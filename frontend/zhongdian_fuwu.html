<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth-boot.js?v=20260920-14pm-aug15"></script>
    <script src="/js/auth.js?v=20260905-zdfw" defer fetchpriority="low"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>首页重点服务管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: #fff; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #fff;
            min-height: 100vh;
            color: #191e26;
        }
        html.app-android-client,
        html.app-android-client body {
            overflow-x: hidden;
            max-width: 100%;
        }
        .header {
            background: #fff;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #f0f0f0;
        }
        .back-btn {
            position: absolute;
            left: 12px;
            color: #1e6fff;
            font-size: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn img {
            width: 9px;
            height: auto;
            display: block;
            margin-right: 4px;
        }
        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }
        .header-done {
            position: absolute;
            right: 14px;
            color: #1e6fff;
            font-size: 15px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        html.app-top-safe-shell body.page-zhongdian-fuwu .header {
            padding-top: calc(12px + var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px)));
        }
        .zdfw-hint {
            padding: 10px 16px 8px;
            font-size: 12px;
            color: #8b93a0;
            line-height: 1.45;
            background: #fff;
        }
        .zdfw-sec-title {
            padding: 14px 16px 8px;
            font-size: 15px;
            color: #191e26;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
        }
        .zdfw-sec-title::before {
            content: '';
            width: 3px;
            height: 15px;
            background: #1e6fff;
            border-radius: 1px;
            flex-shrink: 0;
        }
        .zdfw-cat {
            padding: 4px 16px 6px;
            font-size: 13px;
            color: #8b93a0;
            background: #fff;
        }
        .zdfw-row {
            display: flex;
            align-items: center;
            min-height: 56px;
            padding: 10px 16px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            gap: 12px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .zdfw-row.is-dragging {
            background: #f7faff;
            box-shadow: 0 6px 16px rgba(25, 30, 38, 0.08);
            position: relative;
            z-index: 2;
        }
        .zdfw-row { cursor: pointer; }
        .zdfw-act {
            width: 36px;
            height: 36px;
            margin-left: -7px;
            border-radius: 50%;
            border: 0;
            padding: 0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .zdfw-act-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .zdfw-act-minus .zdfw-act-dot { background: #ee0a24; }
        .zdfw-act-plus .zdfw-act-dot { background: #1e6fff; }
        .zdfw-act svg { display: block; }
        .zdfw-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            display: block;
        }
        .zdfw-icon img.hs-icon,
        .zdfw-icon svg { display: block; width: 32px; height: 32px; }
        .zdfw-name {
            flex: 1;
            min-width: 0;
            font-size: 15px;
            color: #191e26;
            line-height: 1.35;
        }
        .zdfw-handle {
            width: 36px;
            height: 36px;
            margin-right: -8px;
            border: 0;
            background: transparent;
            color: #c0c4cc;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        .zdfw-handle:active { cursor: grabbing; }
        .zdfw-empty {
            padding: 20px 16px;
            font-size: 13px;
            color: #8b93a0;
            text-align: center;
        }
        .zdfw-toast {
            position: fixed;
            left: 50%;
            bottom: calc(28px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%) translateY(12px);
            background: rgba(25, 30, 38, 0.88);
            color: #fff;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 200;
            max-width: 80%;
            text-align: center;
        }
        .zdfw-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
    <script src="/js/theme-loader.js?v=20260905-zdfw" defer></script>
</head>
<body class="page-zhongdian-fuwu">
    <header class="header">
        <a href="shouye.html" class="back-btn" aria-label="返回">
            <img src="/jt.png" class="back-icon" alt="">
            <span>返回</span>
        </a>
        <h1 class="header-title">首页重点服务管理</h1>
        <a href="shouye.html" class="header-done">完成</a>
    </header>

    <p class="zdfw-hint">拖动图标以调整顺序或增减，最多可添加7个服务。</p>

    <section aria-label="当前重点服务">
        <h2 class="zdfw-sec-title">当前重点服务</h2>
        <div id="zdfwCurrent"></div>
    </section>

    <section aria-label="更多服务">
        <h2 class="zdfw-sec-title">更多服务</h2>
        <div id="zdfwMore"></div>
    </section>

    <div class="zdfw-toast" id="zdfwToast" role="status" aria-live="polite"></div>

    <script src="/js/home-services.js?v=20260908-apk-icons"></script>
    <script>
        (function () {
            var HS = window.TaxHomeServices;
            if (!HS) return;
            var currentEl = document.getElementById('zdfwCurrent');
            var moreEl = document.getElementById('zdfwMore');
            var toastEl = document.getElementById('zdfwToast');
            var toastTimer = null;
            var drag = null;

            function toast(msg) {
                if (!toastEl || !msg) return;
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toastEl.classList.remove('show');
                }, 2200);
            }

            function actBtn(kind) {
                var isMinus = kind === 'minus';
                return (
                    '<button type="button" class="zdfw-act zdfw-act-' +
                    (isMinus ? 'minus' : 'plus') +
                    '" data-act="' +
                    (isMinus ? 'remove' : 'add') +
                    '" aria-label="' +
                    (isMinus ? '移除' : '添加') +
                    '"><span class="zdfw-act-dot">' +
                    '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">' +
                    (isMinus
                        ? '<rect x="2" y="5" width="8" height="2" rx="1" fill="#fff"/>'
                        : '<rect x="2" y="5" width="8" height="2" rx="1" fill="#fff"/><rect x="5" y="2" width="2" height="8" rx="1" fill="#fff"/>') +
                    '</svg></span></button>'
                );
            }

            function rowHtml(item, mode) {
                var handle =
                    mode === 'current'
                        ? '<button type="button" class="zdfw-handle" aria-label="拖动调整顺序">' +
                          '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">' +
                          '<rect x="3" y="4" width="12" height="1.8" rx="0.8" fill="currentColor"/>' +
                          '<rect x="3" y="8.1" width="12" height="1.8" rx="0.8" fill="currentColor"/>' +
                          '<rect x="3" y="12.2" width="12" height="1.8" rx="0.8" fill="currentColor"/>' +
                          '</svg></button>'
                        : '';
                return (
                    '<div class="zdfw-row" data-id="' +
                    HS.esc(item.id) +
                    '" data-mode="' +
                    mode +
                    '">' +
                    actBtn(mode === 'current' ? 'minus' : 'plus') +
                    '<span class="zdfw-icon">' +
                    HS.iconMarkup(item, 32) +
                    '</span>' +
                    '<span class="zdfw-name">' +
                    HS.esc(item.name) +
                    '</span>' +
                    handle +
                    '</div>'
                );
            }

            function render() {
                var ids = HS.loadSelectedIds();
                var currentHtml = '';
                for (var i = 0; i < ids.length; i++) {
                    var cur = HS.getById(ids[i]);
                    if (cur) currentHtml += rowHtml(cur, 'current');
                }
                currentEl.innerHTML = currentHtml || '<div class="zdfw-empty">暂无重点服务</div>';

                var groups = HS.moreServicesByCategory(ids);
                if (!groups.length) {
                    moreEl.innerHTML = '<div class="zdfw-empty">已添加全部服务</div>';
                    return;
                }
                var moreHtml = '';
                for (var g = 0; g < groups.length; g++) {
                    moreHtml += '<div class="zdfw-cat">' + HS.esc(groups[g].category) + '</div>';
                    var items = groups[g].items;
                    for (var k = 0; k < items.length; k++) {
                        moreHtml += rowHtml(items[k], 'more');
                    }
                }
                moreEl.innerHTML = moreHtml;
            }

            function onAct(ev) {
                if (ev.target.closest('.zdfw-handle')) return;
                var row = ev.target.closest('.zdfw-row');
                if (!row) return;
                var id = row.getAttribute('data-id');
                var btn = ev.target.closest('[data-act]');
                var act = btn
                    ? btn.getAttribute('data-act')
                    : row.getAttribute('data-mode') === 'current'
                        ? 'remove'
                        : 'add';
                var result = act === 'remove' ? HS.removeService(id) : HS.addService(id);
                if (!result.ok && result.message) toast(result.message);
                render();
            }

            currentEl.addEventListener('click', onAct);
            moreEl.addEventListener('click', onAct);

            function rowIndexFromPoint(clientY) {
                var rows = currentEl.querySelectorAll('.zdfw-row');
                if (!rows.length) return 0;
                for (var i = 0; i < rows.length; i++) {
                    var rect = rows[i].getBoundingClientRect();
                    if (clientY < rect.top + rect.height / 2) return i;
                }
                return rows.length - 1;
            }

            currentEl.addEventListener('pointerdown', function (ev) {
                var handle = ev.target.closest('.zdfw-handle');
                if (!handle) return;
                var row = handle.closest('.zdfw-row');
                if (!row) return;
                ev.preventDefault();
                drag = {
                    id: row.getAttribute('data-id'),
                    pointerId: ev.pointerId,
                    startY: ev.clientY
                };
                row.classList.add('is-dragging');
                try { row.setPointerCapture(ev.pointerId); } catch (e0) {}
            });

            currentEl.addEventListener('pointermove', function (ev) {
                if (!drag) return;
                var row = currentEl.querySelector('.zdfw-row[data-id="' + drag.id + '"]');
                if (!row) return;
                var dy = ev.clientY - drag.startY;
                row.style.transform = 'translateY(' + dy + 'px)';
            });

            function endDrag(ev) {
                if (!drag) return;
                var id = drag.id;
                var row = currentEl.querySelector('.zdfw-row[data-id="' + id + '"]');
                if (row) {
                    row.classList.remove('is-dragging');
                    row.style.transform = '';
                    try { row.releasePointerCapture(drag.pointerId); } catch (e1) {}
                }
                var toIndex = rowIndexFromPoint(ev.clientY);
                drag = null;
                HS.moveService(id, toIndex);
                render();
            }

            currentEl.addEventListener('pointerup', endDrag);
            currentEl.addEventListener('pointercancel', endDrag);

            render();
        })();
    </script>
    <script src="/js/watermark.js?v=20260905-zdfw"></script>
</body>
</html>
