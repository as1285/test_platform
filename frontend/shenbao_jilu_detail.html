<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260721-perf-fix"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>申报记录详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            color: #333;
        }
        body.detail-design-mode {
            background: #fff;
            padding-bottom: calc(50px + env(safe-area-inset-bottom, 0px));
        }
        body.is-editing {
            padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
        }
        .detail-design-view {
            display: none;
            background: #fff;
        }
        body.detail-design-mode .detail-design-view {
            display: block;
        }
        .detail-design-view img {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: block;
            vertical-align: top;
        }
        .detail-form-view {
            display: block;
        }
        body.detail-design-mode .detail-form-view {
            display: none;
        }
        .header {
            background: #fff;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 1px solid #eee;
        }
        html.app-top-safe-shell body.page-shenbao-detail .header {
            padding-top: calc(12px + var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px)));
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 44px;
        }
        .back-btn {
            position: absolute;
            left: 12px;
            color: #1e6fff;
            font-size: 16px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .header-title {
            font-size: 17px;
            font-weight: 500;
            padding: 0 56px;
            text-align: center;
            line-height: 1.35;
        }
        button.header-title {
            display: block;
            width: 100%;
            border: none;
            background: none;
            font-family: inherit;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        button.header-title.header-title--add {
            cursor: pointer;
            color: #000;
        }
        button.header-title.header-title--add:active {
            opacity: 0.88;
        }
        .detail-tabs {
            display: flex;
            margin-top: 4px;
        }
        .detail-tab {
            flex: 1;
            border: none;
            background: none;
            padding: 10px 6px;
            font-size: 15px;
            color: #999;
            font-family: inherit;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .detail-tab.active {
            color: #1e6fff;
            font-weight: 500;
        }
        .detail-tab.active::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 28px;
            height: 3px;
            background: #1e6fff;
            border-radius: 2px;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        .section-title {
            padding: 14px 16px 10px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
        }
        .section-title::before {
            content: '';
            width: 3px;
            height: 16px;
            background: #1e6fff;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .card {
            background: #fff;
            margin-bottom: 10px;
            position: relative;
        }
        .payment-card {
            padding-top: 2px;
            margin-bottom: 0;
        }
        .payment-card-head {
            position: relative;
            min-height: 44px;
            padding: 12px 88px 4px 16px;
        }
        .section-title-inline {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title-inline::before {
            content: '';
            width: 3px;
            height: 16px;
            background: #1e6fff;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .stamp-done {
            position: absolute;
            right: 10px;
            top: 4px;
            width: 82px;
            height: 75px;
            pointer-events: none;
            z-index: 2;
        }
        .stamp-done img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
        .card-meta {
            margin-bottom: 10px;
            margin-top: 0;
        }
        .info-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 13px 16px;
            border-bottom: 1px solid #f5f5f5;
            gap: 12px;
            min-height: 48px;
        }
        .info-row[data-field="totalIncome"] {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        body.is-editing .info-row[data-field="totalIncome"] {
            cursor: default;
        }
        .info-label {
            flex-shrink: 0;
            width: 42%;
            font-size: 15px;
            color: #333;
            line-height: 1.45;
        }
        #detailCard .info-label {
            color: #888;
        }
        .info-value {
            flex: 1;
            text-align: right;
            font-size: 15px;
            color: #333;
            line-height: 1.45;
            word-break: break-all;
        }
        #detailCard .info-value {
            color: #666;
        }
        .info-value.with-chev::after {
            content: '›';
            margin-left: 4px;
            color: #ccc;
            font-size: 18px;
            font-weight: 300;
            vertical-align: middle;
        }
        .info-value.with-expand::after {
            content: '▼';
            margin-left: 4px;
            color: #bbb;
            font-size: 10px;
            vertical-align: middle;
        }
        body.is-editing .info-value.with-chev::after,
        body.is-editing .info-value.with-expand::after {
            display: none;
        }
        body:not(.is-editing) .edit-only-field {
            display: none !important;
        }
        .design-back-btn {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 50;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 12px 48px;
            color: transparent;
            font-size: 16px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        body.detail-design-mode .design-back-btn {
            display: block;
        }
        .info-row input,
        .info-row select,
        .info-row textarea {
            flex: 1;
            min-width: 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 15px;
            font-family: inherit;
            text-align: right;
            background: #fff;
        }
        .info-row textarea {
            min-height: 56px;
            text-align: left;
            resize: vertical;
        }
        .info-row select {
            flex: 1;
            min-width: 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 15px;
            font-family: inherit;
            background: #fff;
        }
        body:not(.is-editing) .info-row input,
        body:not(.is-editing) .info-row select,
        body:not(.is-editing) .info-row textarea {
            display: none;
        }
        body.is-editing .info-value { display: none; }
        .help-q {
            display: inline-flex;
            width: 16px;
            height: 16px;
            border: 1px solid #1e6fff;
            border-radius: 50%;
            font-size: 11px;
            color: #1e6fff;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
            vertical-align: middle;
            font-weight: 500;
        }
        .tab-placeholder {
            padding: 48px 24px;
            text-align: center;
            color: #999;
            font-size: 15px;
            background: #fff;
        }
        .footer-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 40;
            background: #fff;
            border-top: 1px solid #eee;
            padding: 0;
            display: flex;
            gap: 0;
        }
        .footer-bar button {
            flex: 1;
            border: none;
            border-radius: 0;
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
            font-size: 16px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary {
            display: block;
            background: #fff;
            color: #1e6fff;
            font-weight: 400;
            text-align: center;
        }
        .btn-save {
            display: none;
            background: #1e6fff;
            color: #fff;
            font-weight: 500;
            text-align: center;
        }
        .btn-cancel {
            display: none;
            background: #fff;
            color: #333;
            border-right: 1px solid #eee;
            text-align: center;
        }
        body.is-editing .btn-primary {
            display: none;
        }
        body.is-editing .btn-save,
        body.is-editing .btn-cancel {
            display: block;
        }

        /* 退税记录 */
        #panelRefund { background: #f5f6fa; min-height: 40vh; }
        .refund-list { padding-bottom: 16px; }
        .refund-card {
            background: #fff;
            margin-bottom: 10px;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .refund-card-head {
            padding: 12px 16px 4px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refund-card-head::before {
            content: '';
            width: 3px;
            height: 16px;
            background: #1e6fff;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .refund-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 16px;
            border-bottom: 1px solid #f5f5f5;
            gap: 12px;
            min-height: 48px;
        }
        .refund-row:last-child { border-bottom: none; }
        .refund-label {
            flex-shrink: 0;
            font-size: 15px;
            color: #888;
        }
        .refund-value {
            flex: 1;
            text-align: right;
            font-size: 15px;
            color: #333;
            word-break: break-all;
            -webkit-tap-highlight-color: transparent;
        }
        .refund-value[data-edit] {
            cursor: pointer;
        }
        .refund-row-status .refund-value {
            flex: 1;
            min-width: 0;
        }
        .refund-status-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            max-width: 100%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .refund-status-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #52c41a;
            color: #fff;
            font-size: 11px;
            line-height: 18px;
            text-align: center;
            flex-shrink: 0;
        }
        .refund-status-text {
            color: #52c41a;
            font-size: 15px;
            line-height: 1.4;
        }
        .refund-chev {
            display: inline-block;
            width: 0;
            height: 0;
            margin-left: 4px;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 6px solid #7ed492;
            flex-shrink: 0;
            padding: 0;
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .refund-chev.expanded {
            transform: rotate(180deg);
        }
        .refund-card.is-expanded .refund-row-status {
            border-bottom: none;
        }
        .refund-timeline-wrap {
            display: none;
            padding: 4px 16px 0;
            border-top: 1px dashed #e8e8e8;
            position: relative;
        }
        .refund-card.is-expanded .refund-timeline-wrap { display: block; }
        .refund-timeline {
            position: relative;
            padding: 12px 0 8px 28px;
        }
        .refund-timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #1e6fff;
            border-radius: 1px;
        }
        .refund-step {
            position: relative;
            padding: 0 0 18px 22px;
        }
        .refund-step:last-child { padding-bottom: 4px; }
        .refund-step-dot {
            position: absolute;
            left: 0;
            top: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1e6fff;
            color: #fff;
            font-size: 10px;
            line-height: 16px;
            text-align: center;
        }
        .refund-step-title {
            font-size: 15px;
            color: #333;
            line-height: 1.4;
        }
        .refund-step-date {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }
        .refund-step-hint {
            font-size: 13px;
            color: #999;
            margin-top: 2px;
        }
        .refund-step [data-edit] {
            cursor: pointer;
        }
        .refund-card-foot-hint {
            margin: 0;
            padding: 10px 0 14px;
            font-size: 12px;
            color: #999;
            line-height: 1.55;
            background: #fff;
        }
        .refund-card.is-longpress {
            background: #f5f8ff;
        }
        .refund-empty {
            padding: 48px 24px;
            text-align: center;
            color: #999;
            font-size: 15px;
            background: #fff;
        }

        /* 字段编辑浮层 */
        .refund-edit-mask {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.45);
        }
        .refund-edit-mask.show { display: block; }
        .refund-edit-sheet {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            border-radius: 12px 12px 0 0;
            padding: 0 0 calc(12px + env(safe-area-inset-bottom, 0px));
            max-height: 70vh;
            overflow: auto;
        }
        .refund-edit-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
        }
        .refund-edit-head button {
            border: none;
            background: none;
            font-size: 16px;
            font-family: inherit;
            padding: 4px 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .refund-edit-cancel { color: #666; }
        .refund-edit-save { color: #1e6fff; font-weight: 500; }
        .refund-edit-title { font-size: 16px; font-weight: 500; }
        .refund-edit-body { padding: 16px; }
        .refund-edit-body label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }
        .refund-edit-body input,
        .refund-edit-body select,
        .refund-edit-body textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
        }
        .refund-edit-body textarea { min-height: 72px; resize: vertical; }
    </style>
</head>
<body class="page-shenbao-detail">
    <a href="shenbao_jilu.html?tab=done" class="design-back-btn" id="designBackBtn" aria-label="返回">&nbsp;</a>
    <div class="detail-design-view" id="detailDesignView" aria-hidden="false">
        <img src="shenbao_jilu_detail_design.png?v=20260523-v2" width="414" alt="申报记录详情">
    </div>

    <div class="detail-form-view" id="detailFormView">
        <header class="header">
            <div class="header-top">
                <a href="shenbao_jilu.html?tab=done" class="back-btn" id="detailBackBtn"><img src="/jt.png" class="back-icon" alt="" width="9" decoding="async"><span>返回</span></a>
                <button type="button" class="header-title" id="detailHeaderTitleBtn" aria-label="申报记录详情">申报记录详情</button>
            </div>
            <div class="detail-tabs" role="tablist">
                <button type="button" class="detail-tab active" data-panel="declare" role="tab">申报记录</button>
                <button type="button" class="detail-tab" data-panel="pay" role="tab">缴税记录</button>
                <button type="button" class="detail-tab" data-panel="refund" role="tab">退税记录</button>
            </div>
        </header>

        <div id="panelDeclare" class="panel active" role="tabpanel">
            <div class="card payment-card" id="paymentCard">
                <div class="payment-card-head">
                    <div class="section-title-inline">缴款信息：</div>
                    <div class="stamp-done" aria-hidden="true">
                        <img src="shenbao_stamp_done.png?v=20260523-stamp-v5-sm" width="82" height="75" alt="申报已完成">
                    </div>
                </div>
                <div class="info-row" data-field="supplementTax">
                    <span class="info-label">应退税额</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="supplementTax">
                </div>
                <div class="info-row" data-field="lateFee">
                    <span class="info-label">滞纳金</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="lateFee">
                </div>
                <div class="info-row" data-field="paidThisTime">
                    <span class="info-label">本次申报已缴税额<span class="help-q">?</span></span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="paidThisTime">
                </div>
                <div class="info-row" data-field="refundedThisTime">
                    <span class="info-label">本次申报已退税额</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="refundedThisTime">
                </div>
            </div>

            <div class="card card-meta">
                <div class="info-row" data-field="taxYear">
                    <span class="info-label">税款所属年度</span>
                    <span class="info-value"></span>
                    <input type="text" data-input="taxYear">
                </div>
                <div class="info-row" data-field="periodStart">
                    <span class="info-label">税款所属期起</span>
                    <span class="info-value"></span>
                    <input type="text" data-input="periodStart">
                </div>
                <div class="info-row" data-field="periodEnd">
                    <span class="info-label">税款所属期止</span>
                    <span class="info-value"></span>
                    <input type="text" data-input="periodEnd">
                </div>
                <div class="info-row" data-field="taxAuthority">
                    <span class="info-label">汇算地主管税务机关</span>
                    <span class="info-value"></span>
                    <textarea data-input="taxAuthority"></textarea>
                </div>
                <div class="info-row" data-field="employer">
                    <span class="info-label">任职受雇单位</span>
                    <span class="info-value"></span>
                    <input type="text" data-input="employer">
                </div>
                <div class="info-row edit-only-field" data-field="title">
                    <span class="info-label">申报事项</span>
                    <span class="info-value"></span>
                    <input type="text" data-input="title">
                </div>
                <div class="info-row edit-only-field" data-field="groupMonth">
                    <span class="info-label">列表分组（年-月）</span>
                    <span class="info-value"></span>
                    <input type="text" data-input="groupMonth">
                </div>
                <div class="info-row edit-only-field" data-field="amountType">
                    <span class="info-label">税额类型</span>
                    <span class="info-value"></span>
                    <select data-input="amountType">
                        <option value="refunded">已退税额</option>
                        <option value="refundable">可申请退税额</option>
                        <option value="paid">已缴税额</option>
                    </select>
                </div>
                <div class="info-row edit-only-field" data-field="amount">
                    <span class="info-label">列表展示金额</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="amount">
                </div>
            </div>

            <div class="section-title">综合所得年度汇算申报明细</div>
            <div class="card" id="detailCard">
                <div class="info-row" data-field="totalIncome" data-chev="1">
                    <span class="info-label">收入合计</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="totalIncome">
                </div>
                <div class="info-row" data-field="totalExpense">
                    <span class="info-label">费用合计</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="totalExpense">
                </div>
                <div class="info-row" data-field="exemptIncome" data-expand="1">
                    <span class="info-label">免税收入</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="exemptIncome">
                </div>
                <div class="info-row" data-field="basicDeduction">
                    <span class="info-label">减除费用</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="basicDeduction">
                </div>
                <div class="info-row" data-field="specialDeduction" data-chev="1">
                    <span class="info-label">专项扣除合计</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="specialDeduction">
                </div>
                <div class="info-row" data-field="specialAdditionalDeduction" data-chev="1">
                    <span class="info-label">专项附加扣除合计</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="specialAdditionalDeduction">
                </div>
                <div class="info-row" data-field="otherDeduction" data-chev="1">
                    <span class="info-label">其他扣除合计</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="otherDeduction">
                </div>
                <div class="info-row" data-field="donationDeduction" data-chev="1">
                    <span class="info-label">准予扣除的捐赠额</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="donationDeduction">
                </div>
                <div class="info-row" data-field="taxableIncome">
                    <span class="info-label">应纳税所得额</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="taxableIncome">
                </div>
                <div class="info-row" data-field="taxPayable">
                    <span class="info-label">应纳税额</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="taxPayable">
                </div>
                <div class="info-row" data-field="taxReduction" data-chev="1">
                    <span class="info-label">减免税额</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="taxReduction">
                </div>
                <div class="info-row" data-field="taxPaid">
                    <span class="info-label">已缴税额</span>
                    <span class="info-value" data-suffix="元"></span>
                    <input type="text" inputmode="decimal" data-input="taxPaid">
                </div>
            </div>
        </div>

        <div id="panelPay" class="panel" role="tabpanel">
            <div class="tab-placeholder">暂无缴税记录</div>
        </div>
        <div id="panelRefund" class="panel" role="tabpanel">
            <div id="refundListRoot" class="refund-list" aria-live="polite"></div>
        </div>
    </div>

    <div id="refundEditMask" class="refund-edit-mask" aria-hidden="true">
        <div class="refund-edit-sheet" onclick="event.stopPropagation()">
            <div class="refund-edit-head">
                <button type="button" class="refund-edit-cancel" id="refundEditCancel">取消</button>
                <span class="refund-edit-title" id="refundEditTitle">编辑</span>
                <button type="button" class="refund-edit-save" id="refundEditSave">确定</button>
            </div>
            <div class="refund-edit-body" id="refundEditBody"></div>
        </div>
    </div>

    <div class="footer-bar">
        <button type="button" class="btn-primary" id="btnCorrect">更正</button>
        <button type="button" class="btn-cancel" id="btnCancelEdit">取消</button>
        <button type="button" class="btn-save" id="btnSaveEdit">确认保存</button>
    </div>

    <script src="/js/watermark.js?v=20260721-alipay-wm"></script>
    <script src="/js/shenbao_jilu_store.js?v=20260525-refund-empty"></script>
