<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth-boot.js?v=20260905-scan"></script>
    <script src="/js/auth.js?v=20260905-scan" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>扫一扫</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        .scan-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }
        body:not(.has-camera) .scan-video {
            visibility: hidden;
        }
        .scan-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.18);
            pointer-events: none;
        }
        body.camera-denied .scan-shade {
            background: #111;
        }
        .scan-back {
            position: fixed;
            left: 10px;
            top: calc(8px + max(var(--app-shell-statusbar-top, 0px), env(safe-area-inset-top, 0px)));
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 44px;
            padding: 0 8px;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
        }
        .scan-back svg {
            display: block;
            width: 12px;
            height: 20px;
        }
        .scan-line {
            position: fixed;
            left: 8%;
            right: 8%;
            top: 42%;
            height: 3px;
            z-index: 3;
            pointer-events: none;
            background: linear-gradient(
                90deg,
                rgba(46, 140, 255, 0) 0%,
                rgba(46, 140, 255, 0.35) 18%,
                rgba(80, 176, 255, 0.95) 50%,
                rgba(46, 140, 255, 0.35) 82%,
                rgba(46, 140, 255, 0) 100%
            );
            box-shadow: 0 0 10px 2px rgba(46, 140, 255, 0.55), 0 0 22px 4px rgba(30, 111, 255, 0.28);
            animation: scanSweep 2.4s ease-in-out infinite;
        }
        @keyframes scanSweep {
            0% { top: 28%; opacity: 0.45; }
            12% { opacity: 1; }
            88% { opacity: 1; }
            100% { top: 58%; opacity: 0.45; }
        }
        .scan-hint {
            position: fixed;
            left: 24px;
            right: 24px;
            top: 68%;
            z-index: 4;
            text-align: center;
            font-size: 15px;
            line-height: 22px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
            pointer-events: none;
        }
        .scan-hint.is-error {
            color: #ffd6d6;
        }
        .scan-album {
            position: fixed;
            right: 20px;
            bottom: calc(28px + env(safe-area-inset-bottom, 0px));
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 12px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .scan-album-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(40, 40, 40, 0.62);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scan-album-icon svg {
            width: 26px;
            height: 26px;
            display: block;
        }
        #scanAlbumInput { display: none; }
    </style>
</head>
<body class="page-scan">
    <video id="scanVideo" class="scan-video" autoplay muted playsinline></video>
    <div class="scan-shade" aria-hidden="true"></div>
    <a href="shouye.html" class="scan-back" id="scanBackBtn">
        <svg viewBox="0 0 12 20" aria-hidden="true">
            <path d="M10.5 1.5L2 10l8.5 8.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        返回
    </a>
    <div class="scan-line" aria-hidden="true"></div>
    <p class="scan-hint" id="scanHint">请将摄像头对准二维码</p>
    <input id="scanAlbumInput" type="file" accept="image/*">
    <button type="button" class="scan-album" id="scanAlbumBtn" aria-label="相册">
        <span class="scan-album-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="14" rx="2.2" stroke="#fff" stroke-width="1.7"/>
                <circle cx="8.2" cy="10" r="1.7" fill="#fff"/>
                <path d="M7 16.2l3.6-3.8 2.3 2.4 2.4-2.8L17.8 16.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        相册
    </button>
    <script src="/js/vendor/jsqr.min.js?v=20260905-scan"></script>
    <script src="/js/tax-qr-payload.js?v=20260905-scan"></script>
    <script src="/js/scan-qr.js?v=20260905-scan"></script>
</body>
</html>
