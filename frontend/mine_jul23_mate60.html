            try {
                var ua = String(navigator.userAgent || '');
                try { ua += ' ' + String(localStorage.getItem('tax_device_model_v1') || ''); } catch (e0) {}
                var isMate70 = /Mate\s*70|PLA-AL|PLR-AL|PLU-AL/i.test(ua);
                var isMate60 = /Mate\s*60|ALN-AL00|ALN-AL10|ALN-AL80|ALN-AN00|ALN-AL\d{2}|ALN-AN\d{2}|HUAWEIALN/i.test(ua) && !isMate70;
                var target = isMate60 ? 'mine_mate60_aug12.html' : 'mine.html';
                var u = new URL(target, location.href);
                var src = new URL(location.href);
                src.searchParams.forEach(function (v, k) { u.searchParams.set(k, v); });
                u.searchParams.set('_v', '20260824-aug12r6');
                location.replace(u.pathname + u.search + u.hash);
            } catch (e) {
                location.replace('mine_mate60_aug12.html?_v=20260824-aug12r6');
            }
        })();
