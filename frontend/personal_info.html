<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var u = typeof navigator !== 'undefined' ? (navigator.userAgent || '') : '';
                try { u += ' ' + String(localStorage.getItem('tax_device_model_v1') || ''); } catch (eModel) {}
                try { u += ' ' + String(localStorage.getItem('tax_device_ua_v1') || ''); } catch (eUa) {}
                if (/Mate\s*70|PLA-AL|PLR-AL|PLU-AL/i.test(u)) return;
                if (!/Mate\s*60|ALN-AL00|ALN-AL10|ALN-AL80|ALN-AN00|ALN-AL\d{2}|ALN-AN\d{2}|HUAWEIALN/i.test(u)) return;
                document.documentElement.classList.add('app-android-huawei-mate60');
                document.documentElement.classList.add('app-android-immersive-white-top');
                document.documentElement.style.setProperty('--app-shell-statusbar-top', '52px');
                document.documentElement.style.setProperty('--safe-t', '52px');
                document.documentElement.classList.add('app-android-client');
                if (!document.querySelector('style[data-mate60-personal-info-firstpaint]')) {
                    var st = document.createElement('style');
                    st.setAttribute('data-mate60-personal-info-firstpaint', '1');
                    /* 只垫 padding，勿写 sticky+top:52：ArkWeb 会当 fixed，标题和「基本信息」进遮挡条 */
                    st.textContent =
                        'html.app-android-huawei-mate60 body.page-personal-info > .header{' +
                        'position:relative !important;top:0 !important;' +
                        'padding-top:66px !important;padding-bottom:14px !important;' +
                        'box-sizing:border-box !important;height:auto !important;min-height:0 !important;' +
                        'background:#fff !important;z-index:100 !important;}' +
                        'html.app-android-huawei-mate60 body.page-personal-info > .header .back-btn{' +
                        'top:66px !important;height:24px !important;display:flex !important;align-items:center !important;}' +
                        'html.app-android-huawei-mate60 #arkWhiteTopShield{background:#fff !important;}' +
                        'html.app-android-huawei-mate60{color-scheme:light;}';
                    (document.head || document.documentElement).appendChild(st);
                }
            } catch (e) {}
        })();
    </script>
    <script src="/js/auth-boot.js?v=20260918-ios27-inflow"></script>
    <script src="/js/auth.js?v=20260909-android-aug1-blue" defer fetchpriority="low"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f5f6fa;
            min-height: 100vh;
        }

        .header {
            background: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #f0f0f0;
        }

        /* Mate 60 / Pro：相对定位 + 顶距，返回/标题落在状态栏下方；勿用 sticky+top:52 */
        html.app-android-huawei-mate60 body.page-personal-info > .header {
            position: relative;
            top: 0;
            padding-top: 66px;
            padding-bottom: 14px;
            box-sizing: border-box;
            height: auto;
            min-height: 0;
        }
        html.app-android-huawei-mate60 body.page-personal-info > .header .back-btn {
            top: 66px;
            height: 24px;
            display: flex;
            align-items: center;
        }

        .back-btn {
            position: absolute;
            left: 12px;
            color: #1e6fff;
            font-size: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .back-btn span:first-child {
            font-size: 23px;
            margin-right: 2px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }

        .menu-container {
            background: #fff;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .menu-item:active {
            background: #f5f5f5;
        }

        .menu-text {
            font-size: 16px;
            color: #333;
        }

        .menu-arrow {
            font-size: 18px;
            color: #ccc;
        }
    </style>
</head>
<body class="page-personal-info">
    <div class="header">
        <a href="mine.html" class="back-btn">
            <img src="/jt.png" alt="" style="width: 9px; vertical-align: middle;">
            <span>返回</span>
        </a>
        <span class="header-title">个人信息</span>
    </div>

    <div class="menu-container">
        <div class="menu-item" onclick="goBasicInfo()">
            <span class="menu-text">基本信息</span>
            <span class="menu-arrow">&gt;</span>
        </div>
        <div class="menu-item" onclick="goTaxBenefit()">
            <span class="menu-text">可享税收优惠</span>
            <span class="menu-arrow">&gt;</span>
        </div>
        <div class="menu-item" onclick="goOtherID()">
            <span class="menu-text">其他身份证件</span>
            <span class="menu-arrow">&gt;</span>
        </div>
    </div>

    <script>
        function goBasicInfo() {
            window.location.href = 'gerenxinxi.html';
        }

        function goTaxBenefit() {
            window.location.href = 'tax_benefit.html';
        }

        function goOtherID() {
            window.location.href = 'other_id.html';
        }
    </script>
    <script src="/js/watermark.js?v=20260831-m60home"></script>
</body>
</html>
