<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var u = String(navigator.userAgent || '');
                try { u += ' ' + String(localStorage.getItem('tax_device_model_v1') || ''); } catch (eModel) {}
                try { u += ' ' + String(localStorage.getItem('tax_device_ua_v1') || ''); } catch (eUa) {}
                if (/V2302A|V2302B|PD2302|V2307A|iQOO\s*Neo\s*8\s*Pro/i.test(u)) {
                    document.documentElement.classList.add('app-android-iqoo-neo8pro');
                    document.documentElement.classList.add('app-android-immersive-white-top');
                }
                if (/V2301A|V2301B|PD2301/i.test(u) || (/iQOO\s*Neo\s*8(?!\s*Pro)/i.test(u))) {
                    document.documentElement.classList.add('app-android-iqoo-neo8');
                    document.documentElement.classList.add('app-android-immersive-white-top');
                }
                if (/V2502A|V2502DA|V2514|PD2502|vivo[\s_-]*X300\s*Pro/i.test(u)) {
                    document.documentElement.classList.add('app-android-vivo-x300pro');
                    document.documentElement.classList.add('app-android-immersive-white-top');
                }
                if (/V2527A|V2527DA|V2527B|PD2527[A-Z]?|\bV2527\b|(?:vivo[\s_-]*)?S50[\s_-]*Pro[\s_-]*[Mm]ini|S50Promini/i.test(u)) {
                    document.documentElement.classList.add('app-android-vivo-s50promini');
                    document.documentElement.classList.add('app-android-immersive-white-top');
                }
            } catch (e) {}
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e8fff">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>消息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            color: #191e26;
            /* 勿 overflow-x:hidden：iOS 会破坏底栏 position:fixed，切 TAB 时位置不统一且偏高 */
        }
        
        html {
            background: #1e8fff;
        }
        
        .message-page {
            min-height: 100vh;
            min-height: 100dvh;
            background: #f5f7fa;
        }
        
        .message-header-wrap {
            position: relative;
            z-index: 1;
        }

        /* 对齐 APK .zdj-message-container 顶栏：蓝底 + 筛选 / 清除未读 */
        .message-header-toolbar {
            background: linear-gradient(180deg, #1e8fff 0%, #3d96ff 55%, #4da0ff 100%);
            padding: 12px 16px 18px;
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            position: relative;
            border-radius: 0;
            box-shadow: none;
        }

        .message-header-title {
            margin: 0 0 12px;
            padding: 0 0 0 2px;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        /* 蓝渐变从屏幕顶缘铺进安全区，文字用 padding 避让 */
        html.app-top-safe-shell .message-header-toolbar {
            padding-top: calc(12px + var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px)));
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 18px;
        }

        html.app-ios-client.app-top-safe-shell body.page-message::before {
            content: '';
            display: block !important;
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: var(--app-shell-statusbar-top, 59px);
            background: #1e8fff;
            z-index: 40;
            pointer-events: none;
        }

        /* APK .list-box：圆角 24px + 顶部浅灰渐变 */
        .message-list {
            background-image: linear-gradient(180deg, #f5f7fa 0%, #fff 28%);
            background-color: #fff;
            border-radius: 24px 24px 0 0;
            margin-top: -8px;
            position: relative;
            z-index: 2;
            padding-top: 4px;
            padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
            min-height: calc(100vh - 140px);
            overflow: hidden;
        }

        html.app-android-xiaomi-14.app-top-safe-shell .message-header-toolbar {
            padding-bottom: 18px;
        }

        html.app-android-xiaomi-14.app-top-safe-shell .message-header-title {
            margin-bottom: 14px;
        }

        /* iQOO Neo8 Pro：Cordova 沉浸，标题须避开系统时间 */
        html.app-android-iqoo-neo8.app-top-safe-shell .message-header-toolbar,
        html.app-android-iqoo-neo8pro.app-top-safe-shell .message-header-toolbar,
        html.app-android-immersive-white-top.app-top-safe-shell body.page-message .message-header-toolbar {
            padding-top: calc(14px + 40px) !important;
        }

        .message-header-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 26px;
        }

        /* APK .search-btn：76×26、圆角 4、字号 12 */
        .msg-filter-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 26px;
            min-width: 76px;
            padding: 0 16px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            line-height: 26px;
            color: #fff;
            background: rgba(255, 255, 255, 0.28);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .msg-filter-chip:active {
            opacity: 0.92;
        }

        .msg-filter-chip.active {
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
        }

        .msg-filter-icon {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
            opacity: 0.95;
        }

        /* APK .clear-btn */
        .msg-clear-unread {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 2px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 400;
            line-height: 20px;
            color: rgba(255, 255, 255, 0.92);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .msg-clear-unread span {
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .msg-clear-unread:active {
            opacity: 0.78;
        }

        .msg-clear-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            opacity: 0.95;
            object-fit: contain;
            display: block;
        }

        .message-header-custom-img {
            width: 100%;
            display: none;
            vertical-align: top;
        }
        
        /* APK .messsage-item */
        .message-item {
            display: flex;
            align-items: flex-start;
            padding: 20px 24px 20px 0;
            margin-left: 24px;
            gap: 16px;
            border-bottom: 1px solid #f7f7f7;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .message-item:last-child {
            border-bottom: none;
        }

        .message-item:active {
            background: #fafbfc;
        }
        
        .msg-item-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent;
        }
        
        .msg-item-icon img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
        }
        
        .message-content {
            flex: 1;
            min-width: 0;
            padding-right: 8px;
        }
        
        .message-content-title {
            font-size: 14px;
            color: #191e26;
            font-weight: 700;
            line-height: 20px;
            margin-bottom: 4px;
            padding-right: 64px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        
        .message-content-desc {
            font-size: 12px;
            color: #4d5259;
            line-height: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 24px;
        }
        
        .message-meta {
            position: absolute;
            top: 20px;
            right: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .message-date {
            font-size: 12px;
            color: #b2b7bf;
            line-height: 18px;
        }
        
        .message-dot {
            width: 8px;
            height: 8px;
            background: #f51f0c;
            border-radius: 50%;
            margin-top: 6px;
        }

        .message-empty {
            text-align: center;
            padding: 72px 24px 40px;
            color: #999da6;
        }

        .message-empty img {
            width: 180px;
            max-width: 56%;
            height: auto;
            display: block;
            margin: 0 auto 16px;
        }

        .message-empty p {
            font-size: 14px;
            line-height: 20px;
            color: #999da6;
        }

        /* 华为 TAS-AN00（Mate 40 等）：消息页字号整体小两号 */
        html.app-android-huawei-tas-an00 body.page-message .message-header-title {
            font-size: 24px;
        }

        html.app-android-huawei-tas-an00 body.page-message .msg-filter-chip {
            font-size: 11px;
        }

        html.app-android-huawei-tas-an00 body.page-message .msg-clear-unread {
            font-size: 12px;
        }

        html.app-android-huawei-tas-an00 body.page-message .message-content-title {
            font-size: 12px;
        }

        html.app-android-huawei-tas-an00 body.page-message .message-content-desc {
            font-size: 10px;
        }

        html.app-android-huawei-tas-an00 body.page-message .message-date {
            font-size: 9px;
        }
        
        </style>

<body class="page-message">
    <div class="message-page">
        <div class="message-header-wrap">
            <div id="messageHeaderBuiltin" class="message-header-toolbar">
                <h1 class="message-header-title">消息</h1>

                    </button>

                    </button>

            </div>

        </div>
        <div class="message-list" id="messageList">

        </div>

    <script>
        // 更新底部导航图标状态
        function updateNavIcons() {
            var navItems = document.querySelectorAll('.bottom-nav .nav-item');
            navItems.forEach(function(item) {
                var icon = item.getAttribute('data-icon');
                var img = item.querySelector('.nav-icon img');
                if (item.classList.contains('active')) {
                    img.src = 'caidan/' + icon + '1.png';
                } else {
                    img.src = 'caidan/' + icon + '2.png';
                }
            });
            if (window.__refreshNavFromMineUi) {
                window.__refreshNavFromMineUi();
            }
        }
        
        // 初始化时更新图标
        updateNavIcons();
        
        var allMessages = [];
        var filterUnreadOnly = false;

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function messageListDesc(msg) {
            var c = (msg.content || '').trim();
            if (c) return c;
            var co = (msg.company_name || '').trim();
            if (co) return '来自' + co + '的扣缴信息';
            return '—';
        }

        function openMessageDetail(msg) {
            if (!msg || !msg.id) return;
            if (msg._cg_demo) {
                window.location.href = 'message_detail.html?demo=maint';
                return;
            }
            window.location.href = 'message_detail.html?id=' + encodeURIComponent(String(msg.id));
        }

        function renderMessageList() {
            var list = allMessages.filter(function (msg) {
                return !filterUnreadOnly || Number(msg.is_read) === 0;
            });
            var html = '';
            list.forEach(function (msg, idx) {
                var demoAttr = msg._cg_demo ? ' data-demo="1" data-cg-demo-maint="1"' : '';
                html +=
                    '<div class="message-item" role="button" tabindex="0" data-msg-idx="' +
                    idx +
                    '"' +
                    demoAttr +
                    ' data-id="' +
                    escapeHtml(String(msg.id || '')) +
                    '">';
                html += '<div class="msg-item-icon">';
                html += '<img src="message_item_icon.png" width="48" height="48" alt="">';
                html += '</div>';
                html += '<div class="message-content">';
                html += '<div class="message-content-title">' + escapeHtml(msg.title) + '</div>';
                html += '<div class="message-content-desc">' + escapeHtml(messageListDesc(msg)) + '</div>';
                html += '</div>';
                html += '<div class="message-meta">';
                html += '<span class="message-date">' + escapeHtml(msg.msg_date) + '</span>';
                if (Number(msg.is_read) === 0) {
                    html += '<span class="message-dot"></span>';
                }
                html += '</div>';
                html += '</div>';
            });
            var emptyHint = filterUnreadOnly ? '暂无未读消息' : '暂无消息';
            document.getElementById('messageList').innerHTML =
                html ||
                '<div class="message-empty">' +
                '<img src="img/message/empty.png" alt="" width="180" height="124" decoding="async">' +
                '<p>' +
                emptyHint +
                '</p></div>';
        }

        function bindMessageListClicks() {
            var listEl = document.getElementById('messageList');
            if (!listEl || listEl.__msgClickBound) return;
            listEl.__msgClickBound = true;
            listEl.addEventListener('click', function (e) {
                var item = e.target.closest('.message-item');
                if (!item) return;
                var idx = parseInt(item.getAttribute('data-msg-idx'), 10);
                var filtered = allMessages.filter(function (msg) {
                    return !filterUnreadOnly || Number(msg.is_read) === 0;
                });
                var msg = filtered[idx];
                if (msg) openMessageDetail(msg);
            });
            listEl.addEventListener('keydown', function (e) {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                var item = e.target.closest('.message-item');
                if (!item) return;
                e.preventDefault();
                var idx = parseInt(item.getAttribute('data-msg-idx'), 10);
                var filtered = allMessages.filter(function (msg) {
                    return !filterUnreadOnly || Number(msg.is_read) === 0;
                });
                var msg = filtered[idx];
                if (msg) openMessageDetail(msg);
            });
        }

        function loadMessages() {
            window.authFetch('api/message?action=list')
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (data.code === 200) {
                        allMessages = data.data || [];
                        if (
                            window.ConversionGuide &&
                            typeof window.ConversionGuide.prependMaintenanceMessages === 'function'
                        ) {
                            allMessages = window.ConversionGuide.prependMaintenanceMessages(allMessages);
                        }
                        renderMessageList();
                        bindMessageListClicks();
                        if (typeof window.refreshMessageUnreadBadge === 'function') {
                            window.refreshMessageUnreadBadge();
                        }
                    } else {
                        allMessages = [];
                        renderMessageList();
                    }
                })
                .catch(function (error) {
                    console.error(error);
                    allMessages = [];
                    renderMessageList();
                });
        }

        document.getElementById('btnMsgFilter').addEventListener('click', function () {
            filterUnreadOnly = !filterUnreadOnly;
            this.classList.toggle('active', filterUnreadOnly);
            renderMessageList();
        });

        document.getElementById('btnMsgClearUnread').addEventListener('click', function () {
            var btn = this;
            btn.disabled = true;
            window.authFetch('api/message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'mark_all_read' })
            })
                .then(function (r) {
                    return r.json();
                })
                .then(function (data) {
                    if (data.code === 200) {
                        loadMessages();
                        if (typeof window.refreshMessageUnreadBadge === 'function') {
                            window.refreshMessageUnreadBadge();
                        }
                    }
                })
                .catch(function () {})
                .finally(function () {
                    btn.disabled = false;
                });
        });

        bindMessageListClicks();
        loadMessages();
        
        // iOS设备检测，底部导航上移
        (function() {
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                var bottomNav = document.querySelector('.bottom-nav');
                if (bottomNav) {
                    bottomNav.classList.add('ios-device');
                }
            }
        })();
    </script>

</body>
