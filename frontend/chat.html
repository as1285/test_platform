<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260729-app-copy-redirect"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>在线客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .header {
            background: #fff;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #ebebeb;
            flex-shrink: 0;
        }
        .back-btn {
            position: absolute;
            left: 12px;
            color: #1e6fff;
            font-size: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn .arrow {
            font-size: 22px;
            line-height: 1;
            margin-right: 2px;
        }
        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }
        .chat-status {
            font-size: 11px;
            color: #999;
            text-align: center;
            padding: 6px 12px 0;
            flex-shrink: 0;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 8px;
            -webkit-overflow-scrolling: touch;
        }
        .chat-empty {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 48px 24px;
            line-height: 1.6;
        }
        .msg-row {
            display: flex;
            margin-bottom: 12px;
        }
        .msg-row.me {
            justify-content: flex-end;
        }
        .msg-row.them {
            justify-content: flex-start;
        }
        .msg-bubble {
            max-width: 78%;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg-row.me .msg-bubble {
            background: #1e6fff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-row.them .msg-bubble {
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .msg-meta {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
            padding: 0 4px;
        }
        .msg-row.me .msg-meta {
            text-align: right;
        }
        .composer {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid #ebebeb;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .composer textarea {
            flex: 1;
            min-height: 40px;
            max-height: 120px;
            resize: none;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
            background: #f7f8fa;
        }
        .composer textarea:focus {
            border-color: #1e6fff;
            background: #fff;
        }
        .composer #chatSendBtn {
            flex-shrink: 0;
            height: 40px;
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background: #1e6fff;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
        }
        .composer #chatSendBtn:disabled {
            opacity: 0.5;
        }
        .composer-attach {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            background: #f7f8fa;
            color: #1e6fff;
            font-size: 22px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            padding: 0;
        }
        .composer-attach:disabled {
            opacity: 0.5;
        }
        .composer-file {
            display: none;
        }
        .msg-bubble.msg-bubble-img {
            padding: 6px;
            background: transparent;
            box-shadow: none;
        }
        .msg-row.me .msg-bubble.msg-bubble-img {
            background: transparent;
        }
        .msg-row.them .msg-bubble.msg-bubble-img {
            background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .msg-bubble img.chat-img {
            display: block;
            max-width: min(220px, 70vw);
            max-height: 280px;
            border-radius: 8px;
            object-fit: contain;
            background: #f0f2f5;
            cursor: zoom-in;
        }
    </style>
</head>
<body>
    <div class="header">
        <a class="back-btn" id="chatBackBtn" href="consult.html"><span class="arrow">‹</span>返回</a>
        <div class="header-title">在线客服</div>
    </div>
    <div class="chat-status" id="chatStatus">连接中…</div>
    <div class="chat-list" id="chatList">
        <div class="chat-empty" id="chatEmpty">有问题可以直接发消息，客服看到后会回复。</div>
    </div>
    <div class="composer">
        <button type="button" class="composer-attach" id="chatAttachBtn" title="发送图片" aria-label="发送图片">＋</button>
        <input type="file" class="composer-file" id="chatFileInput" accept="image/jpeg,image/png,image/gif,image/webp,image/*" capture="environment">
        <textarea id="chatInput" rows="1" maxlength="2000" placeholder="输入消息…" enterkeyhint="send"></textarea>
        <button type="button" id="chatSendBtn">发送</button>
    </div>
    <script>
(function () {
    var backBtn = document.getElementById('chatBackBtn');
    if (backBtn) {
        try {
            var from = new URLSearchParams(window.location.search).get('from');
            if (from === 'purchase') {
                backBtn.href = 'purchase.html';
            } else if (from === 'mine') {
                backBtn.href = 'mine.html';
            } else {
                backBtn.href = 'consult.html';
            }
        } catch (eBack) {
            backBtn.href = 'consult.html';
        }
    }

    var listEl = document.getElementById('chatList');
    var emptyEl = document.getElementById('chatEmpty');
    var statusEl = document.getElementById('chatStatus');
    var inputEl = document.getElementById('chatInput');
    var sendBtn = document.getElementById('chatSendBtn');
    var attachBtn = document.getElementById('chatAttachBtn');
    var fileInput = document.getElementById('chatFileInput');
    var lastMsgId = 0;
    var pollTimer = null;
    var sending = false;
    var knownIds = {};

    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function formatTime(iso) {
        if (!iso) return '';
        try {
            var d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            var pad = function (n) { return n < 10 ? '0' + n : String(n); };
            return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        } catch (e) {
            return '';
        }
    }

    function resolveChatImageUrl(m) {
        if (!m) return '';
        if (m.image_url) return String(m.image_url);
        if (m.image_path) {
            var p = String(m.image_path).replace(/^\/+/, '');
            return '/' + p;
        }
        var c = String(m.content || '').trim();
        var mm = c.match(/^\[chat_img\](uploads\/[a-zA-Z0-9_.\-]+)\[\/chat_img\]$/i);
        return mm ? '/' + mm[1] : '';
    }

    function bubbleHtml(m) {
        var imgUrl = resolveChatImageUrl(m);
        if (imgUrl) {
            return (
                '<div class="msg-bubble msg-bubble-img"><img class="chat-img" src="' +
                escapeHtml(imgUrl) +
                '" alt="图片" loading="lazy"></div>'
            );
        }
        return '<div class="msg-bubble">' + escapeHtml(m.content) + '</div>';
    }

    function appendMessages(messages, scrollToEnd) {
        if (!messages || !messages.length) return;
        var nearBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 80;
        messages.forEach(function (m) {
            var id = Number(m.id);
            if (!id || knownIds[id]) return;
            knownIds[id] = 1;
            if (id > lastMsgId) lastMsgId = id;
            if (emptyEl && emptyEl.parentNode) {
                emptyEl.parentNode.removeChild(emptyEl);
                emptyEl = null;
            }
            var isMe = m.sender_role === 'user';
            var row = document.createElement('div');
            row.className = 'msg-row ' + (isMe ? 'me' : 'them');
            row.setAttribute('data-msg-id', String(id));
            var whoLabel = isMe
                ? ''
                : m.sender_id === 'ai_reply'
                  ? ' · AI 客服'
                  : m.sender_role === 'system' || m.sender_id === 'auto_reply'
                    ? ' · 自动回复'
                    : ' · 客服';
            row.innerHTML =
                '<div>' +
                bubbleHtml(m) +
                '<div class="msg-meta">' +
                escapeHtml(formatTime(m.created_at)) +
                whoLabel +
                '</div></div>';
            listEl.appendChild(row);
        });
        if (scrollToEnd || nearBottom) {
            listEl.scrollTop = listEl.scrollHeight;
        }
    }

    function setStatus(text) {
        if (statusEl) statusEl.textContent = text || '';
    }

    function setBusy(busy) {
        sending = !!busy;
        if (sendBtn) sendBtn.disabled = sending;
        if (attachBtn) attachBtn.disabled = sending;
        if (fileInput) fileInput.disabled = sending;
    }

    function loadThread(isPoll) {
        var url =
            'api/chat?action=' +
            (isPoll && lastMsgId > 0 ? 'poll' : 'thread') +
            (lastMsgId > 0 ? '&after_id=' + encodeURIComponent(lastMsgId) : '');
        return authFetch(url)
            .then(function (r) { return r.json(); })
            .then(function (body) {
                if (!body || body.code !== 200) {
                    throw new Error((body && body.msg) || '加载失败');
                }
                var data = body.data || {};
                appendMessages(data.messages || [], !isPoll);
                setStatus('客服在线 · 消息实时刷新');
            })
            .catch(function (e) {
                setStatus(String(e && e.message ? e.message : e) || '网络异常');
            });
    }

    function autoGrow() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    }

    function applySendResult(body) {
        if (body.data && body.data.message) {
            appendMessages([body.data.message], true);
            if (body.data.auto_reply) {
                appendMessages([body.data.auto_reply], true);
            }
        } else {
            return loadThread(true);
        }
    }

    function sendMessage() {
        if (sending) return;
        var content = String(inputEl.value || '').trim();
        if (!content) return;
        setBusy(true);
        authFetch('api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'send', content: content })
        })
            .then(function (r) { return r.json(); })
            .then(function (body) {
                if (!body || body.code !== 200) {
                    throw new Error((body && body.msg) || '发送失败');
                }
                inputEl.value = '';
                autoGrow();
                return applySendResult(body);
            })
            .catch(function (e) {
                alert(String(e && e.message ? e.message : e) || '发送失败');
            })
            .then(function () {
                setBusy(false);
                inputEl.focus();
            });
    }

    function uploadChatImage(file) {
        if (sending || !file) return;
        if (!/^image\//i.test(file.type || '') && !/\.(jpe?g|png|gif|webp)$/i.test(file.name || '')) {
            alert('请选择图片文件（jpg / png / gif / webp）');
            return;
        }
        if (file.size > 5 * 1024 * 1024) {
            alert('图片不能超过 5MB');
            return;
        }
        setBusy(true);
        setStatus('正在上传图片…');
        var fd = new FormData();
        fd.append('file', file);
        var headers = {};
        try {
            if (typeof getClientDeviceHeaders === 'function') {
                Object.assign(headers, getClientDeviceHeaders());
            }
        } catch (eH) {}
        try {
            var token =
                typeof authGetToken === 'function'
                    ? authGetToken()
                    : localStorage.getItem('token');
            if (token) headers.Authorization = 'Bearer ' + token;
        } catch (eT) {}
        fetch('/api/chat/upload-image', {
            method: 'POST',
            headers: headers,
            body: fd
        })
            .then(function (r) {
                if (r.status === 401) {
                    throw new Error('请先登录');
                }
                return r.json();
            })
            .then(function (body) {
                if (!body || body.code !== 200) {
                    throw new Error((body && body.msg) || '上传失败');
                }
                return applySendResult(body);
            })
            .catch(function (e) {
                alert(String(e && e.message ? e.message : e) || '上传失败');
                setStatus('客服在线 · 消息实时刷新');
            })
            .then(function () {
                setBusy(false);
                if (fileInput) fileInput.value = '';
            });
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('input', autoGrow);
    inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    if (attachBtn && fileInput) {
        attachBtn.addEventListener('click', function () {
            if (sending) return;
            fileInput.click();
        });
        fileInput.addEventListener('change', function () {
            var f = fileInput.files && fileInput.files[0];
            if (f) uploadChatImage(f);
        });
    }

    listEl.addEventListener('click', function (e) {
        var t = e.target;
        if (t && t.tagName === 'IMG' && t.classList.contains('chat-img') && t.src) {
            window.open(t.src, '_blank');
        }
    });

    loadThread(false).then(function () {
        pollTimer = setInterval(function () {
            loadThread(true);
        }, 3000);
    });

    document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
            loadThread(true);
        }
    });

    window.addEventListener('beforeunload', function () {
        if (pollTimer) clearInterval(pollTimer);
    });
})();
    </script>
</body>
</html>
