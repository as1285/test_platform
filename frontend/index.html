    <title>个人所得税</title>
    <script>
        (function () {
            var q = '';
            var h = '';
            try {
                q = String(window.location.search || '');
                h = String(window.location.hash || '');
            } catch (e0) {}
            var target = 'mine.html';
            try {
                var params = new URLSearchParams(q);
                if (params.get('need_activate') === '1') {
                    target = 'login.html';
                }
            } catch (e1) {}
            window.location.replace(target + q + h);
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=mine.html">

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;

            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        a { color: #1e6fff; }
    </style>
</head>
