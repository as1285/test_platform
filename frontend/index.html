<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260525-browser-install"></script>
    <script src="/js/browser-install-prompt.js?v=20260525-activated" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人所得税</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #fff;
            min-height: 100vh;
        }
        
        /* 顶部导航 */
        .header {
            background: #fff;
            padding: 15px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .back-btn {
            position: absolute;
            left: 16px;
            color: #1e6fff;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        
        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }
        
        /* 头像区域 */
        .avatar-section {
            display: flex;
            justify-content: center;
            padding: 50px 0 40px;
        }
        
        .avatar {
            width: 96px;
            height: 96px;
            background: linear-gradient(180deg, #b8dcff 0%, #e8f4ff 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .avatar-icon {
            width: 50px;
            height: 50px;
        }
        
        /* 表单区域 */
        .form-section {
            padding: 0 24px;
        }
        
        .form-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .form-label {
            width: 50px;
            font-size: 16px;
            color: #333;
            flex-shrink: 0;
        }
        
        .form-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            padding: 0 10px;
        }
        
        .form-input::placeholder {
            color: #999;
        }
        
        .form-help {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid #1e6fff;
            color: #1e6fff;
            font-size: 14px;
            font-weight: 600;
            line-height: 20px;
            text-align: center;
            flex-shrink: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* 滑块验证 */
        .slider-section {
            padding: 8px 24px 0;
        }
        .slider-lane {
            position: relative;
            height: 48px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .slider-hint {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            line-height: 48px;
            text-align: center;
            font-size: 15px;
            color: #c0c0c0;
            pointer-events: none;
            user-select: none;
        }
        .slider-arrows {
            position: absolute;
            left: 0;
            top: 0;
            width: 52px;
            height: 48px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            cursor: grab;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        .slider-arrows:active {
            cursor: grabbing;
        }
        .slider-arrows svg {
            width: 26px;
            height: 26px;
            fill: #999;
        }
        .slider-arrows.verified {
            background: #e8f5e9;
        }
        .slider-arrows.verified svg {
            fill: #52c41a;
        }

        .login-aux {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding: 12px 24px 0;
            font-size: 15px;
        }
        .login-aux a {
            color: #1e6fff;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .login-aux-sep {
            color: #d0d0d0;
            user-select: none;
        }
        
        /* 按钮区域 */
        .btn-section {
            padding: 24px 24px 20px;
        }
        
        .login-btn {
            width: 100%;
            height: 48px;
            background: #5aa3ff;
            border: none;
            border-radius: 24px;
            font-size: 17px;
            color: #fff;
            cursor: pointer;
            margin-bottom: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .login-btn:disabled,
        .login-btn.login-btn--locked {
            background: #b8d4f5;
            cursor: pointer;
        }
        .login-form-tip {
            display: none;
            margin: 10px 24px 0;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.5;
            color: #d46b08;
            background: #fff7e6;
            border: 1px solid #ffd591;
            border-radius: 8px;
            text-align: center;
        }
        .login-form-tip.show {
            display: block;
        }
        .slider-lane.slider-warn {
            animation: loginSliderShake 0.45s ease;
            box-shadow: inset 0 0 0 1px #ffa940;
        }
        @keyframes loginSliderShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .register-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            background: #fff;
            border: 1px solid #1e6fff;
            border-radius: 24px;
            font-size: 17px;
            color: #1e6fff;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        #activateSection {
            display: none;
            padding: 0 24px 32px;
        }
        #activateSection.activate-visible {
            display: block;
        }
        .activate-hint {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 16px;
            text-align: center;
        }
        .activate-code-input {
            width: 100%;
            height: 48px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 0 14px;
            font-size: 16px;
            letter-spacing: 0.04em;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .activate-code-input:focus {
            outline: none;
            border-color: #1e6fff;
        }
        .activate-btn {
            width: 100%;
            height: 48px;
            background: #1e6fff;
            border: none;
            border-radius: 24px;
            font-size: 17px;
            color: #fff;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .activate-btn:disabled {
            opacity: 0.6;
        }
        .activate-btn-secondary {
            background: #fff;
            color: #1e6fff;
            border: 1px solid #d0d8e8;
        }
        .activate-btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .activate-btn-row .activate-btn {
            flex: 1;
            margin-bottom: 0;
        }
        .activate-msg {
            font-size: 13px;
            min-height: 1.2em;
            margin-bottom: 8px;
            text-align: center;
        }
        .activate-msg.err {
            color: #e53935;
        }
        .activate-msg.ok {
            color: #2e7d32;
        }

        .login-welcome-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-welcome-modal.is-open {
            display: flex;
        }
        .login-welcome-modal-mask {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
        }
        .login-welcome-modal-panel {
            position: relative;
            width: 100%;
            max-width: 320px;
            background: #fff;
            border-radius: 12px;
            padding: 22px 20px 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        .login-welcome-modal-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 14px;
        }
        .login-welcome-modal-body {
            font-size: 15px;
            line-height: 1.65;
            color: #444;
            text-align: center;
        }
        .login-welcome-modal-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: #1e6fff;
            color: #fff;
            font-size: 16px;
        }
    </style>
</head>
<body class="page-login">

    <!-- 顶部导航 -->
    <div class="header">
        <a href="javascript:history.back()" class="back-btn">
            <img src="/jt.png" class="back-icon" alt="" width="9" decoding="async">
            <span>返回</span>
        </a>

    <div id="loginMainWrap">
        <!-- 头像区域 -->
        <div class="avatar-section">
            <div class="avatar">
                <svg class="avatar-icon" viewBox="0 0 50 50" fill="none">

                    <!-- 身体 -->
                    <path d="M10 45 C10 32 40 32 40 45" fill="#4a9eff"/>

    <div id="activateSection">
        <p class="activate-hint">您的账号尚未激活，请输入管理员提供的激活码。新用户注册时填写激活码即可直接开通，无需此步骤。</p>

    <div id="loginWelcomeModal" class="login-welcome-modal" role="dialog" aria-modal="true" aria-labelledby="loginWelcomeModalTitle">
        <div class="login-welcome-modal-mask" id="loginWelcomeModalMask"></div>
        <div class="login-welcome-modal-panel">
            <p class="login-welcome-modal-title" id="loginWelcomeModalTitle">温馨提示</p>
            <p class="login-welcome-modal-body" id="loginWelcomeModalBody">请注册账号后登录，注册免费，激活码199 永久使用，闲鱼购买，谨防被骗</p>
            <button type="button" class="login-welcome-modal-btn" id="loginWelcomeModalOk">我知道了</button>
        </div>
    </div>

    <script src="/js/xianyu-copy.js?v=20260525"></script>
    <script>
        function isNeedActivateMode() {
            try {
                return new URLSearchParams(window.location.search).get('need_activate') === '1';
            } catch (e) {
                return false;
            }
        }

        function setActivateMsg(text, isErr) {
            var el = document.getElementById('activateMsg');
            if (!el) {
                return;
            }
            el.textContent = text || '';
            el.className = 'activate-msg' + (text ? (isErr ? ' err' : ' ok') : '');
        }

        function showActivateMode() {
            var main = document.getElementById('loginMainWrap');
            var act = document.getElementById('activateSection');
            if (main) {
                main.style.display = 'none';
            }
            if (act) {
                act.classList.add('activate-visible');
            }
            try {
                document.querySelector('.header-title').textContent = '账号激活';
            } catch (e0) {}
        }

        function initActivateFromUrl() {
            if (!isNeedActivateMode()) {
                return;
            }
            var token = '';
            try {
                token = localStorage.getItem('token') || '';
            } catch (e1) {}
            if (!token) {
                return;
            }
            try {
                if (localStorage.getItem('account_active') === '1') {
                    window.location.replace('mine.html');
                    return;
                }
            } catch (e2) {}
            showActivateMode();
            prefetchXianyuPurchaseUrl();
        }

        initActivateFromUrl();

        var LOGIN_WELCOME_STORAGE_KEY = 'tax_login_welcome_v1';

        function closeLoginWelcomeModal(markSeen) {
            var root = document.getElementById('loginWelcomeModal');
            if (root) {
                root.classList.remove('is-open');
            }
            if (markSeen) {
                try {
                    localStorage.setItem(LOGIN_WELCOME_STORAGE_KEY, '1');
                } catch (e) {}
            }
        }

        function maybeShowLoginWelcomeModal() {
            if (isNeedActivateMode()) {
                return;
            }
            try {
                if (localStorage.getItem(LOGIN_WELCOME_STORAGE_KEY) === '1') {
                    return;
                }
            } catch (e) {}
            var root = document.getElementById('loginWelcomeModal');
            if (!root) {
                return;
            }
            root.classList.add('is-open');
            var ok = document.getElementById('loginWelcomeModalOk');
            var mask = document.getElementById('loginWelcomeModalMask');
            if (ok && !ok.__welcomeBound) {
                ok.__welcomeBound = true;
                ok.addEventListener('click', function () {
                    closeLoginWelcomeModal(true);
                });
            }
            if (mask && !mask.__welcomeBound) {
                mask.__welcomeBound = true;
                mask.addEventListener('click', function () {
                    closeLoginWelcomeModal(true);
                });
            }
        }

        maybeShowLoginWelcomeModal();

        function prefetchXianyuPurchaseUrl() {
            fetch('/api/public/install-packages', { credentials: 'same-origin' })
                .then(function (r) {
                    return r.json();
                })
                .then(function (body) {
                    window.__xianyuPurchaseUrl =
                        body && body.code === 200 && body.data && body.data.xianyu_purchase_url
                            ? String(body.data.xianyu_purchase_url).trim()
                            : '';
                })
                .catch(function () {
                    window.__xianyuPurchaseUrl = '';
                });
        }
        prefetchXianyuPurchaseUrl();

        document.getElementById('btnXianyuPurchase').addEventListener('click', function () {
            function doCopy(txt) {
                if (!txt) {
                    setActivateMsg('暂未配置购买文案，请在管理后台「引导安装」中填写', true);
                    return;
                }
                if (typeof copyXianyuPurchaseText !== 'function') {
                    setActivateMsg('复制功能不可用', true);
                    return;
                }
                copyXianyuPurchaseText(txt).catch(function () {
                    setActivateMsg('复制失败，请长按手动复制', true);
                });
            }
            var cached = String(window.__xianyuPurchaseUrl || '').trim();
            if (cached) {
                doCopy(cached);
                return;
            }
            fetch('/api/public/install-packages', { credentials: 'same-origin' })
                .then(function (r) {
                    return r.json();
                })
                .then(function (body) {
                    var t =
                        body && body.code === 200 && body.data && body.data.xianyu_purchase_url
                            ? String(body.data.xianyu_purchase_url).trim()
                            : '';
                    window.__xianyuPurchaseUrl = t;
                    doCopy(t);
                })
                .catch(function () {
                    setActivateMsg('网络错误', true);
                });
        });

        document.getElementById('btnDoActivate').addEventListener('click', function () {
            var code = document.getElementById('activateCodeInput').value.trim();
            if (!code) {
                setActivateMsg('请输入激活码', true);
                return;
            }
            var btn = document.getElementById('btnDoActivate');
            btn.disabled = true;
            setActivateMsg('');
            fetch('api/auth.php', {
                method: 'POST',
                headers: typeof authHeaders === 'function' ? authHeaders() : { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'activate', code: code })
            })
                .then(function (r) {
                    return r.json().then(function (j) {
                        return { status: r.status, body: j };
                    });
                })
                .then(function (x) {
                    if (x.status === 200 && x.body.code === 200 && x.body.data) {
                        var d = x.body.data;
                        if (d.token) {
                            localStorage.setItem('token', d.token);
                        }
                        localStorage.setItem('account_active', '1');
                        localStorage.setItem('is_test_account', d.is_test_account ? '1' : '0');
                        if (d.user_id) {
                            localStorage.setItem('user_id', d.user_id);
                        }
                        if (d.real_name) {
                            localStorage.setItem('real_name', d.real_name);
                        }
                        setActivateMsg('激活成功，正在进入…', false);
                        setTimeout(function () {
                            window.location.href = 'mine.html';
                        }, 400);
                        return;
                    }
                    setActivateMsg((x.body && x.body.msg) || '激活失败', true);
                })
                .catch(function () {
                    setActivateMsg('网络错误', true);
                })
                .finally(function () {
                    btn.disabled = false;
                });
        });

        document.getElementById('btnActivateLogout').addEventListener('click', function () {
            if (typeof authClearSession === 'function') {
                authClearSession();
            } else {
                try {
                    localStorage.removeItem('token');
                    localStorage.removeItem('account_active');
                } catch (e3) {}
            }
            window.location.href = 'index.html';
        });

        function isLoginSliderVerified() {
            var handle = document.getElementById('loginSliderHandle');
            return !!(handle && handle.classList.contains('verified'));
        }

        function showLoginFormTip(msg) {
            var tip = document.getElementById('loginFormTip');
            if (!tip) {
                if (msg) alert(msg);
                return;
            }
            if (!msg) {
                tip.textContent = '';
                tip.classList.remove('show');
                return;
            }
            tip.textContent = msg;
            tip.classList.add('show');
        }

        function warnLoginSlider() {
            var lane = document.getElementById('loginSliderLane');
            if (!lane) return;
            lane.classList.remove('slider-warn');
            void lane.offsetWidth;
            lane.classList.add('slider-warn');
            window.setTimeout(function () {
                lane.classList.remove('slider-warn');
            }, 500);
        }

        function setLoginSubmitReady(ready) {
            var loginBtn = document.getElementById('loginSubmitBtn');
            if (!loginBtn) return;
            if (ready) {
                loginBtn.classList.remove('login-btn--locked');
            } else {
                loginBtn.classList.add('login-btn--locked');
            }
        }

        function initLoginSlider() {
            var lane = document.getElementById('loginSliderLane');
            var handle = document.getElementById('loginSliderHandle');
            var hint = document.getElementById('loginSliderHint');
            var loginBtn = document.getElementById('loginSubmitBtn');
            if (!lane || !handle || !hint || !loginBtn) return;

            var maxX = 0;
            var startLeft = 0;
            var startClientX = 0;
            var dragging = false;

            function layout() {
                maxX = Math.max(0, lane.offsetWidth - handle.offsetWidth);
            }
            function setHandle(x) {
                x = Math.max(0, Math.min(x, maxX));
                handle.style.left = x + 'px';
            }
            function resetSlider() {
                handle.style.left = '0px';
                handle.classList.remove('verified');
                hint.textContent = '请按住滑块，拖动到最右边';
                hint.style.color = '#c0c0c0';
                setLoginSubmitReady(false);
            }
            function onPointerDown(e) {
                if (handle.classList.contains('verified')) return;
                dragging = true;
                layout();
                startLeft = handle.offsetLeft;
                startClientX = e.clientX != null ? e.clientX : e.touches[0].clientX;
                e.preventDefault();
            }
            function onPointerMove(e) {
                if (!dragging) return;
                var cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                setHandle(startLeft + cx - startClientX);
                e.preventDefault();
            }
            function onPointerUp() {
                if (!dragging) return;
                dragging = false;
                layout();
                if (handle.offsetLeft >= maxX - 2) {
                    handle.classList.add('verified');
                    hint.textContent = '验证通过';
                    hint.style.color = '#52c41a';
                    setLoginSubmitReady(true);
                    showLoginFormTip('');
                } else {
                    resetSlider();
                }
            }

            handle.addEventListener('mousedown', onPointerDown);
            handle.addEventListener('touchstart', onPointerDown, { passive: false });
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('touchmove', onPointerMove, { passive: false });
            document.addEventListener('mouseup', onPointerUp);
            document.addEventListener('touchend', onPointerUp);
            document.addEventListener('touchcancel', onPointerUp);
            window.addEventListener('resize', function () {
                if (!handle.classList.contains('verified')) {
                    layout();
                    setHandle(handle.offsetLeft);
                }
            });
            layout();
            resetSlider();
        }
        initLoginSlider();

        var loginAccountHelp = document.getElementById('loginAccountHelp');
        if (loginAccountHelp) {
            loginAccountHelp.addEventListener('click', function () {
                alert('可使用手机号码或居民身份证号码作为账号登录。');
            });
        }
        var linkFaceLogin = document.getElementById('linkFaceLogin');
        if (linkFaceLogin) {
            linkFaceLogin.addEventListener('click', function () {
                alert('扫脸登录功能暂未开放，请使用账号密码登录。');
            });
        }
        function doLogin() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value;
            showLoginFormTip('');

            if (!username) {
                showLoginFormTip('请输入账号');
                return;
            }
            if (!password) {
                showLoginFormTip('请输入密码');
                return;
            }
            if (!isLoginSliderVerified()) {
                showLoginFormTip('请先按住滑块，拖动到最右边完成验证');
                warnLoginSlider();
                return;
            }

            fetch('api/auth.php', {
                method: 'POST',
                headers: typeof authHeaders === 'function' ? authHeaders() : { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'login',
                    username: username,
                    password: password
                })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.code === 200 && data.data) {
                        var d = data.data;
                        if (d.token) {
                            localStorage.setItem('token', d.token);
                        }
                        localStorage.setItem('userName', d.username || username);
                        localStorage.setItem('user_id', d.user_id || username);
                        localStorage.setItem('real_name', d.real_name || username);
                        var act = d.account_active === true || d.account_active === 1;
                        localStorage.setItem('account_active', act ? '1' : '0');
                        localStorage.setItem('is_test_account', d.is_test_account ? '1' : '0');
                        window.location.href = 'mine.html';
                        return;
                    }
                    alert(data.msg || '登录失败');
                })
                .catch(function () {
                    alert('网络错误，请检查服务是否可用');
                });
        }

    </script>
</body>
</html>
