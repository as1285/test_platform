<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth-boot.js?v=20260902-adopt"></script>
    <script src="/js/auth.js?v=20260902-adopt" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>关于&amp;更新</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom, 0);
            color: #333;
        }
        .header {
            background: #fff;
            min-height: 48px;
            height: auto;
            padding-top: max(var(--app-shell-statusbar-top, 0px), env(safe-area-inset-top, 0px));
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eee;
            box-sizing: border-box;
        }
        html.app-ios-client .header {
            padding-top: max(var(--app-shell-statusbar-top, 59px), env(safe-area-inset-top, 0px));
        }
        .back-btn {
            position: absolute;
            left: 12px;
            top: auto;
            bottom: 0;
            height: 48px;
            color: #1e6fff;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn img {
            width: 9px;
            height: auto;
            display: block;
        }
        .header-title {
            height: 48px;
            display: flex;
            align-items: center;
            font-size: 17px;
            font-weight: 600;
            color: #191e26;
        }
        /* 对齐原版：更大顶距，图标约 90px，版本号 2.3.3 */
        .brand {
            padding: 40px 16px 28px;
            text-align: center;
            background: #f5f6fa;
        }
        .app-icon {
            margin: 0 auto 16px;
            line-height: 0;
        }
        .app-icon img {
            display: block;
            width: 90px;
            height: 90px;
            margin: 0 auto;
            object-fit: contain;
            border-radius: 20px;
        }
        .version {
            font-size: 15px;
            color: #8a8f99;
            letter-spacing: 0.02em;
        }
        .list-wrap {
            margin: 0;
            background: #fff;
            border-top: 1px solid #e8e8ed;
            border-bottom: 1px solid #e8e8ed;
        }
        .list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            min-height: 50px;
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            background: #fff;
            -webkit-tap-highlight-color: transparent;
        }
        .list-row:last-child { border-bottom: none; }
        .list-row:active { background: #f7f7f7; }
        .list-row .label { flex-shrink: 0; color: #333; }
        .list-row .value {
            flex: 1;
            text-align: right;
            font-size: 15px;
            color: #8a8f99;
            margin-left: 12px;
            line-height: 1.35;
        }
        .list-row .arrow {
            color: #c7c7cc;
            font-size: 16px;
            margin-left: 6px;
            flex-shrink: 0;
            line-height: 1;
        }
        .list-row-link .value { color: transparent; width: 0; margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div class="header">
        <a href="mine.html" class="back-btn">
            <img src="/jt.png" alt="">
            <span>返回</span>
        </a>
        <span class="header-title">关于&amp;更新</span>
    </div>

    <div class="brand">
        <div class="app-icon">
            <img src="about_app_icon.png" width="90" height="90" alt="个人所得税">
        </div>
        <p class="version">版本号：2.3.3</p>
    </div>

    <div class="list-wrap">
        <div class="list-row">
            <span class="label">基本信息</span>
            <span class="value">自然人办税服务平台</span>
        </div>
        <div class="list-row">
            <span class="label">版本更新</span>
            <span class="value">已是最新版本</span>
        </div>
        <a class="list-row list-row-link" href="about_update_notes.html">
            <span class="label">更新说明</span>
            <span class="value"></span>
            <span class="arrow">&gt;</span>
        </a>
        <div class="list-row">
            <span class="label">版权所有</span>
            <span class="value">国家税务总局</span>
        </div>
        <a class="list-row list-row-link" href="about_agreement.html">
            <span class="label">协议</span>
            <span class="value"></span>
            <span class="arrow">&gt;</span>
        </a>
    </div>
    <script src="/js/watermark.js?v=20260831-m60home"></script>
</body>
</html>
