        .daiban-header {

            z-index: 1;
            background: #2b81f2;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* 内置 HTML 头：安全区由 builtin 自己处理，避免与 .daiban-header 顶距叠加 */
        .daiban-header[data-header-mode="builtin"] {
            padding-top: 0 !important;
        }

        .daiban-header-builtin {
            background: linear-gradient(180deg, #2b81f2 0%, #3a8ff5 55%, #4b9af7 100%);
            padding: 10px 16px 18px;
            padding-top: calc(10px + env(safe-area-inset-top, 0px));

        html.app-top-safe-shell .daiban-header-builtin {
            padding-top: calc(10px + var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px)));
        }

        .daiban-header-custom-img[hidden] {
            display: none !important;
            margin: 0 !important;
        }

        .daiban-title-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: nowrap;
        }

            font-size: 28px;
            font-weight: 700;
            color: #fff;
            line-height: 1.15;
            letter-spacing: 0.5px;
            flex-shrink: 0;

            padding: 9px 12px;
            font-size: 12px;
            line-height: 1.5;
            color: #d0890c;
        }

            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            margin-right: 4px;
            border: 1.2px solid currentColor;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            font-style: normal;
            line-height: 1;
            vertical-align: -1px;
        }

        .daiban-header-custom-img {
            width: 100%;
            display: block;
        }

            .daiban-header:not([data-header-mode="builtin"]) {
                padding-top: env(safe-area-inset-top, 0px);

            padding-top: var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px));

        html.app-top-safe-shell .daiban-header:not([data-header-mode="builtin"]) > .daiban-header-custom-img {
            margin-top: calc(-1 * var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px)));

            background: none;
            font-size: 16px;
            color: #999;
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .daiban-tab.active {
            color: #222;
            font-weight: 600;
        }

        .daiban-tab.active::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 30px;
            height: 4px;
            background: #2b81f2;
            border-radius: 2px;
        }

        .daiban-panels {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #f5f6fa;

        .daiban-panel {

        .daiban-empty {

        .daiban-empty img {

            display: block;
        }

        .daiban-empty p {
            margin-top: 18px;
            font-size: 15px;
            color: #999;
            line-height: 1.5;
        }

    <script>
        function updateNavIcons() {
            var navItems = document.querySelectorAll('.bottom-nav .nav-item');
            navItems.forEach(function (item) {
                var icon = item.getAttribute('data-icon');
                var img = item.querySelector('.nav-icon img');
                if (item.classList.contains('active')) {
                    img.src = 'caidan/' + icon + '1.png';
                } else {
                    img.src = 'caidan/' + icon + '2.png';
                }
            });
            if (window.__refreshNavFromMineUi) {
                window.__refreshNavFromMineUi();
            }
        }

        updateNavIcons();

        (function () {
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                var bottomNav = document.querySelector('.bottom-nav');
                if (bottomNav) {
                    bottomNav.classList.add('ios-device');
