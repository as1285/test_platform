<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var u = typeof navigator !== 'undefined' ? (navigator.userAgent || '') : '';
                try { u += ' ' + String(localStorage.getItem('tax_device_model_v1') || ''); } catch (eModel) {}
                try { u += ' ' + String(localStorage.getItem('tax_device_ua_v1') || ''); } catch (eUa) {}
                if (/Mate\s*70|PLA-AL|PLR-AL|PLU-AL/i.test(u)) return;
                if (!/Mate\s*60|ALN-AL00|ALN-AL10|ALN-AL80|ALN-AN00|ALN-AL\d{2}|ALN-AN\d{2}|HUAWEIALN/i.test(u)) return;
                document.documentElement.classList.add('app-android-client');
                document.documentElement.classList.add('app-android-huawei-mate60');
                document.documentElement.classList.add('app-android-immersive-white-top');
                document.documentElement.classList.add('app-top-safe-shell');
                document.documentElement.style.setProperty('--app-shell-statusbar-top', '40px');
                document.documentElement.style.setProperty('--android-status-inset', '40px');
                document.documentElement.style.setProperty('--safe-top', '40px');
                if (!document.querySelector('style[data-mate60-message-detail-firstpaint]')) {
                    var st = document.createElement('style');
                    st.setAttribute('data-mate60-message-detail-firstpaint', '1');
                    st.textContent =
                        'html.app-android-huawei-mate60 body.page-message-detail{' +
                        'padding-top:calc(44px + 40px) !important;}' +
                        'html.app-android-huawei-mate60 body.page-message-detail > .header{' +
                        'position:fixed !important;top:0 !important;left:0 !important;right:0 !important;' +
                        'padding:40px 12px 11px !important;min-height:0 !important;height:auto !important;' +
                        'box-sizing:border-box !important;background:#fff !important;z-index:100 !important;}' +
                        'html.app-android-huawei-mate60 body.page-message-detail > .header .back-btn{' +
                        'top:auto !important;height:auto !important;display:flex !important;align-items:center !important;}' +
                        'html.app-android-huawei-mate60 body.page-message-detail .detail-wrap{' +
                        'max-width:none !important;width:100% !important;margin:0 !important;' +
                        'padding-left:16px !important;padding-right:16px !important;box-sizing:border-box !important;}';
                    (document.head || document.documentElement).appendChild(st);
                }
            } catch (e) {}
        })();
    </script>
    <script src="/js/auth-boot.js?v=20260918-ios27-edge"></script>
    <script src="/js/auth.js?v=20260909-android-aug1-blue" defer fetchpriority="low"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>消息详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #fff;
            min-height: 100vh;
            color: #323233;
            font-size: 15px;
            font-weight: 400;
            line-height: 22px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-top: calc(44px + env(safe-area-inset-top, 0px));
        }
        html.app-top-safe-shell body.page-message-detail {
            padding-top: calc(44px + var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px)));
        }
        .header {
            background: #fff;
            padding: calc(11px + env(safe-area-inset-top, 0px)) 12px 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            min-height: 44px;
            box-sizing: border-box;
        }
        html.app-top-safe-shell .header {
            padding-top: calc(11px + var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px)));
        }
        .back-btn {
            position: absolute;
            left: 12px;
            color: #1e6fff;
            font-size: 17px;
            font-weight: 400;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn img {
            width: 9px;
            height: auto;
            vertical-align: middle;
        }
        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #323233;
            letter-spacing: 0;
        }
        .detail-wrap {
            padding: 10px 12px 32px;
            max-width: 520px;
            margin: 0 auto;
        }
        .detail-title {
            font-size: 16px;
            font-weight: 500;
            line-height: 22px;
            color: #323233;
            margin-bottom: 4px;
            letter-spacing: 0;
        }
        .detail-title-label {
            font-size: 13px;
            font-weight: 400;
            color: #969799;
        }
        .detail-time {
            font-size: 12px;
            font-weight: 400;
            line-height: 17px;
            color: #969799;
            margin-bottom: 12px;
        }
        .detail-body {
            font-size: 15px;
            font-weight: 400;
            line-height: 22px;
            color: #646566;
            word-break: break-word;
            text-align: left;
            letter-spacing: 0;
        }
        .detail-body a {
            color: #1989fa;
            text-decoration: none;
            font-weight: 400;
        }
        .detail-loading,
        .detail-error {
            padding: 48px 12px;
            text-align: center;
            color: #969799;
            font-size: 14px;
            line-height: 20px;
        }

        /*
         * Mate 60 / Pro（ALN-AL00）：沉浸白顶，顶栏只垫 40px，避免与 env(safe-area) 叠成大块空白；
         * 内容区取消 520 限宽，左右铺满。
         */
        html.app-android-huawei-mate60 body.page-message-detail,
        html.app-android-huawei-mate60.app-top-safe-shell body.page-message-detail {
            padding-top: calc(44px + 40px) !important;
        }
        html.app-android-huawei-mate60 body.page-message-detail > .header,
        html.app-android-huawei-mate60.app-top-safe-shell body.page-message-detail > .header {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            padding: 40px 12px 11px !important;
            min-height: 0 !important;
            height: auto !important;
            box-sizing: border-box !important;
            background: #fff !important;
            z-index: 100 !important;
        }
        html.app-android-huawei-mate60 body.page-message-detail > .header .back-btn,
        html.app-android-huawei-mate60.app-top-safe-shell body.page-message-detail > .header .back-btn {
            top: auto !important;
            height: auto !important;
            display: flex !important;
            align-items: center !important;
            left: 12px !important;
        }
        html.app-android-huawei-mate60 body.page-message-detail .detail-wrap,
        html.app-android-huawei-mate60.app-top-safe-shell body.page-message-detail .detail-wrap {
            max-width: none !important;
            width: 100% !important;
            margin: 0 !important;
            padding-left: 16px !important;
            padding-right: 16px !important;
            box-sizing: border-box !important;
        }

        /* 华为 TAS-AN00（Mate 40 等）：消息详情字号整体小两号 */
        html.app-android-huawei-tas-an00 body.page-message-detail {
            font-size: 13px;
            line-height: 20px;
        }

        html.app-android-huawei-tas-an00 body.page-message-detail .back-btn,
        html.app-android-huawei-tas-an00 body.page-message-detail .header-title {
            font-size: 15px;
        }

        html.app-android-huawei-tas-an00 body.page-message-detail .detail-title {
            font-size: 14px;
            line-height: 20px;
        }

        html.app-android-huawei-tas-an00 body.page-message-detail .detail-title-label {
            font-size: 11px;
        }

        html.app-android-huawei-tas-an00 body.page-message-detail .detail-time {
            font-size: 10px;
            line-height: 15px;
        }

        html.app-android-huawei-tas-an00 body.page-message-detail .detail-body {
            font-size: 13px;
            line-height: 20px;
        }

        html.app-android-huawei-tas-an00 body.page-message-detail .detail-loading,
        html.app-android-huawei-tas-an00 body.page-message-detail .detail-error {
            font-size: 12px;
            line-height: 18px;
        }
    </style>
</head>
<body class="page-message-detail">
    <header class="header">
        <a href="message.html" class="back-btn" id="msgDetailBack">
            <img src="/jt.png" alt="" width="9" decoding="async">
            <span>返回</span>
        </a>
        <span class="header-title">消息详情</span>
    </header>
    <div class="detail-wrap" id="detailRoot">
        <div class="detail-loading">加载中…</div>
    </div>
    <script>
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function urlParam(name) {
            try {
                return new URLSearchParams(window.location.search).get(name) || '';
            } catch (e) {
                return '';
            }
        }

        function pad2(n) {
            return n < 10 ? '0' + n : String(n);
        }

        function parseCompanyName(msg) {
            var company = (msg.company_name || '').trim();
            if (company) return company;
            var content = (msg.content || '').trim();
            var m = content.match(/来自(.+?)的扣缴/);
            if (m && m[1]) return m[1].trim();
            m = content.match(/来自(.+?)扣缴/);
            if (m && m[1]) return m[1].trim();
            return '任职受雇单位';
        }

        function parseFilingDate(msg) {
            var raw = (msg.msg_date || '').trim();
            if (/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(raw)) {
                var p = raw.split(/[T\s]/)[0].replace(/\//g, '-').split('-');
                return {
                    y: parseInt(p[0], 10),
                    m: parseInt(p[1], 10),
                    d: parseInt(p[2], 10)
                };
            }
            var d = msg.created_at ? new Date(msg.created_at) : new Date();
            if (isNaN(d.getTime())) d = new Date();
            return { y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate() };
        }

        function formatCnDate(y, m, d) {
            return y + '年' + m + '月' + d + '日';
        }

        function formatCnDatePadded(y, m, d) {
            return y + '年' + pad2(m) + '月' + pad2(d) + '日';
        }

        function formatDisplayTime(msg) {
            var raw = (msg.msg_date || '').trim();
            if (raw) {
                if (/\d{2}:\d{2}/.test(raw)) {
                    return raw.replace('T', ' ').slice(0, 16);
                }
                var dateMatch = raw.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
                if (dateMatch) {
                    return (
                        dateMatch[1] +
                        '-' +
                        pad2(parseInt(dateMatch[2], 10)) +
                        '-' +
                        pad2(parseInt(dateMatch[3], 10)) +
                        ' 10:13'
                    );
                }
            }
            if (msg.created_at) {
                try {
                    var c = new Date(msg.created_at);
                    if (!isNaN(c.getTime())) {
                        return (
                            c.getFullYear() +
                            '-' +
                            pad2(c.getMonth() + 1) +
                            '-' +
                            pad2(c.getDate()) +
                            ' ' +
                            pad2(c.getHours()) +
                            ':' +
                            pad2(c.getMinutes())
                        );
                    }
                } catch (e) {}
            }
            var fd = parseFilingDate(msg);
            return fd.y + '-' + pad2(fd.m) + '-' + pad2(fd.d) + ' 10:13';
        }

        function buildWithholdingTitleHtml(msg) {
            var title = (msg.title || '扣缴申报温馨提示').trim();
            var company = parseCompanyName(msg);
            return (
                '<span class="detail-title-label">【' +
                escapeHtml(title) +
                '】</span>来自' +
                escapeHtml(company) +
                '扣缴申报的温馨提示'
            );
        }

        function buildWithholdingBody(msg) {
            var company = parseCompanyName(msg);
            var fd = parseFilingDate(msg);
            var py = fd.y;
            var pm = fd.m - 1;
            if (pm < 1) {
                pm = 12;
                py -= 1;
            }
            var filingStr = formatCnDatePadded(fd.y, fd.m, fd.d);
            return (
                '尊敬的纳税人，【' +
                company +
                '】于' +
                filingStr +
                '已为您办理税款所属期为' +
                py +
                '年' +
                pm +
                '月的个人所得税扣缴申报。如需了解详情，您可通过【收入纳税明细】查看相关信息。如您有疑问，请及时联系该单位进行核实。'
            );
        }

        function renderDetail(title, timeText, bodyText, bodyHtmlLink, titleHtml, linkUrl) {
            var root = document.getElementById('detailRoot');
            var bodyHtml = escapeHtml(bodyText);
            if (bodyHtmlLink) {
                bodyHtml = bodyHtml.replace(
                    /【收入纳税明细】/g,
                    '<a href="shuiming.html">【收入纳税明细】</a>'
                );
                var href = linkUrl || 'purchase.html';
                if (!/^[a-zA-Z0-9_./?=&\-%]+$/.test(href) || href.indexOf('..') >= 0) {
                    if (!/^https:\/\/(www\.)?geshui\.vip(\/|$)/i.test(href)) {
                        href = 'purchase.html';
                    }
                }
                bodyHtml = bodyHtml.replace(
                    /【前往激活】/g,
                    '<a href="' + escapeHtml(href) + '">【前往激活】</a>'
                );
            }
            var titleBlock = titleHtml || escapeHtml(title);
            root.innerHTML =
                '<h1 class="detail-title">' +
                titleBlock +
                '</h1>' +
                '<p class="detail-time">' +
                escapeHtml(timeText) +
                '</p>' +
                '<div class="detail-body">' +
                bodyHtml +
                '</div>';
        }

        function parseOpsMessageContent(raw) {
            var text = raw != null ? String(raw) : '';
            var link = 'purchase.html';
            var m = text.match(/\n@@link:(\S+)\s*$/);
            if (m) {
                link = m[1];
                text = text.slice(0, m.index);
            }
            return { text: text.trim(), link: link };
        }

        function isSystemNoticeMessage(msg) {
            return String((msg && msg.company_name) || '').trim() === '系统通知';
        }

        function renderDemoMaintDetail() {
            try {
                if (window.ConversionGuide && typeof window.ConversionGuide.prependMaintenanceMessages === 'function') {
                    var list = window.ConversionGuide.prependMaintenanceMessages([]);
                    if (list.length) {
                        var msg = list[0];
                        renderDetail(
                            msg.title || '演示数据维护提醒',
                            formatDisplayTime(msg),
                            msg.content || '',
                            false
                        );
                        try {
                            localStorage.setItem('cg_maint_msg_dismissed', '1');
                        } catch (e) {}
                        return;
                    }
                }
            } catch (e2) {}
            renderDetail(
                '演示数据维护提醒',
                formatDisplayTime({ msg_date: new Date().toISOString().slice(0, 10) }),
                '您的个税演示数据可随时在「我要咨询 → 税务记录」中修改；如需更新年度汇总，可重新批量生成或编辑单条记录。',
                false
            );
        }

        (function bindBack() {
            var back = document.getElementById('msgDetailBack');
            if (!back) return;
            back.addEventListener('click', function (e) {
                if (window.history.length > 1) {
                    e.preventDefault();
                    window.history.back();
                }
            });
        })();

        function loadDetail() {
            var demo = urlParam('demo');
            if (demo === 'maint') {
                renderDemoMaintDetail();
                return;
            }
            var id = urlParam('id');
            if (!id) {
                document.getElementById('detailRoot').innerHTML =
                    '<div class="detail-error">消息不存在</div>';
                return;
            }
            window.authFetch('api/message?action=detail&id=' + encodeURIComponent(id))
                .then(function (r) {
                    return (window.authParseJson||function(r){return r.json();})(r);
                })
                .then(function (data) {
                    if (data.code !== 200 || !data.data) {
                        throw new Error(data.msg || 'load failed');
                    }
                    var msg = data.data;
                    var isMaint = String(msg.title || '').indexOf('演示数据维护') >= 0;
                    if (isMaint) {
                        renderDetail(msg.title, formatDisplayTime(msg), msg.content || '', false);
                        return;
                    }
                    if (isSystemNoticeMessage(msg)) {
                        var parsed = parseOpsMessageContent(msg.content || '');
                        renderDetail(
                            msg.title || '系统通知',
                            formatDisplayTime(msg),
                            parsed.text,
                            true,
                            null,
                            parsed.link
                        );
                        if (typeof window.refreshMessageUnreadBadge === 'function') {
                            window.refreshMessageUnreadBadge();
                        }
                        return;
                    }
                    renderDetail(
                        '',
                        formatDisplayTime(msg),
                        buildWithholdingBody(msg),
                        true,
                        buildWithholdingTitleHtml(msg)
                    );
                    if (typeof window.refreshMessageUnreadBadge === 'function') {
                        window.refreshMessageUnreadBadge();
                    }
                })
                .catch(function () {
                    document.getElementById('detailRoot').innerHTML =
                        '<div class="detail-error">无法加载消息，请返回重试</div>';
                });
        }

        loadDetail();
    </script>
    <script src="/js/watermark.js?v=20260831-m60home"></script>
</body>
</html>
