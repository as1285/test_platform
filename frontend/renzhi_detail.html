<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260725-abc-c-only"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f2f2f7;
            min-height: 100vh;
        }
        .header {
            background: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e5e5ea;
        }
        .back-btn {
            position: absolute;
            left: 12px;
            color: #007aff;
            font-size: 15px;
            font-weight: 400;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .header-title { font-size: 17px; font-weight: 500; color: #000; }
        .header-right {
            position: absolute;
            right: 12px;
            color: #007aff;
            font-size: 15px;
            font-weight: 400;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .detail-wrap {
            margin-top: 0;
            background: #fff;
        }
        .detail-row {
            display: flex;
            align-items: flex-start;
            padding: 14px 16px;
            border-bottom: 1px solid #e5e5ea;
            min-height: 48px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            font-size: 15px;
            color: #333;
            font-weight: 400;
            flex: 0 0 38%;
            line-height: 1.45;
            padding-right: 8px;
        }
        .detail-value {
            flex: 1;
            text-align: right;
            font-size: 15px;
            color: #999;
            font-weight: 400;
            line-height: 1.45;
            word-break: break-all;
        }
        .empty-state { text-align: center; padding: 48px 20px; color: #999; font-size: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="renzhi.html" class="back-btn">
            <img src="/jt.png" alt="" style="width: 9px; vertical-align: middle;">
            <span>返回</span>
        </a>
        <span class="header-title">详情</span>
        <a href="#" class="header-right" onclick="return false;">申诉</a>
    </div>
    <div id="detailMount"></div>
    <script>
        function getParam(name) {
            var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return m ? decodeURIComponent(m[1]) : '';
        }
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function displayVal(val) {
            if (val == null || val === '' || val === '-') return '';
            return String(val);
        }
        function row(label, val) {
            var text = displayVal(val);
            return '<div class="detail-row">' +
                '<span class="detail-label">' + escapeHtml(label) + '</span>' +
                '<span class="detail-value">' + escapeHtml(text) + '</span>' +
                '</div>';
        }
        (function () {
            var id = getParam('id');
            var userId = localStorage.getItem('user_id');
            var mount = document.getElementById('detailMount');
            if (!userId) {
                window.location.href = 'index.html';
                return;
            }
            if (!id) {
                mount.innerHTML = '<div class="empty-state">缺少记录参数</div>';
                return;
            }
            authFetch('api/user?action=employers')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.code !== 200 || !data.data || !data.data.employers) {
                        mount.innerHTML = '<div class="empty-state">加载失败</div>';
                        return;
                    }
                    var item = data.data.employers.find(function (x) { return String(x.id) === String(id); });
                    if (!item) {
                        mount.innerHTML = '<div class="empty-state">未找到该任职受雇记录</div>';
                        return;
                    }
                    var leaveVal = item.leave_date;
                    if (!leaveVal && (item.status === '1' || item.status === 1)) {
                        leaveVal = '';
                    }
                    mount.innerHTML =
                        '<div class="detail-wrap">' +
                        row('统一社会信用代码', item.credit_code) +
                        row('单位名称', item.company_name) +
                        row('职务', item.position) +
                        row('任职受雇日期', item.hire_date) +
                        row('离职日期', leaveVal) +
                        '</div>';
                })
                .catch(function () {
                    mount.innerHTML = '<div class="empty-state">加载失败</div>';
                });
        })();
    </script>
    <script src="/js/watermark.js?v=20260722-wm-redder"></script>
</body>
</html>
