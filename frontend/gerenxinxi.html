    <script>
        var lastTaxId = '';

        /** 勿用裸 authFetch：部分 WebView 下未挂到全局会报 ReferenceError，导致改不了资料 */
        function profileAuthFetch(url, opts) {
            opts = opts || {};
            if (typeof window.authFetch === 'function') {
                return window.authFetch(url, opts);
            }
            var headers = { 'Content-Type': 'application/json' };
            try {
                if (typeof window.authHeaders === 'function') {
                    headers = Object.assign(headers, window.authHeaders());
                }
            } catch (eHdr) {}
            if (!headers.Authorization && !headers.authorization) {
                var t = '';
                try {
                    t = String(localStorage.getItem('token') || '').trim();
                } catch (eTok) {}
                if (t) headers.Authorization = 'Bearer ' + t;
            }
            return fetch(
                url,
                Object.assign({}, opts, {
                    headers: Object.assign({}, headers, opts.headers || {}),
                    credentials: opts.credentials || 'same-origin'
                })
            );
        }

        function requireProfileEdit() {
            if (
                !window.ConversionGuide ||
                typeof window.ConversionGuide.isTaxEditModeOn !== 'function' ||
                window.ConversionGuide.isTaxEditModeOn()
            ) {
                return true;
            }
            return false;
        }

        function maskId(num) {
            if (!num || String(num).length < 2) {
                return '--';
            }
            var s = String(num);
            return s.substring(0, 1) + '***************' + s.substring(s.length - 1);
        }

        function birthFromId18(idStr) {
            if (!idStr || String(idStr).length !== 18) {
                return '';
            }
            var d = String(idStr).substring(6, 14);
            if (!/^\d{8}$/.test(d)) {
                return '';
            }
            return d.substring(0, 4) + '-' + d.substring(4, 6) + '-' + d.substring(6, 8);
        }

        var __textCtx = { apiField: '', title: '', validate: null };

        function viewTaxId(ev) {
            if (ev && ev.stopPropagation) {
                ev.stopPropagation();
            }
            var taxId = lastTaxId || localStorage.getItem('tax_id');
            if (taxId) {
                alert('纳税人识别号: ' + taxId);
            } else {
                alert('暂无纳税人识别号');
            }
        }

        function validateIdNumber(val) {
            var s = String(val || '').replace(/\s/g, '').toUpperCase();
            if (!s) {
                return '请填写证件号码';
            }
            if (
                (s.length === 18 && /^\d{17}[\dX]$/.test(s)) ||
                (s.length === 15 && /^\d{15}$/.test(s))
            ) {
                return null;
            }
            return '居民身份证号码格式不正确';
        }

        function genderFromId18(idStr) {
            if (!idStr || String(idStr).length !== 18) {
                return null;
            }
            var c = parseInt(String(idStr).charAt(16), 10);
            if (isNaN(c)) {
                return null;
            }
            return c % 2 === 1 ? 1 : 2;
        }

        function openTextSheet(title, label, value, apiField, opts) {
            if (!requireProfileEdit()) return;
            opts = opts || {};
            __textCtx = {
                apiField: apiField,
                title: title,
                validate: opts.validate || null,
                inputMode: opts.inputMode || 'text',
                maxLength: opts.maxLength || 64
            };
            document.getElementById('textSheetTitle').textContent = title;
            document.getElementById('textFieldLabel').textContent = label;
            var inp = document.getElementById('textFieldInput');
            inp.value = value || '';
            inp.maxLength = __textCtx.maxLength;
            inp.setAttribute('inputmode', __textCtx.inputMode);
            if (opts.uppercase) {
                inp.style.textTransform = 'uppercase';
            } else {
                inp.style.textTransform = 'none';
            }
            document.getElementById('textSheetMask').classList.add('show');
            setTimeout(function () {
                inp.focus();
                inp.select();
            }, 200);
        }

        function closeTextSheet() {
            document.getElementById('textSheetMask').classList.remove('show');
        }

        function closeTextSheetBackdrop(ev) {
            if (ev.target.id === 'textSheetMask') {
                closeTextSheet();
            }

            var items = [];
            var i;
            if (tab === 0) {
                items = Object.keys(pca || {}).sort();
            } else if (tab === 1) {
                if (!prov || !pca[prov]) {
                    items = [];
                } else {
                    items = Object.keys(pca[prov]).sort();
                }
            } else if (tab === 2) {
                if (!prov || !city || !pca[prov] || !pca[prov][city]) {
                    items = [];
                } else {
                    items = Object.keys(pca[prov][city]).sort();
                }
            } else {
                items = districtStreets(prov, city, district).sort();
            }
            if (items.length === 0) {
                var empty = document.createElement('div');
                empty.className = 'region-item';
                empty.style.color = '#999';
                empty.style.cursor = 'default';
                empty.textContent = tab === 3 ? '该区县暂无街道数据，可直接确定' : '请先选择上一级';

        function isValidProfileEmail(raw) {
            var s = raw == null ? '' : String(raw).trim();
            if (!s || s.length > 255) return false;
            if (/\s/.test(s) || s.indexOf('..') >= 0) return false;
            var at = s.lastIndexOf('@');
            if (at <= 0 || at !== s.indexOf('@')) return false;
            var local = s.slice(0, at);
            var domain = s.slice(at + 1);
            if (local.length < 1 || local.length > 64) return false;
            if (domain.length < 4 || domain.length > 253) return false;
            if (local.length === 1) {
                if (!/^[A-Za-z0-9]$/.test(local)) return false;
            } else if (!/^[A-Za-z0-9][A-Za-z0-9._%+-]{0,62}[A-Za-z0-9]$/.test(local)) {
                return false;
            }
            var labels = domain.split('.');
            if (labels.length < 2) return false;
            for (var i = 0; i < labels.length; i++) {
                var lab = labels[i];
                if (!lab || lab.length > 63) return false;
                if (i === labels.length - 1) {
                    if (!/^[A-Za-z]{2,24}$/.test(lab)) return false;
                } else if (lab.length === 1) {
                    if (!/^[A-Za-z0-9]$/.test(lab)) return false;
                } else if (!/^[A-Za-z0-9][A-Za-z0-9-]{0,61}[A-Za-z0-9]$/.test(lab)) {
                    return false;
                }
            }
            var localKey = local.toLowerCase();
            var domainKey = domain.toLowerCase();
            var blockLocal = {
                test: 1, asdf: 1, qwer: 1, abc: 1, abcd: 1, aaa: 1, aaaa: 1,
                xxx: 1, xxxx: 1, email: 1, mail: 1, none: 1, null: 1, undefined: 1,
                '123': 1, '1234': 1, '12345': 1, '123456': 1
            };
            var blockDomain = {
                'example.com': 1, 'example.org': 1, 'example.net': 1,
                'test.com': 1, 'test.cn': 1, 'test.org': 1,
                'asdf.com': 1, 'aaa.com': 1, 'xxx.com': 1,
                localhost: 1, invalid: 1, localdomain: 1
            };
            if (blockLocal[localKey] || blockDomain[domainKey]) return false;
            if (localKey.length <= 3 && labels[0].toLowerCase() === localKey) return false;
            return true;
        }

            profileAuthFetch('api/user?action=info')
                .then(function (response) {
                    return (window.authParseJson||function(response){return response.json();})(response);
                })
                .then(function (data) {
                    if (data.code !== 200 || !data.data) {

                    var user = data.data;
                    lastTaxId = user.tax_id || '';

                    document.getElementById('realName').textContent = user.real_name || '--';
                    document.getElementById('idType').textContent = user.id_type || '居民身份证';

                    if (user.tax_id) {
                        document.getElementById('idNumber').textContent = maskId(user.tax_id);
                        document.getElementById('taxId').textContent = maskId(user.tax_id);
                    } else {
                        document.getElementById('idNumber').textContent = '--';
                        document.getElementById('taxId').textContent = '--';
                    }

                    if (user.real_name) {
                        try {
                            localStorage.setItem('real_name', user.real_name);
                        } catch (e) {}
                    }

                    var birth = user.birth_date || '';
                    if (!birth && user.tax_id) {
                        birth = birthFromId18(user.tax_id);
                    }
                    document.getElementById('birthDate').textContent = birth || '--';

                    var genderText = '--';
                    if (user.gender == 1) {
                        genderText = '男性';
                    } else if (user.gender == 2) {
                        genderText = '女性';
                    }
                    document.getElementById('gender').textContent = genderText;

                    document.getElementById('nationality').textContent = user.nationality || '中华人民共和国';

                    setPlaceholder('hujiFullWrap', 'hujiFull', user.huji_area, '请选择');
                    setPlaceholder('hujiDetailWrap', 'hujiDetail', user.huji_detail, '请填写小区、楼栋、单元室等');

                    setPlaceholder('livingAreaWrap', 'livingArea', user.living_area, '请选择');
                    setPlaceholder('livingDetailWrap', 'livingDetail', user.living_detail, '请填写小区、楼栋、单元室等');

                    setPlaceholder('contactAreaWrap', 'contactArea', user.contact_area, '请选择');
                    setPlaceholder('contactDetailWrap', 'contactDetail', user.contact_detail, '请填写小区、楼栋、单元室等');

                    setPlaceholder('educationWrap', 'education', user.education, '请选择');
                    setPlaceholder('ethnicityWrap', 'ethnicity', user.ethnicity, '请选择');
                    setPlaceholder('emailWrap', 'email', user.email, '请填写');

                    try {
                        if (user.tax_id) {
                            localStorage.setItem('tax_id', user.tax_id);
                        }
                    } catch (e) {}
                })
                .catch(function (error) {
                    console.error('加载用户信息失败:', error);
                });
        }

        loadUserInfo();
