<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260516-cordova-2410-bottom"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>经营所得申报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            color: #333;
            background: linear-gradient(180deg, #d4e8ff 0%, #e8f3ff 28%, #f5f8fc 55%, #f5f6fa 100%);
        }
        .header {
            background: transparent;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back-btn {
            position: absolute;
            left: 14px;
            color: #333;
            font-size: 22px;
            line-height: 1;
            text-decoration: none;
            padding: 4px 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        .page-body {
            padding: 8px 14px 24px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        }
        .card-list {
            background: #fff;
            border-radius: 12px;
            padding: 14px 12px 16px;
            box-shadow: 0 2px 12px rgba(22, 119, 255, 0.06);
        }
        .form-card {
            display: block;
            width: 100%;
            border: none;
            text-align: left;
            font-family: inherit;
            border-radius: 10px;
            padding: 16px 14px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            min-height: 96px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .form-card:last-child { margin-bottom: 0; }
        .form-card:active { opacity: 0.92; }
        .form-card-a {
            background: linear-gradient(135deg, #e8f7ff 0%, #d4efff 100%);
        }
        .form-card-b {
            background: linear-gradient(135deg, #f0ecff 0%, #e4dcff 100%);
        }
        .form-card-c {
            background: linear-gradient(135deg, #e6f3ff 0%, #d8ebff 100%);
        }
        .form-card-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            padding-right: 72px;
            line-height: 1.35;
        }
        .form-card-desc {
            font-size: 14px;
            color: #888;
            line-height: 1.55;
            padding-right: 68px;
        }
        .form-card-mark {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 64px;
            height: 64px;
            opacity: 0.35;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="bancha.html" class="back-btn" aria-label="返回">&lt;</a>
        <h1 class="header-title">经营所得申报</h1>
    </header>

    <main class="page-body">
        <div class="card-list">
            <button type="button" class="form-card form-card-a" data-form="a">
                <div class="form-card-title">其他经营所得（A表）</div>
                <p class="form-card-desc">个人从事其他生产、经营活动取得经营所得的预缴纳税申报</p>
                <svg class="form-card-mark" viewBox="0 0 64 64" aria-hidden="true">
                    <rect x="12" y="8" width="40" height="48" rx="4" fill="#7ec8f8"/>
                    <text x="32" y="42" text-anchor="middle" fill="#fff" font-size="28" font-weight="700" font-family="system-ui,sans-serif">A</text>
                </svg>
            </button>
            <button type="button" class="form-card form-card-b" data-form="b">
                <div class="form-card-title">其他经营所得（B表）</div>
                <p class="form-card-desc">个人从事其他生产、经营活动取得的所得（包含取得反向开票收入）的年度汇算清缴申报</p>
                <svg class="form-card-mark" viewBox="0 0 64 64" aria-hidden="true">
                    <rect x="12" y="8" width="40" height="48" rx="4" fill="#b8a8f0"/>
                    <text x="32" y="42" text-anchor="middle" fill="#fff" font-size="28" font-weight="700" font-family="system-ui,sans-serif">B</text>
                </svg>
            </button>
            <button type="button" class="form-card form-card-c" data-form="c">
                <div class="form-card-title">经营所得（C表）</div>
                <p class="form-card-desc">多处取得生产经营及承包承租经营所得的年度汇总申报</p>
                <svg class="form-card-mark" viewBox="0 0 64 64" aria-hidden="true">
                    <rect x="12" y="8" width="40" height="48" rx="4" fill="#8ebef5"/>
                    <text x="32" y="42" text-anchor="middle" fill="#fff" font-size="28" font-weight="700" font-family="system-ui,sans-serif">C</text>
                </svg>
            </button>
        </div>
    </main>

    <script>
        document.querySelectorAll('.form-card').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var f = btn.getAttribute('data-form') || '';
                var names = { a: 'A表', b: 'B表', c: 'C表' };
                alert((names[f] || '该表单') + '申报功能开发中');
            });
        });
    </script>
    <script src="/js/watermark.js?v=20260511-mine-wm"></script>
</body>
</html>
