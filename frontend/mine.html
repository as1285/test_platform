    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif;
            background-color: #f5f6fa;
            min-height: 100vh;
            max-width: 100vw;
            overflow-x: hidden;
            padding-bottom: var(--bottom-nav-clearance, calc(98px + env(safe-area-inset-bottom, 0px)));
            -webkit-font-smoothing: antialiased;
        }

        /* 底栏位置统一由 nav.css / auth 锁控制，勿在此写死 bottom（会与机型 inset 冲突导致切页跳动） */

        /* 顶部背景图：头像在 grdb/nx 整图内；状态栏区铺蓝（与顶图取样色一致，避免浅/深蓝接缝） */
        .header-bg {
            position: relative;
            width: 100%;
            overflow: hidden;
            --mine-safe-top: env(safe-area-inset-top, 0px);
            /* 激活按钮：相对顶栏下移，与头像中下缘齐平 */
            --mine-activate-btn-top-offset: 66px;
            --mine-header-blue-top: #2188f4;
            --mine-header-blue-mid: #1e81fb;
            --mine-header-blue-bot: #2c80f4;
            background: linear-gradient(
                180deg,
                var(--mine-header-blue-top) 0%,
                var(--mine-header-blue-mid) 45%,
                var(--mine-header-blue-bot) 100%
            );
        }

        html.app-top-safe-shell body.page-mine .header-bg {
            padding-top: var(--app-shell-statusbar-top, var(--mine-safe-top));
        }

        html.app-top-safe-shell body.page-mine .header-bg > img {
            margin-top: calc(-1 * var(--app-shell-statusbar-top, var(--mine-safe-top)));
        }

        /* iOS：顶图上移、状态栏区铺蓝（与 auth.js 一致，仅我的页） */
        html.app-ios-client.app-top-safe-shell {
            --mine-ios-header-lift: 12px;
        }

        html.app-ios-client.app-top-safe-shell body.page-mine::before {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: var(--app-shell-statusbar-top, env(safe-area-inset-top, 48px));
            /* 与 grdb/nx 顶缘同色，iPhone 15 Pro Max 状态栏不再偏浅蓝 */
            background: var(--mine-header-blue-top, #2188f4);
            z-index: 8;
            pointer-events: none;
        }

        html.app-ios-client.app-top-safe-shell body.page-mine .header-bg {
            position: relative;
            z-index: 9;
            padding-top: calc(var(--app-shell-statusbar-top, var(--mine-safe-top)) + var(--mine-ios-header-lift, 12px));
            overflow: visible;
        }

        html.app-ios-client.app-top-safe-shell body.page-mine .header-bg > img {
            margin-top: calc(-1 * var(--app-shell-statusbar-top, var(--mine-safe-top)) - var(--mine-ios-header-lift, 12px));
        }

        html.app-ios-client.app-top-safe-shell body.page-mine .mine-activate-btn {
            top: calc(
                var(--mine-activate-btn-top-offset, 66px) + var(--app-shell-statusbar-top, var(--mine-safe-top)) +
                    var(--mine-ios-header-lift, 12px)
            );
        }

        /* 小米 14 / HyperOS：顶图略下移，头像不被状态栏裁切 */
        html.app-android-xiaomi-14.app-top-safe-shell:not(.app-cordova-xiaomi-23127) body.page-mine .header-bg > img {
            margin-top: calc(-1 * var(--app-shell-statusbar-top, 0px) + 8px);
        }

        html.app-android-xiaomi-14.app-top-safe-shell:not(.app-cordova-xiaomi-23127) body.page-mine .user-card {
            margin: -70px 16px 0;
        }

        html.app-android-xiaomi-14.app-top-safe-shell:not(.app-cordova-xiaomi-23127) body.page-mine .mine-activate-btn {
            top: calc(var(--mine-activate-btn-top-offset, 66px) + var(--app-shell-statusbar-top, 0px));
        }

        /* Cordova 23127PN0CC：固定定位，避免被 header-bg overflow 或黑状态栏裁切 */
        html.app-cordova-xiaomi-23127.app-top-safe-shell body.page-mine .mine-activate-btn {
            position: fixed;
            top: calc(var(--mine-activate-btn-top-offset, 66px) + var(--app-cordova-statusbar-chrome, 40px));
            right: 18px;
            z-index: 500;
        }

        /* Cordova 小米14(23127PN0CC)：米色个人信息卡与参考稿一致，避免姓名/税号顶裁切 */
        html.app-cordova-xiaomi-23127.app-top-safe-shell body.page-mine .header-bg {
            padding-top: 0;
        }

        html.app-cordova-xiaomi-23127.app-top-safe-shell body.page-mine .content-wrapper {
            margin-top: -6px;
            padding-top: 14px;
        }

        html.app-cordova-xiaomi-23127.app-top-safe-shell body.page-mine .user-card {
            margin: -38px 16px 0;
            border-radius: 12px 12px 0 0;
            padding: 16px 14px 14px;
        }

        html.app-cordova-xiaomi-23127.app-top-safe-shell body.page-mine .user-name {
            margin-bottom: 4px;
            line-height: 1.25;
        }

        html.app-cordova-xiaomi-23127.app-top-safe-shell body.page-mine .personal-info-btn {
            top: 16px;
        }

        /* Cordova 小米 10S（M2102J2SC）：个人信息卡字号略小，税号单行完整展示 */
        html.app-cordova-xiaomi-m2102 body.page-mine .user-card {
            padding: 12px;
        }

        html.app-cordova-xiaomi-m2102 body.page-mine .user-card {
            padding-right: 78px;
        }

        html.app-cordova-xiaomi-m2102 body.page-mine .user-info-text {
            padding-right: 0;
            min-width: 0;
        }

        html.app-cordova-xiaomi-m2102 body.page-mine .user-name {
            font-size: 12px;
            margin-bottom: 4px;
            line-height: 1.25;
        }

        html.app-cordova-xiaomi-m2102 body.page-mine .user-id {
            font-size: 12px;
            line-height: 1.25;
            word-break: normal;
            white-space: nowrap;
            flex-wrap: nowrap;
            gap: 4px;
            max-width: 100%;
        }

        html.app-cordova-xiaomi-m2102 body.page-mine .user-tax-value {
            white-space: nowrap;
            letter-spacing: -0.02em;
        }

        html.app-cordova-xiaomi-m2102 body.page-mine .tax-eye-btn {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        html.app-cordova-xiaomi-m2102 body.page-mine .tax-eye-btn svg {
            width: 13px;
            height: 13px;
        }

        html.app-cordova-xiaomi-m2102 body.page-mine .personal-info-btn {
            font-size: 10.5px;
            padding: 5px 8px 5px 10px;
            border-radius: 18px 0 0 18px;
        }

        html.app-cordova-xiaomi-m2102 body.page-mine .personal-info-btn::after {
            font-size: 10.5px;
        }

        /* 华为 TAS-AN00（Mate 30 等，Android 12 Cordova）：个人信息卡姓名小两号 */
        html.app-android-huawei-tas-an00 body.page-mine .user-name {
            font-size: 13px;
            line-height: 1.35;
        }

        /* 小米 14：主白区横向贴边，减少两侧灰条（Cordova 23127 用户卡保留 16px 边距见上） */
        html.app-android-xiaomi-14:not(.app-cordova-xiaomi-23127) body.page-mine .user-card {
            margin-left: 0;
            margin-right: 0;
            border-radius: 12px 12px 0 0;
        }

        html.app-android-xiaomi-14 body.page-mine .function-cards {
            margin-left: 8px;
            margin-right: 8px;
        }

        html.app-android-xiaomi-14 body.page-mine .menu-list {
            margin-left: 0;
            margin-right: 0;
            border-radius: 0;
        }

        /* 华为 Pura 70：录屏时减少两侧黑边观感，主内容横向贴边（与 auth.js 全局规则一致） */
        html.app-huawei-pura70 body.page-mine .user-card,
        html.app-huawei-pura70 body.page-mine .menu-list {
            margin-left: 0;
            margin-right: 0;
            border-radius: 0;
        }

        html.app-huawei-pura70 body.page-mine .function-cards {
            margin-left: 8px;
            margin-right: 8px;
        }

        .header-bg > img {
            width: 100%;
            display: block;
            vertical-align: top;
        }

        .mine-activate-btn {
            position: fixed;
            right: 18px;
            top: calc(var(--mine-activate-btn-top-offset, 66px) + var(--app-shell-statusbar-top, 0px));
            min-width: 76px;
            height: 38px;
            border: none;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.95);
            color: #1658dc;
            font-size: 16px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            z-index: 500;
            pointer-events: auto;
        }

        /* 弹框居中：Android WebView（如 OPPO K7x）下 flex 居中易贴底，改用 fixed + transform */
        .activate-modal-root {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            box-sizing: border-box;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .activate-modal-root.is-open {
            display: block;
        }

        .activate-modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
        }

        .activate-modal-panel {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: calc(100% - 32px);
            max-width: 320px;
            background: #fff;
            border-radius: 12px;
            padding: 18px 16px 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        }

        .activate-modal-title {
            font-size: 15px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .activate-modal-body {
            font-size: 15px;
            color: #333;
            line-height: 1.65;
            margin-bottom: 16px;
        }

        .activate-modal-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #1e6fff;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 14px;
            box-sizing: border-box;
        }

        .activate-modal-label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .activate-modal-label + .activate-modal-input,
        .activate-modal-label + .activate-modal-select {
            margin-bottom: 12px;
        }

        .activate-modal-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #1e6fff;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 14px;
            box-sizing: border-box;
            background: #fff;
            color: #333;
        }

        .mine-profile-edit-hint {
            font-size: 12px;
            color: #999;
            line-height: 1.5;
            margin: -4px 0 12px;
        }

        body.mine-profile-edit-modal-open {
            position: fixed;
            width: 100%;
            overflow: hidden;
            left: 0;
            right: 0;
        }

        #mineProfileEditModal .activate-modal-panel {
            max-height: calc(100dvh - 32px);
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .activate-modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            align-items: center;
        }

        .activate-modal-btn {
            border: 1px solid #d9d9d9;
            background: #fff;
            color: #333;
            height: 34px;
            border-radius: 17px;
            padding: 0 14px;
            font-size: 13px;
            cursor: pointer;
        }

        .activate-modal-btn.primary {
            border-color: #1e6fff;
            background: #1e6fff;
            color: #fff;
        }

        .activate-modal-btn.xianyu {
            margin-right: auto;
        }

        .activate-modal-actions-leading {
            display: flex;
            gap: 8px;
            margin-right: auto;
            flex-wrap: wrap;
        }

        .activate-modal-actions-leading .activate-modal-btn.xianyu {
            margin-right: 0;
        }

        /* 灰底圆角面板：与原版一致，白卡片浮在灰底上 */
        .content-wrapper {
            background: #f5f6fa;
            border-radius: 20px 20px 0 0;
            margin-top: -20px;
            position: relative;
            z-index: 10;
            padding-top: 10px;
            padding-bottom: 12px;
        }

        .user-card {
            background: linear-gradient(105deg, #f8ead8 0%, #f3e2cc 42%, #edd9bf 100%);
            margin: -70px 16px 0;
            border-radius: 12px 12px 0 0;
            padding: 14px 86px 14px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            position: relative;
            z-index: 11;
            overflow: visible;
        }

        /* 头像热区：卡通头像在顶图内，信息卡上移后会挡住点击，单独留出触控区 */
        .mine-avatar-edit-hit {
            position: absolute;
            left: 8px;
            top: -62px;
            width: 80px;
            height: 80px;
            border: none;
            padding: 0;
            margin: 0;
            background: transparent;
            z-index: 15;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .user-info {
            display: block;
            min-width: 0;
        }

        .user-info-text {
            min-width: 0;
            padding-right: 0;
        }

        .user-info-text.user-info-text--editable {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
            z-index: 1;
        }

        .user-info-text.user-info-text--editable:active {
            opacity: 0.88;
        }

        .user-name.user-name--editable {
            display: inline-block;
            max-width: 100%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 0 2px;
            min-height: 0;
        }

        .user-name.user-name--editable:active {
            opacity: 0.88;
        }

        .user-name {
            font-size: 16px;
            color: #1a1a1a;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.25;
        }

        .user-id {
            display: flex;
            flex-direction: row;
            align-items: center;
            flex-wrap: nowrap;
            gap: 4px;
            width: 100%;
            min-width: 0;
            font-size: 12px;
            font-weight: 500;
            color: #c8863a;
            line-height: 1.25;
        }

        .user-tax-label {
            flex: 0 0 auto;
            white-space: nowrap;
            font-size: 12px;
        }

        .user-tax-value {
            flex: 0 0 auto;
            white-space: nowrap;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        /* iOS Safari / iPhone：对齐官方——标签与税号同一行 */
        html.app-ios-client body.page-mine .user-name,
        html[class*='app-ios'] body.page-mine .user-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.25;
        }

        html.app-ios-client body.page-mine .user-id,
        html[class*='app-ios'] body.page-mine .user-id {
            font-size: 12px;
            gap: 3px;
        }

        html.app-ios-client body.page-mine .user-tax-label,
        html[class*='app-ios'] body.page-mine .user-tax-label,
        html.app-ios-client body.page-mine .user-tax-value,
        html[class*='app-ios'] body.page-mine .user-tax-value {
            font-size: 12px;
            letter-spacing: -0.05em;
        }

        html.app-ios-client body.page-mine .tax-eye-btn,
        html[class*='app-ios'] body.page-mine .tax-eye-btn {
            width: 16px;
            height: 16px;
        }

        html.app-ios-client body.page-mine .tax-eye-btn svg,
        html[class*='app-ios'] body.page-mine .tax-eye-btn svg {
            width: 14px;
            height: 14px;
        }

        html.app-ios-client body.page-mine .personal-info-btn,
        html[class*='app-ios'] body.page-mine .personal-info-btn {
            font-size: 11px;
            padding: 5px 10px 5px 12px;
        }

        /* iPhone Safari 模拟/真机：未命中 app-ios-client 时税号仍 12px 单行 */
        @supports (-webkit-touch-callout: none) {
            @media (max-width: 428px) {
                body.page-mine .user-id,
                body.page-mine .user-tax-label,
                body.page-mine .user-tax-value {
                    font-size: 12px;
                    line-height: 1.25;
                    white-space: nowrap;
                }

                body.page-mine .user-tax-value {
                    letter-spacing: -0.05em;
                }
            }
        }

        .tax-eye-btn {
            width: 18px;
            height: 18px;
            border: none;
            background: transparent;
            color: #c8863a;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .tax-eye-btn svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .tax-eye-btn .tax-eye-open {
            display: none;
        }

        .tax-eye-btn.reveal .tax-eye-closed {
            display: none;
        }

        .tax-eye-btn.reveal .tax-eye-open {
            display: block;
        }

        .tax-eye-btn.reveal {
            opacity: 0.75;
        }

        .personal-info-btn {

            right: 0;

            align-items: center;

        .personal-info-btn::after {

        .mine-tax-entry-body {

        .mine-tax-entry-title {

        .mine-tax-entry-desc {

            align-items: center;
            justify-content: space-between;

            border: 1px solid #e8ecf2;
        }

            border-color: #c5d9f5;

            min-width: 0;
            font-size: 12px;
            color: #888;
            line-height: 1.4;
        }

            display: none !important;
        }

        html.cg-screenshot-mode .mine-screenshot-mode-hint {
            display: none;
        }

        .mine-screenshot-mode-btn {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid #c5d9f5;
            background: #fff;

    <script>
        (function () {
            function applyMineHeaderImage(gender) {
                var hi = document.getElementById('headerImg');
                var cfg = window.__MINE_UI_CONFIG || {};
                if (!hi) return;
                var g = gender;
                if (g == null || g === '') {
                    try {
                        g = localStorage.getItem('gender');
                    } catch (e0) {
                        g = null;
                    }
                }
                var n = Number(g);
                if (Number(n) === 2) {
                    hi.src = cfg.header_female || 'nx.jpg';
                } else {
                    hi.src = cfg.header_male || 'grdb.jpg';
                }
            }

            function applyMineAssets(cfg) {
                if (!cfg) return;
                applyMineHeaderImage();
                var f = document.getElementById('mineIconFamily');
                var e = document.getElementById('mineIconEmployer');
                var b = document.getElementById('mineIconBank');
                if (f && cfg.icon_family) f.src = cfg.icon_family;
                if (e && cfg.icon_employer) e.src = cfg.icon_employer;
                if (b && cfg.icon_bank) b.src = cfg.icon_bank;
            }

            window.addEventListener('mineUiConfig', function (ev) {
                applyMineAssets(ev.detail);
                if (typeof window.__refreshNavFromMineUi === 'function') {
                    window.__refreshNavFromMineUi();
                }
            });

            setTimeout(function () {
                if (window.__MINE_UI_CONFIG) {
                    applyMineAssets(window.__MINE_UI_CONFIG);
                }
            }, 0);

            function maskTaxId(taxId) {
                if (!taxId || taxId.length < 2) {
                    return '--';
                }
                return taxId.charAt(0) + '***************' + taxId.charAt(taxId.length - 1);
            }

            var MINE_LEGACY_DEFAULT_TAX_ID = '620000000000000000';
            var MINE_DEFAULT_TAX_ID_HINT = '所有信息点击税务演示数据修改';
            var MINE_LEGACY_TAX_ID_HINT = '所***************改';
            var MINE_DEFAULT_DISPLAY_NAME = '点击我修改名字';
            var mineCurrentTaxIdRaw = '';
            var mineTaxRevealState = false;
            var mineRenderTaxIdFn = null;

            function isPlaceholderTaxIdMine(v) {
                var s = String(v || '').trim();
                return (
                    !s ||
                    s === MINE_LEGACY_DEFAULT_TAX_ID ||
                    s === MINE_DEFAULT_TAX_ID_HINT ||
                    s === MINE_LEGACY_TAX_ID_HINT
                );
            }

            /** 未自定义姓名时的占位（游客默认名、注册时用账号当姓名、旧演示名等） */
            function isPlaceholderRealNameMine(v) {
                var s = String(v || '').trim();
                if (!s || s === '--' || s === MINE_DEFAULT_DISPLAY_NAME) return true;
                if (s === '游客用户' || s === '杰瑞') return true;
                var uid = mineCurrentUserId();
                if (uid && s === uid) return true;
                return false;
            }

            function resolveMineDisplayName(v) {
                return isPlaceholderRealNameMine(v) ? MINE_DEFAULT_DISPLAY_NAME : String(v).trim();
            }

            function setMineDisplayName(v) {
                var nameEl = document.getElementById('mineDisplayName');
                if (nameEl) nameEl.textContent = resolveMineDisplayName(v);
            }

            function mineCurrentUserId() {
                return (
                    localStorage.getItem('user_id') ||
                    localStorage.getItem('userName') ||
                    localStorage.getItem('username') ||
                    ''
                );
            }

            function isMineDataEditEnabled() {
                return (
                    !window.ConversionGuide ||
                    typeof window.ConversionGuide.isTaxEditModeOn !== 'function' ||
                    window.ConversionGuide.isTaxEditModeOn()
                );
            }

            function isLandingGuestMode() {
                try {
                    return localStorage.getItem('landing_guest_v1') === '1';
                } catch (e) {
                    return false;
                }
            }

            function isMineAppShell() {
                return (
                    typeof window.isCordovaTaxAppShell === 'function' &&
                    window.isCordovaTaxAppShell()
                );
            }

            function syncMineProfileEditGate() {
                var hit = document.getElementById('mineProfileEditHit');
                var nameEl = document.getElementById('mineDisplayName');
                var guest = isLandingGuestMode();
                var on = guest || isMineDataEditEnabled();
                if (hit) {
                    hit.classList.remove('user-info-text--editable');
                }
                if (nameEl) {
                    nameEl.classList.toggle('user-name--editable', on);
                    if (on) {
                        nameEl.setAttribute('role', 'button');
                        nameEl.setAttribute('tabindex', '0');
                        nameEl.setAttribute(
                            'aria-label',
                            guest
                                ? isMineAppShell()
                                    ? '打开购买页'
                                    : '下载 App'
                                : '修改姓名、纳税人识别号与性别'
                        );
                    } else {
                        nameEl.removeAttribute('role');
                        nameEl.removeAttribute('tabindex');
                        nameEl.removeAttribute('aria-label');
                    }
                }
                if (!on) {
                    closeMineProfileEditModal();
                }
            }

            function bindMineProfileEditTap(el) {
                if (!el || el.__mineProfileEditTapBound) return;
                el.__mineProfileEditTapBound = true;
                var lastFire = 0;
                var touchMoved = false;
                var touchStartX = 0;
                var touchStartY = 0;
                function fire(e) {
                    var guest = isLandingGuestMode();
                    if (!guest && !isMineDataEditEnabled()) return;
                    var now = Date.now();
                    if (now - lastFire < 320) return;
                    lastFire = now;
                    if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
                    if (guest) {
                        if (typeof window.trackUserAction === 'function') {
                            window.trackUserAction('track_activate_prompt_open', {
                                page: 'mine',
                                source: 'guest_name'
                            });
                        }
                        /* App 内 → 购买页；Web 端 → 下载引导 */
                        if (isMineAppShell()) {
                            window.location.href = 'purchase.html';
                        } else {
                            goGuestDownload('guest_name');
                        }
                        return;
                    }
                    openMineProfileEditModal();
                }
                el.addEventListener(
                    'touchstart',
                    function (e) {
                        touchMoved = false;
                        if (e.touches && e.touches[0]) {
                            touchStartX = e.touches[0].clientX;
                            touchStartY = e.touches[0].clientY;
                        }
                    },
                    { passive: true }
                );
                el.addEventListener(
                    'touchmove',
                    function (e) {
                        if (!e.touches || !e.touches[0]) return;
                        if (
                            Math.abs(e.touches[0].clientX - touchStartX) > 12 ||
                            Math.abs(e.touches[0].clientY - touchStartY) > 12
                        ) {
                            touchMoved = true;
                        }
                    },
                    { passive: true }
                );
                el.addEventListener(
                    'touchend',
                    function (e) {
                        if (touchMoved) return;
                        e.preventDefault();
                        fire(e);
                    },
                    { passive: false }
                );
                el.addEventListener('click', fire);
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        fire(e);
                    }
                });
            }

            var mineProfileEditScrollLockY = 0;

            function lockMineProfileEditScroll() {
                mineProfileEditScrollLockY =
                    window.scrollY || document.documentElement.scrollTop || 0;
                document.body.classList.add('mine-profile-edit-modal-open');
                document.body.style.top = '-' + mineProfileEditScrollLockY + 'px';
            }

            function unlockMineProfileEditScroll() {
                if (!document.body.classList.contains('mine-profile-edit-modal-open')) return;
                document.body.classList.remove('mine-profile-edit-modal-open');
                document.body.style.top = '';
                window.scrollTo(0, mineProfileEditScrollLockY);
            }

            function openMineProfileEditModal() {
                if (!isMineDataEditEnabled()) return;
                var root = document.getElementById('mineProfileEditModal');
                var nameInp = document.getElementById('mineEditRealName');
                var taxInp = document.getElementById('mineEditTaxId');
                var genderSel = document.getElementById('mineEditGender');
                var nameEl = document.getElementById('mineDisplayName');
                if (!root || !nameInp || !taxInp) return;
                var storedName = localStorage.getItem('real_name') || '';
                var displayName = nameEl ? String(nameEl.textContent || '').trim() : '';
                var seed = !isPlaceholderRealNameMine(storedName)
                    ? String(storedName).trim()
                    : !isPlaceholderRealNameMine(displayName)
                      ? displayName
                      : '';
                nameInp.value = seed;
                var tid = mineCurrentTaxIdRaw || localStorage.getItem('tax_id') || '';
                if (isPlaceholderTaxIdMine(tid)) tid = '';
                taxInp.value = tid;
                if (genderSel) {
                    var g = localStorage.getItem('gender');
                    genderSel.value = g === '2' ? '2' : '1';
                }
                lockMineProfileEditScroll();
                root.classList.add('is-open');
                var ua = navigator.userAgent || '';
                if (!/Android/i.test(ua)) {
                    setTimeout(function () {
                        nameInp.focus();
                    }, 0);
                }
            }

            function closeMineProfileEditModal() {
                var root = document.getElementById('mineProfileEditModal');
                if (root) root.classList.remove('is-open');
                unlockMineProfileEditScroll();
            }

            function saveMineProfileEdit() {
                if (!isMineDataEditEnabled()) {
                    closeMineProfileEditModal();
                    return;
                }
                var nameInp = document.getElementById('mineEditRealName');
                var taxInp = document.getElementById('mineEditTaxId');
                var genderSel = document.getElementById('mineEditGender');
                if (!nameInp || !taxInp) return;
                var realName = nameInp.value.trim();
                var taxId = taxInp.value.trim();
                var gender = genderSel ? genderSel.value : '1';
                if (!realName || isPlaceholderRealNameMine(realName)) {
                    alert('请输入姓名');
                    return;
                }
                if (!taxId) {
                    alert('请输入纳税人识别号');
                    return;
                }
                setMineDisplayName(realName);
                localStorage.setItem('real_name', realName);
                mineCurrentTaxIdRaw = taxId;
                mineTaxRevealState = false;
                localStorage.setItem('tax_id', taxId);
                localStorage.setItem('gender', gender);
                applyAvatarGender(gender);
                if (mineRenderTaxIdFn) mineRenderTaxIdFn();
                closeMineProfileEditModal();

                var userId = mineCurrentUserId();
                if (!userId) return;

                var fetchFn =
                    typeof authFetch === 'function'
                        ? authFetch
                        : function (url, opts) {
                              return fetch(url, Object.assign({ credentials: 'same-origin' }, opts || {}));
                          };
                fetchFn('api/user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'save_profile',
                        user_id: userId,
                        real_name: realName,
                        tax_id: taxId,
                        gender: gender
                    })
                })
                    .then(function (r) {
                        return r.json();
                    })
                    .then(function (data) {
                        if (data.code !== 200) {
                            alert('保存失败：' + (data.msg || '未知错误'));
                        } else {
                            try {
                                sessionStorage.removeItem('mine_summary_cache_v1');
                            } catch (eClr) {}
                        }
                    })
                    .catch(function () {
                        alert('网络异常，已保存到本地');
                    });
            }

            function setCounts(user) {
                var employerBtn = document.getElementById('employerCount');
                var familyBtn = document.getElementById('familyCount');
                var familyWrap = document.getElementById('familyCountWrap');
                var bankBtn = document.getElementById('bankCardCount');
                var bankWrap = document.getElementById('bankCardAddWrap');
                var ec = user && user.employer_count != null ? Number(user.employer_count) : NaN;
                var fc = user && user.family_count != null ? Number(user.family_count) : NaN;
                var bc = user && user.bank_card_count != null ? Number(user.bank_card_count) : NaN;

                if (employerBtn) {
                    if (user && !isNaN(ec) && ec > 0) {
                        employerBtn.textContent = ec + '家';
                        employerBtn.className = 'function-btn blue';
                    } else {
                        employerBtn.textContent = '暂无';
                        employerBtn.className = 'function-btn orange';
                    }
                }
                if (familyBtn && familyWrap) {
                    if (user && !isNaN(fc) && fc > 0) {
                        familyBtn.textContent = fc + '人';
                        familyWrap.className = 'function-btn blue';
                        familyWrap.setAttribute('href', 'jtcy.html');
                        familyWrap.setAttribute('aria-label', '家庭成员');
                    } else {
                        familyBtn.textContent = '添加';
                        familyWrap.className = 'function-btn orange';
                        familyWrap.setAttribute('href', 'jtcy_add.html');
                        familyWrap.setAttribute('aria-label', '添加家庭成员');
                    }
                }
                if (bankBtn && bankWrap) {
                    if (user && !isNaN(bc) && bc > 0) {
                        bankBtn.textContent = bc + '张';
                        bankWrap.className = 'function-btn blue';
                        bankWrap.setAttribute('href', 'yhk.html');
                        bankWrap.setAttribute('aria-label', '银行卡');
                    } else {
                        bankBtn.textContent = '添加';
                        bankWrap.className = 'function-btn orange';
                        bankWrap.setAttribute('href', 'yhk_add.html');
                        bankWrap.setAttribute('aria-label', '添加银行卡');
                    }
                }
                syncConsultModifyHint();
            }

            function syncConsultModifyHint() {
                var hint = document.getElementById('consultModifyHint');
                if (!hint) return;
                var loggedIn = !!localStorage.getItem('user_id');
                var editOn =
                    !window.ConversionGuide ||
                    typeof window.ConversionGuide.isTaxEditModeOn !== 'function' ||
                    window.ConversionGuide.isTaxEditModeOn();
                if (loggedIn && editOn && !hasTaxRecords()) {
                    hint.removeAttribute('hidden');
                } else {
                    hint.setAttribute('hidden', '');
                }
            }

            function updateCountsFromStorage() {
                var ec = localStorage.getItem('employer_count');
                var fc = localStorage.getItem('family_count');
                var bc = localStorage.getItem('bank_card_count');
                var tc = localStorage.getItem('tax_record_count');
                setCounts({
                    employer_count: ec != null ? ec : null,
                    family_count: fc != null ? fc : null,
                    bank_card_count: bc != null ? bc : null,
                    tax_record_count: tc != null ? tc : null
                });
            }

            function isInactiveAccount() {
                return localStorage.getItem('account_active') === '0';
            }

            function hasTaxRecords() {
                var n = Number(localStorage.getItem('tax_record_count') || '0');
                return !isNaN(n) && n > 0;
            }

            window.addEventListener('pageshow', function (ev) {
                if (ev.persisted) {
                    updateCountsFromStorage();
                }
            });

            function goConsultPage() {
                if (!localStorage.getItem('user_id')) {
                    window.location.href = 'login.html';
                    return;
                }
                window.location.href = 'consult.html?v=20260721d-bonus';
            }

            function copyMineXianyuPurchase() {
                var t = String(mineXianyuPurchaseUrl || '').trim();
                function doCopy(txt) {
                    if (!txt) {
                        alert('暂未配置闲鱼购买文案');
                        return;
                    }
                    if (typeof copyXianyuPurchaseText !== 'function') {
                        alert('复制功能不可用');
                        return;
                    }
                    copyXianyuPurchaseText(txt).catch(function () {
                        alert('复制失败，请长按手动复制');
                    });
                }
                if (t) {
                    doCopy(t);
                    return;
                }
                fetch(
                    typeof getPublicInstallPackagesUrl === 'function'
                        ? getPublicInstallPackagesUrl()
                        : '/api/public/install-packages',
                    { credentials: 'same-origin' }
                )
                    .then(function (r) { return r.json(); })
                    .then(function (body) {
                        if (body && body.code === 200 && body.data && body.data.xianyu_purchase_url) {
                            t = String(body.data.xianyu_purchase_url).trim();
                            mineXianyuPurchaseUrl = t;
                        }
                        doCopy(t);
                    })
                    .catch(function () {
                        alert('获取购买文案失败，请稍后重试');
                    });
            }

            function applyAvatarGender(gender) {
                applyMineHeaderImage(gender);
            }

            function updateMineActivateButton(user) {
                var btn = document.getElementById('mineActivateBtn');
                var active = false;
                if (user && (user.account_active === true || user.account_active === 1 || user.account_active === '1')) {
                    active = true;
                } else {
                    try {
                        active = localStorage.getItem('account_active') === '1';
                    } catch (e0) {}
                }
                if (btn) {
                    if (active) {
                        /* 已激活（含试用）不展示「剩X天」按钮 */
                        btn.style.display = 'none';
                        btn.textContent = '已激活';
                    } else {
                        btn.style.display = 'inline-flex';
                        btn.textContent = isLandingGuestMode() ? '下载' : '激活';
                    }
                }
                if (document.body) {
                    document.body.classList.toggle('mine-account-active', active);
                }
            }

            function loadMineInviteOverview() {
                var card = document.getElementById('mineInviteCard');
                if (!card) return;
                function isAccountActiveNow() {
                    try {
                        if (document.body && document.body.classList.contains('mine-account-active')) {
                            return true;
                        }
                        return localStorage.getItem('account_active') === '1';
                    } catch (e) {
                        return false;
                    }
                }
                if (isAccountActiveNow()) {
                    card.hidden = true;
                    return;
                }
                var fetchFn =
                    typeof authFetch === 'function'
                        ? authFetch
                        : function (url, opts) {
                              return fetch(url, Object.assign({ credentials: 'same-origin' }, opts || {}));
                          };
                fetchFn('api/user?action=invite_overview')
                    .then(function (r) {
                        return r.json();
                    })
                    .then(function (data) {
                        if (data.code !== 200 || !data.data || !data.data.enabled) {
                            card.hidden = true;
                            return;
                        }
                        var d = data.data;
                        updateMineActivateButton({
                            account_active: d.account_active,
                            activation_kind: d.activation_kind,
                            active_days_left: d.active_days_left
                        });
                        if (
                            d.account_active === true ||
                            d.account_active === 1 ||
                            d.account_active === '1' ||
                            isAccountActiveNow()
                        ) {
                            card.hidden = true;
                            return;
                        }
                        card.hidden = false;
                        var codeEl = document.getElementById('mineInviteCodeText');
                        if (codeEl) codeEl.textContent = d.invite_code || '—';
                        var desc = document.getElementById('mineInviteDesc');
                        if (desc) {
                            var rewardBits = [];
                            if (d.reward_days) rewardBits.push(d.reward_days + ' 天');
                            if (d.reward_hours) rewardBits.push(d.reward_hours + ' 小时');
                            if (d.reward_minutes) rewardBits.push(d.reward_minutes + ' 分钟');
                            var payBits =
                                d.pay_reward_days != null && Number(d.pay_reward_days) > 0
                                    ? Number(d.pay_reward_days) + ' 天'
                                    : '3 天';
                            desc.textContent =
                                '好友扫码先注册、再下载 App；注册成功你得 ' +
                                (rewardBits.length ? rewardBits.join(' ') : '30 分钟') +
                                '，好友付费永久激活后再得 ' +
                                payBits +
                                '（每月最多 ' +
                                (d.monthly_cap || 4) +
                                ' 次）。';
                        }
                        var stats = document.getElementById('mineInviteStats');
                        if (stats) {
                            stats.textContent =
                                '链接点击 ' +
                                (d.link_clicks || 0) +
                                '（约 ' +
                                (d.link_visitors || 0) +
                                ' 人）· 本月已获奖 ' +
                                (d.rewarded_this_month || 0) +
                                '/' +
                                (d.monthly_cap || 4) +
                                ' · 累计注册 ' +
                                (d.invited_activated || 0) +
                                ' 人 · 待到账 ' +
                                (d.pending_rewards || 0);
                        }
                        var transfer = document.getElementById('mineInviteTransferCodes');
                        if (transfer) {
                            var list = d.transferable_codes || [];
                            if (!list.length) {
                                transfer.hidden = true;
                                transfer.innerHTML = '';
                            } else {
                                transfer.hidden = false;
                                transfer.innerHTML =
                                    '<div>可转赠时效码：</div>' +
                                    list
                                        .map(function (c) {
                                            return (
                                                '<div>' +
                                                String(c.code || '') +
                                                '（' +
                                                (function () {
                                                    var bits = [];
                                                    if (c.days) bits.push(c.days + '天');
                                                    if (c.minutes) bits.push(c.minutes + '分钟');
                                                    if (c.kind === 'pay') bits.push('付费奖');
                                                    return bits.length ? bits.join('') : '试用';
                                                })() +
                                                '）</div>'
                                            );
                                        })
                                        .join('');
                            }
                        }
                        window.__mineInvitePath = d.invite_path || '';
                        window.__mineInviteCode = d.invite_code || '';
                        window.__mineInviteRewardText =
                            (function () {
                                var bits = [];
                                if (d.reward_days) bits.push(d.reward_days + '天');
                                if (d.reward_hours) bits.push(d.reward_hours + '小时');
                                if (d.reward_minutes) bits.push(d.reward_minutes + '分钟');
                                var reg = bits.length ? bits.join('') : '30分钟';

            function buildMineInvitePosterDataUrl() {
                var url = getMineInviteAbsoluteUrl();
                if (!url) {
                    return Promise.reject(new Error('no_url'));
                }
                if (window.__mineInvitePosterDataUrl) {
                    return Promise.resolve(window.__mineInvitePosterDataUrl);
                }
                if (typeof QRCode === 'undefined' || typeof QRCode.toDataURL !== 'function') {
                    return Promise.reject(new Error('no_qrcode'));
                }
                return new Promise(function (resolve, reject) {
                    QRCode.toDataURL(
                        url,
                        {
                            width: 420,
                            margin: 2,
                            errorCorrectionLevel: 'M',
                            color: { dark: '#111111', light: '#ffffff' }
                        },
                        function (err, qrDataUrl) {
                            if (err || !qrDataUrl) {
                                reject(err || new Error('qr_fail'));
                                return;
                            }
                            var img = new Image();
                            img.onload = function () {
                                try {
                                    var canvas = document.createElement('canvas');
                                    var w = 750;
                                    var h = 1120;
                                    canvas.width = w;
                                    canvas.height = h;
                                    var ctx = canvas.getContext('2d');
                                    var g = ctx.createLinearGradient(0, 0, 0, h);
                                    g.addColorStop(0, '#0b3d91');
                                    g.addColorStop(0.45, '#1677ff');
                                    g.addColorStop(1, '#e8f1ff');
                                    ctx.fillStyle = g;
                                    ctx.fillRect(0, 0, w, h);

                                    ctx.fillStyle = 'rgba(255,255,255,0.96)';
                                    roundRect(ctx, 48, 72, w - 96, h - 160, 28);
                                    ctx.fill();

                                    ctx.fillStyle = '#0b3d91';
                                    ctx.font = 'bold 44px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                    ctx.textAlign = 'center';
                                    ctx.fillText('个税演示', w / 2, 160);

                                    ctx.fillStyle = '#1a1a1a';
                                    ctx.font = 'bold 36px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                    ctx.fillText('邀请你先注册', w / 2, 230);

                                    ctx.fillStyle = '#666';
                                    ctx.font = '26px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                    ctx.fillText('扫码注册 → 再下载 App', w / 2, 280);

                                    var qrSize = 380;
                                    var qrX = (w - qrSize) / 2;
                                    var qrY = 320;
                                    ctx.fillStyle = '#fff';
                                    roundRect(ctx, qrX - 16, qrY - 16, qrSize + 32, qrSize + 32, 16);
                                    ctx.fill();
                                    ctx.drawImage(img, qrX, qrY, qrSize, qrSize);

                                    ctx.fillStyle = '#333';
                                    ctx.font = '24px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                    ctx.fillText('微信扫一扫，先注册再下载', w / 2, qrY + qrSize + 70);

                                    var code = window.__mineInviteCode || '';
                                    if (code) {
                                        ctx.fillStyle = '#888';
                                        ctx.font = '22px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                        ctx.fillText('邀请码 ' + code, w / 2, qrY + qrSize + 112);
                                    }

                                    var reward = window.__mineInviteRewardText || '';
                                    if (reward) {
                                        ctx.fillStyle = '#1677ff';
                                        ctx.font = 'bold 24px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                        ctx.fillText('好友注册成功，你得 ' + reward + ' 试用', w / 2, h - 120);
                                    }

                                    var dataUrl = canvas.toDataURL('image/png');
                                    window.__mineInvitePosterDataUrl = dataUrl;
                                    resolve(dataUrl);
                                } catch (ePaint) {
                                    reject(ePaint);
                                }
                            };
                            img.onerror = function () {
                                reject(new Error('qr_img'));
                            };
                            img.src = qrDataUrl;
                        }
                    );
                });

                function roundRect(ctx, x, y, width, height, radius) {
                    var r = Math.min(radius, width / 2, height / 2);
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.arcTo(x + width, y, x + width, y + height, r);
                    ctx.arcTo(x + width, y + height, x, y + height, r);
                    ctx.arcTo(x, y + height, x, y, r);
                    ctx.arcTo(x, y, x + width, y, r);
                    ctx.closePath();
                }
            }

                        );
                    } else {
                        prompt('复制邀请内容', text);
                    }
                });
            }

            var btnMineInviteSavePoster = document.getElementById('btnMineInviteSavePoster');
            if (btnMineInviteSavePoster) {
                btnMineInviteSavePoster.addEventListener('click', function () {
                    withMineInvitePoster(function (dataUrl) {
                        downloadMineInvitePoster(dataUrl);
                        toastMineInvite('海报已保存，可发到朋友圈或微信');
                    });
                });
            }

            var btnMineInviteSharePoster = document.getElementById('btnMineInviteSharePoster');
            if (btnMineInviteSharePoster) {
                btnMineInviteSharePoster.addEventListener('click', function () {
                    withMineInvitePoster(function (dataUrl) {
                        var shareText = getMineInviteShareText();
                        if (navigator.share) {
                            fetch(dataUrl)
                                .then(function (r) {
                                    return r.blob();
                                })
                                .then(function (blob) {
                                    var file = new File([blob], 'invite-register.png', { type: 'image/png' });
                                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                        return navigator.share({
                                            files: [file],
                                            title: '邀请先注册再下载',
                                            text: shareText
                                        });
                                    }
                                    throw new Error('share_unsupported');
                                })
                                .catch(function () {
                                    openMineInvitePosterModal(dataUrl);
                                    alert('当前环境不支持直接分享图片，请长按海报保存后发到微信/朋友圈');
                                });
                            return;
                        }
                        openMineInvitePosterModal(dataUrl);
                        alert('请长按海报保存图片后，发到微信或朋友圈');
                    });
                });
            }

            var btnMineInvitePreviewPoster = document.getElementById('btnMineInvitePreviewPoster');
            if (btnMineInvitePreviewPoster) {
                btnMineInvitePreviewPoster.addEventListener('click', function () {
                    withMineInvitePoster(function (dataUrl) {
                        openMineInvitePosterModal(dataUrl);
                    });
                });
            }

            var btnMineInvitePosterClose = document.getElementById('btnMineInvitePosterClose');
            if (btnMineInvitePosterClose) {
                btnMineInvitePosterClose.addEventListener('click', closeMineInvitePosterModal);
            }
            var mineInvitePosterMask = document.getElementById('mineInvitePosterMask');
            if (mineInvitePosterMask) {
                mineInvitePosterMask.addEventListener('click', closeMineInvitePosterModal);
            }
            var btnMineInvitePosterSave = document.getElementById('btnMineInvitePosterSave');
            if (btnMineInvitePosterSave) {
                btnMineInvitePosterSave.addEventListener('click', function () {
                    withMineInvitePoster(function (dataUrl) {
                        downloadMineInvitePoster(dataUrl);
                        toastMineInvite('海报已保存');
                    });
                });
            }

            function handleConsultMenuClick(e) {
                e.preventDefault();
                if (!localStorage.getItem('user_id')) {
                    window.location.href = 'login.html';
                    return;
                }
                if (
                    window.ConversionGuide &&
                    typeof window.ConversionGuide.isTaxEditModeOn === 'function' &&
                    !window.ConversionGuide.isTaxEditModeOn()
                ) {
                    window.location.href = 'help_center.html';
                    return;
                }
                goConsultPage();
            }
            var consultModifyLink = document.getElementById('consultModifyLink');
            if (consultModifyLink) {
                consultModifyLink.addEventListener('click', handleConsultMenuClick);
            }

            var mineActivateBtn = document.getElementById('mineActivateBtn');
            if (mineActivateBtn) {
                mineActivateBtn.addEventListener('touchend', function (e) {
                    e.stopPropagation();
                });
                mineActivateBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    openMineActivateModal();
                });
            }

            var mineOkBtn = document.getElementById('btnMineActivateOk');
            var mineCancelBtn = document.getElementById('btnMineActivateCancel');
            var mineXyBtn = document.getElementById('btnMineActivateXianyu');
            var mineMask = document.getElementById('mineActivateModalMask');
            var mineInput = document.getElementById('mineActivateCodeInput');
            if (mineOkBtn) {
                mineOkBtn.addEventListener('click', function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_activate_prompt_confirm', { page: 'mine' });
                    }
                    closeMineActivateModal();
                    submitMineActivateWithCode(mineInput ? mineInput.value : '');
                });
            }
            if (mineCancelBtn) {
                mineCancelBtn.addEventListener('click', function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_activate_prompt_cancel', { page: 'mine' });
                    }
                    closeMineActivateModal();
                });
            }
            if (mineMask) {
                mineMask.addEventListener('click', function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_activate_prompt_cancel', { page: 'mine' });
                    }
                    closeMineActivateModal();
                });
            }
            if (mineInput) {
                mineInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (mineOkBtn) mineOkBtn.click();
                    }
                });
            }
            if (mineXyBtn) {
                mineXyBtn.addEventListener('click', function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_xianyu_purchase_click', {
                            page: 'mine',
                            source: 'activate_modal'
                        });
                    }
                    copyMineXianyuPurchase();
                });
            }

            document.getElementById('mineLogout').addEventListener('click', function () {
                try {
                    sessionStorage.clear();
                    localStorage.removeItem('token');
                    localStorage.removeItem('user_id');
                    localStorage.removeItem('username');
                    localStorage.removeItem('real_name');
                    localStorage.removeItem('tax_id');
                    localStorage.removeItem('landing_guest_v1');
                } catch (e) {}
                window.location.href = 'login.html';
            });

            if (isLandingGuestMode()) {
                setupGuestDownloadUi();
            }
            if (isLandingGuestMode() && typeof window.trackPublicAction === 'function') {
                var guestVisitMeta = {
                    page: 'mine_guest',
                    landing_variant: 'c'
                };
                try {
                    var guestEntryRaw = sessionStorage.getItem('landing_bc_entry_v1');
                    var guestEntry = guestEntryRaw ? JSON.parse(guestEntryRaw) : null;
                    if (guestEntry) {
                        guestVisitMeta.referrer = guestEntry.referrer || '';
                        guestVisitMeta.utm_source = guestEntry.utm_source || '';
                        guestVisitMeta.sales_ch = guestEntry.sales_ch || '';
                    }
                } catch (eGuestEntry) {}
                window.trackPublicAction('track_install_page_view', guestVisitMeta);
                window.trackPublicAction('track_landing_ab_view', guestVisitMeta);
                var guestVisitStart = Date.now();
                var guestLeaveSent = false;
                function sendGuestMineLeave() {
                    if (guestLeaveSent) return;
                    guestLeaveSent = true;
                    var sec = Math.max(
                        0,
                        Math.min(86400, Math.round((Date.now() - guestVisitStart) / 1000))
                    );
                    window.trackPublicAction('track_install_page_leave', {
                        page: 'mine_guest',
                        landing_variant: 'c',
                        dwell_seconds: sec
                    });
                }
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'hidden') sendGuestMineLeave();
                });
                window.addEventListener('pagehide', sendGuestMineLeave);
                window.addEventListener('beforeunload', sendGuestMineLeave);
            }

            (function showGuestDataMigratedNotice() {
                try {
                    var raw = sessionStorage.getItem('guest_data_migrated_notice');
                    if (!raw) return;
                    sessionStorage.removeItem('guest_data_migrated_notice');
                    var parsed = JSON.parse(raw);
                    var noticeMsg =
                        (parsed && parsed.msg) || '您在游客模式下填写的资料已同步到新账号';
                    var toastEl = document.getElementById('guest-migrate-toast');
                    if (!toastEl) {
                        toastEl = document.createElement('div');
                        toastEl.id = 'guest-migrate-toast';
                        toastEl.setAttribute('role', 'status');
                        toastEl.style.cssText =
                            'position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));' +
                            'z-index:1000020;padding:12px 14px;border-radius:10px;background:#ecfdf3;' +
                            'border:1px solid #86efac;color:#166534;font-size:13px;line-height:1.5;' +
                            'box-shadow:0 4px 16px rgba(0,0,0,.12);opacity:0;transition:opacity .2s ease;';
                        document.body.appendChild(toastEl);
                    }
                    toastEl.textContent = noticeMsg;
                    requestAnimationFrame(function () {
                        toastEl.style.opacity = '1';
                    });
                    var hideMs =
                        typeof window.TOAST_DURATION_MS === 'number' && window.TOAST_DURATION_MS > 0
                            ? window.TOAST_DURATION_MS + 2000
                            : 5000;
                    setTimeout(function () {
                        toastEl.style.opacity = '0';
                    }, hideMs);
                } catch (eGuestMigToast) {}
            })();
        })();
    </script>
    <script>
        (function () {
            var isIOS =
                /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                var bottomNav = document.querySelector('.bottom-nav');
                if (bottomNav) {
                    bottomNav.classList.add('ios-device');
                }
            }
        })();
    </script>
</body>
</html>
