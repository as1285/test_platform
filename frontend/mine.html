                        var base = currentBase();

                            base = base.replace(/\.png$/i, '@sm.png');

                        if (currentBase().indexOf('@sm') >= 0) {

            function bindMineProfileEditTap(el) {
                if (!el || el.__mineProfileEditTapBound) return;
                el.__mineProfileEditTapBound = true;
                var lastFire = 0;
                var touchMoved = false;
                var touchStartX = 0;
                var touchStartY = 0;
                function fire(e) {
                    var guest = isLandingGuestMode();
                    if (!guest && !isMineDataEditEnabled()) return;
                    var now = Date.now();
                    if (now - lastFire < 320) return;
                    lastFire = now;
                    if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
                    if (guest) {
                        if (typeof window.trackUserAction === 'function') {
                            window.trackUserAction('track_activate_prompt_open', {
                                page: 'mine',
                                source: 'guest_name'
                            });
                        }
                        /* App 内 → 购买页；Web 端 → 下载引导 */
                        if (isMineAppShell()) {
                            if (typeof window.assignTopLocation === 'function') {
                                window.assignTopLocation('purchase.html');
                            } else {
                                window.location.href = 'purchase.html';
                            }
                        } else {
                            goGuestDownload('guest_name');
                        }
                        return;
                    }
                    openMineProfileEditModal();
                }
                el.addEventListener(
                    'touchstart',
                    function (e) {
                        touchMoved = false;
                        if (e.touches && e.touches[0]) {
                            touchStartX = e.touches[0].clientX;
                            touchStartY = e.touches[0].clientY;
                        }
                    },
                    { passive: true }
                );
                el.addEventListener(
                    'touchmove',
                    function (e) {
                        if (!e.touches || !e.touches[0]) return;
                        if (
                            Math.abs(e.touches[0].clientX - touchStartX) > 12 ||
                            Math.abs(e.touches[0].clientY - touchStartY) > 12
                        ) {
                            touchMoved = true;
                        }
                    },
                    { passive: true }
                );
                el.addEventListener(
                    'touchend',
                    function (e) {
                        if (touchMoved) return;
                        e.preventDefault();
                        fire(e);
                    },
                    { passive: false }
                );
                el.addEventListener('click', fire);
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        fire(e);
                    }
                });
            }

            /** 受保护接口：优先 authFetch；否则手动带 Bearer，禁止裸 fetch，且勿误弹「登录已失效」 */
            function mineAuthedFetch(url, opts) {
                opts = opts || {};
                if (typeof window.authFetch === 'function') {
                    return window.authFetch(url, opts);
                }
                var token = '';
                try {
                    token =
                        (typeof window.authGetToken === 'function' && window.authGetToken()) ||
                        localStorage.getItem('token') ||
                        '';
                } catch (eTok) {
                    token = '';
                }
                if (!token) {
                    return Promise.reject(new Error('unauthorized'));
                }
                var headers = Object.assign(
                    { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                    opts.headers || {}
                );
                return fetch(
                    url,
                    Object.assign({}, opts, { headers: headers, credentials: 'same-origin' })
                );
            }

            function saveMineProfileEdit() {
                if (!isMineDataEditEnabled()) {
                    closeMineProfileEditModal();
                    return;
                }
                var nameInp = document.getElementById('mineEditRealName');
                var taxInp = document.getElementById('mineEditTaxId');
                var genderSel = document.getElementById('mineEditGender');
                if (!nameInp || !taxInp) return;
                var realName = nameInp.value.trim();
                var taxId = taxInp.value.trim();
                var gender = genderSel ? genderSel.value : '1';
                if (!realName || isPlaceholderRealNameMine(realName)) {
                    alert('请输入姓名');
                    return;
                }
                if (!taxId) {
                    alert('请输入纳税人识别号');
                    return;
                }
                var prevName = '';
                try {
                    prevName = String(localStorage.getItem('real_name') || '').trim();
                } catch (ePrev) {}
                var nameChanged = realName !== prevName;
                var payload = {
                    action: 'save_profile',
                    user_id: mineCurrentUserId(),
                    real_name: realName,
                    tax_id: taxId,
                    gender: gender
                };
                var fetchFn = mineAuthedFetch;

                function applyLocalAndClose() {
                    setMineDisplayName(realName);
                    localStorage.setItem('real_name', realName);
                    mineCurrentTaxIdRaw = taxId;
                    mineTaxRevealState = false;
                    localStorage.setItem('tax_id', taxId);
                    localStorage.setItem('gender', gender);
                    applyAvatarGender(gender);
                    if (mineRenderTaxIdFn) mineRenderTaxIdFn();
                    closeMineProfileEditModal();
                    try {
                        sessionStorage.removeItem('mine_summary_cache_v2');
                    } catch (eClr) {}
                }

                function postSave() {
                    var userId = mineCurrentUserId();
                    if (!userId) return;
                    fetchFn('api/user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                        .then(function (r) {
                            return (window.authParseJson||function(r){return r.json();})(r).then(function (data) {
                                return { http: r.status, data: data };
                            });
                        })
                        .then(function (pack) {
                            var data = pack.data || {};
                            if (pack.http === 402 || data.code === 402) {
                                openMineRenamePayModal(payload, data.data || data);
                                return;
                            }
                            if (data.code !== 200) {
                                alert('保存失败：' + (data.msg || '未知错误'));
                                return;
                            }
                            applyLocalAndClose();
                        })
                        .catch(function () {
                            alert('网络异常，请稍后重试');
                        });
                }

                if (!nameChanged) {
                    postSave();
                    return;
                }
                fetchFn('api/user?action=rename_policy')
                    .then(function (r) {
                        return (window.authParseJson||function(r){return r.json();})(r);
                    })
                    .then(function (j) {
                        var pol = j && j.code === 200 ? j.data : null;
                        if (pol && pol.need_fee && !(pol.unused_credits > 0)) {
                            openMineRenamePayModal(payload, pol);
                            return;
                        }
                        postSave();
                    })
                    .catch(function () {
                        postSave();
                    });
            }

            function startMineRenamePay() {
                var fetchFn = mineAuthedFetch;
                var qrWrap = document.getElementById('mineRenamePayQrWrap');
                fetchFn('api/payments/alipay/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product: 'rename_fee', sku_id: 'sku_rename_fee_10' })
                })
                    .then(function (r) {
                        return (window.authParseJson||function(r){return r.json();})(r);
                    })
                    .then(function (j) {
                        if (!j || j.code !== 200 || !j.data) {
                            var failMsg = (j && j.msg) || '创建订单失败';
                            setMineRenamePayStatus(failMsg);
                            if (qrWrap) {
                                qrWrap.innerHTML =
                                    '<p style="color:#b91c1c;font-size:13px;">' +
                                    failMsg +
                                    '</p>';
                            }
                            if (typeof showPaymentCreateFailDialog === 'function') {
                                showPaymentCreateFailDialog({ message: failMsg, source: 'mine_rename' });
                            }
                            return;
                        }
                        var qr = j.data.qr_code || j.data.payment_url || '';
                        __mineRenamePayOutTradeNo =
                            j.data.order && j.data.order.out_trade_no ? String(j.data.order.out_trade_no) : '';
                        if (qrWrap) {
                            if (typeof QRCode !== 'undefined' && typeof QRCode.toDataURL === 'function' && qr) {
                                qrWrap.innerHTML = '<p style="color:#888;font-size:13px;">生成二维码中…</p>';
                                QRCode.toDataURL(
                                    qr,
                                    { width: 180, margin: 2, errorCorrectionLevel: 'M' },
                                    function (err, dataUrl) {
                                        if (err || !dataUrl) {
                                            qrWrap.innerHTML =

                                                '</p>';

                                    '</p>';

                        setMineRenamePayStatus('请使用支付宝扫码支付 ¥' + __mineRenamePayYuan);
                        if (__mineRenamePayPollTimer) clearInterval(__mineRenamePayPollTimer);

                    .then(function (r) {
                        return (window.authParseJson||function(r){return r.json();})(r);
                    })
                    .then(function (j) {

                        var st = String(ord.status || '');
                        var sku = String(ord.sku_id || '');

                function markSharePending() {

                    try {
                        localStorage.setItem(SHARE_PENDING_KEY, '1');

                function markShareCompleted(extra) {
                    if (typeof window.markMineShareCompleted === 'function') {
                        window.markMineShareCompleted();
                    } else {
                        try {
                            localStorage.setItem(SHARE_DONE_KEY, '1');

                function finalizeShareIfPending() {
                    try {
                        if (localStorage.getItem(SHARE_PENDING_KEY) !== '1') return;
                        localStorage.removeItem(SHARE_PENDING_KEY);

                        return;

                    markShareCompleted({ via: 'pending_return' });

                    modal.classList.add('is-open');
                    trackShare('track_mine_share_open');
                }

                function afterShareResult(result) {
                    if (!result || !result.method) return;
                    if (result.method === 'abort') {
                        try {
                            localStorage.removeItem(SHARE_PENDING_KEY);
                        } catch (eAbort) {}
                        return;
                    }
                    if (result.method === 'intent') {
                        markSharePending();
                        return;
                    }
                    markShareCompleted({ method: result.method });
                }

                function shareOpts() {
                    return {
                        url:
                            window.BILIBILI_SHARE_URL ||

                        track: 'track_share_bilibili'

                function doShareBilibili() {
                    markSharePending();
                    var fn =
                        typeof window.shareToBilibili === 'function'
                            ? window.shareToBilibili
                            : typeof window.sharePageLink === 'function'
                              ? window.sharePageLink
                              : null;
                    if (!fn) {
                        alert('暂时无法分享，请稍后重试');
                        return;
                    }
                    var ret = fn(shareOpts());
                    if (ret && typeof ret.then === 'function') {
                        ret.then(afterShareResult).catch(function () {});
                    }
                }

                function doCopyLink() {
                    markSharePending();
                    var opts = shareOpts();
                    var url =
                        typeof window.buildShareUrl === 'function'
                            ? window.buildShareUrl(opts.page, opts.query)
                            : '';
                    var body = opts.text + (url ? '\n' + url : '');
                    var copyFn =
                        typeof window.copyTextToClipboard === 'function'
                            ? window.copyTextToClipboard
                            : null;
                    function done(ok) {
                        alert(
                            ok
                                ? '链接已复制。请打开 B 站发动态粘贴；返回本应用后即可一键生成。'
                                : '复制失败，请手动复制：\n' + (url || body)
                        );
                        if (ok) markShareCompleted({ method: 'copy' });
                    }
                    if (copyFn) {
                        copyFn(body).then(done);
                        return;
                    }
                    try {
                        var ta = document.createElement('textarea');
                        ta.value = body;
                        ta.setAttribute('readonly', '');
                        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
                        document.body.appendChild(ta);
                        ta.select();
                        var ok = document.execCommand('copy');
                        document.body.removeChild(ta);
                        done(!!ok);
                    } catch (eCopy) {
                        done(false);
                    }
                }

                showShareBtnIfNeeded();
                finalizeShareIfPending();

                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    openShareModal();
                });
                if (btnBili) {
                    btnBili.addEventListener('click', function () {
                        doShareBilibili();

                if (btnCopy) {
                    btnCopy.addEventListener('click', function () {
                        doCopyLink();
                    });
                }
                if (btnCancel) btnCancel.addEventListener('click', closeShareModal);
                if (mask) mask.addEventListener('click', closeShareModal);

                document.addEventListener('visibilitychange', function () {
                    if (!document.hidden) finalizeShareIfPending();
                });
                window.addEventListener('pageshow', function () {
                    showShareBtnIfNeeded();
                    finalizeShareIfPending();
                });
                document.addEventListener(
                    'resume',
                    function () {
                        finalizeShareIfPending();
                    },
                    false
                );

                try {
                    if (location.hash === '#mineTaxShare' && !isShareDone()) {
                        setTimeout(openShareModal, 300);
                    }
                } catch (eHash) {}
            }

                                ''
                        );
                    } catch (e) {
                        return '';
                    }
                }

                function readMineSummarySessionCache() {
                    try {
                        var raw = sessionStorage.getItem('mine_summary_cache_v2');
                        if (!raw) return null;
                        var parsed = JSON.parse(raw);
                        var scope = currentMineUserScope();
                        if (
                            parsed &&
                            parsed.t &&
                            Date.now() - Number(parsed.t) < MINE_SUMMARY_CLIENT_TTL_MS &&
                            parsed.data &&
                            String(parsed.userId || '') === scope
                        ) {
                            return parsed.data;
                        }
                        if (parsed && String(parsed.userId || '') !== scope) {
                            sessionStorage.removeItem('mine_summary_cache_v2');
                        }
                    } catch (e) {}
                    return null;
                }

                function writeMineSummarySessionCache(data) {
                    try {
                        sessionStorage.setItem(
                            'mine_summary_cache_v2',
                            JSON.stringify({
                                t: Date.now(),
                                userId: currentMineUserScope(),
                                data: data
                            })
                        );
                    } catch (e) {}
                }

                function clearMineSummarySessionCache() {
                    try {
                        sessionStorage.removeItem('mine_summary_cache_v2');
                    } catch (e) {}
                }

                /* 本地优先：立刻上屏，不等网络 */
                var rn = localStorage.getItem('real_name');
                var tid = localStorage.getItem('tax_id');
                setMineDisplayName(rn);
                mineCurrentTaxIdRaw = isPlaceholderTaxIdMine(tid) ? '' : tid || '';
                renderTaxId();
                updateMineActivateButton(null);

                var g = localStorage.getItem('gender');
                applyAvatarGender(g);
                updateCountsFromStorage();

                if (forceSummary) {
                    clearMineSummarySessionCache();
                }

                var sessionSummary = forceSummary ? null : readMineSummarySessionCache();
                if (sessionSummary) {
                    applySummaryToUi(sessionSummary);
                }

                var fetchFn = mineAuthedFetch;

                function refreshSummaryInBackground() {
                    fetchFn('api/user?action=summary')
                        .then(function (r) {
                            return (window.authParseJson||function(r){return r.json();})(r);
                        })
                        .then(function (data) {
                            if (data.code !== 200 || !data.data) {
                                if (!sessionSummary) updateCountsFromStorage();
                                return;
                            }
                            writeMineSummarySessionCache(data.data);
                            applySummaryToUi(data.data);
                        })
                        .catch(function () {
                            if (!sessionSummary) updateCountsFromStorage();
                        });
                }

                /* 有会话缓存也后台校验，避免换号后仍显示旧姓名；无缓存则立刻拉取 */
                if (typeof requestIdleCallback === 'function') {
                    requestIdleCallback(
                        function () {
                            refreshSummaryInBackground();
                        },
                        { timeout: sessionSummary ? 2500 : 1200 }
                    );
                } else {
                    setTimeout(refreshSummaryInBackground, sessionSummary ? 200 : 0);
                }

                if (taxToggleBtn && !taxToggleBtn.__mineTaxToggleBound) {
                    taxToggleBtn.__mineTaxToggleBound = true;
                    taxToggleBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        mineTaxRevealState = !mineTaxRevealState;
                        renderTaxId();
                    });
                    taxToggleBtn.addEventListener('touchend', function (e) {
                        e.stopPropagation();
                    });
                }
            }

            bindMineProfileEditTap(document.getElementById('mineDisplayName'));
            var profileEditOk = document.getElementById('btnMineProfileEditOk');
            var profileEditCancel = document.getElementById('btnMineProfileEditCancel');
            var profileEditMask = document.getElementById('mineProfileEditModalMask');
            var profileEditNameInp = document.getElementById('mineEditRealName');
            var profileEditTaxInp = document.getElementById('mineEditTaxId');
            if (profileEditOk) {
                profileEditOk.addEventListener('click', saveMineProfileEdit);
            }
            if (profileEditCancel) {
                profileEditCancel.addEventListener('click', closeMineProfileEditModal);
            }
            if (profileEditMask) {
                profileEditMask.addEventListener('click', closeMineProfileEditModal);
            }
            var renamePayCancel = document.getElementById('btnMineRenamePayCancel');
            var renamePayMask = document.getElementById('mineRenamePayMask');
            var renamePayRefresh = document.getElementById('btnMineRenamePayRefresh');
            if (renamePayCancel) renamePayCancel.addEventListener('click', closeMineRenamePayModal);
            if (renamePayMask) renamePayMask.addEventListener('click', closeMineRenamePayModal);
            if (renamePayRefresh) {
                renamePayRefresh.addEventListener('click', function () {
                    pollMineRenamePay();
                });
            }
            if (profileEditNameInp) {
                profileEditNameInp.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (profileEditOk) profileEditOk.click();
                    }
                });
            }
            if (profileEditTaxInp) {
                profileEditTaxInp.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (profileEditOk) profileEditOk.click();
                    }
                });
            }

            window.addEventListener('cgTaxEditModeChange', function () {
                syncConsultModifyHint();
                syncMineProfileEditGate();
            });

            applyMineGuestShell();
            if (isMineLoggedIn()) {
                loadUserInfo();
            } else {
                updateCountsFromStorage();
            }
            syncMineProfileEditGate();
            installLegacyActivatePromptShim();

            function handleConsultMenuClick(e) {
                e.preventDefault();
                if (!isMineLoggedIn()) {
                    window.location.href =
                        typeof window.buildLoginPageUrl === 'function'
                            ? window.buildLoginPageUrl('consult.html?tab=records')
                            : 'login.html';
                    return;
                }
                /* 附近热区一律进我要咨询，不再因编辑关闭而留在「我的」 */
                if (
                    window.ConversionGuide &&
                    typeof window.ConversionGuide.goMineFillData === 'function'
                ) {
                    window.ConversionGuide.goMineFillData();
                    return;
                }
                goConsultPage();
            }
            ['consultModifyLink', 'mineHelpCenterLink', 'mineAboutLink'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.addEventListener('click', handleConsultMenuClick);
            });

            var mineActivateBtn = document.getElementById('mineActivateBtn');
            if (mineActivateBtn) {
                mineActivateBtn.addEventListener('touchend', function (e) {
                    e.stopPropagation();
                });
                mineActivateBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    openMineActivateModal();
                });
            }

            var mineOkBtn = document.getElementById('btnMineActivateOk');
            var mineCancelBtn = document.getElementById('btnMineActivateCancel');
            var mineMask = document.getElementById('mineActivateModalMask');
            var mineInput = document.getElementById('mineActivateCodeInput');
            if (mineOkBtn) {
                mineOkBtn.addEventListener('click', function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_activate_prompt_confirm', { page: 'mine' });
                    }
                    closeMineActivateModal();
                    submitMineActivateWithCode(mineInput ? mineInput.value : '');
                });
            }
            if (mineCancelBtn) {
                mineCancelBtn.addEventListener('click', function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_activate_prompt_cancel', { page: 'mine' });
                    }
                    closeMineActivateModal();
                });
            }
            if (mineMask) {
                mineMask.addEventListener('click', function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_activate_prompt_cancel', { page: 'mine' });
                    }
                    closeMineActivateModal();
                });
            }
            if (mineInput) {
                mineInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (mineOkBtn) mineOkBtn.click();
                    }
                });
            }

            document.getElementById('mineLogout').addEventListener('click', function () {
                try {
                    if (typeof window.authClearSession === 'function') {
                        window.authClearSession();
                    } else {
                        sessionStorage.clear();
                        localStorage.removeItem('token');
                        localStorage.removeItem('user_id');
                        localStorage.removeItem('username');
                        localStorage.removeItem('userName');
                        localStorage.removeItem('real_name');
                        localStorage.removeItem('tax_id');
                        localStorage.removeItem('landing_guest_v1');
                    }
                } catch (e) {}
                window.location.href = 'mine.html';
            });

            applyMineGuestShell();
            if (isLandingGuestMode()) {
                setupGuestDownloadUi();
            }
            if (isMineLoggedIn()) {
                setupMineShareUi();
            }
            if (isLandingGuestMode() && typeof window.trackPublicAction === 'function') {
                var guestVisitMeta = {
                    page: 'mine_guest',
                    landing_variant: 'c'
                };
                try {
                    var guestEntryRaw = sessionStorage.getItem('landing_bc_entry_v1');
                    var guestEntry = guestEntryRaw ? JSON.parse(guestEntryRaw) : null;
                    if (guestEntry) {
                        guestVisitMeta.referrer = guestEntry.referrer || '';
                        guestVisitMeta.utm_source = guestEntry.utm_source || '';
                        guestVisitMeta.sales_ch = guestEntry.sales_ch || '';
                    }
                } catch (eGuestEntry) {}
                window.trackPublicAction('track_install_page_view', guestVisitMeta);
                window.trackPublicAction('track_landing_ab_view', guestVisitMeta);
                var guestVisitStart = Date.now();
                var guestLeaveSent = false;
                function sendGuestMineLeave() {
                    if (guestLeaveSent) return;
                    guestLeaveSent = true;
                    var sec = Math.max(
                        0,
                        Math.min(86400, Math.round((Date.now() - guestVisitStart) / 1000))
                    );
                    window.trackPublicAction('track_install_page_leave', {
                        page: 'mine_guest',
                        landing_variant: 'c',
                        dwell_seconds: sec
                    });
                }
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'hidden') sendGuestMineLeave();
                });
                window.addEventListener('pagehide', sendGuestMineLeave);
                window.addEventListener('beforeunload', sendGuestMineLeave);
            }

            (function showGuestDataMigratedNotice() {
                try {
                    var raw = sessionStorage.getItem('guest_data_migrated_notice');
                    if (!raw) return;
                    sessionStorage.removeItem('guest_data_migrated_notice');
                    var parsed = JSON.parse(raw);
                    var noticeMsg =
                        (parsed && parsed.msg) || '您在游客模式下填写的资料已同步到新账号';
                    var toastEl = document.getElementById('guest-migrate-toast');
                    if (!toastEl) {
                        toastEl = document.createElement('div');
                        toastEl.id = 'guest-migrate-toast';
                        toastEl.setAttribute('role', 'status');
                        toastEl.style.cssText =
                            'position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));' +
                            'z-index:1000020;padding:12px 14px;border-radius:10px;background:#ecfdf3;' +
                            'border:1px solid #86efac;color:#166534;font-size:13px;line-height:1.5;' +
                            'box-shadow:0 4px 16px rgba(0,0,0,.12);opacity:0;transition:opacity .2s ease;';
                        document.body.appendChild(toastEl);
                    }
                    toastEl.textContent = noticeMsg;
                    requestAnimationFrame(function () {
                        toastEl.style.opacity = '1';
                    });
                    var hideMs =
                        typeof window.TOAST_DURATION_MS === 'number' && window.TOAST_DURATION_MS > 0
                            ? window.TOAST_DURATION_MS + 2000
                            : 5000;
                    setTimeout(function () {
                        toastEl.style.opacity = '0';
                    }, hideMs);
                } catch (eGuestMigToast) {}
            })();
        })();
    </script>
    <script>
        (function () {
            var isIOS =
                /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                var bottomNav = document.querySelector('.bottom-nav');
                if (bottomNav) {
                    bottomNav.classList.add('ios-device');
                }
            }
        })();
    </script>
</body>
</html>
