        /* 底栏避让改到 .content-wrapper，避免与 app-shell 的 body padding 叠高 */

        html body.page-mine > .bottom-nav.ios-device,
        html.app-ios-client body.page-mine > .bottom-nav,

            z-index: 200 !important;
            margin: 0 !important;
        }

        /* 顶部头图：安全区用头图顶入（负 margin），避免纯色垫带与图顶色差接缝 */
        .header-bg {
            position: relative;
            z-index: 0;
            width: 100%;
            overflow: hidden;
            --mine-safe-top: env(safe-area-inset-top, 0px);

            padding-top: var(--app-shell-statusbar-top, var(--mine-safe-top));

        html.app-top-safe-shell body.page-mine .header-bg > img {

            width: 100%;

        html.app-ios-client.app-top-safe-shell {

            /* 与 grdb.jpg 顶部取样一致 */
            --mine-header-blue-top: #2286ee;

        /*
         * iOS：头图顶入安全区即可，不做额外拼接层（拼接会造成白条/圆弧重影）。

        html.app-ios-client.app-top-safe-shell body.page-mine::before,
        html.app-ios-client.app-top-safe-shell body.page-mine .header-bg::after {
            content: none !important;
            display: none !important;
        }

        html.app-ios-client.app-top-safe-shell body.page-mine .header-bg {
            position: relative;
            z-index: 0;
            padding-top: var(--app-shell-statusbar-top, var(--mine-safe-top));
            overflow: hidden;
            background: var(--mine-header-blue-top, #2286ee);

        html.app-ios-client.app-top-safe-shell body.page-mine .header-bg > img {

            z-index: 1;

        /* 小米 14：同样头图顶入安全区，避免固色垫带色差 */
        html.app-android-xiaomi-14.app-top-safe-shell:not(.app-cordova-xiaomi-23127) body.page-mine .header-bg > img {
            margin-top: calc(-1 * var(--app-shell-statusbar-top, var(--mine-safe-top)));

        /* Cordova 23127PN0CC：固定定位，避免被 header-bg overflow 或黑状态栏裁切 */

        html.app-cordova-xiaomi-23127.app-top-safe-shell body.page-mine .header-bg > img {
            margin-top: calc(-1 * var(--app-cordova-statusbar-chrome, 40px));

        /* 红米 Note 13 Pro：缩小「个人信息」与税号字号，避免挡住眼睛按钮 */
        html.app-android-redmi-note13-pro body.page-mine .user-card {

        html.app-android-redmi-note13-pro body.page-mine .user-name {

        /* 弹框居中：Android WebView（如 OPPO K7x）下 flex 居中易贴底，改用 fixed + transform */
        .activate-modal-root {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            box-sizing: border-box;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .activate-modal-root.is-open {
            display: block;
        }

        .activate-modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
        }

        .activate-modal-panel {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: calc(100% - 32px);
            max-width: 320px;
            background: #fff;
            border-radius: 12px;
            padding: 18px 16px 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        }

        .activate-modal-title {
            font-size: 15px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .activate-modal-body {
            font-size: 15px;
            color: #333;
            line-height: 1.65;
            margin-bottom: 16px;
        }

        .activate-modal-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #1e6fff;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 14px;
            box-sizing: border-box;
        }

        .activate-modal-label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .activate-modal-label + .activate-modal-input,
        .activate-modal-label + .activate-modal-select {
            margin-bottom: 12px;
        }

        .activate-modal-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #1e6fff;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 14px;
            box-sizing: border-box;
            background: #fff;
            color: #333;
        }

        .mine-profile-edit-hint {
            font-size: 12px;
            color: #999;
            line-height: 1.5;
            margin: -4px 0 12px;
        }

        body.mine-profile-edit-modal-open {
            position: fixed;
            width: 100%;
            overflow: hidden;
            left: 0;
            right: 0;
        }

        #mineProfileEditModal .activate-modal-panel {
            max-height: calc(100dvh - 32px);
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .activate-modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            align-items: center;
        }

        .activate-modal-btn {
            border: 1px solid #d9d9d9;
            background: #fff;

            height: 34px;
            border-radius: 17px;
            padding: 0 14px;

        }

        .activate-modal-btn.primary {
            border-color: #1e6fff;
            background: #1e6fff;
            color: #fff;
        }

        .activate-modal-btn.xianyu {
            margin-right: auto;
        }

        .activate-modal-actions-leading {
            display: flex;
            gap: 8px;
            margin-right: auto;
            flex-wrap: wrap;
        }

        .activate-modal-actions-leading .activate-modal-btn.xianyu {
            margin-right: 0;
        }

        /*
         * 灰底圆角面板：与官方一致。信息卡在灰底外上移压住蓝头图，两侧露蓝而非灰。
         * 勿加 overflow-x:clip/hidden：会连带裁切上移的 .user-card。
         */
        .content-wrapper {
            background: #f5f6fa;
            border-radius: 20px 20px 0 0;
            margin-top: -20px;
            position: relative;
            z-index: 10;
            padding-top: 10px;
            padding-bottom: var(--bottom-nav-clearance, calc(98px + env(safe-area-inset-bottom, 0px)));
        }

        .user-card {
            background: linear-gradient(105deg, #f8ead8 0%, #f3e2cc 42%, #edd9bf 100%);
            margin: -70px 16px 0;
            border-radius: 12px 12px 0 0;
            padding: 14px 86px 14px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            position: relative;
            z-index: 11;
            overflow: visible;
        }

        /* 头像热区：卡通头像在顶图内，信息卡上移后会挡住点击，单独留出触控区 */
        .mine-avatar-edit-hit {
            position: absolute;
            left: 8px;
            top: -62px;
            width: 80px;
            height: 80px;
            border: none;
            padding: 0;
            margin: 0;
            background: transparent;
            z-index: 15;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .user-info {
            display: block;
            min-width: 0;
        }

        .user-info-text {
            min-width: 0;
            padding-right: 0;
        }

        .user-info-text.user-info-text--editable {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
            z-index: 1;
        }

        .user-info-text.user-info-text--editable:active {
            opacity: 0.88;
        }

        .user-name.user-name--editable {
            display: inline-block;
            max-width: 100%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 0 2px;
            min-height: 0;
        }

        .user-name.user-name--editable:active {
            opacity: 0.88;
        }

        .user-name {

            font-weight: 600;

        }

            flex-wrap: nowrap;
            gap: 4px;

        /* iOS Safari / iPhone：对齐官方——标签与税号同一行 */
        html.app-ios-client body.page-mine .user-name,
        html[class*='app-ios'] body.page-mine .user-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.25;
        }

        html.app-ios-client body.page-mine .user-id,
        html[class*='app-ios'] body.page-mine .user-id {
            font-size: 12px;
            gap: 3px;
        }

        html.app-ios-client body.page-mine .user-tax-label,
        html[class*='app-ios'] body.page-mine .user-tax-label,
        html.app-ios-client body.page-mine .user-tax-value,
        html[class*='app-ios'] body.page-mine .user-tax-value {

        html[class*='app-ios'] body.page-mine .personal-info-btn {

    <script>
        (function () {
            function applyMineHeaderImage(gender) {
                var hi = document.getElementById('headerImg');
                var cfg = window.__MINE_UI_CONFIG || {};
                if (!hi) return;
                var g = gender;
                if (g == null || g === '') {
                    try {
                        g = localStorage.getItem('gender');
                    } catch (e0) {
                        g = null;
                    }
                }
                var n = Number(g);
                if (Number(n) === 2) {
                    hi.src = cfg.header_female || 'nx.jpg';
                } else {
                    hi.src = cfg.header_male || 'grdb.jpg';
                }
            }

            function applyMineAssets(cfg) {
                if (!cfg) return;
                applyMineHeaderImage();
                var f = document.getElementById('mineIconFamily');
                var e = document.getElementById('mineIconEmployer');
                var b = document.getElementById('mineIconBank');
                if (f && cfg.icon_family) f.src = cfg.icon_family;
                if (e && cfg.icon_employer) e.src = cfg.icon_employer;
                if (b && cfg.icon_bank) b.src = cfg.icon_bank;
            }

            window.addEventListener('mineUiConfig', function (ev) {
                applyMineAssets(ev.detail);
                if (typeof window.__refreshNavFromMineUi === 'function') {
                    window.__refreshNavFromMineUi();
                }
            });

            setTimeout(function () {
                if (window.__MINE_UI_CONFIG) {
                    applyMineAssets(window.__MINE_UI_CONFIG);
                }
            }, 0);

            function maskTaxId(taxId) {
                if (!taxId || taxId.length < 2) {
                    return '--';
                }
                return taxId.charAt(0) + '***************' + taxId.charAt(taxId.length - 1);
            }

            var MINE_LEGACY_DEFAULT_TAX_ID = '620000000000000000';
            var MINE_DEFAULT_TAX_ID_HINT = '所有信息点击税务演示数据修改';
            var MINE_LEGACY_TAX_ID_HINT = '所***************改';
            var MINE_DEFAULT_DISPLAY_NAME = '点击我修改名字';
            var mineCurrentTaxIdRaw = '';
            var mineTaxRevealState = false;
            var mineRenderTaxIdFn = null;

            function isPlaceholderTaxIdMine(v) {
                var s = String(v || '').trim();
                return (
                    !s ||
                    s === MINE_LEGACY_DEFAULT_TAX_ID ||
                    s === MINE_DEFAULT_TAX_ID_HINT ||
                    s === MINE_LEGACY_TAX_ID_HINT
                );
            }

            /** 未自定义姓名时的占位（游客默认名、注册时用账号当姓名、旧演示名等） */
            function isPlaceholderRealNameMine(v) {
                var s = String(v || '').trim();
                if (!s || s === '--' || s === MINE_DEFAULT_DISPLAY_NAME) return true;
                if (s === '游客用户' || s === '杰瑞') return true;
                var uid = mineCurrentUserId();
                if (uid && s === uid) return true;
                return false;
            }

            function resolveMineDisplayName(v) {
                return isPlaceholderRealNameMine(v) ? MINE_DEFAULT_DISPLAY_NAME : String(v).trim();
            }

            function setMineDisplayName(v) {
                var nameEl = document.getElementById('mineDisplayName');
                if (nameEl) nameEl.textContent = resolveMineDisplayName(v);
            }

            function mineCurrentUserId() {
                return (
                    localStorage.getItem('user_id') ||
                    localStorage.getItem('userName') ||
                    localStorage.getItem('username') ||
                    ''
                );
            }

            function isMineDataEditEnabled() {
                return (
                    !window.ConversionGuide ||
                    typeof window.ConversionGuide.isTaxEditModeOn !== 'function' ||
                    window.ConversionGuide.isTaxEditModeOn()
                );
            }

            function isLandingGuestMode() {
                try {
                    return localStorage.getItem('landing_guest_v1') === '1';
                } catch (e) {
                    return false;
                }
            }

            function isMineAppShell() {
                return (
                    typeof window.isCordovaTaxAppShell === 'function' &&
                    window.isCordovaTaxAppShell()
                );
            }

            function syncMineProfileEditGate() {
                var hit = document.getElementById('mineProfileEditHit');
                var nameEl = document.getElementById('mineDisplayName');
                var guest = isLandingGuestMode();
                var on = guest || isMineDataEditEnabled();
                if (hit) {
                    hit.classList.remove('user-info-text--editable');
                }
                if (nameEl) {
                    nameEl.classList.toggle('user-name--editable', on);
                    if (on) {
                        nameEl.setAttribute('role', 'button');
                        nameEl.setAttribute('tabindex', '0');
                        nameEl.setAttribute(
                            'aria-label',
                            guest
                                ? isMineAppShell()
                                    ? '打开购买页'
                                    : '下载 App'
                                : '修改姓名、纳税人识别号与性别'
                        );
                    } else {
                        nameEl.removeAttribute('role');
                        nameEl.removeAttribute('tabindex');
                        nameEl.removeAttribute('aria-label');
                    }
                }
                if (!on) {
                    closeMineProfileEditModal();
                }
            }

            function bindMineProfileEditTap(el) {
                if (!el || el.__mineProfileEditTapBound) return;
                el.__mineProfileEditTapBound = true;
                var lastFire = 0;
                var touchMoved = false;
                var touchStartX = 0;
                var touchStartY = 0;
                function fire(e) {
                    var guest = isLandingGuestMode();
                    if (!guest && !isMineDataEditEnabled()) return;
                    var now = Date.now();
                    if (now - lastFire < 320) return;
                    lastFire = now;
                    if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
                    if (guest) {
                        if (typeof window.trackUserAction === 'function') {
                            window.trackUserAction('track_activate_prompt_open', {
                                page: 'mine',
                                source: 'guest_name'
                            });
                        }
                        /* App 内 → 购买页；Web 端 → 下载引导 */
                        if (isMineAppShell()) {
                            window.location.href = 'purchase.html';
                        } else {
                            goGuestDownload('guest_name');
                        }
                        return;
                    }
                    openMineProfileEditModal();
                }
                el.addEventListener(
                    'touchstart',
                    function (e) {
                        touchMoved = false;
                        if (e.touches && e.touches[0]) {
                            touchStartX = e.touches[0].clientX;
                            touchStartY = e.touches[0].clientY;
                        }
                    },
                    { passive: true }
                );
                el.addEventListener(
                    'touchmove',
                    function (e) {
                        if (!e.touches || !e.touches[0]) return;
                        if (
                            Math.abs(e.touches[0].clientX - touchStartX) > 12 ||
                            Math.abs(e.touches[0].clientY - touchStartY) > 12
                        ) {
                            touchMoved = true;
                        }
                    },
                    { passive: true }
                );
                el.addEventListener(
                    'touchend',
                    function (e) {
                        if (touchMoved) return;
                        e.preventDefault();
                        fire(e);
                    },
                    { passive: false }
                );
                el.addEventListener('click', fire);
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        fire(e);
                    }
                });
            }

            var mineProfileEditScrollLockY = 0;

            function lockMineProfileEditScroll() {
                mineProfileEditScrollLockY =
                    window.scrollY || document.documentElement.scrollTop || 0;
                document.body.classList.add('mine-profile-edit-modal-open');
                document.body.style.top = '-' + mineProfileEditScrollLockY + 'px';
            }

            function unlockMineProfileEditScroll() {
                if (!document.body.classList.contains('mine-profile-edit-modal-open')) return;
                document.body.classList.remove('mine-profile-edit-modal-open');
                document.body.style.top = '';
                window.scrollTo(0, mineProfileEditScrollLockY);
            }

            function openMineProfileEditModal() {
                if (!isMineDataEditEnabled()) return;
                var root = document.getElementById('mineProfileEditModal');
                var nameInp = document.getElementById('mineEditRealName');
                var taxInp = document.getElementById('mineEditTaxId');
                var genderSel = document.getElementById('mineEditGender');
                var nameEl = document.getElementById('mineDisplayName');
                if (!root || !nameInp || !taxInp) return;
                var storedName = localStorage.getItem('real_name') || '';
                var displayName = nameEl ? String(nameEl.textContent || '').trim() : '';
                var seed = !isPlaceholderRealNameMine(storedName)
                    ? String(storedName).trim()
                    : !isPlaceholderRealNameMine(displayName)
                      ? displayName
                      : '';
                nameInp.value = seed;
                var tid = mineCurrentTaxIdRaw || localStorage.getItem('tax_id') || '';
                if (isPlaceholderTaxIdMine(tid)) tid = '';
                taxInp.value = tid;
                if (genderSel) {
                    var g = localStorage.getItem('gender');
                    genderSel.value = g === '2' ? '2' : '1';
                }
                lockMineProfileEditScroll();
                root.classList.add('is-open');
                var ua = navigator.userAgent || '';
                if (!/Android/i.test(ua)) {
                    setTimeout(function () {
                        nameInp.focus();
                    }, 0);
                }
            }

            function closeMineProfileEditModal() {
                var root = document.getElementById('mineProfileEditModal');
                if (root) root.classList.remove('is-open');
                unlockMineProfileEditScroll();
            }

            /** 受保护接口：优先 authFetch；否则手动带 Bearer，禁止裸 fetch，且勿误弹「登录已失效」 */
            function mineAuthedFetch(url, opts) {
                opts = opts || {};
                if (typeof window.authFetch === 'function') {
                    return window.authFetch(url, opts);
                }
                var token = '';
                try {
                    token =
                        (typeof window.authGetToken === 'function' && window.authGetToken()) ||
                        localStorage.getItem('token') ||
                        '';
                } catch (eTok) {
                    token = '';
                }
                if (!token) {
                    return Promise.reject(new Error('unauthorized'));
                }
                var headers = Object.assign(
                    { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                    opts.headers || {}
                );
                return fetch(
                    url,
                    Object.assign({}, opts, { headers: headers, credentials: 'same-origin' })
                );
            }

            function saveMineProfileEdit() {
                if (!isMineDataEditEnabled()) {
                    closeMineProfileEditModal();
                    return;
                }
                var nameInp = document.getElementById('mineEditRealName');
                var taxInp = document.getElementById('mineEditTaxId');
                var genderSel = document.getElementById('mineEditGender');
                if (!nameInp || !taxInp) return;
                var realName = nameInp.value.trim();
                var taxId = taxInp.value.trim();
                var gender = genderSel ? genderSel.value : '1';
                if (!realName || isPlaceholderRealNameMine(realName)) {
                    alert('请输入姓名');
                    return;
                }
                if (!taxId) {
                    alert('请输入纳税人识别号');
                    return;
                }
                var prevName = '';
                try {
                    prevName = String(localStorage.getItem('real_name') || '').trim();
                } catch (ePrev) {}
                var nameChanged = realName !== prevName;
                var payload = {
                    action: 'save_profile',
                    user_id: mineCurrentUserId(),
                    real_name: realName,
                    tax_id: taxId,
                    gender: gender
                };
                var fetchFn = mineAuthedFetch;

                function applyLocalAndClose() {
                    setMineDisplayName(realName);
                    localStorage.setItem('real_name', realName);
                    mineCurrentTaxIdRaw = taxId;
                    mineTaxRevealState = false;
                    localStorage.setItem('tax_id', taxId);
                    localStorage.setItem('gender', gender);
                    applyAvatarGender(gender);
                    if (mineRenderTaxIdFn) mineRenderTaxIdFn();
                    closeMineProfileEditModal();
                    try {
                        sessionStorage.removeItem('mine_summary_cache_v1');
                    } catch (eClr) {}
                }

                function postSave() {
                    var userId = mineCurrentUserId();
                    if (!userId) return;
                    fetchFn('api/user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                        .then(function (r) {
                            return r.json().then(function (data) {
                                return { http: r.status, data: data };
                            });
                        })
                        .then(function (pack) {
                            var data = pack.data || {};
                            if (pack.http === 402 || data.code === 402) {
                                openMineRenamePayModal(payload, data.data || data);
                                return;
                            }
                            if (data.code !== 200) {
                                alert('保存失败：' + (data.msg || '未知错误'));
                                return;
                            }
                            applyLocalAndClose();
                        })
                        .catch(function () {
                            alert('网络异常，请稍后重试');
                        });
                }

                if (!nameChanged) {
                    postSave();
                    return;
                }
                fetchFn('api/user?action=rename_policy')
                    .then(function (r) {
                        return r.json();
                    })
                    .then(function (j) {
                        var pol = j && j.code === 200 ? j.data : null;
                        if (pol && pol.need_fee && !(pol.unused_credits > 0)) {
                            openMineRenamePayModal(payload, pol);
                            return;
                        }
                        postSave();
                    })
                    .catch(function () {
                        postSave();
                    });
            }

            var __mineRenamePayPayload = null;
            var __mineRenamePayPollTimer = null;
            var __mineRenamePayOutTradeNo = '';

            function closeMineRenamePayModal() {
                var root = document.getElementById('mineRenamePayModal');
                if (root) root.classList.remove('is-open');
                if (__mineRenamePayPollTimer) {
                    clearInterval(__mineRenamePayPollTimer);
                    __mineRenamePayPollTimer = null;
                }
                __mineRenamePayPayload = null;
                __mineRenamePayOutTradeNo = '';
            }

            function setMineRenamePayStatus(msg) {
                var el = document.getElementById('mineRenamePayStatus');
                if (el) el.textContent = msg || '—';
            }

            function openMineRenamePayModal(payload, policy) {
                __mineRenamePayPayload = payload;
                var root = document.getElementById('mineRenamePayModal');
                var hint = document.getElementById('mineRenamePayHint');
                var qrWrap = document.getElementById('mineRenamePayQrWrap');
                if (hint && policy) {
                    hint.textContent =
                        '近 ' +
                        (policy.activity_window_days || 30) +
                        ' 天活跃 ' +
                        (policy.active_days != null ? policy.active_days : '—') +
                        ' 天，已改名 ' +
                        (policy.name_change_count != null ? policy.name_change_count : '—') +
                        ' 次（免费 ' +
                        (policy.free_limit || 5) +
                        ' 次）。请支付 ¥' +
                        (policy.fee_amount || '10.00') +
                        ' 获得 1 次改名。';
                }
                if (qrWrap) qrWrap.innerHTML = '<p style="color:#888;font-size:13px;">正在生成付款码…</p>';
                setMineRenamePayStatus('等待支付');
                if (root) root.classList.add('is-open');
                startMineRenamePay();
            }

            function startMineRenamePay() {
                var fetchFn = mineAuthedFetch;
                var qrWrap = document.getElementById('mineRenamePayQrWrap');
                fetchFn('api/payments/alipay/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product: 'rename_fee', sku_id: 'sku_rename_fee_10' })
                })
                    .then(function (r) {
                        return r.json();
                    })
                    .then(function (j) {
                        if (!j || j.code !== 200 || !j.data) {
                            setMineRenamePayStatus((j && j.msg) || '创建订单失败');
                            if (qrWrap) {
                                qrWrap.innerHTML =
                                    '<p style="color:#b91c1c;font-size:13px;">' +
                                    ((j && j.msg) || '创建订单失败') +
                                    '</p>';
                            }
                            return;
                        }
                        var qr = j.data.qr_code || j.data.payment_url || '';
                        __mineRenamePayOutTradeNo =
                            j.data.order && j.data.order.out_trade_no ? String(j.data.order.out_trade_no) : '';
                        if (qrWrap) {
                            if (typeof QRCode !== 'undefined' && typeof QRCode.toDataURL === 'function' && qr) {
                                qrWrap.innerHTML = '<p style="color:#888;font-size:13px;">生成二维码中…</p>';
                                QRCode.toDataURL(
                                    qr,
                                    { width: 180, margin: 2, errorCorrectionLevel: 'M' },
                                    function (err, dataUrl) {
                                        if (err || !dataUrl) {
                                            qrWrap.innerHTML =
                                                '<p style="font-size:12px;word-break:break-all;">请在支付宝打开：<br>' +
                                                qr +
                                                '</p>';
                                            return;
                                        }
                                        qrWrap.innerHTML =
                                            '<img src="' +
                                            dataUrl +
                                            '" alt="改名付款码" style="width:180px;height:180px;background:#fff;">';
                                    }
                                );
                            } else if (qr) {
                                qrWrap.innerHTML =
                                    '<p style="font-size:12px;word-break:break-all;">请复制到支付宝打开：<br>' +
                                    qr +
                                    '</p>';
                            }
                        }
                        setMineRenamePayStatus('请使用支付宝扫码支付 ¥10');
                        if (__mineRenamePayPollTimer) clearInterval(__mineRenamePayPollTimer);
                        __mineRenamePayPollTimer = setInterval(pollMineRenamePay, 2500);
                    })
                    .catch(function () {
                        setMineRenamePayStatus('网络错误');
                    });
            }

            function pollMineRenamePay() {
                var fetchFn = mineAuthedFetch;
                fetchFn('api/payments/alipay/latest')
                    .then(function (r) {
                        return r.json();
                    })
                    .then(function (j) {
                        var ord = j && j.code === 200 && j.data ? j.data.order || j.data : null;
                        if (!ord) return;
                        var st = String(ord.status || '');
                        var sku = String(ord.sku_id || '');
                        var otn = String(ord.out_trade_no || '');
                        if (
                            st === 'paid' &&
                            (sku === 'sku_rename_fee_10' ||
                                !__mineRenamePayOutTradeNo ||
                                otn === __mineRenamePayOutTradeNo)
                        ) {
                            setMineRenamePayStatus('支付成功，正在保存姓名…');
                            if (__mineRenamePayPollTimer) {
                                clearInterval(__mineRenamePayPollTimer);
                                __mineRenamePayPollTimer = null;
                            }
                            finishMineRenameAfterPay();
                        }
                    })
                    .catch(function () {});
            }

            function finishMineRenameAfterPay() {
                if (!__mineRenamePayPayload) {
                    closeMineRenamePayModal();
                    return;
                }

                                if (err || !url) {
                                    reject(err || new Error('qr_fail'));

                /** 合成带文案的分享海报（品牌 + 说明 + 二维码），避免只发裸码 */
                function composeSharePoster(qrDataUrl) {
                    return new Promise(function (resolve, reject) {
                        var img = new Image();
                        img.onload = function () {
                            try {
                                var W = 720;
                                var H = 980;
                                var canvas = document.createElement('canvas');
                                canvas.width = W;
                                canvas.height = H;
                                var ctx = canvas.getContext('2d');
                                if (!ctx) {
                                    reject(new Error('no_ctx'));
                                    return;
                                }

                                /* 背景 */
                                var bg = ctx.createLinearGradient(0, 0, 0, H);
                                bg.addColorStop(0, '#1f78ee');
                                bg.addColorStop(0.42, '#2b86f2');
                                bg.addColorStop(1, '#eef4fc');
                                ctx.fillStyle = bg;
                                ctx.fillRect(0, 0, W, H);

                                /* 顶部品牌区 */
                                ctx.fillStyle = '#ffffff';
                                ctx.font = '600 28px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                ctx.textAlign = 'center';
                                ctx.fillText('个人所得税', W / 2, 78);

                                ctx.font = '700 44px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                ctx.fillText('扫码下载官方 App', W / 2, 148);

                                ctx.font = '400 26px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                ctx.globalAlpha = 0.92;
                                ctx.fillText('安装后登录，权益与资料自动同步', W / 2, 198);
                                ctx.globalAlpha = 1;

                                /* 白色卡片承载二维码 */
                                var cardX = 70;
                                var cardY = 240;
                                var cardW = W - 140;
                                var cardH = 560;
                                var r = 28;
                                ctx.fillStyle = '#ffffff';
                                ctx.beginPath();
                                ctx.moveTo(cardX + r, cardY);
                                ctx.arcTo(cardX + cardW, cardY, cardX + cardW, cardY + cardH, r);
                                ctx.arcTo(cardX + cardW, cardY + cardH, cardX, cardY + cardH, r);
                                ctx.arcTo(cardX, cardY + cardH, cardX, cardY, r);
                                ctx.arcTo(cardX, cardY, cardX + cardW, cardY, r);
                                ctx.closePath();
                                ctx.fill();

                                ctx.fillStyle = '#1a1a1a';
                                ctx.font = '600 28px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                ctx.fillText('微信扫一扫下载', W / 2, cardY + 58);

                                ctx.fillStyle = '#6b7280';
                                ctx.font = '400 22px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                ctx.fillText('支持 Android / iOS', W / 2, cardY + 96);

                                var qrSize = 360;
                                var qrX = (W - qrSize) / 2;
                                var qrY = cardY + 130;
                                ctx.drawImage(img, qrX, qrY, qrSize, qrSize);

                                /* 底部提示 */
                                ctx.fillStyle = '#334155';
                                ctx.font = '400 24px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
                                ctx.fillText('长按识别二维码 · 立即安装体验', W / 2, cardY + cardH + 70);

                                resolve(canvas.toDataURL('image/png'));
                            } catch (eDraw) {
                                reject(eDraw);
                            }
                        };
                        img.onerror = function () {
                            reject(new Error('qr_img_fail'));
                        };
                        img.src = qrDataUrl;
                    });
                }

                function ensureShareImage() {
                    if (shareImgUrl) {
                        setQrImg(shareImgUrl);

                        packagesLoaded = true;

                        var cached = window.getCachedPublicInstallPackages();
                        if (cached) {
                            applyPkg(cached);
                            return;
                        }
                    }
                    var fetcher =
                        typeof window.fetchPublicInstallPackages === 'function'
                            ? window.fetchPublicInstallPackages()
                            : fetch(
                                  typeof getPublicInstallPackagesUrl === 'function'
                                      ? getPublicInstallPackagesUrl()
                                      : '/api/public/install-packages',
                                  { credentials: 'same-origin' }
                              ).then(function (r) {
                                  return r.json();
                              });
                    Promise.resolve(fetcher)
                        .then(function (j) {
                            var pkg =
                                j && j.code === 200 && j.data
                                    ? j.data
                                    : j && j.android_apk_download_url
                                      ? j
                                      : {};
                            applyPkg(pkg || {});
                        })
                        .catch(function () {
                            if (!packagesLoaded) {
                                applyPkg({});
                            }
                        });

                function revokeBlobUrl() {
                    if (shareBlobUrl) {
                        try {
                            URL.revokeObjectURL(shareBlobUrl);

                        shareBlobUrl = '';

                function fetchImageBlob(url) {
                    if (!url) return Promise.reject(new Error('empty'));
                    if (url.indexOf('data:') === 0) {
                        return fetch(url).then(function (r) {
                            return r.blob();
                        });
                    }
                    return fetch(url, { credentials: 'same-origin' }).then(function (r) {
                        if (!r.ok) throw new Error('http_' + r.status);
                        return r.blob();
                    });
                }

                function downloadBlob(blob, filename) {
                    revokeBlobUrl();
                    shareBlobUrl = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = shareBlobUrl;
                    a.download = filename || '个人所得税-下载海报.png';
                    a.style.display = 'none';
                    document.body.appendChild(a);

                            parsed &&
                            parsed.t &&
                            Date.now() - Number(parsed.t) < MINE_SUMMARY_CLIENT_TTL_MS &&
                            parsed.data
                        ) {
                            return parsed.data;
                        }
                    } catch (e) {}

                });
            }

            document.getElementById('mineLogout').addEventListener('click', function () {
                try {
                    sessionStorage.clear();
                    localStorage.removeItem('token');
                    localStorage.removeItem('user_id');
                    localStorage.removeItem('username');
                    localStorage.removeItem('real_name');
                    localStorage.removeItem('tax_id');
                    localStorage.removeItem('landing_guest_v1');
                } catch (e) {}
                window.location.href = 'login.html';
            });

            if (isLandingGuestMode()) {
                setupGuestDownloadUi();
            }
            setupMineShareUi();
            if (isLandingGuestMode() && typeof window.trackPublicAction === 'function') {
                var guestVisitMeta = {
                    page: 'mine_guest',
                    landing_variant: 'c'
                };
                try {
                    var guestEntryRaw = sessionStorage.getItem('landing_bc_entry_v1');
                    var guestEntry = guestEntryRaw ? JSON.parse(guestEntryRaw) : null;
                    if (guestEntry) {
                        guestVisitMeta.referrer = guestEntry.referrer || '';
                        guestVisitMeta.utm_source = guestEntry.utm_source || '';
                        guestVisitMeta.sales_ch = guestEntry.sales_ch || '';
                    }
                } catch (eGuestEntry) {}
                window.trackPublicAction('track_install_page_view', guestVisitMeta);
                window.trackPublicAction('track_landing_ab_view', guestVisitMeta);
                var guestVisitStart = Date.now();
                var guestLeaveSent = false;
                function sendGuestMineLeave() {
                    if (guestLeaveSent) return;
                    guestLeaveSent = true;
                    var sec = Math.max(
                        0,
                        Math.min(86400, Math.round((Date.now() - guestVisitStart) / 1000))
                    );
                    window.trackPublicAction('track_install_page_leave', {
                        page: 'mine_guest',
                        landing_variant: 'c',
                        dwell_seconds: sec
                    });
                }
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'hidden') sendGuestMineLeave();
                });
                window.addEventListener('pagehide', sendGuestMineLeave);
                window.addEventListener('beforeunload', sendGuestMineLeave);
            }

            (function showGuestDataMigratedNotice() {
                try {
                    var raw = sessionStorage.getItem('guest_data_migrated_notice');
                    if (!raw) return;
                    sessionStorage.removeItem('guest_data_migrated_notice');
                    var parsed = JSON.parse(raw);
                    var noticeMsg =
                        (parsed && parsed.msg) || '您在游客模式下填写的资料已同步到新账号';
                    var toastEl = document.getElementById('guest-migrate-toast');
                    if (!toastEl) {
                        toastEl = document.createElement('div');
                        toastEl.id = 'guest-migrate-toast';
                        toastEl.setAttribute('role', 'status');
                        toastEl.style.cssText =
                            'position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));' +
                            'z-index:1000020;padding:12px 14px;border-radius:10px;background:#ecfdf3;' +
                            'border:1px solid #86efac;color:#166534;font-size:13px;line-height:1.5;' +
                            'box-shadow:0 4px 16px rgba(0,0,0,.12);opacity:0;transition:opacity .2s ease;';
                        document.body.appendChild(toastEl);
                    }
                    toastEl.textContent = noticeMsg;
                    requestAnimationFrame(function () {
                        toastEl.style.opacity = '1';
                    });
                    var hideMs =
                        typeof window.TOAST_DURATION_MS === 'number' && window.TOAST_DURATION_MS > 0
                            ? window.TOAST_DURATION_MS + 2000
                            : 5000;
                    setTimeout(function () {
                        toastEl.style.opacity = '0';
                    }, hideMs);
                } catch (eGuestMigToast) {}
            })();
        })();
    </script>
    <script>
        (function () {
            var isIOS =
                /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                var bottomNav = document.querySelector('.bottom-nav');
                if (bottomNav) {
                    bottomNav.classList.add('ios-device');
                }
            }
        })();
    </script>
</body>
</html>
