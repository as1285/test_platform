<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260805-shouye-bar-blue"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>离职证明生成</title>
    <style>
        :root {
            --ink: #0f172a;
            --ink-soft: #475569;
            --muted: #94a3b8;
            --line: #e2e8f0;
            --bg: #f4f7fb;
            --accent: #1d6fd8;
            --accent-deep: #1860be;
            --accent-soft: #eff6ff;
            --warn: #b45309;
            --warn-soft: #fff7e8;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --wrap: 440px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background: var(--bg);
            padding-bottom: calc(28px + var(--safe-b));
        }
        .header {
            max-width: var(--wrap);
            margin: 0 auto;
            padding: calc(12px + var(--safe-t)) 20px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            color: var(--accent);
            font-size: 15px;
            text-decoration: none;
            padding: 4px 2px;
        }
        .header-title { font-size: 16px; font-weight: 600; }
        .page { max-width: var(--wrap); margin: 0 auto; padding: 8px 20px 0; }
        .hero {
            padding: 18px 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            color: #fff;
            background: linear-gradient(135deg, #0f4c9a 0%, #1d6fd8 55%, #5aa3f0 100%);
            box-shadow: 0 10px 24px rgba(29, 111, 216, 0.18);
        }
        .hero h1 { font-size: 20px; margin: 0 0 6px; }
        .hero p { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.88); margin: 0; }
        .card {
            padding: 16px;
            margin-top: 12px;
            border: 1px solid rgba(226, 232, 240, 0.85);
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.05);
        }
        .card[hidden] { display: none !important; }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .card-hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
        .warn-box {
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--warn-soft);
            color: var(--warn);
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .field-label {
            display: block;
            font-size: 12px;
            color: var(--ink-soft);
            margin: 0 0 6px;
        }
        .field {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 15px;
            margin-bottom: 12px;
            font-family: inherit;
            background: #fff;
        }
        .field:focus {
            outline: none;
            border-color: #93c0f0;
            box-shadow: 0 0 0 3px rgba(29, 111, 216, 0.12);
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            background: var(--accent);
        }
        .btn + .btn { margin-top: 8px; }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-secondary {
            background: #fff;
            color: var(--ink-soft);
            border: 1px solid var(--line);
        }
        .status {
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.45;
            color: var(--accent-deep);
            text-align: center;
        }
        .status.is-err { color: #b91c1c; }
        .qr-wrap {
            margin-top: 12px;
            text-align: center;
            min-height: 40px;
        }
        .qr-wrap img {
            width: 180px;
            height: 180px;
            background: #fff;
            border-radius: 8px;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            color: #166534;
            background: #ecfdf3;
            border-radius: 6px;
            padding: 3px 8px;
            margin-bottom: 8px;
        }
        .pdf-save-card .card-title { margin-bottom: 8px; }
        .pdf-frame-wrap {
            margin: 10px 0 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: #e8eef5;
            min-height: 280px;
        }
        .pdf-frame-wrap iframe {
            display: block;
            width: 100%;
            height: 360px;
            border: 0;
            background: #fff;
        }
        .pdf-save-tip {
            font-size: 12px;
            line-height: 1.5;
            color: var(--ink-soft);
            margin: 0 0 10px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>
</head>
<body>
    <div class="header">
        <a class="back-btn" href="consult.html?tab=products" id="lizhiBack">‹ 返回</a>
        <div class="header-title">离职证明</div>
    </div>
    <div class="page">
        <div class="hero">
            <h1>离职证明生成</h1>
            <p>未付款可生成带「演示样例」水印的 PDF；支付宝付 ¥50 开通后，可生成无演示水印版本。</p>
        </div>

        <div class="warn-box" id="lizhiNote">
            电子生成件，仅供个人留存，非用人单位出具。请勿用于入职、签证等正式用途。
        </div>

        <div class="card" id="cardPay" hidden>
            <div class="card-title">开通权益 · ¥50</div>
            <p class="card-hint">付款成功后自动解锁并去除「演示样例」水印，无需激活码。</p>
            <button type="button" class="btn" id="btnLizhiPay">支付宝付款开通</button>
            <div class="qr-wrap" id="lizhiQrWrap" hidden></div>
            <p class="status" id="lizhiPayStatus" hidden></p>
        </div>

        <div class="card" id="cardForm">
            <span class="badge" id="lizhiUnlockBadge">未开通 · PDF 含演示水印</span>
            <div class="card-title">填写并生成</div>
            <p class="card-hint">已按账号资料预填，可修改后生成 PDF。App 内请用系统分享「存储到文件」。</p>
            <label class="field-label" for="lzName">姓名</label>
            <input class="field" id="lzName" maxlength="64" autocomplete="name">
            <label class="field-label" for="lzId">身份证号</label>
            <input class="field" id="lzId" maxlength="32" autocomplete="off">
            <label class="field-label" for="lzCompany">公司全称</label>
            <input class="field" id="lzCompany" maxlength="128" autocomplete="organization">
            <label class="field-label" for="lzPosition">担任岗位</label>
            <input class="field" id="lzPosition" maxlength="64" placeholder="如：销售经理" autocomplete="organization-title">
            <label class="field-label" for="lzHire">入职日期</label>
            <input class="field" id="lzHire" maxlength="32" placeholder="2025/12/15">
            <label class="field-label" for="lzLeave">离职日期</label>
            <input class="field" id="lzLeave" maxlength="32" placeholder="2026/7/10">
            <label class="field-label" for="lzIssue">开具日期</label>
            <input class="field" id="lzIssue" maxlength="48" placeholder="2026 年 7 月 13 日">
            <button type="button" class="btn" id="btnLizhiGenerate">生成并保存 PDF</button>
            <button type="button" class="btn btn-secondary" id="btnLizhiPrefill">重新预填</button>
            <p class="status" id="lizhiGenStatus" hidden></p>
        </div>

        <div class="card pdf-save-card" id="cardPdfSave" hidden>
            <div class="card-title">PDF 已生成</div>
            <p class="pdf-save-tip" id="lizhiPdfTip">
                App 内无法直接写入「下载」目录。请点「系统分享保存」，在弹出面板里选择「存储到文件」或「保存到下载」。
            </p>
            <div class="pdf-frame-wrap">
                <iframe id="lizhiPdfFrame" title="离职证明预览"></iframe>
            </div>
            <button type="button" class="btn" id="btnLizhiShare">系统分享保存</button>
            <button type="button" class="btn btn-secondary" id="btnLizhiOpenPdf">打开预览</button>
            <button type="button" class="btn btn-secondary" id="btnLizhiDesktopDl">浏览器下载（电脑端）</button>
            <p class="status" id="lizhiSaveStatus" hidden></p>
        </div>
    </div>

    <script>
(function () {
    function token() {
        try { return String(localStorage.getItem('token') || '').trim(); } catch (e) { return ''; }
    }
    function authFetch(url, opts) {
        opts = opts || {};
        var headers = Object.assign({ Accept: 'application/json' }, opts.headers || {});
        var t = token();
        if (t) headers.Authorization = 'Bearer ' + t;
        return fetch(url, Object.assign({}, opts, { headers: headers }));
    }
    function setStatus(el, text, isErr) {
        if (!el) return;
        if (!text) {
            el.hidden = true;
            el.textContent = '';
            return;
        }
        el.hidden = false;
        el.textContent = text;
        el.classList.toggle('is-err', !!isErr);
    }
    var lastPdfBlob = null;
    var lastPdfName = '离职证明.pdf';
    var lastPdfUrl = '';
    var cardPay = document.getElementById('cardPay');
    var cardForm = document.getElementById('cardForm');
    var cardPdfSave = document.getElementById('cardPdfSave');
    var payStatus = document.getElementById('lizhiPayStatus');
    var genStatus = document.getElementById('lizhiGenStatus');
    var saveStatus = document.getElementById('lizhiSaveStatus');
    var pdfFrame = document.getElementById('lizhiPdfFrame');
    var qrWrap = document.getElementById('lizhiQrWrap');
    var pollTimer = null;
    var pendingOtn = '';
    var feeAmount = '50.00';

    function base64ToPdfBlob(b64) {
        var bin = atob(b64);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: 'application/pdf' });
    }

    function revokeLastPdfUrl() {
        if (lastPdfUrl) {
            try { URL.revokeObjectURL(lastPdfUrl); } catch (e0) {}
            lastPdfUrl = '';
        }
    }

    function isLikelyMobileAppShell() {
        try {
            if (typeof window.isCordovaTaxAppShell === 'function' && window.isCordovaTaxAppShell()) {
                return true;
            }
        } catch (e1) {}
        try {
            if (window.navigator.standalone === true) return true;
        } catch (e2) {}
        try {
            if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
                return true;
            }
        } catch (e3) {}
        var ua = navigator.userAgent || '';
        return /iPhone|iPad|iPod|Android/i.test(ua);
    }

    function canSharePdfFile(file) {
        try {
            if (!navigator.share || typeof navigator.share !== 'function') return false;
            if (typeof File === 'undefined') return false;
            if (navigator.canShare && !navigator.canShare({ files: [file] })) return false;
            return true;
        } catch (e) {
            return false;
        }
    }

    function sharePdfBlob(blob, filename) {
        if (!blob) return Promise.reject(new Error('no_blob'));
        var file = new File([blob], filename || '离职证明.pdf', { type: 'application/pdf' });
        if (!canSharePdfFile(file)) {
            return Promise.reject(new Error('share_unsupported'));
        }
        return navigator.share({
            files: [file],
            title: filename || '离职证明'
        });
    }

    function triggerAnchorDownload(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename || '离职证明.pdf';
        a.rel = 'noopener';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
            try { URL.revokeObjectURL(url); } catch (e0) {}
            if (a.parentNode) a.parentNode.removeChild(a);
        }, 2000);
    }

    function showPdfSavePanel(blob, filename) {
        lastPdfBlob = blob;
        lastPdfName = filename || '离职证明.pdf';
        revokeLastPdfUrl();
        lastPdfUrl = URL.createObjectURL(blob);
        if (pdfFrame) pdfFrame.src = lastPdfUrl;
        if (cardPdfSave) {
            cardPdfSave.hidden = false;
            try {
                cardPdfSave.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch (eScroll) {}
        }
        setStatus(saveStatus, '');
    }

    function deliverPdf(b64, filename) {
        var name = filename || '离职证明.pdf';
        var blob = base64ToPdfBlob(b64);
        showPdfSavePanel(blob, name);

        if (!isLikelyMobileAppShell()) {
            triggerAnchorDownload(blob, name);
            setStatus(genStatus, '已开始下载；也可在下方预览或再次下载');
            return Promise.resolve('desktop_download');
        }

        return sharePdfBlob(blob, name)
            .then(function () {
                setStatus(genStatus, '已调起系统分享，请选择「存储到文件」或「保存到下载」');
                setStatus(saveStatus, '分享面板已打开');
                return 'shared';
            })
            .catch(function (err) {
                var errName = err && err.name ? String(err.name) : '';
                var msg = err && err.message ? String(err.message) : '';
                if (errName === 'AbortError') {
                    setStatus(genStatus, '已取消分享。可再点下方「系统分享保存」');
                    return 'aborted';
                }
                setStatus(genStatus, '请点下方「系统分享保存」，在面板中选择「存储到文件」');
                setStatus(
                    saveStatus,
                    msg === 'share_unsupported'
                        ? '当前环境不支持直接分享文件，请用「打开预览」后从系统菜单保存'
                        : '自动分享未成功，请手动点「系统分享保存」',
                    true
                );
                return 'fallback';
            });
    }

    try {
        var ref = document.referrer || '';
        var back = document.getElementById('lizhiBack');
        if (back) {
            var fromQ = '';
            try {
                fromQ = String(new URLSearchParams(location.search || '').get('from') || '').toLowerCase();
            } catch (eFrom) {}
            if (fromQ === 'consult' || /consult\.html/i.test(ref)) {
                back.setAttribute('href', 'consult.html?tab=products');
            } else if (fromQ === 'purchase' || /purchase\.html/i.test(ref)) {
                back.setAttribute('href', 'purchase.html?from=mine');
            } else if (/mine\.html/i.test(ref)) {
                back.setAttribute('href', 'mine.html');
            } else {
                // 已激活用户常从「我要咨询」进入；默认回咨询页税务记录
                back.setAttribute('href', 'consult.html?tab=products');
            }
        }
    } catch (e0) {}

    if (!token()) {
        window.location.replace(
            typeof window.buildLoginPageUrl === 'function'
                ? window.buildLoginPageUrl('lizhi_cert.html')
                : 'login.html?redirect=' + encodeURIComponent('lizhi_cert.html')
        );
        return;
    }

    document.getElementById('btnLizhiShare').addEventListener('click', function () {
        if (!lastPdfBlob) {
            setStatus(saveStatus, '请先生成 PDF', true);
            return;
        }
        setStatus(saveStatus, '正在调起系统分享…');
        sharePdfBlob(lastPdfBlob, lastPdfName)
            .then(function () {
                setStatus(saveStatus, '请在分享面板选择「存储到文件」');
            })
            .catch(function (err) {
                if (err && err.name === 'AbortError') {
                    setStatus(saveStatus, '已取消');
                    return;
                }
                setStatus(saveStatus, '分享不可用，请点「打开预览」后用系统菜单保存', true);
            });
    });

    document.getElementById('btnLizhiOpenPdf').addEventListener('click', function () {
        if (!lastPdfUrl) {
            setStatus(saveStatus, '请先生成 PDF', true);
            return;
        }
        var opened = null;
        try {
            opened = window.open(lastPdfUrl, '_blank');
        } catch (eOpen) {}
        if (!opened) {
            setStatus(saveStatus, '已在上方预览；可用系统分享保存', true);
            if (pdfFrame) {
                try { pdfFrame.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e2) {}
            }
            return;
        }
        setStatus(saveStatus, '已打开预览，可用系统分享/存储菜单保存');
    });

    document.getElementById('btnLizhiDesktopDl').addEventListener('click', function () {
        if (!lastPdfBlob) {
            setStatus(saveStatus, '请先生成 PDF', true);
            return;
        }
        triggerAnchorDownload(lastPdfBlob, lastPdfName);
        setStatus(saveStatus, '若未开始下载，请改用「系统分享保存」');
    });

    function applyUnlocked(unlocked) {
        cardPay.hidden = !!unlocked;
        cardForm.hidden = false;
        var badge = document.getElementById('lizhiUnlockBadge');
        if (badge) {
            badge.textContent = unlocked
                ? '已开通 · 生成无演示水印版本'
                : '未开通 · PDF 含演示水印';
        }
        if (unlocked && pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
        }
    }

    function fillForm(d) {
        if (!d) return;
        if (d.name != null) document.getElementById('lzName').value = d.name;
        if (d.id_number != null) document.getElementById('lzId').value = d.id_number;
        if (d.company_name != null) document.getElementById('lzCompany').value = d.company_name;
        if (d.position != null) document.getElementById('lzPosition').value = d.position;
        if (d.hire_date != null) document.getElementById('lzHire').value = d.hire_date;
        if (d.leave_date != null) document.getElementById('lzLeave').value = d.leave_date;
        if (d.issue_date != null) document.getElementById('lzIssue').value = d.issue_date;
        if (d.note) document.getElementById('lizhiNote').textContent = d.note;
    }

    function defaultIssueDate() {
        var n = new Date();
        return n.getFullYear() + ' 年 ' + (n.getMonth() + 1) + ' 月 ' + n.getDate() + ' 日';
    }

    function loadStatus() {
        return authFetch('/api/lizhi-cert/status')
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (!j || j.code !== 200 || !j.data) throw new Error((j && j.msg) || '读取失败');
                feeAmount = j.data.fee_amount || feeAmount;
                if (j.data.note) document.getElementById('lizhiNote').textContent = j.data.note;
                applyUnlocked(!!j.data.unlocked);
                document.getElementById('btnLizhiPay').textContent =
                    '支付宝付款开通 ¥' + feeAmount;
                return loadPrefill();
            })
            .catch(function (e) {
                setStatus(payStatus, (e && e.message) || '读取权益失败', true);
            });
    }

    function loadPrefill() {
        return authFetch('/api/lizhi-cert/prefill')
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j && j.code === 200 && j.data) {
                    fillForm(j.data);
                    if (!document.getElementById('lzIssue').value) {
                        document.getElementById('lzIssue').value = defaultIssueDate();
                    }
                }
            })
            .catch(function () {});
    }

    function startPay() {
        setStatus(payStatus, '正在创建订单…');
        qrWrap.hidden = false;
        qrWrap.innerHTML = '<p style="color:#888;font-size:13px;">生成付款码…</p>';
        authFetch('/api/payments/alipay/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product: 'lizhi_cert', sku_id: 'sku_lizhi_cert_50' })
        })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (!j || j.code !== 200 || !j.data) {
                    var failMsg = (j && j.msg) || '创建订单失败';
                    setStatus(payStatus, failMsg, true);
                    qrWrap.innerHTML = '';
                    if (typeof showPaymentCreateFailDialog === 'function') {
                        showPaymentCreateFailDialog({ message: failMsg, source: 'lizhi_cert' });
                    }
                    return;
                }
                var qr = j.data.qr_code || j.data.payment_url || '';
                pendingOtn = j.data.order && j.data.order.out_trade_no ? String(j.data.order.out_trade_no) : '';
                if (typeof QRCode !== 'undefined' && QRCode.toDataURL && qr) {
                    QRCode.toDataURL(qr, { width: 180, margin: 2, errorCorrectionLevel: 'M' }, function (err, dataUrl) {
                        if (err || !dataUrl) {
                            qrWrap.innerHTML = '<p style="font-size:12px;word-break:break-all;">请在支付宝打开：<br>' + qr + '</p>';
                            return;
                        }
                        qrWrap.innerHTML = '<img src="' + dataUrl + '" alt="付款码">';
                    });
                } else if (qr) {
                    qrWrap.innerHTML = '<p style="font-size:12px;word-break:break-all;">请复制到支付宝打开：<br>' + qr + '</p>';
                }
                setStatus(payStatus, '请使用支付宝扫码支付 ¥' + feeAmount);
                if (pollTimer) clearInterval(pollTimer);
                pollTimer = setInterval(pollPay, 2500);
            })
            .catch(function () {
                setStatus(payStatus, '网络错误', true);
                if (typeof showPaymentCreateFailDialog === 'function') {
                    showPaymentCreateFailDialog({
                        message: '创建支付订单失败，网络异常',
                        source: 'lizhi_cert'
                    });
                }
            });
    }

    function pollPay() {
        authFetch('/api/payments/alipay/latest')
            .then(function (r) { return r.json(); })
            .then(function (j) {
                var ord = j && j.code === 200 && j.data ? j.data.order : null;
                if (!ord) return;
                var st = String(ord.status || '');
                var sku = String(ord.sku_id || '');
                var otn = String(ord.out_trade_no || '');
                if (
                    st === 'paid' &&
                    (sku === 'sku_lizhi_cert_50' || !pendingOtn || otn === pendingOtn)
                ) {
                    setStatus(payStatus, '支付成功，正在解锁…');
                    if (pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                    loadStatus();
                }
            })
            .catch(function () {});
    }

    function generate() {
        var payload = {
            name: document.getElementById('lzName').value.trim(),
            id_number: document.getElementById('lzId').value.trim(),
            company_name: document.getElementById('lzCompany').value.trim(),
            position: document.getElementById('lzPosition').value.trim(),
            hire_date: document.getElementById('lzHire').value.trim(),
            leave_date: document.getElementById('lzLeave').value.trim(),
            issue_date: document.getElementById('lzIssue').value.trim() || defaultIssueDate()
        };
        if (!payload.name || !payload.id_number) {
            setStatus(genStatus, '请填写姓名与身份证号', true);
            return;
        }
        if (!payload.company_name) {
            setStatus(genStatus, '请填写公司全称', true);
            return;
        }
        if (!payload.position) {
            setStatus(genStatus, '请填写担任岗位', true);
            return;
        }
        var btn = document.getElementById('btnLizhiGenerate');
        btn.disabled = true;
        setStatus(genStatus, '正在生成 PDF…');
        authFetch('/api/lizhi-cert/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                var j = res.j;
                if (!j || j.code !== 200 || !j.data || !j.data.pdf_base64) {
                    setStatus(genStatus, (j && j.msg) || '生成失败', true);
                    return;
                }
                setStatus(
                    genStatus,
                    j.data.demo
                        ? '演示水印版生成成功，正在调起保存…'
                        : '无演示水印版生成成功，正在调起保存…'
                );
                return deliverPdf(j.data.pdf_base64, j.data.filename || '离职证明.pdf');
            })
            .catch(function () {
                setStatus(genStatus, '网络错误', true);
            })
            .finally(function () {
                btn.disabled = false;
            });
    }

    document.getElementById('btnLizhiPay').addEventListener('click', startPay);
    document.getElementById('btnLizhiGenerate').addEventListener('click', generate);
    document.getElementById('btnLizhiPrefill').addEventListener('click', function () {
        loadPrefill().then(function () {
            setStatus(genStatus, '已重新预填');
        });
    });
    document.getElementById('lzIssue').value = defaultIssueDate();
    loadStatus();
    window.addEventListener('pagehide', revokeLastPdfUrl);
})();
    </script>
</body>
</html>
