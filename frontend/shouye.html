    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif;

            min-height: 100vh;
        }
        
        .shouye-page {
            min-height: 100vh;
            background: #f6f7fb;
        }
        
        /* 为固定搜索条留白；顶栏区用蓝色铺满，避免 padding 露出 #f6f7fb 白条 */
        body.page-shouye .shouye-header {
            margin-top: calc(-1 * var(--shouye-fixed-top-h, 52px));
            padding-top: var(--shouye-fixed-top-h, 52px);
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
        }
        
        /* 搜索框容器：横幅在搜索条下方（非叠层），顶栏须始终铺蓝，避免首屏透明露灰底 */
        .search-bar-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 12px 4px 14px;
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
            box-shadow: none;
        }

        /* iPhone 16 Pro：状态栏安全区与顶栏同色（auth.js 亦注入，此处兜底） */
        html.app-ios-iphone16pro.app-top-safe-shell body.page-shouye .search-bar-wrapper {
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
        }

        /* iPhone 15/16 Pro Max：状态栏区与搜索顶栏同蓝 */
        html.app-ios-iphone15promax.app-top-safe-shell body.page-shouye::before,
        html.app-ios-iphone16promax.app-top-safe-shell body.page-shouye::before {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: var(--app-shell-statusbar-top, env(safe-area-inset-top, 48px));
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
            z-index: 998;
            pointer-events: none;
        }

        html.app-ios-iphone15promax.app-top-safe-shell body.page-shouye .search-bar-wrapper,
        html.app-ios-iphone16promax.app-top-safe-shell body.page-shouye .search-bar-wrapper {
            padding-top: calc(6px + var(--app-shell-statusbar-top, env(safe-area-inset-top, 48px)));
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
            box-shadow: none;
        }

        /* 荣耀等 Android 顶栏安全区（auth.js 亦注入，此处兜底） */
        html.app-android-honor-magic.app-top-safe-shell body.page-shouye .search-bar-wrapper,
        html.app-android-honor-pgt-an20.app-top-safe-shell body.page-shouye .search-bar-wrapper,
        html.app-android-honor-ptp-an00.app-top-safe-shell body.page-shouye .search-bar-wrapper {
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
        }

        /* 华为 Pura 70 Cordova：壳已留状态栏，搜索条贴顶；内容区顶距由 JS 同步 */
        html.app-cordova-huawei-pura70.app-top-safe-shell body.page-shouye .search-bar-wrapper {
            padding-top: 6px;
            padding-bottom: 6px;
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
            box-shadow: none;
        }

        html.app-huawei-pura70.app-top-safe-shell:not(.app-cordova-huawei-pura70) body.page-shouye .search-bar-wrapper {
            padding-top: calc(6px + var(--app-shell-statusbar-top, 32px));
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
            box-shadow: none;
        }

        /* Android 壳/客户端：首屏顶距与实测搜索条高度对齐（约 78px），避免 JS 未跑完前错位 */
        html.app-top-safe-shell.app-android-client {
            --shouye-fixed-top-h: 78px;
        }

        /* 内容区顶距由 JS 写入 --shouye-fixed-top-h，与固定搜索条等高 */
        html.app-top-safe-shell body.page-shouye .shouye-page,
        body.page-shouye .shouye-page {
            padding-top: var(--shouye-fixed-top-h, 52px);

            height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .scan-btn svg {

            height: 26px;
        }
        
        .shouye-header img {

            display: block;
        }
        
        .shouye-content {
            background: #f6f7fb;
            position: relative;
            z-index: 5;
            min-height: calc(100vh - 120px);
            padding-bottom: var(--bottom-nav-clearance);
        }
        
        /* 通知条独立占位 + 下边距；横幅图裁掉顶部蓝条，避免与通知条叠层重合 */
        .shouye-banner-wrap {
            position: relative;
            margin-top: 0;
        }

        .shouye-banner-wrap .notice-bar {
            position: relative;
            margin: 2px 12px 14px;
            background: linear-gradient(135deg, #fff9e6 0%, #fff5d6 100%);
            border-radius: 10px;
            padding: 7px 12px 7px 10px;
            display: flex;
            align-items: center;
            z-index: 12;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        html.app-top-safe-shell body.page-shouye .shouye-banner-wrap .notice-bar {
            position: relative !important;
            top: auto !important;
            left: auto !important;
            right: auto !important;
            margin: 2px 12px 14px !important;
        }

        .shouye-banner-viewport {
            position: relative;
            overflow: hidden;
            line-height: 0;
            aspect-ratio: 1024 / 610;
        }

        .shouye-banner-viewport img {
            width: 100%;
            display: block;
            vertical-align: top;
            transform: translateY(var(--shouye-banner-shift, 0));
            will-change: transform;

        .notice-icon {
            width: 21px;
            height: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 8px;
        }
        
        .notice-icon svg {
            width: 16px;
            height: 16px;
        }
        
        .notice-content {
            flex: 1;
            overflow: hidden;

            height: 20px;
        }
        
        .notice-text {
            white-space: nowrap;
            font-size: 14px;
            color: #d48806;
            font-weight: 500;
            display: inline-block;
        }
        
        
        .notice-slider {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 20px;
        }

        .notice-row {
            display: flex;
            align-items: center;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: transform 0.4s ease;
        }

        .notice-row.current {
            transform: translateY(0);
        }

        .notice-row.next-below {
            transform: translateY(100%);
        }

        .notice-row.exit-up {
            transform: translateY(-100%);
        }

        .svc-cards-wrap {

            display: block;
            background: #f6f7fb;
        }
        .svc-cards-wrap > img {
            width: 100%;
            display: block;

        }
        .svc-hot {

            z-index: 4;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            touch-action: manipulation;
            background: transparent;
            top: 52%;

        .svc-hot-left { left: 0; width: 33.33%; }
        .svc-hot-mid { left: 33.33%; width: 33.33%; }
        .svc-hot-right { left: 66.66%; width: 33.34%; }

        .svc-zxk-banner-fill {

            outline: none;
            touch-action: manipulation;
            background: transparent;

        .guest-experience-bar {
            display: none;

    <div class="shouye-page">
        <div class="shouye-header">
            <div class="shouye-banner-wrap">
                <div class="notice-bar">
                    <div class="notice-icon" style="flex-shrink:0;"><img src="ld.png" style="width:21px;object-fit:contain;"></div>
                    <div class="notice-slider">
                        <div id="noticeRow0" class="notice-row current">
                            <span class="notice-text" id="noticeText0">国家税务总局令第57号：《个人所得税综合所得汇算清缴管理办法》</span>
                        </div>
                        <div id="noticeRow1" class="notice-row next-below">
                            <span class="notice-text" id="noticeText1">关于近期虚假退税宣传的温馨提示</span>
                        </div>
                    </div>
                </div>
                <script>
                (function() {
                    var row0 = document.getElementById('noticeRow0');
                    var row1 = document.getElementById('noticeRow1');
                    var text0 = document.getElementById('noticeText0');
                    var rafId = null;

                    function startScroll() {
                        row0.style.transition = 'none';
                        row1.style.transition = 'none';
                        row0.className = 'notice-row current';
                        row1.className = 'notice-row next-below';
                        text0.style.transform = 'translateX(0)';

                        requestAnimationFrame(function() {
                            // notice-slider是text0的祖父元素（text0 -> notice-row -> notice-slider）
                            var slider = text0.parentElement.parentElement;
                            slider.style.overflow = 'visible';
                            var containerLeft = slider.getBoundingClientRect().left;
                            var initialRight = text0.getBoundingClientRect().right;
                            slider.style.overflow = '';
                            // 文字右边缘到容器左边缘的距离 = 文字真实宽度
                            var total = initialRight - containerLeft;
                            var speed = 80; // px/s
                            var pos = 0;
                            var last = null;

                            function step(ts) {
                                if (!last) last = ts;
                                var delta = (ts - last) / 1000;
                                last = ts;
                                pos += speed * delta;
                                text0.style.transform = 'translateX(-' + pos + 'px)';
                                if (pos < total) {
                                    rafId = requestAnimationFrame(step);
                                } else {
                                    slideUp();
                                }
                            }
                            rafId = requestAnimationFrame(step);
                        });
                    }

                    function slideUp() {
                        // 两行同时向上滑动
                        row0.style.transition = 'transform 0.4s ease';
                        row1.style.transition = 'transform 0.4s ease';
                        row0.className = 'notice-row exit-up';
                        row1.className = 'notice-row current';
                        // 第二条静止1秒后滑回
                        setTimeout(function() {
                            slideDown();
                        }, 1000);
                    }

                    function slideDown() {
                        // 第一条从下方进入，第二条滑出上方
                        row0.style.transition = 'none';
                        row0.className = 'notice-row next-below';
                        requestAnimationFrame(function() {
                            requestAnimationFrame(function() {
                                row0.style.transition = 'transform 0.4s ease';
                                row1.style.transition = 'transform 0.4s ease';
                                row0.className = 'notice-row current';
                                row1.className = 'notice-row exit-up';
                                setTimeout(function() {
                                    // 回到第一条，暂停500ms后滚动
                                    setTimeout(startScroll, 500);
                                }, 400);
                            });
                        });
                    }

                    // 初始暂停500ms后开始滚动
                    setTimeout(startScroll, 500);
                })();
                </script>

            <h2 id="guestGateTitle">继续使用完整功能</h2>

    <script>
        // 顶栏主题色（蓝/金）与内容区顶距：横幅在搜索条下方，顶栏始终实色蓝
        var searchWrapper = document.querySelector('.search-bar-wrapper');

        function shouyeTopBarRgb() {
            var raw = getComputedStyle(document.documentElement).getPropertyValue('--shouye-top-bar-rgb').trim();
            return raw || '44, 128, 244';
        }

        function updateSearchBarTopBg() {
            if (!searchWrapper) return;
            searchWrapper.style.background = 'rgb(' + shouyeTopBarRgb() + ')';
        }

        window.addEventListener('mineUiConfig', function () {
            updateSearchBarTopBg();
            syncShouyeBannerCrop();
        });
        window.syncShouyeBannerCrop = syncShouyeBannerCrop;
        updateSearchBarTopBg();

        /** Web / Android / iOS：测量固定搜索条高度，内容区顶距与其一致，消除顶栏下灰白条 */
        /** 新横幅仅为卡片图，无需裁掉顶部蓝条 */
        var SHOUYE_BANNER_WHITE_RATIO = 0;

        function syncShouyeBannerCrop() {
            var img = document.getElementById('assetShouyeBanner');
            var viewport = document.getElementById('shouyeBannerViewport');
            if (!img || !viewport) {
                return;
            }
            function apply() {
                var fullH = img.offsetHeight || img.getBoundingClientRect().height || 0;
                if (fullH <= 0) {
                    return;
                }
                var shift = Math.round(fullH * SHOUYE_BANNER_WHITE_RATIO);
                var visibleH = Math.max(0, fullH - shift);
                img.style.transform = 'translateY(-' + shift + 'px)';
                if (shift > 0) {
                    viewport.style.height = visibleH + 'px';
                } else {
                    viewport.style.height = '';
                }
                document.documentElement.style.setProperty('--shouye-banner-shift', (-shift) + 'px');
            }
            if (img.complete) {
                apply();
            } else {
                img.addEventListener('load', apply, { once: true });
            }
            requestAnimationFrame(function () {
                apply();
                requestAnimationFrame(apply);
            });
        }

        function syncShouyeTopPadding() {
            var page = document.querySelector('.shouye-page');
            if (!searchWrapper || !page) {
                return;
            }
            var html = document.documentElement;
            function apply() {
                if (html.classList.contains('app-cordova-huawei-pura70')) {
                    var vv = window.visualViewport;
                    var topInset = vv && vv.offsetTop > 0 ? Math.ceil(vv.offsetTop) : 0;
                    searchWrapper.style.paddingTop = (6 + topInset) + 'px';
                }
                var h = Math.ceil(searchWrapper.getBoundingClientRect().height || 0);
                if (h > 0) {
                    html.style.setProperty('--shouye-fixed-top-h', h + 'px');
                    page.style.paddingTop = h + 'px';
                }
                syncShouyeBannerCrop();
                window.scrollTo(0, 0);
            }
            apply();
            requestAnimationFrame(function () {
                apply();
                requestAnimationFrame(apply);
            });
        }

        function applyCordovaHuaweiShouyeChrome() {
            if (!document.documentElement.classList.contains('app-cordova-huawei-pura70')) {
                return;
            }
            var names = ['theme-color', 'msapplication-navbutton-color'];
            for (var i = 0; i < names.length; i++) {
                var el = document.querySelector('meta[name="' + names[i] + '"]');
                if (!el) {
                    el = document.createElement('meta');
                    el.setAttribute('name', names[i]);
                    document.head.appendChild(el);
                }
                el.setAttribute('content', '#2c80f4');
            }
        }

        applyCordovaHuaweiShouyeChrome();
        syncShouyeTopPadding();
        window.addEventListener('load', syncShouyeTopPadding);
        window.addEventListener('pageshow', function (ev) {
            if (ev.persisted) {
                syncShouyeTopPadding();
            }
        });
        window.addEventListener('resize', function () {
            syncShouyeTopPadding();
            syncShouyeBannerCrop();
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncShouyeTopPadding);
        }
        
        // 更新底部导航图标状态
        function updateNavIcons() {
            var navItems = document.querySelectorAll('.bottom-nav .nav-item');
            navItems.forEach(function(item) {
                var icon = item.getAttribute('data-icon');
                var img = item.querySelector('.nav-icon img');
                if (item.classList.contains('active')) {
                    img.src = 'caidan/' + icon + '1.png';
                } else {
                    img.src = 'caidan/' + icon + '2.png';
                }
            });
            if (window.__refreshNavFromMineUi) {
                window.__refreshNavFromMineUi();
            }
        }
        
        // 初始化时更新图标
        updateNavIcons();
        
        // iOS设备检测，底部导航上移
        (function() {
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                var bottomNav = document.querySelector('.bottom-nav');
                if (bottomNav) {
                    bottomNav.classList.add('ios-device');
                }
            }
        })();

        (function initLandingGuestMode() {
            var query = null;
            try {
                query = new URLSearchParams(window.location.search);
            } catch (e0) {}
            if (!query || query.get('guest') !== '1' || query.get('landing_ab') !== 'c') {
                return;
            }
            document.body.classList.add('is-landing-guest');
            if (typeof window.setLandingAbAssignment === 'function') {
                window.setLandingAbAssignment('c', 'guest_home');
            }
            if (typeof window.markInstallGuideReferral === 'function') {
                window.markInstallGuideReferral('landing_ab_c_guest');
            }

            var mask = document.getElementById('guestGateMask');
            var desc = document.getElementById('guestGateDesc');
            var cancel = document.getElementById('guestGateCancel');
            var download = document.getElementById('guestGateDownload');
            var register = document.getElementById('guestGateRegister');
            var topDownload = document.getElementById('guestExperienceDownload');
            var startMs = Date.now();
            var leaveSent = false;

            function track(action, meta) {
                if (typeof window.trackPublicAction !== 'function') return;
                window.trackPublicAction(
                    action,
                    Object.assign(
                        { page: 'shouye_guest', landing_variant: 'c' },
                        meta || {}
                    )
                );
            }

            function sourceMeta() {
                var out = {};
                try {
                    var raw = sessionStorage.getItem('landing_bc_entry_v1');
                    var entry = raw ? JSON.parse(raw) : null;
                    if (entry) {
                        out.referrer = entry.referrer || '';
                        out.utm_source = entry.utm_source || '';
                        out.sales_ch = entry.sales_ch || '';
                    }
                } catch (e1) {}
                return out;
            }

            function openGate(source, label) {
                if (desc && label) {
                    desc.textContent = '“' + label + '”属于完整功能，安装 App 或注册账号后即可继续使用。';
                }
                if (mask) mask.classList.add('is-open');
                track('track_landing_ab_guest_gate', { source: source || 'feature' });
            }

            function closeGate() {
                if (mask) mask.classList.remove('is-open');
            }

            document.querySelectorAll('a[href]').forEach(function (link) {
                if (link.closest('#guestGateMask')) return;
                if (link.classList.contains('active') && link.getAttribute('href') === 'shouye.html') return;
                link.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    openGate(
                        link.getAttribute('href') || 'feature',
                        link.getAttribute('aria-label') || link.textContent.trim() || '此功能'
                    );
                });
            });

            if (topDownload) {
                topDownload.addEventListener('click', function () {
                    track('track_landing_ab_guest_download_entry', { source: 'guest_bar' });
                    window.location.href = 'install_guide.html?download=1#download';
                });
            }
            if (download) {
                download.addEventListener('click', function () {
                    track('track_landing_ab_guest_download_entry', { source: 'guest_gate' });
                });
            }
            if (register) {
                register.addEventListener('click', function () {
                    if (typeof window.markInstallGuideReferral === 'function') {
                        window.markInstallGuideReferral('landing_ab_c_register');
                    }
                    track('track_install_register_click', { source: 'guest_gate' });
                });
            }
            if (cancel) cancel.addEventListener('click', closeGate);
            if (mask) {
                mask.addEventListener('click', function (ev) {
                    if (ev.target === mask) closeGate();
                });
            }

            track('track_install_page_view', sourceMeta());
            track('track_landing_ab_view', sourceMeta());

            function sendLeave() {
                if (leaveSent) return;
                leaveSent = true;
                var sec = Math.max(0, Math.min(86400, Math.round((Date.now() - startMs) / 1000)));
                track('track_install_page_leave', { dwell_seconds: sec });
            }
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden') sendLeave();
            });
            window.addEventListener('pagehide', sendLeave);
            window.addEventListener('beforeunload', sendLeave);
        })();
    </script>
