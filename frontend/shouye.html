    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
        }

        body.page-shouye {
            --sy-rpx: calc(100vw / 750);
            /* 与 ahead.png 顶栏蓝一致，避免安全区垫色色差 */
            --shouye-top-bar-rgb: 71, 127, 236;
            background: #f4f6f9;
        }

        /* 固定顶栏：原版 ahead.png（搜索+扫码），安全区铺蓝 */
        .search-bar-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 0;
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
            box-shadow: none;
            display: block;
            line-height: 0;
            /* 绝对热区相对顶栏定位 */
            overflow: visible;
        }

        html.app-ios-client.app-top-safe-shell body.page-shouye::before {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: var(--app-shell-statusbar-top, env(safe-area-inset-top, 48px));
            background: rgb(var(--shouye-top-bar-rgb, 44, 128, 244));
            z-index: 998;
            pointer-events: none;
        }

        html.app-ios-client.app-top-safe-shell body.page-shouye .search-bar-wrapper,
        html.app-top-safe-shell body.page-shouye .search-bar-wrapper {
            padding-top: var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px));
        }

        html.app-android-mi-family.app-top-safe-shell body.page-shouye .search-bar-wrapper,
        html.app-android-redmi-k70.app-top-safe-shell body.page-shouye .search-bar-wrapper,
        html.app-android-xiaomi-14.app-top-safe-shell body.page-shouye .search-bar-wrapper,
        html.app-cordova-huawei-pura70.app-top-safe-shell body.page-shouye .search-bar-wrapper {
            padding-top: 0;
        }

        .sy-apk-ahead {
            display: block;
            width: 100%;
            height: auto;
            vertical-align: top;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .sy-ahead-hit {
            position: absolute;
            z-index: 2;
            display: block;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            text-decoration: none;
        }

        .search-bar-wrapper { position: fixed; }

        .sy-hit-search {
            top: calc(12 * var(--sy-rpx));
            left: 0;
            right: 40px;
            bottom: 0;
        }

        .sy-hit-scan {
            top: 13px;
            right: 10px;
            width: 30px;
            height: 30px;
        }

        .shouye-page {
            min-height: 100vh;
            background: #f4f6f9;
            padding-top: var(--shouye-fixed-top-h, 52px);
            padding-bottom: var(--bottom-nav-clearance, 70px);
        }

        html.app-top-safe-shell.app-android-client {
            --shouye-fixed-top-h: 78px;
        }

        /* 原版：整页 widthFix 切片 + 绝对热区 */
        .sy-apk-stack {
            position: relative;
            width: 100%;
            background: #f4f6f9;
            line-height: 0;
        }

        .sy-apk-slice {
            display: block;
            width: 100%;
            height: auto;
            vertical-align: top;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .sy-apk-block {
            position: relative;
            width: 100%;
            line-height: 0;
        }

        .sy-apk-hit {
            position: absolute;
            z-index: 10;
            display: block;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }

        /* a1 通知条叠字 */
        .sy-apk-a1 {
            position: relative;
            background: #2c80f4;
        }

        .sy-apk-marquee {
            position: absolute;
            top: 25px;
            left: 50px;
            width: calc(100% - 80px);
            margin-right: 30px;
            color: #b27a39;
            font-size: 16px;
            line-height: 1.2;
            overflow: hidden;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
        }

        .sy-apk-marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: sy-marquee 18s linear infinite;
        }

        @keyframes sy-marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* a32/a33 热区（相对卡片容器，rpx） */
        .sy-hit-zonghe-tab {
            top: 0;
            right: calc(23 * var(--sy-rpx));
            width: calc(250 * var(--sy-rpx));
            height: calc(70 * var(--sy-rpx));
        }

        .sy-hit-record {
            top: calc(266 * var(--sy-rpx));
            right: calc(363 * var(--sy-rpx));
            width: calc(330 * var(--sy-rpx));
            height: calc(90 * var(--sy-rpx));
        }

        /* a3：相关政策 / 我要填报（对齐原版 jumpToss / jumpTos 热区） */
        .sy-hit-policy {
            top: calc(120 * var(--sy-rpx));
            left: calc(500 * var(--sy-rpx));
            width: calc(200 * var(--sy-rpx));
            height: calc(70 * var(--sy-rpx));
        }

        .sy-hit-fill {
            top: calc(320 * var(--sy-rpx));
            left: calc(100 * var(--sy-rpx));
            width: calc(550 * var(--sy-rpx));
            height: calc(90 * var(--sy-rpx));
        }

        /* 横向 a6 */
        .sy-apk-hscroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            background: #f4f6f9;
            padding: 4px 0 8px;
        }

        .sy-apk-hscroll::-webkit-scrollbar { display: none; }

        .sy-apk-hitem {
            display: inline-block;
            width: 30%;
            margin-left: 2.5%;
            vertical-align: top;
            text-decoration: none;
        }

        .sy-apk-hitem:first-child { margin-left: 3%; }

        .sy-apk-hitem img {
            display: block;
            width: 100%;
            height: calc(300 * var(--sy-rpx));
            object-fit: cover;
            border-radius: 8px;
        }

        /* 轮播 */
        .sy-apk-swiper-wrap {
            width: 93%;
            margin: 8px auto 12px;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: #fff;
            line-height: 0;
        }

        .sy-apk-swiper-track {
            display: flex;
            transition: transform 0.35s ease;
            will-change: transform;
        }

        .sy-apk-swiper-track img {
            flex: 0 0 100%;
            width: 100%;
            height: auto;
            display: block;
            vertical-align: top;
        }

        .sy-apk-swiper-dots {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 8px;
            display: flex;
            justify-content: center;
            gap: 5px;
            pointer-events: none;
            z-index: 2;
            line-height: normal;
        }

        .sy-apk-swiper-dots i {
            width: 6px;
            height: 6px;
            border-radius: 1px;
            background: rgba(0, 0, 0, 0.2);
        }

        .sy-apk-swiper-dots i.is-on {
            width: 12px;
            background: #2c80f4;
        }

        .sy-hit-more {
            left: 0;
            right: 0;
            top: 0;
            height: calc(80 * var(--sy-rpx));
        }

        .guest-experience-bar {
            display: none;
            margin: 10px 12px 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, #eaf3ff, #f7fbff);
            border: 1px solid #cfe2ff;
            color: #174a8b;
            align-items: center;
            justify-content: space-between;

            line-height: normal;

        .guest-experience-copy span { display: block; font-size: 12px; line-height: 1.45; color: #52749f; }
        .guest-experience-actions {
            display: flex;
            flex-shrink: 0;
            gap: 8px;
            align-items: center;
        }
        .guest-experience-action {
            flex-shrink: 0;
            border: 0;
            border-radius: 10px;
            padding: 9px 12px;
            background: #1e6fff;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;

        .guest-experience-action.is-secondary {

        }
        .guest-gate-mask {
            display: none;
            position: fixed;
            inset: 0;

            align-items: center;
            justify-content: center;

        .guest-gate-mask.is-open { display: flex; }
        .guest-gate-panel {
            width: 100%;

        .guest-gate-panel p { margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: #65758b; }
        .guest-gate-actions { display: grid; gap: 10px; }
        .guest-gate-actions a,
        .guest-gate-actions button {
            display: flex;
            min-height: 44px;

        .guest-gate-download { color: #fff; background: #1e6fff; }
        .guest-gate-register { color: #1e6fff; background: #edf4ff; }
        .guest-gate-cancel { color: #7b8798; background: #f5f6f8; }
    </style>

    <script>
        (function () {
            var ASSET_V = '?v=20260802-home';
            var searchWrapper = document.getElementById('syAheadWrap') || document.querySelector('.search-bar-wrapper');
            var page = document.querySelector('.shouye-page');
            var declareImg = document.getElementById('syDeclareImg');
            var recordHit = document.getElementById('syRecordHit');

            function isLoggedIn() {
                try {
                    return !!String(localStorage.getItem('token') || '').trim();
                } catch (e) {
                    return false;
                }
            }

            function syncDeclareCard() {
                if (!declareImg) return;
                var logged = isLoggedIn();
                declareImg.src = (logged ? '/img/home/a33.png' : '/img/home/a32.png') + ASSET_V;
                declareImg.width = 1179;
                declareImg.height = logged ? 613 : 610;
                if (recordHit) {
                    /* 未登录 a32 主按钮是「进入专题页」，热区仍指向专题；已登录绿框为「查看记录」 */
                    recordHit.href = logged ? 'shenbao_jilu.html' : 'zonghe.html';
                    recordHit.setAttribute('aria-label', logged ? '查看记录' : '进入专题页');
                }
            }
            syncDeclareCard();

            function syncShouyeTopPadding() {
                if (!searchWrapper || !page) return;
                function apply() {
                    var html = document.documentElement;
                    if (html.classList.contains('app-cordova-huawei-pura70')) {
                        var vv = window.visualViewport;
                        var topInset = vv && vv.offsetTop > 0 ? Math.ceil(vv.offsetTop) : 0;
                        searchWrapper.style.paddingTop = topInset + 'px';
                    }
                    var h = Math.ceil(searchWrapper.getBoundingClientRect().height || 0);
                    if (h > 0) {
                        html.style.setProperty('--shouye-fixed-top-h', h + 'px');
                        page.style.paddingTop = h + 'px';
                    }
                }
                apply();
                requestAnimationFrame(function () {
                    apply();
                    requestAnimationFrame(apply);
                });
            }

            syncShouyeTopPadding();
            window.addEventListener('load', syncShouyeTopPadding);
            window.addEventListener('resize', syncShouyeTopPadding);
            window.addEventListener('pageshow', function (ev) {
                if (ev.persisted) syncShouyeTopPadding();
                syncDeclareCard();
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', syncShouyeTopPadding);
            }

            var scanBtn = document.getElementById('syScanBtn');
            if (scanBtn) {
                scanBtn.addEventListener('click', function () {
                    window.location.href = 'help_center.html';
                });
            }

            /* 简易轮播 */
            (function initSwiper() {
                var track = document.getElementById('sySwiperTrack');
                var dots = document.getElementById('sySwiperDots');
                if (!track || !dots) return;
                var slides = track.querySelectorAll('img');
                var n = slides.length;
                if (!n) return;
                var i = 0;
                for (var d = 0; d < n; d++) {
                    var el = document.createElement('i');
                    if (d === 0) el.className = 'is-on';
                    dots.appendChild(el);
                }
                var dotNodes = dots.querySelectorAll('i');
                function go(idx) {
                    i = (idx + n) % n;
                    track.style.transform = 'translateX(-' + i * 100 + '%)';
                    for (var k = 0; k < dotNodes.length; k++) {
                        dotNodes[k].className = k === i ? 'is-on' : '';
                    }
                }
                setInterval(function () { go(i + 1); }, 3500);
            })();

            function updateNavIcons() {
                var navItems = document.querySelectorAll('.bottom-nav .nav-item');
                navItems.forEach(function (item) {
                    var icon = item.getAttribute('data-icon');
                    var img = item.querySelector('.nav-icon img');
                    if (!img || !icon) return;
                    img.src = item.classList.contains('active')
                        ? 'caidan/' + icon + '1.png'
                        : 'caidan/' + icon + '2.png';
                });
                if (window.__refreshNavFromMineUi) window.__refreshNavFromMineUi();
            }
            updateNavIcons();

            (function () {
                var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                if (isIOS) {
                    var bottomNav = document.querySelector('.bottom-nav');
                    if (bottomNav) bottomNav.classList.add('ios-device');
                }
            })();

            (function initLandingGuestMode() {
                var query = null;
                try { query = new URLSearchParams(window.location.search); } catch (e0) {}
                if (!query) return;
                var fromShare = String(query.get('from') || '').toLowerCase() === 'share';
                var landingGuestC = query.get('guest') === '1' && query.get('landing_ab') === 'c';
                if (!landingGuestC && !fromShare) return;

                document.body.classList.add('is-landing-guest');
                if (typeof window.setLandingAbAssignment === 'function') {
                    window.setLandingAbAssignment('c', fromShare ? 'share_guest_home' : 'guest_home');
                }
                if (!fromShare && typeof window.markInstallGuideReferral === 'function') {
                    window.markInstallGuideReferral('landing_ab_c_guest');
                }

                var mask = document.getElementById('guestGateMask');
                var titleEl = document.getElementById('guestGateTitle');
                var desc = document.getElementById('guestGateDesc');
                var cancel = document.getElementById('guestGateCancel');
                var download = document.getElementById('guestGateDownload');
                var register = document.getElementById('guestGateRegister');
                var topDownload = document.getElementById('guestExperienceDownload');
                var topRegister = document.getElementById('guestExperienceRegister');
                var expTitle = document.getElementById('guestExperienceTitle');
                var expDesc = document.getElementById('guestExperienceDesc');
                var startMs = Date.now();
                var leaveSent = false;

                var registerHref = fromShare
                    ? 'register.html?from=share&landing_ab=c'
                    : 'register.html?from=install_guide&landing_ab=c';
                var downloadHref = fromShare
                    ? 'install_guide.html?download=1&from=share#download'
                    : 'install_guide.html?download=1#download';
                if (register) register.setAttribute('href', registerHref);
                if (topRegister) topRegister.setAttribute('href', registerHref);
                if (download) download.setAttribute('href', downloadHref);

                if (fromShare) {
                    if (titleEl) titleEl.textContent = '好友分享 · 免费体验';
                    if (expTitle) expTitle.textContent = '好友分享进入';
                    if (expDesc) expDesc.textContent = '可先逛演示首页，注册后保存资料并去除水印限制';
                    if (desc) {
                        desc.textContent =
                            '好友推荐你体验个税记录演示。注册账号后可保存资料、查看完整收入明细并生成完税证明。';
                    }
                }

                function track(action, meta) {
                    if (typeof window.trackPublicAction !== 'function') return;
                    window.trackPublicAction(
                        action,
                        Object.assign(
                            { page: 'shouye_guest', landing_variant: 'c', from_share: fromShare ? 1 : 0 },
                            meta || {}
                        )
                    );
                }

                function sourceMeta() {
                    var out = {};
                    try {
                        var raw = sessionStorage.getItem('landing_bc_entry_v1');
                        var entry = raw ? JSON.parse(raw) : null;
                        if (entry) {
                            out.referrer = entry.referrer || '';
                            out.utm_source = entry.utm_source || '';
                            out.sales_ch = entry.sales_ch || '';
                        }
                    } catch (e1) {}
                    return out;
                }

                function openGate(source, label) {
                    if (desc && label) {
                        desc.textContent = fromShare
                            ? '“' + label + '”需注册后使用。好友分享进入，注册即可继续体验。'
                            : '“' + label + '”属于完整功能，安装 App 或注册账号后即可继续使用。';
                    }
                    if (mask) mask.classList.add('is-open');
                    track('track_landing_ab_guest_gate', { source: source || 'feature' });
                }

                function closeGate() {
                    if (mask) mask.classList.remove('is-open');
                }

                document.querySelectorAll('a[href]').forEach(function (link) {
                    if (link.closest('#guestGateMask')) return;
                    if (link.closest('#guestExperienceBar')) return;
                    if (link.classList.contains('active') && link.getAttribute('href') === 'shouye.html') return;
                    link.addEventListener('click', function (ev) {
                        ev.preventDefault();
                        openGate(
                            link.getAttribute('href') || 'feature',
                            link.getAttribute('aria-label') || link.textContent.trim() || '此功能'
                        );
                    });
                });

                if (topDownload) {
                    topDownload.addEventListener('click', function () {
                        track('track_landing_ab_guest_download_entry', { source: 'guest_bar' });
                        if (typeof window.trackShareDownloadClick === 'function') {
                            window.trackShareDownloadClick('shouye_guest_bar');
                        }
                        window.location.href = downloadHref;
                    });
                }
                if (topRegister) {
                    topRegister.addEventListener('click', function () {
                        if (!fromShare && typeof window.markInstallGuideReferral === 'function') {
                            window.markInstallGuideReferral('landing_ab_c_register');
                        }
                        track('track_install_register_click', { source: 'guest_bar' });
                    });
                }
                if (download) {
                    download.addEventListener('click', function () {
                        track('track_landing_ab_guest_download_entry', { source: 'guest_gate' });
                        if (typeof window.trackShareDownloadClick === 'function') {
                            window.trackShareDownloadClick('shouye_guest_gate');
                        }
                    });
                }
                if (register) {
                    register.addEventListener('click', function () {
                        if (!fromShare && typeof window.markInstallGuideReferral === 'function') {
                            window.markInstallGuideReferral('landing_ab_c_register');
                        }
                        track('track_install_register_click', { source: 'guest_gate' });
                    });
                }
                if (cancel) cancel.addEventListener('click', closeGate);
                if (mask) {
                    mask.addEventListener('click', function (ev) {
                        if (ev.target === mask) closeGate();
                    });
                }

                track('track_install_page_view', sourceMeta());
                track('track_landing_ab_view', sourceMeta());

                function sendLeave() {
                    if (leaveSent) return;
                    leaveSent = true;
                    var sec = Math.max(0, Math.min(86400, Math.round((Date.now() - startMs) / 1000)));
                    track('track_install_page_leave', { dwell_seconds: sec });
                }
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'hidden') sendLeave();
                });
                window.addEventListener('pagehide', sendLeave);
                window.addEventListener('beforeunload', sendLeave);
            })();
        })();
    </script>
    <script src="/js/watermark.js?v=20260722-wm-redder"></script>
</body>
