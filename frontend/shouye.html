        body.page-shouye .shouye-header {

                <div class="notice-bar">
                    <div class="notice-icon" style="flex-shrink:0;"><img src="ld.png" style="width:21px;object-fit:contain;"></div>
                    <div class="notice-slider">
                        <div id="noticeRow0" class="notice-row current">
                            <span class="notice-text" id="noticeText0">国家税务总局令第57号：《个人所得税综合所得汇算清缴管理办法》</span>
                        </div>
                        <div id="noticeRow1" class="notice-row next-below">
                            <span class="notice-text" id="noticeText1">关于近期虚假退税宣传的温馨提示</span>
                        </div>
                    </div>
                </div>
                <script>
                (function() {
                    var row0 = document.getElementById('noticeRow0');
                    var row1 = document.getElementById('noticeRow1');
                    var text0 = document.getElementById('noticeText0');
                    var rafId = null;

                    function startScroll() {
                        row0.style.transition = 'none';
                        row1.style.transition = 'none';
                        row0.className = 'notice-row current';
                        row1.className = 'notice-row next-below';
                        text0.style.transform = 'translateX(0)';

                        requestAnimationFrame(function() {
                            // notice-slider是text0的祖父元素（text0 -> notice-row -> notice-slider）
                            var slider = text0.parentElement.parentElement;
                            slider.style.overflow = 'visible';
                            var containerLeft = slider.getBoundingClientRect().left;
                            var initialRight = text0.getBoundingClientRect().right;
                            slider.style.overflow = '';
                            // 文字右边缘到容器左边缘的距离 = 文字真实宽度
                            var total = initialRight - containerLeft;
                            var speed = 80; // px/s
                            var pos = 0;
                            var last = null;

                            function step(ts) {
                                if (!last) last = ts;
                                var delta = (ts - last) / 1000;
                                last = ts;
                                pos += speed * delta;
                                text0.style.transform = 'translateX(-' + pos + 'px)';
                                if (pos < total) {
                                    rafId = requestAnimationFrame(step);
                                } else {
                                    slideUp();
                                }
                            }
                            rafId = requestAnimationFrame(step);
                        });
                    }

                    function slideUp() {
                        // 两行同时向上滑动
                        row0.style.transition = 'transform 0.4s ease';
                        row1.style.transition = 'transform 0.4s ease';
                        row0.className = 'notice-row exit-up';
                        row1.className = 'notice-row current';
                        // 第二条静止1秒后滑回
                        setTimeout(function() {
                            slideDown();
                        }, 1000);
                    }

                    function slideDown() {
                        // 第一条从下方进入，第二条滑出上方
                        row0.style.transition = 'none';
                        row0.className = 'notice-row next-below';
                        requestAnimationFrame(function() {
                            requestAnimationFrame(function() {
                                row0.style.transition = 'transform 0.4s ease';
                                row1.style.transition = 'transform 0.4s ease';
                                row0.className = 'notice-row current';
                                row1.className = 'notice-row exit-up';
                                setTimeout(function() {
                                    // 回到第一条，暂停500ms后滚动
                                    setTimeout(startScroll, 500);
                                }, 400);
                            });
                        });
                    }

                    // 初始暂停500ms后开始滚动
                    setTimeout(startScroll, 500);
                })();
                </script>

    <script>
        // 顶栏主题色（蓝/金）与内容区顶距：横幅在搜索条下方，顶栏始终实色蓝
        var searchWrapper = document.querySelector('.search-bar-wrapper');

        function shouyeTopBarRgb() {
            var raw = getComputedStyle(document.documentElement).getPropertyValue('--shouye-top-bar-rgb').trim();
            return raw || '44, 128, 244';
        }

        function updateSearchBarTopBg() {
            if (!searchWrapper) return;
            searchWrapper.style.background = 'rgb(' + shouyeTopBarRgb() + ')';
        }

        window.addEventListener('mineUiConfig', function () {
            updateSearchBarTopBg();
            syncShouyeBannerCrop();
        });
        window.syncShouyeBannerCrop = syncShouyeBannerCrop;
        updateSearchBarTopBg();

        /** Web / Android / iOS：测量固定搜索条高度，内容区顶距与其一致，消除顶栏下灰白条 */
        /** 新横幅仅为卡片图，无需裁掉顶部蓝条 */
        var SHOUYE_BANNER_WHITE_RATIO = 0;

        function syncShouyeBannerCrop() {
            var img = document.getElementById('assetShouyeBanner');
            var viewport = document.getElementById('shouyeBannerViewport');
            if (!img || !viewport) {
                return;
            }
            function apply() {
                var fullH = img.offsetHeight || img.getBoundingClientRect().height || 0;
                if (fullH <= 0) {
                    return;
                }
                var shift = Math.round(fullH * SHOUYE_BANNER_WHITE_RATIO);
                var visibleH = Math.max(0, fullH - shift);
                img.style.transform = 'translateY(-' + shift + 'px)';
                if (shift > 0) {
                    viewport.style.height = visibleH + 'px';
                } else {
                    viewport.style.height = '';
                }
                document.documentElement.style.setProperty('--shouye-banner-shift', (-shift) + 'px');
            }
            if (img.complete) {
                apply();
            } else {
                img.addEventListener('load', apply, { once: true });
            }
            requestAnimationFrame(function () {
                apply();
                requestAnimationFrame(apply);
            });
        }

        function syncShouyeTopPadding() {
            var page = document.querySelector('.shouye-page');
            if (!searchWrapper || !page) {
                return;
            }
            var html = document.documentElement;
            function apply() {
                if (html.classList.contains('app-cordova-huawei-pura70')) {
                    var vv = window.visualViewport;
                    var topInset = vv && vv.offsetTop > 0 ? Math.ceil(vv.offsetTop) : 0;
                    searchWrapper.style.paddingTop = (6 + topInset) + 'px';
                }
                var h = Math.ceil(searchWrapper.getBoundingClientRect().height || 0);
                if (h > 0) {
                    html.style.setProperty('--shouye-fixed-top-h', h + 'px');
                    page.style.paddingTop = h + 'px';
                }
                syncShouyeBannerCrop();
                window.scrollTo(0, 0);
            }
            apply();
            requestAnimationFrame(function () {
                apply();
                requestAnimationFrame(apply);
            });
        }

        function applyCordovaHuaweiShouyeChrome() {
            if (!document.documentElement.classList.contains('app-cordova-huawei-pura70')) {
                return;
            }
            var names = ['theme-color', 'msapplication-navbutton-color'];
            for (var i = 0; i < names.length; i++) {
                var el = document.querySelector('meta[name="' + names[i] + '"]');
                if (!el) {
                    el = document.createElement('meta');
                    el.setAttribute('name', names[i]);
                    document.head.appendChild(el);
                }
                el.setAttribute('content', '#2c80f4');
            }
        }

        applyCordovaHuaweiShouyeChrome();
        syncShouyeTopPadding();
        window.addEventListener('load', syncShouyeTopPadding);
        window.addEventListener('pageshow', function (ev) {
            if (ev.persisted) {
                syncShouyeTopPadding();
            }
        });
        window.addEventListener('resize', function () {
            syncShouyeTopPadding();
            syncShouyeBannerCrop();
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncShouyeTopPadding);
        }
        
        // 更新底部导航图标状态
        function updateNavIcons() {
            var navItems = document.querySelectorAll('.bottom-nav .nav-item');
            navItems.forEach(function(item) {
                var icon = item.getAttribute('data-icon');
                var img = item.querySelector('.nav-icon img');
                if (item.classList.contains('active')) {
                    img.src = 'caidan/' + icon + '1.png';
                } else {
                    img.src = 'caidan/' + icon + '2.png';
                }
            });
            if (window.__refreshNavFromMineUi) {
                window.__refreshNavFromMineUi();
            }
        }
        
        // 初始化时更新图标
        updateNavIcons();
        
        // iOS设备检测，底部导航上移
        (function() {
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                var bottomNav = document.querySelector('.bottom-nav');
                if (bottomNav) {
                    bottomNav.classList.add('ios-device');
                }
            }
        })();
    </script>
