    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
        }

        body.page-shouye {
            --sy-rpx: calc(100vw / 750);
            /* 官方 zdj-home 头图 pending-tasks-bg 顶缘 #4f90f3；垫色/theme-color/StatusBar 同色 */
            --shouye-top-bar-rgb: 79, 144, 243;
            --shouye-header-bg: url('/img/home/apk-home-header-bg.png');
            background: #f4f6f9;
        }

        /* 固定顶栏：官方头图铺底（含柔光）+ ahead 搜索条，安全区同色无缝 */
        .search-bar-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 0;
            background-color: rgb(var(--shouye-top-bar-rgb, 79, 144, 243));
            background-image: var(--shouye-header-bg);
            background-size: 100% auto;
            background-position: top center;
            background-repeat: no-repeat;
            box-shadow: none !important;
            border: 0 !important;
            outline: none;
            display: block;
            line-height: 0;
            /* 裁掉顶缘亚像素白缝；热区仍可用 absolute */
            overflow: hidden;
        }

        html.app-ios-client.app-top-safe-shell body.page-shouye::before {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: var(--app-shell-statusbar-top, env(safe-area-inset-top, 48px));
            background-color: rgb(var(--shouye-top-bar-rgb, 79, 144, 243));
            background-image: var(--shouye-header-bg);
            background-size: 100% auto;
            background-position: top center;
            background-repeat: no-repeat;
            z-index: 998;
            pointer-events: none;
        }

        html.app-ios-client.app-top-safe-shell body.page-shouye .search-bar-wrapper,
        html.app-top-safe-shell body.page-shouye .search-bar-wrapper {
            padding-top: var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px));

         * 华为 Pura70 Cordova 壳已避开状态栏，仍走贴顶。
         */

            --shouye-status-inset: 40px;
        }

        html.app-android-client.app-top-safe-shell:not(.app-cordova-huawei-pura70) body.page-shouye::before {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: var(--shouye-status-inset, 40px);
            background-color: rgb(var(--shouye-top-bar-rgb, 79, 144, 243));
            background-image: var(--shouye-header-bg);
            background-size: 100% auto;
            background-position: top center;
            background-repeat: no-repeat;
            z-index: 998;
            pointer-events: none;

            background-color: rgb(var(--shouye-top-bar-rgb, 79, 144, 243)) !important;
            background-image: var(--shouye-header-bg) !important;
            background-size: 100% auto !important;
            background-position: top center !important;

        html.app-android-vivo-s15.app-top-safe-shell body.page-shouye {

                        'api/user?action=special_deduction_records&year=' +
                        encodeURIComponent(deductionYear());
                    var fetchFn =
                        typeof window.authFetch === 'function'
                            ? window.authFetch
                            : fetch;
                    fetchFn(url, { credentials: 'same-origin' })
                        .then(function (r) {
                            return (window.authParseJson||function(r){return r.json();})(r);
                        })
                        .then(function (body) {
                            var records =
                                body &&
                                body.code === 200 &&
                                body.data &&
                                Array.isArray(body.data.records)
                                    ? body.data.records
                                    : [];
                            var n = 0;
                            for (var i = 0; i < records.length; i++) {
                                var row = records[i];
                                if (!row) continue;
                                if (Number(row.is_voided) === 1) continue;
                                n += 1;
                            }
                            renderCount(n);
                        })
                        .catch(function () {
                            if (lastCount == null) renderCount(0);
                        })
                        .then(function () {
                            loading = false;
                        });
                }

                renderCount(0);
                fetchCount();
                window.addEventListener('pageshow', fetchCount);
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'visible') fetchCount();
                });
            })();

            function syncShouyeTopPadding() {
                if (!searchWrapper || !page) return;
                function apply() {
                    var html = document.documentElement;
                    if (html.classList.contains('app-cordova-huawei-pura70')) {
                        var vv = window.visualViewport;
                        var topInset = vv && vv.offsetTop > 0 ? Math.ceil(vv.offsetTop) : 0;
                        searchWrapper.style.paddingTop = topInset + 'px';
                    }
                    var h = Math.ceil(searchWrapper.getBoundingClientRect().height || 0);
                    if (h > 0) {
                        /* 内容区与顶栏重叠 1px，避免 ceil/亚像素露出灰白底 */
                        var pad = Math.max(0, h - 1);
                        html.style.setProperty('--shouye-fixed-top-h', pad + 'px');
                        page.style.paddingTop = pad + 'px';
                    }
                }
                apply();
                requestAnimationFrame(function () {
                    apply();
                    requestAnimationFrame(apply);
                });
            }

            syncShouyeTopPadding();
            window.addEventListener('load', syncShouyeTopPadding);
            window.addEventListener('resize', syncShouyeTopPadding);
            window.addEventListener('pageshow', function (ev) {
                if (ev.persisted) syncShouyeTopPadding();
                syncDeclareCard();
                syncHomeKeyServices();
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', syncShouyeTopPadding);
            }

            var scanBtn = document.getElementById('syScanBtn');
            if (scanBtn) {
                scanBtn.addEventListener('click', function () {
                    window.location.href = 'scan.html';
                });
            }

            /* 简易轮播：Android 延后启动，减轻首屏主线程压力 */
            (function initSwiper() {
                var track = document.getElementById('sySwiperTrack');
                var dots = document.getElementById('sySwiperDots');
                if (!track || !dots) return;
                var slides = track.querySelectorAll('img');
                var n = slides.length;
                if (!n) return;
                var i = 0;
                for (var d = 0; d < n; d++) {
                    var el = document.createElement('i');
                    if (d === 0) el.className = 'is-on';
                    dots.appendChild(el);
                }
                var dotNodes = dots.querySelectorAll('i');
                function go(idx) {
                    i = (idx + n) % n;
                    track.style.transform = 'translateX(-' + i * 100 + '%)';
                    for (var k = 0; k < dotNodes.length; k++) {
                        dotNodes[k].className = k === i ? 'is-on' : '';
                    }
                }
                var androidLike = false;
                try {
                    androidLike = /Android|HarmonyOS|OpenHarmony|ArkWeb|HMSCore|HUAWEI|Huawei/i.test(
                        String(navigator.userAgent || '')
                    ) || document.documentElement.classList.contains('app-android-client');
                } catch (eUa) {}
                function startAuto() {
                    setInterval(function () { go(i + 1); }, androidLike ? 4500 : 3500);
                }
                if (androidLike) {
                    if (typeof requestIdleCallback === 'function') {
                        requestIdleCallback(startAuto, { timeout: 6000 });
                    } else {
                        setTimeout(startAuto, 3500);
                    }
                } else {
                    startAuto();
                }
            })();

            function updateNavIcons() {
                var navItems = document.querySelectorAll('.bottom-nav .nav-item');
                navItems.forEach(function (item) {
                    var icon = item.getAttribute('data-icon');
                    var img = item.querySelector('.nav-icon img');
                    if (!img || !icon) return;
                    img.src = item.classList.contains('active')
                        ? 'caidan/' + icon + '1.png'
                        : 'caidan/' + icon + '2.png';
                });
                if (window.__refreshNavFromMineUi) window.__refreshNavFromMineUi();
            }
            updateNavIcons();

            (function () {
                var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                if (isIOS) {
                    var bottomNav = document.querySelector('.bottom-nav');
                    if (bottomNav) bottomNav.classList.add('ios-device');
                }
            })();

            (function initLandingGuestMode() {
                var query = null;
                try { query = new URLSearchParams(window.location.search); } catch (e0) {}
                if (!query) return;
                var fromShare = String(query.get('from') || '').toLowerCase() === 'share';
                var landingGuestC = query.get('guest') === '1' && query.get('landing_ab') === 'c';
                if (!landingGuestC && !fromShare) return;

                document.body.classList.add('is-landing-guest');
                if (typeof window.setLandingAbAssignment === 'function') {
                    window.setLandingAbAssignment('c', fromShare ? 'share_guest_home' : 'guest_home');
                }
                if (!fromShare && typeof window.markInstallGuideReferral === 'function') {
                    window.markInstallGuideReferral('landing_ab_c_guest');
                }

                var mask = document.getElementById('guestGateMask');
                var titleEl = document.getElementById('guestGateTitle');
                var desc = document.getElementById('guestGateDesc');
                var cancel = document.getElementById('guestGateCancel');
                var download = document.getElementById('guestGateDownload');
                var register = document.getElementById('guestGateRegister');
                var topDownload = document.getElementById('guestExperienceDownload');
                var topRegister = document.getElementById('guestExperienceRegister');
                var expTitle = document.getElementById('guestExperienceTitle');
                var expDesc = document.getElementById('guestExperienceDesc');
                var startMs = Date.now();
                var leaveSent = false;

                var registerHref = fromShare
                    ? 'register.html?from=share&landing_ab=c'
                    : 'register.html?from=install_guide&landing_ab=c';
                var downloadHref = fromShare
                    ? 'install_guide.html?download=1&from=share#download'
                    : 'install_guide.html?download=1#download';
                if (register) register.setAttribute('href', registerHref);
                if (topRegister) topRegister.setAttribute('href', registerHref);
                if (download) download.setAttribute('href', downloadHref);

                if (fromShare) {
                    if (titleEl) titleEl.textContent = '好友分享 · 免费体验';
                    if (expTitle) expTitle.textContent = '好友分享进入';
                    if (expDesc) expDesc.textContent = '可先逛演示首页，注册后保存资料并去除水印限制';
                    if (desc) {
                        desc.textContent =
                            '好友推荐你体验个税记录演示。注册账号后可保存资料、查看完整收入明细并生成完税证明。';
                    }
                }

                function track(action, meta) {
                    if (typeof window.trackPublicAction !== 'function') return;
                    window.trackPublicAction(
                        action,
                        Object.assign(
                            { page: 'shouye_guest', landing_variant: 'c', from_share: fromShare ? 1 : 0 },
                            meta || {}
                        )
                    );
                }

                function sourceMeta() {
                    var out = {};
                    try {
                        var raw = sessionStorage.getItem('landing_bc_entry_v1');
                        var entry = raw ? JSON.parse(raw) : null;
                        if (entry) {
                            out.referrer = entry.referrer || '';
                            out.utm_source = entry.utm_source || '';
                            out.sales_ch = entry.sales_ch || '';
                        }
                    } catch (e1) {}
                    return out;
                }

                function openGate(source, label) {
                    if (desc && label) {
                        desc.textContent = fromShare
                            ? '“' + label + '”需注册后使用。好友分享进入，注册即可继续体验。'
                            : '“' + label + '”属于完整功能，安装 App 或注册账号后即可继续使用。';
                    }
                    if (mask) mask.classList.add('is-open');
                    track('track_landing_ab_guest_gate', { source: source || 'feature' });
                }

                function closeGate() {
                    if (mask) mask.classList.remove('is-open');
                }

                document.querySelectorAll('a[href]').forEach(function (link) {
                    if (link.closest('#guestGateMask')) return;
                    if (link.closest('#guestExperienceBar')) return;
                    if (link.classList.contains('active') && link.getAttribute('href') === 'shouye.html') return;
                    link.addEventListener('click', function (ev) {
                        ev.preventDefault();
                        openGate(
                            link.getAttribute('href') || 'feature',
                            link.getAttribute('aria-label') || link.textContent.trim() || '此功能'
                        );
                    });
                });

                if (topDownload) {
                    topDownload.addEventListener('click', function () {
                        track('track_landing_ab_guest_download_entry', { source: 'guest_bar' });
                        if (typeof window.trackShareDownloadClick === 'function') {
                            window.trackShareDownloadClick('shouye_guest_bar');
                        }
                        window.location.href = downloadHref;
                    });
                }
                if (topRegister) {
                    topRegister.addEventListener('click', function () {
                        if (!fromShare && typeof window.markInstallGuideReferral === 'function') {
                            window.markInstallGuideReferral('landing_ab_c_register');
                        }
                        track('track_install_register_click', { source: 'guest_bar' });
                    });
                }
                if (download) {
                    download.addEventListener('click', function () {
                        track('track_landing_ab_guest_download_entry', { source: 'guest_gate' });
                        if (typeof window.trackShareDownloadClick === 'function') {
                            window.trackShareDownloadClick('shouye_guest_gate');
                        }
                    });
                }
                if (register) {
                    register.addEventListener('click', function () {
                        if (!fromShare && typeof window.markInstallGuideReferral === 'function') {
                            window.markInstallGuideReferral('landing_ab_c_register');
                        }
                        track('track_install_register_click', { source: 'guest_gate' });
                    });
                }
                if (cancel) cancel.addEventListener('click', closeGate);
                if (mask) {
                    mask.addEventListener('click', function (ev) {
                        if (ev.target === mask) closeGate();
                    });
                }

                track('track_install_page_view', sourceMeta());
                track('track_landing_ab_view', sourceMeta());

                function sendLeave() {
                    if (leaveSent) return;
                    leaveSent = true;
                    var sec = Math.max(0, Math.min(86400, Math.round((Date.now() - startMs) / 1000)));
                    track('track_install_page_leave', { dwell_seconds: sec });
                }
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'hidden') sendLeave();
                });
                window.addEventListener('pagehide', sendLeave);
                window.addEventListener('beforeunload', sendLeave);
            })();
        })();
    </script>
</body>
</html>
