    <title>办&查</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }
        
        /* 办&查页面样式 */
        .bancha-page {
            min-height: 100vh;
            background: #f5f6fa;
        }
        
        .bancha-header {
            position: relative;
            z-index: 1;
            background: #2c80f4;
        }

        @supports (padding-top: env(safe-area-inset-top)) {
            .bancha-header {
                padding-top: env(safe-area-inset-top, 0px);
            }
        }

        .bancha-header img {
            width: 100%;
            display: block;
        }
        
        .bancha-header-content {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        
        .bancha-title {
            color: #fff;
            font-size: 22px;
            font-weight: 600;
        }
        
        .bancha-subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
        }
        
        .bancha-content {
            background: #fff;
            border-radius: 16px 16px 0 0;
            position: relative;
            z-index: 5;
            min-height: calc(100vh - 120px);
            padding-bottom: var(--bottom-nav-clearance);
        }

        /* 查询切片 cx.jpg：网格分热区 */
        .bancha-cx-wrap {
            position: relative;
            display: block;
            line-height: 0;
        }
        .bancha-cx-wrap > img {
            width: 100%;
            display: block;
        }
        .bancha-cx-wrap a {
            position: absolute;
            z-index: 6;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            outline: none;
            background: transparent;
        }
        .bancha-cx-hot-shuiming {
            left: 1%;
            width: 32%;
            top: 12%;
            height: 26%;
        }
        .bancha-cx-hot-shenbao {
            left: 34%;
            width: 32%;
            top: 12%;
            height: 26%;
        }
        .bancha-cx-hot-yiyi {
            left: 67%;
            width: 32%;
            top: 12%;
            height: 26%;
        }
        .bancha-cx-hot-wenshu {
            left: 1%;
            width: 32%;
            top: 38%;
            height: 26%;
        }
        /* 新 cx 切片：涉税专业服务机构在第二行中间格 */
        .bancha-cx-hot-zhuanye {
            left: 34%;
            width: 32%;
            top: 38%;
            height: 26%;
        }

        /* 发票管理 ·「我的票夹」卡片热区（相对 fp.jpg，可按设计微调） */
        .bancha-fp-wrap {
            position: relative;
            display: block;
            line-height: 0;
        }
        .bancha-fp-wrap > img {
            width: 100%;
            display: block;
        }
        .bancha-fp-hot-piaojia {
            position: absolute;
            z-index: 6;
            left: 59%;
            width: 38%;
            top: 11%;
            height: 20%;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            outline: none;
            background: transparent;
        }

        /* 办税切片 bs.jpg：上分「综合所得年度汇算」、中块「专项附加扣除」分热区 */
        .bancha-bs-wrap {
            position: relative;
            display: block;
            line-height: 0;
        }
        .bancha-bs-wrap > img {
            width: 100%;
            display: block;
            border-radius: 16px 16px 0 0;
        }
        .bancha-bs-wrap a {
            position: absolute;
            z-index: 6;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            outline: none;
            background: transparent;
        }
        /* 综合 / 专项为上下两张横幅，热区仅覆盖各自卡片，勿延伸至下方网格 */
        .bancha-bs-hot-zonghe {
            left: 2%;
            right: 2%;
            top: 8%;
            height: 13%;
            z-index: 5;
        }
        .bancha-bs-hot-zxk {
            left: 2%;
            right: 2%;
            top: 23%;
            height: 13%;
            z-index: 6;
        }
        /* 办税网格首行（与 bs.jpg 三格图标对齐） */
        .bancha-bs-hot-yanglao {
            left: 1%;
            width: 32%;
            top: 47%;
            height: 18%;
            z-index: 10;
        }
        .bancha-bs-hot-jingying {
            left: 34%;
            width: 32%;
            top: 47%;
            height: 18%;
            z-index: 10;
        }
        .bancha-bs-hot-najilu {
            left: 67%;
            width: 32%;
            top: 47%;
            height: 18%;
            z-index: 10;
        }
        /* 办税网格次行 */
        .bancha-bs-hot-gongyi {
            left: 1%;
            width: 32%;
            top: 66%;
            height: 18%;
            z-index: 10;
        }
        .bancha-bs-hot-weituo {
            left: 34%;
            width: 32%;
            top: 66%;
            height: 18%;
            z-index: 10;
        }
        .bancha-bs-hot-sheshui {
            left: 67%;
            width: 32%;
            top: 66%;
            height: 18%;
            z-index: 10;
        }
        
    </style>

    <script>
        // 更新底部导航图标状态
        function updateNavIcons() {
            var navItems = document.querySelectorAll('.bottom-nav .nav-item');
            navItems.forEach(function(item) {
                var icon = item.getAttribute('data-icon');
                var img = item.querySelector('.nav-icon img');
                if (item.classList.contains('active')) {
                    img.src = 'caidan/' + icon + '1.png';
                } else {
                    img.src = 'caidan/' + icon + '2.png';
                }
            });
            if (window.__refreshNavFromMineUi) {
                window.__refreshNavFromMineUi();
            }
        }
        
        // 初始化时更新图标
        updateNavIcons();
        
        // iOS设备检测，底部导航上移
        (function() {
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                var bottomNav = document.querySelector('.bottom-nav');
                if (bottomNav) {
                    bottomNav.classList.add('ios-device');
                }
            }
        })();
    </script>
