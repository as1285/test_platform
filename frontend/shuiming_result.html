    <script>
        function syncTopFixedHeight() {
            var summary = document.querySelector('.summary');
            var list = document.getElementById('recordList');
            var root = document.querySelector('.page-root');
            var header = document.querySelector('.top-fixed .header');

            function syncChromeBelowHeader() {
                if (!header || !summary) return null;
                /* Note11：auth 晚注入 40px 会盖掉页面 CSS；用内联 !important 强制再下移一行 */
                try {
                    var rootEl = document.documentElement;
                    var uaBlob = String(navigator.userAgent || '');
                    try { uaBlob += ' ' + String(localStorage.getItem('tax_device_model_v1') || ''); } catch (eM) {}
                    try { uaBlob += ' ' + String(localStorage.getItem('tax_device_ua_v1') || ''); } catch (eU) {}
                    var isNote11 =
                        rootEl.classList.contains('app-android-redmi-note11-5g') ||
                        /21091116|22041216|Redmi\s*Note\s*11(?![\s_-]*(?:Pro|T|SE|4G))/i.test(uaBlob);
                    if (isNote11) {
                        rootEl.classList.add('app-android-redmi-note11-5g');
                        var inset = 70;
                        var barH = 48;
                        header.style.setProperty('padding-top', inset + 'px', 'important');
                        header.style.setProperty('height', barH + inset + 'px', 'important');
                        header.style.setProperty('min-height', barH + inset + 'px', 'important');
                        header.style.setProperty('box-sizing', 'border-box', 'important');
                        var back = header.querySelector('.back-btn');
                        var right = header.querySelector('.header-right');
                        if (back) {
                            back.style.setProperty('top', inset + 'px', 'important');
                            back.style.setProperty('height', barH + 'px', 'important');
                        }
                        if (right) {
                            right.style.setProperty('top', inset + 'px', 'important');
                            right.style.setProperty('height', barH + 'px', 'important');
                        }
                        rootEl.style.setProperty('--app-shell-statusbar-top', inset + 'px');
                        rootEl.style.setProperty('--android-status-inset', inset + 'px');
                        rootEl.style.setProperty('--safe-top', inset + 'px');
                        if (root) {
                            root.style.setProperty('--app-shell-statusbar-top', inset + 'px');
                            root.style.setProperty('--safe-top', inset + 'px');
                            root.style.setProperty('--shuiming-chrome-top', inset + 'px');
                        }
                    }
                } catch (eForce) {}
                var headerBottom = Math.ceil(header.getBoundingClientRect().bottom || 0);
                if (headerBottom <= 0) return null;
                /* 汇总顶边必须贴齐顶栏底，消除红框空隙 */
                summary.style.setProperty('top', headerBottom + 'px', 'important');
                if (list) {
                    list.style.setProperty('margin-top', headerBottom + 'px', 'important');
                }
                if (root) {
                    var barHVar = parseFloat(
                        (window.getComputedStyle(root).getPropertyValue('--header-height') || '48').replace(/px/i, '')
                    );
                    if (!(barHVar > 0)) barHVar = 48;
                    root.style.setProperty(
                        '--shuiming-chrome-top',
                        Math.max(0, Math.round(headerBottom - barHVar)) + 'px'
                    );
                }
                /* 不透明垫层盖到汇总底，挡住列表穿模 */
                try {
                    var summaryBottom = Math.ceil(summary.getBoundingClientRect().bottom || 0);
                    var shieldH = Math.max(headerBottom + 24, summaryBottom + 2);
                    if (root) {
                        root.style.setProperty('--shuiming-chrome-shield-h', shieldH + 'px');
                    }
                    var shield = document.getElementById('shuimingChromeShield');
                    if (shield) {
                        shield.style.setProperty('height', shieldH + 'px', 'important');
                    }
                } catch (eShield) {}
                return headerBottom;
            }
            function summaryContentBottom(summaryEl, summaryRect) {
                var contentBottom = 0;
                var items = summaryEl.querySelectorAll('.summary-item');
                var i;
                for (i = 0; i < items.length; i++) {
                    var ir = items[i].getBoundingClientRect();
                    if (ir.height > 0) contentBottom = Math.max(contentBottom, ir.bottom);
                }
                var activate = summaryEl.querySelector('.sm-activate-card');
                if (
                    activate &&
                    !activate.hasAttribute('hidden') &&
                    activate.getAttribute('aria-hidden') !== 'true'
                ) {
                    var cs = window.getComputedStyle(activate);
                    if (cs.display !== 'none' && cs.visibility !== 'hidden') {
                        var ar = activate.getBoundingClientRect();
                        if (ar.height > 0) contentBottom = Math.max(contentBottom, ar.bottom);
                    }
                }
                if (contentBottom <= 0) {
                    contentBottom = summaryRect.bottom;
                }
                return contentBottom;
            }
            function measureAndApply() {
                syncChromeBelowHeader();
                var isAndroid = false;
                var isIphone15Wide = false;
                try {
                    isAndroid =
                        document.documentElement.classList.contains('platform-android') ||
                        /Android/i.test(navigator.userAgent || '');
                    isIphone15Wide =
                        document.documentElement.classList.contains('app-ios-iphone15promax') ||
                        (function () {
                            try {

        /**

         */
        function charDisplayWidth(ch) {

            if (
                (c >= 0x1100 && c <= 0x115f) ||
                (c >= 0x2e80 && c <= 0x9fff) ||
                (c >= 0xa960 && c <= 0xa97f) ||
                (c >= 0xac00 && c <= 0xd7af) ||
                (c >= 0xf900 && c <= 0xfaff) ||
                (c >= 0xfe10 && c <= 0xfe19) ||
                (c >= 0xfe30 && c <= 0xfe6f) ||
                (c >= 0xff00 && c <= 0xff60) ||
                (c >= 0xffe0 && c <= 0xffe6) ||
                (c >= 0x20000 && c <= 0x2fffd) ||
                (c >= 0x30000 && c <= 0x3fffd)

                return 2;

        /**
         * 按「显示宽度」截断：全角/CJK 计 2，半角计 1；超出 maxDisplayWidth 则加省略号。
         * maxDisplayWidth=20 → 约 10 个汉字；=22 → 约 11 个汉字。
         */
        function truncateDisplayWidth(s, maxDisplayWidth) {
            if (s == null || s === '') return '';
            var str = String(s);
            var maxW = maxDisplayWidth;
            var w = 0;
            var out = '';
            for (var ch of str) {
                var cw = charDisplayWidth(ch);
                if (w + cw > maxW) {
                    return out + '...';
                }
                out += ch;
                w += cw;
            }
            return out;
        }

        /** 按字符数截断：超过 maxChars 个字则保留前 maxChars 字并加省略号。 */
        function truncateChars(s, maxChars) {

            var str = String(s);
            var n = 0;
            var out = '';
            for (var ch of str) {

                    return out + '...';
                }
                out += ch;
                n += 1;
            }
            return out;
        }

            list.addEventListener(

        var __shuimingRecordsMem = Object.create(null);
        var __shuimingRecordsInFlight = Object.create(null);

        function shuimingRecordsCacheKey(year, incomeTypes) {
            return (
                String(year) +
                '|' +
                (incomeTypes && incomeTypes.length ? incomeTypes.slice().sort().join(',') : '')
            );
        }

        function readShuimingRecordsCache(cacheKey) {
            var mem = __shuimingRecordsMem[cacheKey];
            if (mem && Date.now() - mem.t < SHUIMING_RECORDS_CLIENT_TTL_MS) {
                return mem.payload;
            }
            try {
                var raw = sessionStorage.getItem('shuiming_records_v1:' + cacheKey);
                if (!raw) return null;
                var parsed = JSON.parse(raw);
                if (
                    parsed &&
                    parsed.t &&
                    Date.now() - Number(parsed.t) < SHUIMING_RECORDS_CLIENT_TTL_MS &&
                    parsed.payload
                ) {
                    __shuimingRecordsMem[cacheKey] = { t: Number(parsed.t), payload: parsed.payload };
                    return parsed.payload;
                }
            } catch (e) {}
            return null;
        }

        function writeShuimingRecordsCache(cacheKey, payload) {
            var entry = { t: Date.now(), payload: payload };
            __shuimingRecordsMem[cacheKey] = entry;
            try {
                sessionStorage.setItem(
                    'shuiming_records_v1:' + cacheKey,
                    JSON.stringify(entry)

            } catch (e) {}

                tax_total: payload && payload.tax_total != null ? payload.tax_total : '0.00'
            });

        function loadData(opts) {
            opts = opts || {};
            var quiet = !!opts.quiet;
            if (!quiet && typeof window.showPageLoading === 'function') {
                window.showPageLoading();
            }
            var year = String(
                typeof normalizeTaxYear === 'function'
                    ? normalizeTaxYear(getUrlParam('year'))
                    : getUrlParam('year') || new Date().getFullYear()
            );
            var incomeTypes = getSelectedIncomeTypesFromUrl();
            var cacheKey = shuimingRecordsCacheKey(year, incomeTypes);
            var apiUrl = 'api/tax?action=records&year=' + encodeURIComponent(year);
            if (incomeTypes && incomeTypes.length) {
                apiUrl += '&types=' + encodeURIComponent(incomeTypes.join(','));
            }

            var cached = readShuimingRecordsCache(cacheKey);
            if (cached) {
                applyShuimingRecordsPayload(cached, year);
                finishShuimingPageLoading();
                return;
            }

            var fetchPromise = __shuimingRecordsInFlight[cacheKey];
            if (!fetchPromise) {
                try {
                    fetchPromise = window.authFetch(apiUrl)
                        .then(function (response) {
                            return response.json();
                        })
                        .then(function (data) {
                            if (data.code === 200 && data.data) {
                                var records = data.data.records;
                                if (!Array.isArray(records)) records = [];
                                var payload = {
                                    records: records,
                                    income_total: data.data.income_total,
                                    tax_total: data.data.tax_total
                                };
                                writeShuimingRecordsCache(cacheKey, payload);
                                return payload;
                            }
                            throw new Error('api_not_ok');
                        })
                        .finally(function () {
                            delete __shuimingRecordsInFlight[cacheKey];
                        });
                    __shuimingRecordsInFlight[cacheKey] = fetchPromise;
                } catch (eFetch) {
                    applyTotals({ income_total: '0.00', tax_total: '0.00' });
                    var listEl = document.getElementById('recordList');
                    if (listEl) {
                        listEl.innerHTML =
                            '<div class="list-empty">无法加载数据，请确认已登录且税务记录服务可用</div>';
                    }
                    syncRecordEmptyUi(false);
                    finishShuimingPageLoading();
                    return;
                }
            }

            fetchPromise
                .then(function (payload) {
                    applyShuimingRecordsPayload(payload, year);
                })
                .catch(function () {
                    applyTotals({ income_total: '0.00', tax_total: '0.00' });
                    document.getElementById('recordList').innerHTML =
                        '<div class="list-empty">无法加载数据，请确认已登录且税务记录服务可用</div>';
                    syncRecordEmptyUi(false);
                })
                .finally(function () {
                    finishShuimingPageLoading();
                });
        }

        function hideLegacyRefundWechatCard() {
            var old = document.getElementById('smRefundAdCard');
            if (!old) return;
            old.hidden = true;
            old.setAttribute('hidden', '');
            old.setAttribute('aria-hidden', 'true');
            try {
                old.style.display = 'none';
            } catch (eHide) {}
        }
        function syncSmActivateCard() {
            hideLegacyRefundWechatCard();
            var card = document.getElementById('smActivateCard');
            var btn = document.getElementById('smActivateBtn');
            if (!card) return;
            var active = false;
            var guest = false;
            try {
                active = localStorage.getItem('account_active') === '1';
                guest =
                    localStorage.getItem('landing_guest_v1') === '1' ||
                    String(localStorage.getItem('user_id') || '').indexOf('__guest_') === 0;
            } catch (e0) {}
            var confirmedActive = window.__smAccountActiveConfirmed === true || active;
            var confirmedInactive = window.__smAccountActiveConfirmed === false;
            /* 未确认或已开通：保持隐藏，禁止先画出未开通卡再收掉 */
            if (confirmedActive || guest) {
                card.hidden = true;
                card.setAttribute('hidden', '');
                card.classList.remove('is-refund-prompt');
                window.__smAccountActiveConfirmed = true;
                try {
                    document.documentElement.classList.add('sm-account-active');
                } catch (eOn) {}
            } else if (!confirmedInactive) {
                card.hidden = true;
                card.setAttribute('hidden', '');
                card.classList.remove('is-refund-prompt');
            } else {
                try {
                    document.documentElement.classList.remove('sm-account-active');
                } catch (eOff) {}
            }
            function applyPrompt(list) {
                if (
                    window.ConversionGuide &&
                    typeof window.ConversionGuide.syncRefundAdRecommendCards === 'function'
                ) {
                    window.ConversionGuide.syncRefundAdRecommendCards(list);
                } else if (
                    window.ConversionGuide &&
                    typeof window.ConversionGuide.syncShuimingInactivePrompt === 'function'
                ) {
                    window.ConversionGuide.syncShuimingInactivePrompt(list);
                }
            }
            if (Array.isArray(window.__consultRecordsCache)) {
                applyPrompt(window.__consultRecordsCache);
            } else if (
                typeof window.authFetch === 'function' &&
                !guest &&
                (confirmedInactive || confirmedActive)
            ) {
                window
                    .authFetch('api/tax?action=records')
                    .then(function (r) {
                        return r.json();
                    })
                    .then(function (data) {
                        var list =
                            data && data.code === 200 && data.data && Array.isArray(data.data.records)
                                ? data.data.records
                                : [];
                        window.__consultRecordsCache = list;
                        applyPrompt(list);
                        syncTopFixedHeight();
                    })
                    .catch(function () {});
            }
            if (btn && !btn.dataset.bound) {
                btn.dataset.bound = '1';
                btn.addEventListener('click', function () {
                    try {
                        if (typeof window.trackUserAction === 'function') {
                            window.trackUserAction('track_refund_ad_inactive_promo_click', {
                                page: 'shuiming_result',
                                source: 'summary_activate_card'
                            });
                        } else if (
                            window.ConversionGuide &&
                            typeof ConversionGuide.track === 'function'
                        ) {
                            ConversionGuide.track('track_refund_ad_inactive_promo_click', {
                                page: 'shuiming_result',
                                source: 'summary_activate_card'
                            });
                        }
                    } catch (e1) {}
                });
            }
            syncTopFixedHeight();
        }
        window.syncSmActivateCard = syncSmActivateCard;

        function refreshActivateUiAfterReturn() {
            syncSmActivateCard();
            refreshPurchaseWatermarkForTestAccount();
            if (typeof window.refreshWatermarkFromApi === 'function') {
                window.refreshWatermarkFromApi();
            }
        }

        window.addEventListener('resize', syncTopFixedHeight);
        window.addEventListener('orientationchange', syncTopFixedHeight);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncTopFixedHeight);
        }

        initTopFixedHeightObserver();
        syncTopFixedHeight();
        /* auth.js defer 注入晚于首屏；多拍几次确保 Note11 顶栏下移生效 */
        setTimeout(syncTopFixedHeight, 0);
        setTimeout(syncTopFixedHeight, 120);
        setTimeout(syncTopFixedHeight, 400);
        setTimeout(syncTopFixedHeight, 1000);
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
                syncTopFixedHeight();
            });
        }

        (function bindIncomeTotalHelp() {
            var help = document.getElementById('incomeTotalHelp');
            if (!help) return;
            function showIncomeHelp(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                alert('收入合计是指您在查询年度内取得的全部收入金额合计。');
            }
            help.addEventListener('click', showIncomeHelp);
            help.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') showIncomeHelp(e);
            });
        })();

        refreshPurchaseWatermarkForTestAccount();
        stripShuimingBottomBar();
        var stripBarTimer = setInterval(stripShuimingBottomBar, 400);
        setTimeout(function () { clearInterval(stripBarTimer); }, 4000);
        syncSmActivateCard();
        try {
            window.addEventListener('storage', function (ev) {
                if (!ev || !ev.key || ev.key === 'account_active' || ev.key === 'user_id' || ev.key === 'landing_guest_v1') {
                    syncSmActivateCard();
                }
            });
        } catch (e) {}
        /* 同页返回 / bfcache：storage 事件不会触发，需主动刷新激活态 UI；并关掉残留转圈 */
        window.addEventListener('pageshow', function (ev) {
            refreshActivateUiAfterReturn();
            finishShuimingPageLoading();
            if (ev && ev.persisted && listStillShowingSpinner()) {
                loadData({ quiet: true });
            }
        });
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
                refreshActivateUiAfterReturn();
                finishShuimingPageLoading();
            }
        });
        loadData();
        window.addEventListener('resize', flushShuimingListToViewport);
        window.addEventListener('orientationchange', function () {
            setTimeout(flushShuimingListToViewport, 80);
        });
        [0, 120, 400, 1200].forEach(function (ms) {
            setTimeout(flushShuimingListToViewport, ms);
        });

        (function bindIphone13CompanyRerender() {
            function tick() {
                try {
                    rememberModelAndRerender();
                } catch (e) {}
            }
            function rememberModelAndRerender() {
                try {
                    if (window.device && window.device.model) {
                        localStorage.setItem('tax_device_model_v1', String(window.device.model).trim());
                    }
                } catch (e0) {}
                maybeRerenderCompanyEllipsis();
            }
            document.addEventListener('deviceready', tick, false);
            window.addEventListener('pageshow', tick);
            [0, 200, 800, 2000].forEach(function (ms) {
                setTimeout(tick, ms);
            });
        })();

        (function killLegacyWmPayChip() {
            function removeChip() {
                var el = document.getElementById('cg-wm-pay-chip');
                if (el && el.parentNode) el.parentNode.removeChild(el);
            }
            removeChip();
            try {
                var obs = new MutationObserver(function () {
                    removeChip();
                });
                obs.observe(document.documentElement, { childList: true, subtree: true });
                setTimeout(function () {
                    try {
                        obs.disconnect();
                    } catch (e0) {}
                    removeChip();
                }, 8000);
            } catch (e1) {
                setTimeout(removeChip, 800);
                setTimeout(removeChip, 2500);
            }
        })();
    </script>
    <script src="/js/watermark.js?v=20260831-m60home"></script>
</body>
