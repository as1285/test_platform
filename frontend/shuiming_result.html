        function resetShuimingScrollTop() {
            try {
                if (window.history && 'scrollRestoration' in window.history) {
                    window.history.scrollRestoration = 'manual';
                }
            } catch (e0) {}
            try {
                window.scrollTo(0, 0);
                if (document.documentElement) document.documentElement.scrollTop = 0;
                if (document.body) document.body.scrollTop = 0;
                var rootEl = document.querySelector('.page-root');
                if (rootEl) rootEl.scrollTop = 0;
            } catch (e1) {}
        }

        function shuimingPageScrolled() {
            try {
                var y =
                    window.scrollY ||
                    document.documentElement.scrollTop ||
                    (document.body && document.body.scrollTop) ||
                    0;
                var rootEl = document.querySelector('.page-root');
                if (rootEl && rootEl.scrollTop > y) y = rootEl.scrollTop;
                if (y > 4) return true;
                if (window.visualViewport && window.visualViewport.offsetTop > 4) return true;
            } catch (eScr) {}
            return false;
        }

        /* 橡皮筋时 fixed 顶栏/汇总会跟着走，rect 不能用来写 margin */
        function shuimingChromeUnstable() {
            if (shuimingPageScrolled()) return true;
            try {
                if (window.visualViewport && Math.abs(window.visualViewport.offsetTop || 0) > 2) {
                    return true;
                }
                var headerEl = document.querySelector('.top-fixed .header');
                if (headerEl) {
                    var ht = headerEl.getBoundingClientRect().top;
                    if (ht > 2 || ht < -8) return true;
                }
            } catch (eU) {}
            return false;
        }

            function summaryContentBottom(summaryEl, summaryRect) {
                var contentBottom = 0;
                var items = summaryEl.querySelectorAll('.summary-item');
                var i;
                for (i = 0; i < items.length; i++) {
                    var ir = items[i].getBoundingClientRect();

                    var cs = window.getComputedStyle(activate);
                    if (cs.display !== 'none' && cs.visibility !== 'hidden') {
                        var ar = activate.getBoundingClientRect();
                        if (ar.height > 0) contentBottom = Math.max(contentBottom, ar.bottom);

                if (contentBottom <= 0) {

            function measureAndApply() {
                var headerBottom = syncChromeBelowHeader();
                var isAndroid = false;
                var isIphone15Wide = false;
                var isIphone16ProSeam = false;
                var isIphone11Seam = false;
                try {
                    isAndroid =
                        document.documentElement.classList.contains('platform-android') ||
                        /Android/i.test(navigator.userAgent || '');
                    isIphone15Wide =
                        document.documentElement.classList.contains('app-ios-iphone15promax') ||
                        (function () {
                            try {
                                var sw = Math.min(screen.width || 0, screen.height || 0);
                                var sh = Math.max(screen.width || 0, screen.height || 0);
                                return sw >= 428 && sw <= 432 && sh >= 926 && sh <= 936;
                            } catch (eSz) {
                                return false;
                            }
                        })();
                    /* 16 Pro：灰缝按汇总盒底起算，避免白条贴死列表 */
                    isIphone16ProSeam =
                        document.documentElement.classList.contains('app-ios-iphone16pro') ||
                        (function () {
                            try {
                                var sw16 = Math.min(screen.width || 0, screen.height || 0);
                                var sh16 = Math.max(screen.width || 0, screen.height || 0);
                                return sw16 >= 399 && sw16 <= 405 && sh16 >= 868 && sh16 <= 878;
                            } catch (e16s) {
                                return false;
                            }
                        })();
                    /* iPhone 11 / XR（414×896）：按汇总盒底起算，露出 padding 灰缝 */
                    isIphone11Seam =
                        document.documentElement.classList.contains('app-ios-promax-wide') &&
                        !isIphone15Wide &&
                        !isIphone16ProSeam &&
                        !document.documentElement.classList.contains('app-ios-iphone16promax') &&
                        !document.documentElement.classList.contains('app-ios-iphone17promax') &&
                        !document.documentElement.classList.contains('app-ios-iphoneair') &&
                        (function () {
                            try {
                                var sw11 = Math.min(screen.width || 0, screen.height || 0);
                                var sh11 = Math.max(screen.width || 0, screen.height || 0);
                                return sw11 >= 410 && sw11 <= 416 && sh11 >= 890 && sh11 <= 900;
                            } catch (e11s) {
                                return false;
                            }
                        })();
                } catch (eA) {}
                /*
                 * 列表从汇总底下起排（margin-top = 汇总底 + 灰缝），padding-top 置 0。
                 * 旧方案把汇总高度写进 padding-top：轻拖还好，使劲橡皮筋会把那一整截灰垫拽出来。
                 */
                if (shuimingChromeUnstable() || !(headerBottom > 0) || !summary || !list) return;
                var summaryRect = summary.getBoundingClientRect();
                if (!(summaryRect.height > 0)) return;
                var contentBottom = summaryContentBottom(summary, summaryRect);
                if (isIphone15Wide || isIphone16ProSeam || isIphone11Seam) {
                    contentBottom = Math.max(contentBottom, summaryRect.bottom);
                }
                /* 16 Pro / 11：灰缝已写在汇总 padding-bottom，勿再叠 JS gap；15 宽档略留 10 */
                var gap = isAndroid
                    ? 8
                    : isIphone16ProSeam || isIphone11Seam
                      ? 0
                      : isIphone15Wide
                        ? 10
                        : 8;
                var listTop = Math.ceil(contentBottom + gap);
                if (listTop < headerBottom + 24) listTop = headerBottom + 24;
                if (root) {
                    root.style.setProperty('--list-summary-pad', '0px', 'important');
                }
                list.style.setProperty('padding-top', '0px', 'important');
                list.style.setProperty('margin-top', listTop + 'px', 'important');
                var firstItem =
                    list.querySelector('.list-item') ||
                    list.querySelector('.list-empty') ||
                    list.querySelector('.list-empty-state');
                if (firstItem) {
                    var sr = summary.getBoundingClientRect();
                    var cb = summaryContentBottom(summary, sr);
                    if (isIphone15Wide || isIphone16ProSeam || isIphone11Seam) {
                        cb = Math.max(cb, sr.bottom);
                    }
                    var visualGap = firstItem.getBoundingClientRect().top - cb;
                    if (Math.abs(visualGap - gap) >= 2) {
                        var nextTop = Math.ceil(listTop + (gap - visualGap));
                        if (nextTop < headerBottom + 24) nextTop = headerBottom + 24;
                        list.style.setProperty('margin-top', nextTop + 'px', 'important');
                    }
                }
            }
            measureAndApply();
            requestAnimationFrame(function () {
                measureAndApply();
                requestAnimationFrame(measureAndApply);
            });
        }

        /**
         * 单字符在列表中的「显示宽度」：全角/中日韩等计 2，半角字母数字标点计 1（与常见「10 个汉字宽度」一致）。
         */
        function charDisplayWidth(ch) {
            var c = ch.codePointAt(0);
            if (
                (c >= 0x1100 && c <= 0x115f) ||
                (c >= 0x2e80 && c <= 0x9fff) ||
                (c >= 0xa960 && c <= 0xa97f) ||
                (c >= 0xac00 && c <= 0xd7af) ||
                (c >= 0xf900 && c <= 0xfaff) ||
                (c >= 0xfe10 && c <= 0xfe19) ||
                (c >= 0xfe30 && c <= 0xfe6f) ||
                (c >= 0xff00 && c <= 0xff60) ||
                (c >= 0xffe0 && c <= 0xffe6) ||
                (c >= 0x20000 && c <= 0x2fffd) ||
                (c >= 0x30000 && c <= 0x3fffd)
            ) {
                return 2;
            }
            return 1;
        }

        /**
         * 按「显示宽度」截断：全角/CJK 计 2，半角计 1；超出 maxDisplayWidth 则加省略号。
         * maxDisplayWidth=20 → 约 10 个汉字；=22 → 约 11 个汉字。
         */
        function truncateDisplayWidth(s, maxDisplayWidth) {
            if (s == null || s === '') return '';
            var str = String(s);
            var maxW = maxDisplayWidth;
            var w = 0;
            var out = '';
            for (var ch of str) {
                var cw = charDisplayWidth(ch);
                if (w + cw > maxW) {
                    return out + '...';
                }
                out += ch;
                w += cw;
            }
            return out;
        }

        /** 按字符数截断：超过 maxChars 个字则保留前 maxChars 字并加省略号。 */
        function truncateChars(s, maxChars) {
            if (s == null || s === '') return '';
            var str = String(s);
            var n = 0;
            var out = '';
            for (var ch of str) {
                if (n >= maxChars) {
                    return out + '...';
                }
                out += ch;
                n += 1;
            }
            return out;
        }

        /*
         * 公司名按「汉字宽」截断：全角括号（、）各算半个汉字宽（两个括号合一个汉字宽），
         * 其余每字计 1；累计宽度超过 maxChars 则加省略号。
         * 例：「视锐达科技（宁波）有限公司」= 5 + 0.5 + 2 + 0.5 + 3 = 11 宽，12 内可完整显示，
         * 不再被截成「视锐达科技（宁波）有限公...」。
         */
        function truncateCompanyName(s, maxChars) {
            if (s == null || s === '') return '';
            var str = String(s);
            var w = 0;
            var out = '';
            for (var ch of str) {
                var cw = ch === '（' || ch === '）' ? 0.5 : 1;
                if (w + cw > maxChars) {
                    return out + '...';
                }
                out += ch;
                w += cw;
            }
            return out;
        }

        function bindRecordListNavigation() {

            /* 捕获阶段兜底：部分 WebView 上 <a> 默认跳转被吞时，用 assign 强制进入详情 */
            list.addEventListener(
                'click',
                function (ev) {
                    var item = ev.target.closest('a.list-item');
                    if (!item) return;
                    if (__shuimingSkipNavUntil && Date.now() < __shuimingSkipNavUntil) {
                        ev.preventDefault();

                        return;
                    }
                    var href = item.getAttribute('href') || '';
                    if (!href || href.indexOf('xiangqing.html') < 0) return;
                    var idMatch = href.match(/[?&]id=([^&]+)/);
                    if (!idMatch || !decodeURIComponent(idMatch[1] || '').trim()) {
                        ev.preventDefault();
                        alert('该记录缺少编号，请返回重新生成或刷新列表后再试。');

                    setTimeout(function () {
                        try {
                            if (document.visibilityState === 'hidden') return;
                            if (String(window.location.href || '').indexOf('xiangqing.html') >= 0) return;
                        } catch (e0) {}
                        goXiangqingHref(href);
                    }, 120);
                },

        function bindShuimingReorder() {
            var list = document.getElementById('recordList');
            if (!list || list.__reorderBound) return;
            list.__reorderBound = true;
            var pressTimer = null;
            var startY = 0;
            var startX = 0;
            var startAt = 0;
            var activeId = '';
            var opened = false;
            function clearPress() {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            }
            function recordIdFromEvent(ev) {
                var item = ev.target && ev.target.closest ? ev.target.closest('[data-record-id]') : null;
                if (!item || !list.contains(item)) return '';
                var id = item.getAttribute('data-record-id') || '';
                if (!id || !window.TaxRecordOrder) return '';
                var flags = window.TaxRecordOrder.moveFlags(__shuimingLastListRecords || [], id);
                if (!flags.canUp && !flags.canDown) return '';
                return id;
            }
            function tryOpen(id) {
                if (opened || !id) return false;
                opened = true;
                clearPress();
                openShuimingReorderSheet(id);
                return true;
            }
            list.addEventListener(
                'touchstart',
                function (ev) {
                    var id = recordIdFromEvent(ev);
                    var t = ev.touches && ev.touches[0];
                    activeId = id;
                    opened = false;
                    startAt = Date.now();
                    startY = t ? t.clientY : 0;
                    startX = t ? t.clientX : 0;
                    clearPress();
                    if (!id) return;
                    pressTimer = setTimeout(function () {
                        pressTimer = null;
                        tryOpen(id);
                    }, 420);
                },
                { passive: true }
            );
            list.addEventListener(
                'touchmove',
                function (ev) {
                    if (!activeId) return;
                    var t = ev.touches && ev.touches[0];
                    if (!t) return;
                    if (Math.abs(t.clientY - startY) > 16 || Math.abs(t.clientX - startX) > 16) {
                        clearPress();
                        activeId = '';
                    }
                },
                { passive: true }
            );
            list.addEventListener(
                'touchend',
                function (ev) {
                    var held = startAt ? Date.now() - startAt : 0;
                    var id = activeId;
                    clearPress();
                    activeId = '';
                    if (opened || (id && held >= 400)) {
                        if (ev && ev.preventDefault) ev.preventDefault();
                        if (ev && ev.stopPropagation) ev.stopPropagation();
                        tryOpen(id);
                    }
                },
                { passive: false }
            );
            list.addEventListener('touchcancel', function () {
                clearPress();
                activeId = '';
            });
            list.addEventListener('contextmenu', function (ev) {
                var id = recordIdFromEvent(ev);
                if (!id) return;
                ev.preventDefault();
                ev.stopPropagation();
                tryOpen(id);
            });
            var up = document.getElementById('shuimingReorderUp');
            var down = document.getElementById('shuimingReorderDown');
            var cancel = document.getElementById('shuimingReorderCancel');
            var mask = document.getElementById('shuimingReorderMask');
            if (up) {
                up.addEventListener('click', function () {
                    postShuimingReorder('up');
                });
            }
            if (down) {
                down.addEventListener('click', function () {
                    postShuimingReorder('down');
                });
            }
            if (cancel) cancel.addEventListener('click', closeShuimingReorderSheet);
            if (mask) mask.addEventListener('click', closeShuimingReorderSheet);
        }

        /** 17 Pro Max 等大屏：文档流若被收窄，把列表钉回视口全宽，去掉左右灰边。 */
        function flushShuimingListToViewport() {
            try {
                var list = document.getElementById('recordList');
                if (!list) return;
                var vw = window.innerWidth || document.documentElement.clientWidth || 0;
                if (vw < 360) return;
                var rect = list.getBoundingClientRect();
                var leftGap = Math.round(rect.left);
                var rightGap = Math.round(vw - rect.right);
                if (leftGap > 1 || rightGap > 1) {
                    list.style.marginLeft = -leftGap + 'px';
                    list.style.width = vw + 'px';
                    list.style.maxWidth = 'none';
                    list.style.paddingLeft = '0';
                    list.style.paddingRight = '0';
                    list.style.boxSizing = 'border-box';
                }

        var SHUIMING_RECORDS_CLIENT_TTL_MS = 60000;
        var __shuimingRecordsMem = Object.create(null);
        var __shuimingRecordsInFlight = Object.create(null);

        function shuimingRecordsCacheKey(year, incomeTypes) {
            return (
                String(year) +
                '|' +
                (incomeTypes && incomeTypes.length ? incomeTypes.slice().sort().join(',') : '')
            );
        }

        function readShuimingRecordsCache(cacheKey) {
            var mem = __shuimingRecordsMem[cacheKey];
            if (mem && Date.now() - mem.t < SHUIMING_RECORDS_CLIENT_TTL_MS) {
                return mem.payload;
            }
            try {
                var raw = sessionStorage.getItem('shuiming_records_v1:' + cacheKey);
                if (!raw) return null;
                var parsed = JSON.parse(raw);
                if (
                    parsed &&
                    parsed.t &&
                    Date.now() - Number(parsed.t) < SHUIMING_RECORDS_CLIENT_TTL_MS &&
                    parsed.payload
                ) {
                    __shuimingRecordsMem[cacheKey] = { t: Number(parsed.t), payload: parsed.payload };
                    return parsed.payload;
                }
            } catch (e) {}
            return null;
        }

        function writeShuimingRecordsCache(cacheKey, payload) {
            var entry = { t: Date.now(), payload: payload };
            __shuimingRecordsMem[cacheKey] = entry;
            try {
                sessionStorage.setItem(
                    'shuiming_records_v1:' + cacheKey,
                    JSON.stringify(entry)
                );
            } catch (e) {}
        }

        function applyShuimingRecordsPayload(payload, year) {
            var records = payload && Array.isArray(payload.records) ? payload.records : [];
            applyTotals({
                income_total: payload && payload.income_total != null ? payload.income_total : '0.00',
                tax_total: payload && payload.tax_total != null ? payload.tax_total : '0.00'
            });

        function loadData(opts) {
            opts = opts || {};
            var quiet = !!opts.quiet;
            if (!quiet) resetShuimingScrollTop();
            if (!quiet && typeof window.showPageLoading === 'function') {
                window.showPageLoading();
            }
            var year = String(
                typeof normalizeTaxYear === 'function'
                    ? normalizeTaxYear(getUrlParam('year'))
                    : getUrlParam('year') || new Date().getFullYear()
            );
            var incomeTypes = getSelectedIncomeTypesFromUrl();
            var cacheKey = shuimingRecordsCacheKey(year, incomeTypes);
            var apiUrl = 'api/tax?action=records&year=' + encodeURIComponent(year);
            if (incomeTypes && incomeTypes.length) {
                apiUrl += '&types=' + encodeURIComponent(incomeTypes.join(','));
            }

            /* force：编辑返回后跳过 60s 客户端缓存，避免合计仍是旧值 */
            var cached = opts.force ? null : readShuimingRecordsCache(cacheKey);
            if (cached) {
                applyShuimingRecordsPayload(cached, year);
                finishShuimingPageLoading();
                return;
            }

            var fetchPromise = __shuimingRecordsInFlight[cacheKey];
            if (!fetchPromise) {
                try {
                    fetchPromise = window.authFetch(apiUrl)
                        .then(function (response) {
                            return (window.authParseJson||function(response){return response.json();})(response);
                        })
                        .then(function (data) {
                            if (data.code === 200 && data.data) {
                                var records = data.data.records;
                                if (!Array.isArray(records)) records = [];
                                var payload = {
                                    records: records,
                                    income_total: data.data.income_total,
                                    tax_total: data.data.tax_total
                                };
                                writeShuimingRecordsCache(cacheKey, payload);
                                return payload;
                            }
                            throw new Error('api_not_ok');
                        })
                        .finally(function () {
                            delete __shuimingRecordsInFlight[cacheKey];
                        });
                    __shuimingRecordsInFlight[cacheKey] = fetchPromise;
                } catch (eFetch) {
                    applyTotals({ income_total: '0.00', tax_total: '0.00' });
                    var listEl = document.getElementById('recordList');
                    if (listEl) {
                        listEl.innerHTML =
                            '<div class="list-empty">无法加载数据，请确认已登录且税务记录服务可用</div>';
                    }
                    syncRecordEmptyUi(false);
                    finishShuimingPageLoading();
                    return;
                }
            }

            fetchPromise
                .then(function (payload) {
                    applyShuimingRecordsPayload(payload, year);
                })
                .catch(function () {
                    applyTotals({ income_total: '0.00', tax_total: '0.00' });
                    document.getElementById('recordList').innerHTML =
                        '<div class="list-empty">无法加载数据，请确认已登录且税务记录服务可用</div>';
                    syncRecordEmptyUi(false);
                })
                .finally(function () {
                    finishShuimingPageLoading();
                });
        }

        /* 正版短拉手：仅滑动出现；活动区从汇总底到屏底。
           汇总两行固定；不做顶部下拉位移，避免汇总下露出白/灰空条。 */
        (function initSmShortScrollThumb() {
            var MIN_H = 72;
            var MAX_H = 110;
            var EDGE = 4;
            var HIDE_MS = 700;
            var thumb = document.createElement('div');
            thumb.className = 'sm-scroll-thumb';
            thumb.setAttribute('aria-hidden', 'true');
            (document.body || document.documentElement).appendChild(thumb);
            var hideTimer = null;
            var ticking = false;
            var wantShow = false;

            function pageScrollTop() {
                var doc = document.documentElement;
                var y = window.pageYOffset || doc.scrollTop || 0;
                var rootEl = document.querySelector('.page-root');
                if (rootEl && rootEl.scrollTop > y) y = rootEl.scrollTop;
                return y;
            }

            function listTrackTop() {
                /* 拉手最高只能到已申报税额合计（汇总区）下方 */
                var summary = document.querySelector('.top-fixed .summary') || document.querySelector('.summary');
                if (summary) {
                    var bottom = summary.getBoundingClientRect().bottom;
                    if (bottom > 0) return Math.ceil(bottom) + 2;
                }
                var fixed = document.querySelector('.top-fixed');
                if (fixed) {
                    var fb = fixed.getBoundingClientRect().bottom;
                    if (fb > 0) return Math.ceil(fb) + 2;
                }
                return EDGE;
            }

            function place() {
                ticking = false;
                var doc = document.documentElement;
                var scrollTop = pageScrollTop();
                var viewH = window.innerHeight || doc.clientHeight || 1;
                var scrollH = Math.max(doc.scrollHeight || 0, (document.body && document.body.scrollHeight) || 0);
                var maxScroll = Math.max(0, scrollH - viewH);
                var trackTop = listTrackTop();
                var trackBottom = viewH - EDGE;
                var listViewH = Math.max(1, trackBottom - trackTop);
                if (maxScroll <= 8 || listViewH < MIN_H + 8) {
                    thumb.classList.remove('is-visible');
                    return;
                }
                var natural = listViewH * (viewH / Math.max(scrollH, 1));
                var thumbH = Math.round(Math.max(MIN_H, Math.min(MAX_H, natural, listViewH)));
                var track = Math.max(0, listViewH - thumbH);
                var ratio = maxScroll > 0 ? Math.max(0, Math.min(1, scrollTop / maxScroll)) : 0;
                var y = trackTop + ratio * track;
                if (y < trackTop) y = trackTop;
                if (y > trackBottom - thumbH) y = trackBottom - thumbH;
                thumb.style.height = thumbH + 'px';
                thumb.style.transform = 'translate3d(0,' + Math.round(y) + 'px,0)';
                if (wantShow) {
                    thumb.classList.add('is-visible');
                    if (hideTimer) clearTimeout(hideTimer);
                    hideTimer = setTimeout(function () {
                        thumb.classList.remove('is-visible');
                        wantShow = false;
                    }, HIDE_MS);
                }
            }

            function onScroll() {
                wantShow = true;
                if (!ticking) {
                    ticking = true;
                    requestAnimationFrame(place);
                }
            }

            function onResize() {
                if (!ticking) {
                    ticking = true;
                    requestAnimationFrame(place);
                }
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('touchmove', onScroll, { passive: true });
            window.addEventListener('resize', onResize, { passive: true });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', onResize, { passive: true });
            }
        })();
