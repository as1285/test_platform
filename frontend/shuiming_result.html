                ) {

    <title>收入纳税明细</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /*
         * 页面数字（汇总金额、日期、行内金额）：比例数字 + 系统无衬线数字栈。
         * tabular-nums 等宽格会使窄字「1」在 1991、2026 等串中两侧留白过大。
         */
        .summary-value,
        .list-date,
        .list-amount {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-variant-numeric: normal;
            font-feature-settings: 'tnum' 0, 'zero' 0;
            letter-spacing: normal;
        }

        /* 主内容保持独立层；未激活水印由 watermark.js 使用更高层级覆盖 */
        .page-root {
            --safe-top: env(safe-area-inset-top, 0px);
            --header-height: 48px;
            --list-summary-pad: 102px;
            position: relative;
            z-index: 100000;
            min-height: 100vh;
            background: #f5f6fa;
            isolation: isolate;
        }

        .top-fixed {
            position: static;
        }

        .header {
            background: #fff;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: calc(var(--header-height) + var(--safe-top));
            padding-top: calc(8px + var(--safe-top));
            box-sizing: border-box;
        }

        .back-btn {
            position: absolute;
            left: 16px;
            color: #1e6fff;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .back-btn .back-icon {
            width: 9px;
            height: auto;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }

        .header-right {
            position: absolute;
            right: 16px;
            color: #1e6fff;
            font-size: 15px;
            text-decoration: none;
        }

        .summary {
            background: #fff;
            position: fixed;
            top: calc(var(--safe-top) + var(--header-height));
            left: 0;
            right: 0;
            z-index: 101;
            height: auto;
            background-color: #fff;
            background-clip: border-box;
            overflow: visible;
            will-change: background;
            border-top: 15px solid #f5f6fa;
            border-bottom: 10px solid #f5f6fa;
            padding: 10px 16px 2px;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* 无列表数据：不展示批量申诉 */
        .page-root.is-record-empty .header-right {
            display: none;
        }

        /* 无列表数据：汇总区底部不额外留白 */
        .page-root.is-record-empty .summary {
            padding-bottom: 0;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 8px;
            padding: 6px 0;
            padding-bottom: 9px;
            margin-bottom: 3px;
            position: relative;
            border-bottom: none;
        }

        /* 仅「收入合计」与「已申报税额合计」之间保留横线；税额下方不再画线（对齐正版） */
        .summary > .summary-item:first-child {
            border-bottom: 1px solid #e5e5e5;
        }

        .sm-activate-card {
            margin: 4px 0 10px;
            padding: 14px 14px 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0b3d7a 0%, #1e6fff 55%, #3d8bff 100%);
            color: #fff;
            box-shadow: 0 8px 20px rgba(30, 111, 255, 0.22);
            position: relative;
            overflow: hidden;
        }
        .sm-activate-card[hidden] { display: none !important; }
        .sm-activate-card::before {
            content: "";
            position: absolute;
            width: 96px;
            height: 96px;
            right: -24px;
            top: -30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }
        .sm-activate-title {
            position: relative;
            z-index: 1;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.02em;
        }
        .sm-activate-desc {
            position: relative;
            z-index: 1;
            font-size: 12px;
            line-height: 1.5;
            opacity: 0.9;
            margin-bottom: 12px;
        }
        .sm-activate-btn {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            border-radius: 10px;
            background: #fff;
            color: #1e6fff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .sm-activate-btn:active { opacity: 0.92; transform: scale(0.98); }

        .summary-label {
            font-size: 14px;
            color: #000;
            display: flex;
            align-items: center;
            gap: 0;
            flex: 1;
            min-width: 0;
            line-height: 20px;
        }

        .summary-label-text {
            flex-shrink: 0;
        }

        .summary-label .icon {
            width: 13px;
            height: 13px;
            border: 1px solid #0e60f1;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 500;
            line-height: 1;
            color: #0e60f1;
            flex-shrink: 0;
            box-sizing: border-box;
            vertical-align: middle;
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Android：问号圆贴近汇总字高，并扩大点击热区（视觉仍为小圆） */
        html.platform-android body.page-shuiming-result .summary-label .icon {
            width: 15px;
            height: 15px;
            min-width: 15px;
            min-height: 15px;
            font-size: 10px;
            font-weight: 600;
            border-width: 1.25px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-synthesis: none;
        }

        html.platform-android body.page-shuiming-result .summary-label .icon::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 36px;
            height: 36px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        html.platform-android body.page-shuiming-result .summary-label .icon:active {
            opacity: 0.75;
        }

        /* 问号与冒号紧贴；与「收入合计」仅留极小间距，贴近官方 */
        .summary-help-with-colon {
            display: inline-flex;
            align-items: center;
            gap: 0;
            margin-left: 2px;
            line-height: 20px;
            position: relative;
            z-index: 2;

        .summary-help-with-colon .summary-colon {
            line-height: 20px;

        .summary-value {
            font-size: 14px;
            font-weight: 490;
            color: #111;
            text-align: right;
            line-height: 20px;
            min-width: 5.5em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Android：Roboto 对中段字重易合成偏粗，汇总金额略降为 400 以接近 iOS/SF 观感；未加 class 的 iOS 等保持 490 */
        html.platform-android .summary-value {
            font-weight: 400;
            font-synthesis: none;
        }

        html.platform-android body.page-shuiming-result .list-date,
        html.platform-android body.page-shuiming-result .list-amount {
            font-synthesis: none;
        }

        /* 列表顶部留白：避开固定汇总区（高度用 JS 实测写入 --list-summary-pad） */
        .list {
            margin-top: calc(var(--safe-top) + var(--header-height));
            padding-top: var(--list-summary-pad, 102px);
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 20px;
            background: #f5f6fa;
            position: relative;
            isolation: isolate;
        }

        .list-item {
            display: block;
            width: 100%;
            background: #fff;
            border-radius: 8px;
            --list-inline-pad: 16px;
            padding: 16px var(--list-inline-pad);
            margin-top: 11px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            color: inherit;
            position: relative;
            z-index: 1;
            border-top: none;
        }

        .list-item:first-child {
            margin-top: 0;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            flex-wrap: nowrap;
            gap: 8px;
        }

        .list-title {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            line-height: 1.25;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Android：列表主标题（工资薪金等）Roboto 500 偏厚，略降为 400 与右侧日期粗细更协调 */
        html.platform-android .list-title {
            font-weight: 400;
            font-synthesis: none;
        }

        /*
         * iOS：PingFang 系统栈 + 列表排版按 iOS 规格微调（与 platform-android 互斥）。
         */
        html.platform-ios body,
        html.platform-ios .header-title,
        html.platform-ios .back-btn,
        html.platform-ios .header-right,
        html.platform-ios .summary-label,
        html.platform-ios .summary-value,
        html.platform-ios .list-date,
        html.platform-ios .list-title,
        html.platform-ios .list-label,

        html.platform-ios .list-company {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* iOS：汇总区字号/字重对齐官方（Android 14px） */
        html.platform-ios .summary-label,
        html.platform-ios .summary-value {
            font-size: 16px;
            font-weight: 600;
            font-synthesis: none;
        }

        /* iOS 汇总 16px：问号圆与字高一致（16×16），「?」字略小居中 */
        html.platform-ios .summary-label .icon {
            width: 16px;
            height: 16px;
            min-width: 16px;
            min-height: 16px;
            font-size: 11px;
        }

        html.platform-ios .list-item {
            /* 水平 16px（--list-inline-pad）；上下略不对称，视觉更稳 */
            padding: 17px var(--list-inline-pad) 16px;
        }

        html.platform-ios .list-header {
            margin-bottom: 2px;
        }

        html.platform-ios .list-title {
            font-size: 16px;
            line-height: 1.18;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        html.platform-ios .list-date {
            line-height: 1.18;
        }

        html.platform-ios .list-row,
        html.platform-ios .list-row-with-arrow {
            padding: 4px 0;
        }

        html.platform-ios .list-label,
        html.platform-ios .list-company {
            line-height: 1.32;
        }

        html.platform-ios .list-arrow {
            margin-top: 2px;
        }

        /*
         * iOS 16.x 等 Safari（PingFang）：汇总/列表主标题 font-weight 600 偏厚，本页统一降为 400；问号与汇总字号同高（1em）。
         * 作用域仅限 page-shuiming-result，不影响其它页面。
         */
        html.platform-ios body.page-shuiming-result .header-title {
            font-weight: 400;
            font-synthesis: none;
            letter-spacing: -0.01em;
        }

        html.platform-ios body.page-shuiming-result .summary-label,
        html.platform-ios body.page-shuiming-result .summary-value {
            font-weight: 400;
            font-synthesis: none;
        }

        html.platform-ios body.page-shuiming-result .list-title {
            font-weight: 400;
            font-synthesis: none;
            letter-spacing: -0.012em;
        }

        html.platform-ios body.page-shuiming-result .summary-label .icon {
            width: 16px;
            height: 16px;
            min-width: 16px;
            min-height: 16px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: 500;
            font-synthesis: none;
            -webkit-font-smoothing: antialiased;
            flex-shrink: 0;
        }

        .list-date {
            flex-shrink: 0;
            font-size: 16px;
            font-weight: 400;
            color: #333;
            line-height: 1.25;
            margin-right: 25px;
        }

        .list-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .list-label {
            font-size: 15px;
            color: #999;
            line-height: 1.3;
            display: block;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 与参考稿一致：明细行内强调数值可用（当前结构多用 list-label 承载「收入/税额」文案） */
        .list-value {
            font-size: 14px;
            color: #333;
        }

        .list-row-with-arrow {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 8px;
        }

        .list-row-left {

        }

        .list-company {
            font-size: 15px;
            font-weight: 400;
            color: #999;
            line-height: 1.3;
            white-space: nowrap;
            display: block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /*

         * UA: CLS-AL00 Build/HUAWEICLS-AL00 … TaxPlatformCordovaApp
         */

            font-size: 17px;
            font-weight: 500;
            letter-spacing: 0;
        }

        html.app-android-huawei-cls-al00 body.page-shuiming-result .back-btn {

        }

        html.app-android-huawei-cls-al00 body.page-shuiming-result .summary-help-with-colon,
        html.app-android-huawei-cls-al00 body.page-shuiming-result .summary-help-with-colon .summary-colon {

            border-width: 1.25px;

        /* 红米 K70 / 至尊：高分屏上再略放大，贴近汇总字高 */
        html.app-android-redmi-k70 body.page-shuiming-result .summary-label .icon,
        html.app-android-mi-family body.page-shuiming-result .summary-label .icon {
            width: 16px;

        html.app-android-redmi-k70 body.page-shuiming-result .summary-help-with-colon,
        html.app-android-mi-family body.page-shuiming-result .summary-help-with-colon,
        html.app-android-redmi-k70 body.page-shuiming-result .summary-help-with-colon .summary-colon,
        html.app-android-mi-family body.page-shuiming-result .summary-help-with-colon .summary-colon {

        }

        html.app-android-huawei-cls-al00 body.page-shuiming-result .summary-item {
            padding: 7px 0 10px;

        }

        /* iPhone 11 Pro：顶栏标题、列表主标题（工资薪金）及汇总 PingFang 偏厚，单独降字重 */
        html.app-ios-iphone11pro body.page-shuiming-result .header-title {
            font-weight: 400;
            font-synthesis: none;
            letter-spacing: -0.01em;
        }

        html.app-ios-iphone11pro body.page-shuiming-result .summary-label {
            font-weight: 400;
            font-synthesis: none;
            letter-spacing: -0.015em;
        }

        html.app-ios-iphone11pro body.page-shuiming-result .summary-value {
            font-weight: 400;
            font-synthesis: none;
        }

        html.app-ios-iphone11pro body.page-shuiming-result .list-title {
            font-weight: 400;
            font-synthesis: none;
            letter-spacing: -0.012em;

         * iPhone 14 / 15 Plus·Pro Max：顶栏从安全区下缘开始，勿用 top:0 白底盖住系统状态栏。

        html.app-ios-iphone15promax.app-top-safe-shell body.page-shuiming-result::before,

    <script>
        function syncTopFixedHeight() {
            var summary = document.querySelector('.summary');
            var root = document.querySelector('.page-root');
            function measureAndApply() {
                var pad = 102;
                if (summary) {
                    var r = summary.getBoundingClientRect();
                    var h = r.height;
                    if (!(h > 0)) {
                        h = summary.offsetHeight || summary.scrollHeight || 0;
                    }
                    if (h > 0) {
                        pad = Math.ceil(h) + 4;
                    }
                }
                if (root) {
                    root.style.setProperty('--list-summary-pad', pad + 'px');
                }
            }
            measureAndApply();
            requestAnimationFrame(function () {
                measureAndApply();
                requestAnimationFrame(measureAndApply);
            });
        }

        function initTopFixedHeightObserver() {
            var summary = document.querySelector('.summary');
            if (!summary || typeof ResizeObserver === 'undefined') return;
            var ro = new ResizeObserver(function () {
                syncTopFixedHeight();
            });
            ro.observe(summary);
        }

        function getUrlParam(name) {
            var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)');
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        function escapeHtml(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function amountSummaryInnerHtml(yuanText) {
            return escapeHtml(String(yuanText));
        }

        /**
         * 单字符在列表中的「显示宽度」：全角/中日韩等计 2，半角字母数字标点计 1（与常见「10 个汉字宽度」一致）。
         */
        function charDisplayWidth(ch) {
            var c = ch.codePointAt(0);
            if (
                (c >= 0x1100 && c <= 0x115f) ||
                (c >= 0x2e80 && c <= 0x9fff) ||
                (c >= 0xa960 && c <= 0xa97f) ||
                (c >= 0xac00 && c <= 0xd7af) ||
                (c >= 0xf900 && c <= 0xfaff) ||
                (c >= 0xfe10 && c <= 0xfe19) ||
                (c >= 0xfe30 && c <= 0xfe6f) ||
                (c >= 0xff00 && c <= 0xff60) ||
                (c >= 0xffe0 && c <= 0xffe6) ||
                (c >= 0x20000 && c <= 0x2fffd) ||
                (c >= 0x30000 && c <= 0x3fffd)
            ) {
                return 2;
            }
            return 1;
        }

        /**
         * 按「显示宽度」截断：全角/CJK 计 2，半角计 1；超出 maxDisplayWidth 则加省略号。
         * maxDisplayWidth=20 → 约 10 个汉字；=22 → 约 11 个汉字。
         */
        function truncateDisplayWidth(s, maxDisplayWidth) {
            if (s == null || s === '') return '';
            var str = String(s);
            var maxW = maxDisplayWidth;
            var w = 0;
            var out = '';
            for (var ch of str) {
                var cw = charDisplayWidth(ch);
                if (w + cw > maxW) {
                    return out + '...';
                }
                out += ch;
                w += cw;
            }
            return out;
        }

        /** 按字符数截断：超过 maxChars 个字则保留前 maxChars 字并加省略号。 */
        function truncateChars(s, maxChars) {
            if (s == null || s === '') return '';
            var str = String(s);
            var n = 0;
            var out = '';
            for (var ch of str) {
                if (n >= maxChars) {
                    return out + '...';
                }
                out += ch;
                n += 1;
            }
            return out;
        }

        /** 无记录时的空状态：shuiming_empty.png 为高清截切（仅插画+「页面空空如也」） */

            return (

                '</div></div>'
            );
        };

        function renderList(records, listYear) {
            var listHtml = '';
            records.forEach(function(record) {
                var month = record.month < 10 ? '0' + record.month : record.month;
                var subtype = record.income_subtype || '正常工资薪金';
                var company = record.company_name || '';
                var subtypeShow = truncateDisplayWidth(subtype, 20);
                var companyShow = truncateChars(company, 12);
                var id = record.id != null ? record.id : '';
                listHtml += '<a href="xiangqing.html?id=' + encodeURIComponent(id) + '&year=' + encodeURIComponent(String(listYear)) + '" class="list-item" style="text-decoration: none; display: block;">';
                listHtml += '<div class="list-header">';
                listHtml += '<span class="list-title">' + escapeHtml(record.income_type || '') + '</span>';
                listHtml += '<span class="list-date">' + escapeHtml(String(record.year) + '-' + month) + '</span>';
                listHtml += '</div>';
                listHtml += '<div class="list-row"><span class="list-label">所得项目小类：' + escapeHtml(subtypeShow) + '</span></div>';
                listHtml += '<div class="list-row-with-arrow">';
                listHtml += '<div class="list-row-left">';
                listHtml += '<div class="list-row"><span class="list-company">扣缴义务人：' + escapeHtml(companyShow) + '</span></div>';
                listHtml +=
                    '<div class="list-row"><span class="list-label">收入：<span class="list-amount">' +
                    escapeHtml(String(record.income)) +
                    '</span>元</span></div>';
                listHtml += '</div>';
                listHtml += '<img class="list-arrow" src="/jt.jpg" alt="" width="10" loading="lazy" decoding="async">';
                listHtml += '</div>';
                listHtml +=
                    '<div class="list-row"><span class="list-label">已申报税额：<span class="list-amount">' +
                    escapeHtml(String(record.tax_reported)) +
                    '</span>元</span></div>';
                listHtml += '</a>';
            });
            document.getElementById('recordList').innerHTML = listHtml || getNoRecordsHtml();
            syncRecordEmptyUi(records.length > 0);
            if (
                records.length === 0 &&
                window.ConversionGuide &&
                typeof window.ConversionGuide.onIncomeDetailEmpty === 'function'
            ) {
                window.ConversionGuide.onIncomeDetailEmpty();
            }
            if (window.UserFontSettings && window.UserFontSettings.apply) {
                window.UserFontSettings.apply(window.UserFontSettings.load());
            }
        }

        function syncRecordEmptyUi(hasRecords) {
            var root = document.querySelector('.page-root');
            if (root) root.classList.toggle('is-record-empty', !hasRecords);
            syncTopFixedHeight();
        }

        function formatYuanField(v) {
            if (v == null || v === '') return '0.00';
            return String(v);
        }

        function applyTotals(data) {
            document.getElementById('incomeTotal').innerHTML = amountSummaryInnerHtml(formatYuanField(data.income_total) + '元');
            document.getElementById('taxTotal').innerHTML = amountSummaryInnerHtml(formatYuanField(data.tax_total) + '元');

        function createPurchaseWatermarkLayer() {
            if (document.getElementById('__test_account_purchase_wm__')) {
                return;
            }
            var canvas = document.createElement('canvas');
            var dpr = window.devicePixelRatio || 1;
            var w = 260;
            var h = 160;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            var ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.translate(w / 2, h / 2);
            ctx.rotate(-24 * Math.PI / 180);
            ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = 'rgba(30, 111, 255, 0.18)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('购买后去除水印', 0, 0);

            var layer = document.createElement('div');
            layer.id = '__test_account_purchase_wm__';
            layer.className = 'test-account-watermark-layer';
            layer.style.backgroundImage = 'url(' + canvas.toDataURL('image/png') + ')';
            var root = document.querySelector('.page-root') || document.body;
            root.appendChild(layer);
        }

        function removePurchaseWatermarkLayer() {
            var el = document.getElementById('__test_account_purchase_wm__');
            if (el && el.parentNode) {
                el.parentNode.removeChild(el);
            }
        }

        function applyPurchaseWatermark(enabled) {
            if (enabled) {
                createPurchaseWatermarkLayer();
            } else {
                removePurchaseWatermarkLayer();
            }
        }

        function refreshPurchaseWatermarkForTestAccount() {
            var localIsTest = false;
            var localInactive = false;
            try {
                localIsTest = localStorage.getItem('is_test_account') === '1';
                localInactive = localStorage.getItem('account_active') === '0';
            } catch (e0) {}
            if (localIsTest && localInactive) {
                applyPurchaseWatermark(true);
            } else {
                applyPurchaseWatermark(false);
            }

            window.authFetch('api/user?action=info')
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    var d = res && res.code === 200 ? res.data : null;
                    var isTest = !!(d && d.is_test_account);
                    var isInactive = !!(d && d.account_active === false);
                    try {
                        localStorage.setItem('is_test_account', isTest ? '1' : '0');
                        if (d && d.account_active !== undefined && d.account_active !== null) {
                            localStorage.setItem('account_active', d.account_active ? '1' : '0');
                        }
                    } catch (e1) {}
                    applyPurchaseWatermark(isTest && isInactive);
                    if (typeof syncSmActivateCard === 'function') syncSmActivateCard();
                })
                .catch(function () {
                    applyPurchaseWatermark(localIsTest && localInactive);
                });
        }

        function stripShuimingBottomBar() {
            document.body.classList.remove('cg-has-value-bar');
            var bar = document.getElementById('cg-value-action-bar');
            if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
        }

        function getSelectedIncomeTypesFromUrl() {
            var raw = getUrlParam('types');
            if (raw) {
                return raw.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            }
            try {
                var stored = localStorage.getItem('selected_income_types');
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length) return parsed;
                }
            } catch (e) {}
            return null;
        }

        var SHUIMING_RECORDS_CLIENT_TTL_MS = 60000;
        var __shuimingRecordsMem = Object.create(null);
        var __shuimingRecordsInFlight = Object.create(null);

        function shuimingRecordsCacheKey(year, incomeTypes) {
            return (
                String(year) +
                '|' +
                (incomeTypes && incomeTypes.length ? incomeTypes.slice().sort().join(',') : '')
            );
        }

        function readShuimingRecordsCache(cacheKey) {
            var mem = __shuimingRecordsMem[cacheKey];
            if (mem && Date.now() - mem.t < SHUIMING_RECORDS_CLIENT_TTL_MS) {
                return mem.payload;
            }
            try {
                var raw = sessionStorage.getItem('shuiming_records_v1:' + cacheKey);
                if (!raw) return null;
                var parsed = JSON.parse(raw);
                if (
                    parsed &&
                    parsed.t &&
                    Date.now() - Number(parsed.t) < SHUIMING_RECORDS_CLIENT_TTL_MS &&
                    parsed.payload
                ) {
                    __shuimingRecordsMem[cacheKey] = { t: Number(parsed.t), payload: parsed.payload };
                    return parsed.payload;
                }
            } catch (e) {}
            return null;
        }

        function writeShuimingRecordsCache(cacheKey, payload) {
            var entry = { t: Date.now(), payload: payload };
            __shuimingRecordsMem[cacheKey] = entry;
            try {
                sessionStorage.setItem(
                    'shuiming_records_v1:' + cacheKey,
                    JSON.stringify(entry)
                );
            } catch (e) {}
        }

        function applyShuimingRecordsPayload(payload, year) {
            var records = payload && Array.isArray(payload.records) ? payload.records : [];
            applyTotals({
                income_total: payload && payload.income_total != null ? payload.income_total : '0.00',
                tax_total: payload && payload.tax_total != null ? payload.tax_total : '0.00'
            });
            renderList(records, year);
        }

        function finishShuimingPageLoading() {
            stripShuimingBottomBar();
            if (typeof window.appPageLoadingDispatchDataDone === 'function') {
                window.appPageLoadingDispatchDataDone();
            } else if (typeof window.forceHidePageLoading === 'function') {
                window.forceHidePageLoading();
            } else if (typeof window.hidePageLoading === 'function') {
                window.hidePageLoading();
            }
        }

        function loadData() {
            if (typeof window.showPageLoading === 'function') {
                window.showPageLoading();
            }
            var year = String(
                typeof normalizeTaxYear === 'function'
                    ? normalizeTaxYear(getUrlParam('year'))
                    : getUrlParam('year') || new Date().getFullYear()
            );
            var incomeTypes = getSelectedIncomeTypesFromUrl();
            var cacheKey = shuimingRecordsCacheKey(year, incomeTypes);
            var apiUrl = 'api/tax?action=records&year=' + encodeURIComponent(year);
            if (incomeTypes && incomeTypes.length) {
                apiUrl += '&types=' + encodeURIComponent(incomeTypes.join(','));
            }

            var cached = readShuimingRecordsCache(cacheKey);
            if (cached) {
                applyShuimingRecordsPayload(cached, year);
                finishShuimingPageLoading();
                return;
            }

            var fetchPromise = __shuimingRecordsInFlight[cacheKey];
            if (!fetchPromise) {
                fetchPromise = window.authFetch(apiUrl)
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (data) {
                        if (data.code === 200 && data.data) {
                            var records = data.data.records;
                            if (!Array.isArray(records)) records = [];
                            var payload = {
                                records: records,
                                income_total: data.data.income_total,
                                tax_total: data.data.tax_total
                            };
                            writeShuimingRecordsCache(cacheKey, payload);
                            return payload;
                        }
                        throw new Error('api_not_ok');
                    })
                    .finally(function () {
                        delete __shuimingRecordsInFlight[cacheKey];
                    });
                __shuimingRecordsInFlight[cacheKey] = fetchPromise;
            }

            fetchPromise
                .then(function (payload) {
                    applyShuimingRecordsPayload(payload, year);
                })
                .catch(function () {
                    applyTotals({ income_total: '0.00', tax_total: '0.00' });
                    document.getElementById('recordList').innerHTML =
                        '<div class="list-empty">无法加载数据，请确认已登录且税务记录服务可用</div>';
                    syncRecordEmptyUi(false);
                })
                .finally(function () {
                    finishShuimingPageLoading();
                });
        }

        function syncSmActivateCard() {
            var card = document.getElementById('smActivateCard');
            var btn = document.getElementById('smActivateBtn');
            if (!card) return;
            var active = false;
            var guest = false;
            try {
                active = localStorage.getItem('account_active') === '1';
                guest =
                    localStorage.getItem('landing_guest_v1') === '1' ||
                    String(localStorage.getItem('user_id') || '').indexOf('__guest_') === 0;
            } catch (e0) {}
            card.hidden = !!(active || guest);
            if (btn && !btn.dataset.bound) {
                btn.dataset.bound = '1';
                btn.addEventListener('click', function () {
                    try {
                        if (typeof window.trackUserAction === 'function') {
                            window.trackUserAction('track_activate_prompt_open', {
                                page: 'shuiming_result',
                                source: 'summary_activate_card'
                            });
                        } else if (
                            window.ConversionGuide &&
                            typeof ConversionGuide.track === 'function'
                        ) {
                            ConversionGuide.track('track_activate_prompt_open', {
                                page: 'shuiming_result',
                                source: 'summary_activate_card'
                            });
                        }
                    } catch (e1) {}
                });
            }
            syncTopFixedHeight();
        }
        window.syncSmActivateCard = syncSmActivateCard;

        function refreshActivateUiAfterReturn() {
            syncSmActivateCard();
            refreshPurchaseWatermarkForTestAccount();
            if (typeof window.refreshWatermarkFromApi === 'function') {
                window.refreshWatermarkFromApi();
            }
        }

        window.addEventListener('resize', syncTopFixedHeight);
        window.addEventListener('orientationchange', syncTopFixedHeight);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncTopFixedHeight);
        }

        initTopFixedHeightObserver();
        syncTopFixedHeight();
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
                syncTopFixedHeight();
            });
        }

        (function bindIncomeTotalHelp() {
            var help = document.getElementById('incomeTotalHelp');
            if (!help) return;
            function showIncomeHelp(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                alert('收入合计是指您在查询年度内取得的全部收入金额合计。');
            }
            help.addEventListener('click', showIncomeHelp);
            help.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') showIncomeHelp(e);
            });
        })();

        refreshPurchaseWatermarkForTestAccount();
        stripShuimingBottomBar();
        var stripBarTimer = setInterval(stripShuimingBottomBar, 400);
        setTimeout(function () { clearInterval(stripBarTimer); }, 4000);
        syncSmActivateCard();
        try {
            window.addEventListener('storage', function (ev) {
                if (!ev || !ev.key || ev.key === 'account_active' || ev.key === 'user_id' || ev.key === 'landing_guest_v1') {
                    syncSmActivateCard();
                }
            });
        } catch (e) {}
        /* 同页返回 / bfcache：storage 事件不会触发，需主动刷新激活态 UI */
        window.addEventListener('pageshow', function () {
            refreshActivateUiAfterReturn();
        });
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
                refreshActivateUiAfterReturn();
            }
        });
        loadData();
    </script>
    <script src="/js/watermark.js?v=20260727-wm-activate"></script>
</body>
