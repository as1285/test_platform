    <script>
        function syncTopFixedHeight() {
            var summary = document.querySelector('.summary');
            var list = document.getElementById('recordList');
            var root = document.querySelector('.page-root');
            function summaryContentBottom(summaryEl, summaryRect) {
                var contentBottom = 0;
                var items = summaryEl.querySelectorAll('.summary-item');
                var i;
                for (i = 0; i < items.length; i++) {
                    var ir = items[i].getBoundingClientRect();
                    if (ir.height > 0) contentBottom = Math.max(contentBottom, ir.bottom);
                }
                var activate = summaryEl.querySelector('.sm-activate-card');
                if (
                    activate &&
                    !activate.hasAttribute('hidden') &&
                    activate.getAttribute('aria-hidden') !== 'true'
                ) {
                    var cs = window.getComputedStyle(activate);
                    if (cs.display !== 'none' && cs.visibility !== 'hidden') {
                        var ar = activate.getBoundingClientRect();
                        if (ar.height > 0) contentBottom = Math.max(contentBottom, ar.bottom);
                    }
                }
                if (contentBottom <= 0) {
                    contentBottom = summaryRect.bottom;
                }
                return contentBottom;
            }
            function measureAndApply() {
                var isAndroid = false;
                try {
                    isAndroid =
                        document.documentElement.classList.contains('platform-android') ||
                        /Android/i.test(navigator.userAgent || '');
                } catch (eA) {}
                var pad = isAndroid ? 64 : 102;
                if (summary && list) {
                    var summaryRect = summary.getBoundingClientRect();
                    var listRect = list.getBoundingClientRect();
                    if (summaryRect.height > 0 && listRect.top > -1) {
                        var contentBottom = summaryContentBottom(summary, summaryRect);
                        /*
                         * 列表内容顶应对齐「汇总可见内容底 + 灰缝」，不要用整盒 bottom 再加呼吸缝，
                         * 否则 Android 上白底汇总区下方容易空出一大截。
                         */
                        var gap = isAndroid ? 8 : 2;
                        var aligned = Math.ceil(contentBottom - listRect.top + gap);
                        if (aligned > 0) {
                            pad = Math.max(isAndroid ? 52 : 48, aligned);
                        }
                        /* 列表被其它节点顶下去时，aligned 会偏小却仍留出大缝：改用汇总自身高度 */
                        var boxH = Math.ceil(summaryRect.height || 0);
                        if (isAndroid && boxH > 0) {
                            var maxPad = boxH + 4;
                            if (pad > maxPad) pad = maxPad;
                            /* list.top 明显低于 summary.top：说明上方被撑高，用盒子高度兜底 */
                            if (listRect.top > summaryRect.top + 8) {
                                pad = Math.min(pad, Math.max(52, boxH));
                            }
                        }
                    }
                }
                if (root) {
                    root.style.setProperty('--list-summary-pad', pad + 'px');
                }
                /* 二次校正：首条与汇总末行缝过大则收回；过小/重叠则加大，避免盖住列表导致点不进详情 */
                if (summary && list && root) {
                    var firstItem =
                        list.querySelector('.list-item') ||
                        list.querySelector('.list-empty') ||
                        list.querySelector('.list-empty-state');
                    if (firstItem) {
                        var sr = summary.getBoundingClientRect();
                        var cb = summaryContentBottom(summary, sr);
                        var fr = firstItem.getBoundingClientRect();
                        var visualGap = fr.top - cb;
                        var curPad = parseFloat(root.style.getPropertyValue('--list-summary-pad')) || pad;
                        var minPad = isAndroid ? 52 : 48;
                        if (visualGap > 18) {
                            var nextPad = Math.max(minPad, Math.ceil(curPad - (visualGap - 10)));
                            if (nextPad < curPad) {
                                root.style.setProperty('--list-summary-pad', nextPad + 'px');
                            }
                        } else if (visualGap < 8) {
                            var growPad = Math.max(minPad, Math.ceil(curPad + (8 - visualGap)));
                            if (growPad > curPad) {
                                root.style.setProperty('--list-summary-pad', growPad + 'px');
                            }
                        }
                    }
                }
            }
            measureAndApply();
            requestAnimationFrame(function () {
                measureAndApply();
                requestAnimationFrame(measureAndApply);
            });
        }

        function initTopFixedHeightObserver() {
            var summary = document.querySelector('.summary');
            if (!summary || typeof ResizeObserver === 'undefined') return;
            var ro = new ResizeObserver(function () {
                syncTopFixedHeight();
            });
            ro.observe(summary);
        }

        function getUrlParam(name) {
            var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)');
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        function escapeHtml(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function amountSummaryInnerHtml(yuanText) {
            return escapeHtml(String(yuanText));
        }

        /**
         * 单字符在列表中的「显示宽度」：全角/中日韩等计 2，半角字母数字标点计 1（与常见「10 个汉字宽度」一致）。
         */
        function charDisplayWidth(ch) {
            var c = ch.codePointAt(0);
            if (
                (c >= 0x1100 && c <= 0x115f) ||
                (c >= 0x2e80 && c <= 0x9fff) ||
                (c >= 0xa960 && c <= 0xa97f) ||
                (c >= 0xac00 && c <= 0xd7af) ||
                (c >= 0xf900 && c <= 0xfaff) ||
                (c >= 0xfe10 && c <= 0xfe19) ||
                (c >= 0xfe30 && c <= 0xfe6f) ||
                (c >= 0xff00 && c <= 0xff60) ||
                (c >= 0xffe0 && c <= 0xffe6) ||
                (c >= 0x20000 && c <= 0x2fffd) ||
                (c >= 0x30000 && c <= 0x3fffd)
            ) {
                return 2;
            }
            return 1;
        }

        /**
         * 按「显示宽度」截断：全角/CJK 计 2，半角计 1；超出 maxDisplayWidth 则加省略号。
         * maxDisplayWidth=20 → 约 10 个汉字；=22 → 约 11 个汉字。
         */
        function truncateDisplayWidth(s, maxDisplayWidth) {
            if (s == null || s === '') return '';
            var str = String(s);
            var maxW = maxDisplayWidth;
            var w = 0;
            var out = '';
            for (var ch of str) {
                var cw = charDisplayWidth(ch);
                if (w + cw > maxW) {
                    return out + '...';
                }
                out += ch;
                w += cw;
            }
            return out;
        }

        /** 按字符数截断：超过 maxChars 个字则保留前 maxChars 字并加省略号。 */
        function truncateChars(s, maxChars) {
            if (s == null || s === '') return '';
            var str = String(s);
            var n = 0;
            var out = '';
            for (var ch of str) {
                if (n >= maxChars) {
                    return out + '...';
                }
                out += ch;
                n += 1;
            }
            return out;
        }

        /** 无记录时的空状态：shuiming_empty.png 为高清截切（仅插画+「页面空空如也」） */
        window.getNoRecordsHtml = function getNoRecordsHtml() {
            return (
                '<div class="list-empty-state" role="status">' +
                '<div class="list-empty-illustration">' +
                '<img src="shuiming_empty.png" alt="页面空空如也" loading="lazy" decoding="async">' +
                '</div></div>'
            );
        };

        function buildXiangqingUrl(record, listYear) {
            var id = record && record.id != null ? String(record.id).trim() : '';
            if (!id) return '';
            var month = record.month != null ? Number(record.month) : 0;
            var y =
                record.year != null && String(record.year).trim() !== ''
                    ? String(record.year)
                    : String(listYear || '');
            var q = 'xiangqing.html?id=' + encodeURIComponent(id) + '&year=' + encodeURIComponent(y);
            if (month > 0) {
                q += '&month=' + encodeURIComponent(String(month));
            }
            return q;
        }

        function goXiangqingHref(href) {
            if (!href) return;
            try {
                var abs = new URL(href, window.location.href).href;
                window.location.assign(abs);
            } catch (e1) {
                try {
                    window.location.href = href;
                } catch (e2) {}
            }
        }

        function bindRecordListNavigation() {
            var list = document.getElementById('recordList');
            if (!list || list.__recordNavBound) return;
            list.__recordNavBound = true;
            /* 捕获阶段兜底：部分 WebView 上 <a> 默认跳转被吞时，用 assign 强制进入详情 */
            list.addEventListener(
                'click',
                function (ev) {
                    var item = ev.target.closest('a.list-item');
                    if (!item) return;
                    var href = item.getAttribute('href') || '';
                    if (!href || href.indexOf('xiangqing.html') < 0) return;
                    var idMatch = href.match(/[?&]id=([^&]+)/);
                    if (!idMatch || !decodeURIComponent(idMatch[1] || '').trim()) {
                        ev.preventDefault();
                        alert('该记录缺少编号，请返回重新生成或刷新列表后再试。');
                        return;
                    }
                    /* 不 preventDefault：优先走原生 <a>；若被其它脚本拦下再兜底 */
                    setTimeout(function () {
                        try {
                            if (document.visibilityState === 'hidden') return;
                            if (String(window.location.href || '').indexOf('xiangqing.html') >= 0) return;
                        } catch (e0) {}
                        goXiangqingHref(href);
                    }, 120);
                },
                true
            );
        }

        function renderList(records, listYear) {
            var listHtml = '';
            records.forEach(function(record) {
                var month = record.month < 10 ? '0' + record.month : record.month;
                var subtype = record.income_subtype || '正常工资薪金';
                var company = record.company_name || '';
                var subtypeShow = truncateDisplayWidth(subtype, 20);
                var companyShow = company;
                var id = record.id != null ? String(record.id).trim() : '';
                var detailHref = buildXiangqingUrl(record, listYear);
                if (!detailHref) {
                    listHtml +=
                        '<div class="list-item list-item-disabled" style="text-decoration: none; display: block; opacity: 0.72;">';
                } else {
                    listHtml +=
                        '<a href="' +
                        detailHref +
                        '" class="list-item" style="text-decoration: none; display: block;">';
                }
                listHtml += '<div class="list-header">';
                listHtml += '<span class="list-title">' + escapeHtml(record.income_type || '') + '</span>';
                listHtml += '<span class="list-date">' + escapeHtml(String(record.year) + '-' + month) + '</span>';
                listHtml += '</div>';
                listHtml += '<div class="list-row"><span class="list-label">所得项目小类：' + escapeHtml(subtypeShow) + '</span></div>';
                listHtml += '<div class="list-row-with-arrow">';
                listHtml += '<div class="list-row-left">';
                listHtml += '<div class="list-row"><span class="list-company">扣缴义务人：' + escapeHtml(companyShow) + '</span></div>';
                listHtml +=
                    '<div class="list-row"><span class="list-label">收入：<span class="list-amount">' +
                    escapeHtml(String(record.income)) +
                    '</span>元</span></div>';
                listHtml += '</div>';
                listHtml += '<img class="list-arrow" src="/jt.jpg" alt="" width="10" loading="lazy" decoding="async">';
                listHtml += '</div>';
                listHtml +=
                    '<div class="list-row"><span class="list-label">已申报税额：<span class="list-amount">' +
                    escapeHtml(String(record.tax_reported)) +
                    '</span>元</span></div>';
                listHtml += detailHref ? '</a>' : '</div>';
            });
            document.getElementById('recordList').innerHTML = listHtml || getNoRecordsHtml();
            syncRecordEmptyUi(records.length > 0);
            bindRecordListNavigation();
            if (
                records.length === 0 &&
                window.ConversionGuide &&
                typeof window.ConversionGuide.onIncomeDetailEmpty === 'function'
            ) {
                window.ConversionGuide.onIncomeDetailEmpty();
            }
            if (window.UserFontSettings && window.UserFontSettings.apply) {
                window.UserFontSettings.apply(window.UserFontSettings.load());
            }
            requestAnimationFrame(syncTopFixedHeight);
        }

        function syncRecordEmptyUi(hasRecords) {
            var root = document.querySelector('.page-root');
            if (root) root.classList.toggle('is-record-empty', !hasRecords);
            syncTopFixedHeight();
        }

        function formatYuanField(v) {
            if (v == null || v === '') return '0.00';
            return String(v);
        }

        function applyTotals(data) {
            document.getElementById('incomeTotal').innerHTML = amountSummaryInnerHtml(formatYuanField(data.income_total) + '元');
            document.getElementById('taxTotal').innerHTML = amountSummaryInnerHtml(formatYuanField(data.tax_total) + '元');
            requestAnimationFrame(syncTopFixedHeight);
        }

        function createPurchaseWatermarkLayer() {
            if (document.getElementById('__test_account_purchase_wm__')) {
                return;
            }
            var canvas = document.createElement('canvas');
            var dpr = window.devicePixelRatio || 1;
            var w = 260;
            var h = 160;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            var ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.translate(w / 2, h / 2);
            ctx.rotate(-24 * Math.PI / 180);
            ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = 'rgba(30, 111, 255, 0.18)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('购买后去除水印', 0, 0);

            var layer = document.createElement('div');
            layer.id = '__test_account_purchase_wm__';
            layer.className = 'test-account-watermark-layer';
            layer.style.backgroundImage = 'url(' + canvas.toDataURL('image/png') + ')';
            var root = document.querySelector('.page-root') || document.body;
            root.appendChild(layer);
        }

        function removePurchaseWatermarkLayer() {
            var el = document.getElementById('__test_account_purchase_wm__');
            if (el && el.parentNode) {
                el.parentNode.removeChild(el);
            }
        }

        function applyPurchaseWatermark(enabled) {
            if (enabled) {
                createPurchaseWatermarkLayer();
            } else {
                removePurchaseWatermarkLayer();
            }
        }

        function refreshPurchaseWatermarkForTestAccount() {
            var localIsTest = false;
            var localInactive = false;
            try {
                localIsTest = localStorage.getItem('is_test_account') === '1';
                localInactive = localStorage.getItem('account_active') === '0';
            } catch (e0) {}
            if (localIsTest && localInactive) {
                applyPurchaseWatermark(true);
            } else {
                applyPurchaseWatermark(false);
            }

            window.authFetch('api/user?action=info')
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    var d = res && res.code === 200 ? res.data : null;
                    var isTest = !!(d && d.is_test_account);
                    var isInactive = !!(d && d.account_active === false);
                    try {
                        localStorage.setItem('is_test_account', isTest ? '1' : '0');
                        if (d && d.account_active !== undefined && d.account_active !== null) {
                            localStorage.setItem('account_active', d.account_active ? '1' : '0');
                        }
                    } catch (e1) {}
                    applyPurchaseWatermark(isTest && isInactive);
                    if (typeof syncSmActivateCard === 'function') syncSmActivateCard();
                })
                .catch(function () {
                    applyPurchaseWatermark(localIsTest && localInactive);
                });
        }

        function stripShuimingBottomBar() {
            document.body.classList.remove('cg-has-value-bar');
            var bar = document.getElementById('cg-value-action-bar');
            if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
        }

        function getSelectedIncomeTypesFromUrl() {
            var raw = getUrlParam('types');
            if (raw) {
                return raw.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            }
            try {
                var stored = localStorage.getItem('selected_income_types');
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length) return parsed;
                }
            } catch (e) {}
            return null;
        }

        var SHUIMING_RECORDS_CLIENT_TTL_MS = 60000;
        var __shuimingRecordsMem = Object.create(null);
        var __shuimingRecordsInFlight = Object.create(null);

        function shuimingRecordsCacheKey(year, incomeTypes) {
            return (
                String(year) +
                '|' +
                (incomeTypes && incomeTypes.length ? incomeTypes.slice().sort().join(',') : '')
            );
        }

        function readShuimingRecordsCache(cacheKey) {
            var mem = __shuimingRecordsMem[cacheKey];
            if (mem && Date.now() - mem.t < SHUIMING_RECORDS_CLIENT_TTL_MS) {
                return mem.payload;
            }
            try {
                var raw = sessionStorage.getItem('shuiming_records_v1:' + cacheKey);
                if (!raw) return null;
                var parsed = JSON.parse(raw);
                if (
                    parsed &&
                    parsed.t &&
                    Date.now() - Number(parsed.t) < SHUIMING_RECORDS_CLIENT_TTL_MS &&
                    parsed.payload
                ) {
                    __shuimingRecordsMem[cacheKey] = { t: Number(parsed.t), payload: parsed.payload };
                    return parsed.payload;
                }
            } catch (e) {}
            return null;
        }

        function writeShuimingRecordsCache(cacheKey, payload) {
            var entry = { t: Date.now(), payload: payload };
            __shuimingRecordsMem[cacheKey] = entry;
            try {
                sessionStorage.setItem(
                    'shuiming_records_v1:' + cacheKey,
                    JSON.stringify(entry)
                );
            } catch (e) {}
        }

        function applyShuimingRecordsPayload(payload, year) {
            var records = payload && Array.isArray(payload.records) ? payload.records : [];
            applyTotals({
                income_total: payload && payload.income_total != null ? payload.income_total : '0.00',
                tax_total: payload && payload.tax_total != null ? payload.tax_total : '0.00'
            });
            renderList(records, year);
        }

        function finishShuimingPageLoading() {
            stripShuimingBottomBar();
            if (typeof window.appPageLoadingDispatchDataDone === 'function') {
                window.appPageLoadingDispatchDataDone();
            }
            /* 双保险：避免仅 dispatch、lifecycle 已 finished 时遮罩残留 */
            if (typeof window.forceHidePageLoading === 'function') {
                window.forceHidePageLoading();
            } else if (typeof window.hidePageLoading === 'function') {
                window.hidePageLoading();
            }
        }

        function listStillShowingSpinner() {
            var list = document.getElementById('recordList');
            return !!(list && list.querySelector('.list-loading-spin'));
        }

        function loadData(opts) {
            opts = opts || {};
            var quiet = !!opts.quiet;
            if (!quiet && typeof window.showPageLoading === 'function') {
                window.showPageLoading();
            }
            var year = String(
                typeof normalizeTaxYear === 'function'
                    ? normalizeTaxYear(getUrlParam('year'))
                    : getUrlParam('year') || new Date().getFullYear()
            );
            var incomeTypes = getSelectedIncomeTypesFromUrl();
            var cacheKey = shuimingRecordsCacheKey(year, incomeTypes);
            var apiUrl = 'api/tax?action=records&year=' + encodeURIComponent(year);
            if (incomeTypes && incomeTypes.length) {
                apiUrl += '&types=' + encodeURIComponent(incomeTypes.join(','));
            }

            var cached = readShuimingRecordsCache(cacheKey);
            if (cached) {
                applyShuimingRecordsPayload(cached, year);
                finishShuimingPageLoading();
                return;
            }

            var fetchPromise = __shuimingRecordsInFlight[cacheKey];
            if (!fetchPromise) {
                try {
                    fetchPromise = window.authFetch(apiUrl)
                        .then(function (response) {
                            return response.json();
                        })
                        .then(function (data) {
                            if (data.code === 200 && data.data) {
                                var records = data.data.records;
                                if (!Array.isArray(records)) records = [];
                                var payload = {
                                    records: records,
                                    income_total: data.data.income_total,
                                    tax_total: data.data.tax_total
                                };
                                writeShuimingRecordsCache(cacheKey, payload);
                                return payload;
                            }
                            throw new Error('api_not_ok');
                        })
                        .finally(function () {
                            delete __shuimingRecordsInFlight[cacheKey];
                        });
                    __shuimingRecordsInFlight[cacheKey] = fetchPromise;
                } catch (eFetch) {
                    applyTotals({ income_total: '0.00', tax_total: '0.00' });
                    var listEl = document.getElementById('recordList');
                    if (listEl) {
                        listEl.innerHTML =
                            '<div class="list-empty">无法加载数据，请确认已登录且税务记录服务可用</div>';
                    }
                    syncRecordEmptyUi(false);
                    finishShuimingPageLoading();
                    return;
                }
            }

            fetchPromise
                .then(function (payload) {
                    applyShuimingRecordsPayload(payload, year);
                })
                .catch(function () {
                    applyTotals({ income_total: '0.00', tax_total: '0.00' });
                    document.getElementById('recordList').innerHTML =
                        '<div class="list-empty">无法加载数据，请确认已登录且税务记录服务可用</div>';
                    syncRecordEmptyUi(false);
                })
                .finally(function () {
                    finishShuimingPageLoading();
                });
        }

        function syncSmActivateCard() {
            var card = document.getElementById('smActivateCard');
            var btn = document.getElementById('smActivateBtn');
            if (!card) return;
            var active = false;
            var guest = false;
            try {
                active = localStorage.getItem('account_active') === '1';
                guest =
                    localStorage.getItem('landing_guest_v1') === '1' ||
                    String(localStorage.getItem('user_id') || '').indexOf('__guest_') === 0;
            } catch (e0) {}
            card.hidden = !!(active || guest);
            if (btn && !btn.dataset.bound) {
                btn.dataset.bound = '1';
                btn.addEventListener('click', function () {
                    try {
                        if (typeof window.trackUserAction === 'function') {
                            window.trackUserAction('track_activate_prompt_open', {
                                page: 'shuiming_result',
                                source: 'summary_activate_card'
                            });
                        } else if (
                            window.ConversionGuide &&
                            typeof ConversionGuide.track === 'function'
                        ) {
                            ConversionGuide.track('track_activate_prompt_open', {
                                page: 'shuiming_result',
                                source: 'summary_activate_card'
                            });
                        }
                    } catch (e1) {}
                });
            }
            syncTopFixedHeight();
        }
        window.syncSmActivateCard = syncSmActivateCard;

        function refreshActivateUiAfterReturn() {
            syncSmActivateCard();
            refreshPurchaseWatermarkForTestAccount();
            if (typeof window.refreshWatermarkFromApi === 'function') {
                window.refreshWatermarkFromApi();
            }
        }

        window.addEventListener('resize', syncTopFixedHeight);
        window.addEventListener('orientationchange', syncTopFixedHeight);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncTopFixedHeight);
        }

        initTopFixedHeightObserver();
        syncTopFixedHeight();
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
                syncTopFixedHeight();
            });
        }

        (function bindIncomeTotalHelp() {
            var help = document.getElementById('incomeTotalHelp');
            if (!help) return;
            function showIncomeHelp(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                alert('收入合计是指您在查询年度内取得的全部收入金额合计。');
            }
            help.addEventListener('click', showIncomeHelp);
            help.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') showIncomeHelp(e);
            });
        })();

        refreshPurchaseWatermarkForTestAccount();
        stripShuimingBottomBar();
        var stripBarTimer = setInterval(stripShuimingBottomBar, 400);
        setTimeout(function () { clearInterval(stripBarTimer); }, 4000);
        syncSmActivateCard();
        try {
            window.addEventListener('storage', function (ev) {
                if (!ev || !ev.key || ev.key === 'account_active' || ev.key === 'user_id' || ev.key === 'landing_guest_v1') {
                    syncSmActivateCard();
                }
            });
        } catch (e) {}
        /* 同页返回 / bfcache：storage 事件不会触发，需主动刷新激活态 UI；并关掉残留转圈 */
        window.addEventListener('pageshow', function (ev) {
            refreshActivateUiAfterReturn();
            finishShuimingPageLoading();
            if (ev && ev.persisted && listStillShowingSpinner()) {
                loadData({ quiet: true });
            }
        });
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
                refreshActivateUiAfterReturn();
                finishShuimingPageLoading();
            }
        });
        loadData();

        (function killLegacyWmPayChip() {
            function removeChip() {
                var el = document.getElementById('cg-wm-pay-chip');
                if (el && el.parentNode) el.parentNode.removeChild(el);
            }
            removeChip();
            try {
                var obs = new MutationObserver(function () {
                    removeChip();
                });
                obs.observe(document.documentElement, { childList: true, subtree: true });
                setTimeout(function () {
                    try {
                        obs.disconnect();
                    } catch (e0) {}
                    removeChip();
                }, 8000);
            } catch (e1) {
                setTimeout(removeChip, 800);
                setTimeout(removeChip, 2500);
            }
        })();
    </script>
    <script src="/js/watermark.js?v=20260807-wm-inside-root"></script>
</body>
