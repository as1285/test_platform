<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260827-mi14pro-e1bg"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>综合所得年度汇算</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }
        /* erji.jpg 为整页切图：仅展示顶栏+插画，下方用 HTML 按钮保证可点 */
        .page-hero {
            position: relative;
            width: 100%;
            overflow: hidden;
            max-height: clamp(168px, 42vw, 240px);
            line-height: 0;
        }
        .page-hero-img {
            width: 100%;
            display: block;
            vertical-align: top;
        }
        .page-hero-hit {
            position: absolute;
            display: block;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            z-index: 2;
        }
        .page-hero-hit-back {
            left: 0;
            top: 0;
            width: 30%;
            height: 45%;
            min-height: 44px;
        }
        .panel {
            margin: -10px 12px 24px;
            position: relative;
            z-index: 3;
            background: #fff;
            border-radius: 12px;
            padding: 18px 16px 22px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        .warm-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .warm-list {
            font-size: 14px;
            color: #888;
            line-height: 1.65;
            padding-left: 18px;
            margin-bottom: 20px;
        }
        .warm-list li { margin-bottom: 8px; }
        .year-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 4px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 20px;
            font-size: 15px;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        .year-row .year-val {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333;
            font-weight: 500;
        }
        .year-row .chev {
            color: #ccc;
            font-size: 18px;
            font-weight: 300;
        }
        .btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 14px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            position: relative;
            z-index: 1;
            cursor: pointer;
        }
        .btn:last-child {
            margin-bottom: 0;
        }
        .btn-primary {
            background: linear-gradient(180deg, #3d8dff 0%, #1e6fff 100%);
            color: #fff;
            border: none;
            box-shadow: 0 4px 12px rgba(30, 111, 255, 0.35);
        }
        .btn-outline {
            background: #fff;
            color: #1e6fff;
            border: 1px solid #1e6fff;
        }
        .footer-link {
            display: block;
            text-align: center;
            padding: 20px 16px 28px;
            font-size: 14px;
            color: #999;
            text-decoration: none;
        }
        html.app-top-safe-shell body.page-zonghe {
            padding-top: 0;
        }
    </style>
    <link rel="stylesheet" href="css/nav.css">
    <script src="/js/theme-loader.js?v=20260827-cend-sync" defer></script>
</head>
<body class="page-zonghe">
    <div class="page-hero">
        <img class="page-hero-img" src="erji.jpg?v=3" alt="综合所得年度汇算">
        <a href="bancha.html" class="page-hero-hit page-hero-hit-back" aria-label="返回"></a>
    </div>
    <div class="panel">
        <h2 class="warm-title">温馨提示</h2>
        <ul class="warm-list">
            <li>如您仅有境内所得且需要办理汇算，请选择申报年度后点击下方「开始申报」。</li>
            <li>您可点击「查看申报记录」查询以往申报情况。</li>
        </ul>
        <div class="year-row" id="yearRow" role="button" tabindex="0">
            <span>申报年度</span>
            <span class="year-val"><span id="yearDisplay">2025</span><span class="chev">›</span></span>
        </div>
        <a class="btn btn-primary" href="shenbao_jilu.html" id="btnStartDeclare">开始申报</a>
        <a class="btn btn-outline" href="shenbao_jilu.html" id="btnViewRecords">查看申报记录</a>
    </div>
    <a href="javascript:void(0)" class="footer-link" id="linkOverseas">取得了境外所得，点击这里</a>
    <script src="/js/watermark.js?v=20260827-cend-sync"></script>
    <script>
        (function () {
            var row = document.getElementById('yearRow');
            var years = ['2025', '2024', '2023'];
            var idx = 0;
            var disp = document.getElementById('yearDisplay');
            function cycle() {
                idx = (idx + 1) % years.length;
                disp.textContent = years[idx];
            }
            row.addEventListener('click', cycle);
            row.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    cycle();
                }
            });
            document.getElementById('linkOverseas').addEventListener('click', function (e) {
                e.preventDefault();
            });
        })();
    </script>
</body>
</html>
