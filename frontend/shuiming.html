            color: #333;
            font-size: 16px;
            line-height: 22px;
            font-weight: 400;
            pointer-events: none;
        }
        
        .year-chevron-wrap {
            flex: 0 0 auto;
            width: 22px;
            height: 22px;
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }
        
        .year-chevron {
            width: 12px;
            height: 12px;
            color: #d1d3d8;
            flex-shrink: 0;
        }

        .year-chevron path {
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        
        /* 所得类型列表（白底由外层 .form-section-card 提供） */
        .type-list {
            background: transparent;
            margin: 0;
            border-radius: 0;
        }
        
        .type-item {
            padding: 12px var(--form-card-pad-x);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e3e4e8;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        .type-item:last-child {
            border-bottom: none;
        }

        /* 第四项与「其他类型」之间只保留一条分隔线（由 .type-toggle 的 border-top 承担） */
        .type-list > .type-item:nth-child(4) {
            border-bottom: none;
        }
        
        /* 官方 iconfont 勾选约 16–20px，选中 #4285f4 / 未选 #d1d3d8 */
        .check-icon {
            width: 18px;
            height: 18px;
            background: #4285f4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .check-icon svg {
            width: 10px;
            height: 10px;
        }
        
        .check-icon.check-off {
            background: transparent;
            border: 1.5px solid #d1d3d8;
            box-sizing: border-box;
        }
        .check-icon.check-off svg {
            display: none;
        }
        
        .type-text {
            font-size: 16px;
            line-height: 22px;
            font-weight: 400;
            color: #333;
        }
        
        .income-types-extra {
            display: none;
        }
        .income-types-extra.is-open {
            display: block;
        }
        
        /* 展开 / 收起：官方 .show-all-line #257cf5 */
        .type-toggle {
            padding: 12px var(--form-card-pad-x);
            color: #257cf5;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            border-top: 1px solid #e3e4e8;
        }
        .type-toggle.hidden {
            display: none;
        }
        .type-toggle-text {
            flex: 0 0 auto;
        }
        /* 官方 IncomeTaxPayment .show-all-line img：15×15 位图，全机型同一张；展开 scaleY(-1) */
        .type-toggle-caret {
            width: 15px;
            height: 15px;
            margin-left: 4px;
            display: block;
            flex-shrink: 0;
            border: 0;
        }
        .type-toggle-caret.zhankai {
            -webkit-transform: scaleY(-1);
            transform: scaleY(-1);
        }
        .type-toggle-caret.shousuo {
            -webkit-transform: scaleY(1);
            transform: scaleY(1);
        }
        
        /* 官方 .income-query-btn margin-top .85333333rem ≈ 32px */
        .query-btn-wrapper {
            padding: 32px 16px 40px;
            padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
            background: #f4f6f9;
        }
        
        /* 官方 .zdj-btn_primary 渐变；圆角取截图约 8px（非 pill） */
        .query-btn {
            width: 100%;
            max-width: 100%;
            height: 44px;
            background-image: linear-gradient(135deg, #257cf5, #4d97ff);
            background-color: #257cf5;
            box-shadow: 0 12px 32px 0 rgba(37, 123, 245, 0.3);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-size: 16px;
            font-weight: 500;
            line-height: 44px;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 日期选择器遮罩 */
        .picker-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
        }
        
        .picker-overlay.show {
            display: block;
        }
        
        /* 日期选择器 */
        .year-picker {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 16px 16px 0 0;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        
        .year-picker.show {
            transform: translateY(0);
        }
        
        .picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #e3e4e8;
        }
        
        .picker-cancel {
            color: #666;
            font-size: 16px;
            font-weight: 400;
            font-family: inherit;
            background: none;
            border: none;
            cursor: pointer;
        }
        
        .picker-confirm {
            color: #4285f4;
            font-size: 16px;
            font-weight: 400;
            font-family: inherit;
            background: none;
            border: none;
            cursor: pointer;
        }
        
        /* iOS风格滚轮选择器 */
        .picker-wrapper {
            position: relative;
            height: 200px;
            overflow: hidden;
        }
        
        /* 中间选中区域的灰色线条指示器 */
        .picker-indicator {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 40px;
            pointer-events: none;
            z-index: 2;
        }
        
        .picker-indicator::before,
        .picker-indicator::after {
            content: '';
            position: absolute;
            left: 16px;
            right: 16px;
            height: 1px;
            background: #e0e0e0;
        }
        
        .picker-indicator::before {
            top: 0;
        }
        
        .picker-indicator::after {
            bottom: 0;
        }
        
        /* 上下渐变遮罩 */
        .picker-mask-top,
        .picker-mask-bottom {
            position: absolute;
            left: 0;
            right: 0;
            height: 80px;
            pointer-events: none;
            z-index: 1;
        }
        
        .picker-mask-top {
            top: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
        }
        
        .picker-mask-bottom {
            bottom: 0;
            background: linear-gradient(to top, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 100%);
        }
        
        .picker-list {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .picker-list::-webkit-scrollbar {
            display: none;
        }
        
        /* 上下留白，让第一个和最后一个选项能滚动到中间 */
        .picker-list::before,
        .picker-list::after {
            content: '';
            display: block;
            height: 80px;
        }
        
        .picker-item {
            height: 40px;
            line-height: 40px;
            text-align: center;
            font-size: 18px;
            color: #999;
            cursor: pointer;
            scroll-snap-align: center;
            transition: color 0.2s ease;
        }
        
        .picker-item.selected {
            color: #333;
            font-weight: 500;
        }
    </style>
</head>

    <div class="year-picker" id="yearPicker">

            <div class="picker-mask-bottom"></div>
            <!-- 滚动列表：由 tax-year.js 动态填充 2019…当前年 -->

        </div>

    <script src="/js/tax-year.js?v=20260816-year-from-2019"></script>
    <script>
        (function () {
            var HOME = 'shouye.html';
            var BANCHA = 'bancha.html';
            var back = document.getElementById('shuimingBack');
            if (!back) return;
            function resolveBackTarget() {
                try {
                    var ref = String(document.referrer || '');
                    if (/bancha\.html(?:[?#]|$)/i.test(ref)) return BANCHA;
                    if (/shouye\.html(?:[?#]|$)/i.test(ref)) return HOME;
                } catch (e0) {}
                try {
                    if (/[?&]reset=1(?:&|$)/.test(String(location.search || ''))) return HOME;
                } catch (e1) {}
                return HOME;
            }
            back.setAttribute('href', resolveBackTarget());
            back.addEventListener('click', function (e) {
                e.preventDefault();
                var href = resolveBackTarget();
                try {
                    window.location.assign(href);
                } catch (e2) {
                    window.location.href = href;
                }
            });
        })();

        const yearSelect = document.getElementById('yearSelect');
        const yearDisplay = document.getElementById('yearDisplay');
        const pickerOverlay = document.getElementById('pickerOverlay');
        const yearPicker = document.getElementById('yearPicker');
        const pickerCancel = document.getElementById('pickerCancel');
        const pickerConfirm = document.getElementById('pickerConfirm');
        const pickerList = document.getElementById('pickerList');
        const itemHeight = 40;

        function getPickerItems() {
            return pickerList.querySelectorAll('.picker-item');
        }

        function buildYearPickerList() {
            var years = typeof listTaxYears === 'function' ? listTaxYears() : [];
            if (!years.length) {
                var maxY = typeof getMaxTaxYear === 'function' ? getMaxTaxYear() : new Date().getFullYear();
                var minY = typeof getMinTaxYear === 'function' ? getMinTaxYear() : 2019;
                for (var y = minY; y <= maxY; y++) years.push(y);
            }
            pickerList.innerHTML = '';
            years.forEach(function (y) {
                var el = document.createElement('div');
                el.className = 'picker-item';
                el.setAttribute('data-year', String(y));
                el.textContent = String(y);
                pickerList.appendChild(el);
            });
            getPickerItems().forEach(function (item, index) {
                item.addEventListener('click', function () {
                    pickerList.scrollTo({
                        top: index * itemHeight,
                        behavior: 'smooth'
                    });
                });
            });
        }

        buildYearPickerList();

        // 从URL参数或localStorage获取上次选择的年份，默认当前年份（2019–当前年）
        function getInitialYear() {
            var urlParams = new URLSearchParams(window.location.search);
            // reset=1 时清除记忆，回到当前年份
            if (urlParams.get('reset') === '1') {
                localStorage.removeItem('selected_year');
                return String(normalizeTaxYear(null));
            }
            // 优先从URL参数获取
            var yearFromUrl = urlParams.get('year');
            if (yearFromUrl) return String(normalizeTaxYear(yearFromUrl));
            // 其次从localStorage获取
            var yearFromStorage = localStorage.getItem('selected_year');
            if (yearFromStorage) return String(normalizeTaxYear(yearFromStorage));
            // 默认当前年份
            return String(normalizeTaxYear(null));
        }
        
        let selectedYear = getInitialYear();
        
        // 初始化显示（纠正 localStorage / 异常系统时间）
        yearDisplay.textContent = selectedYear;
        try {
            localStorage.setItem('selected_year', selectedYear);
        } catch (e) {}
        
        // 打开选择器
        yearSelect.addEventListener('click', function() {
            pickerOverlay.classList.add('show');
            yearPicker.classList.add('show');
            // 滚动到当前选中的年份
            scrollToYear(selectedYear);
        });
        
        // 滚动到指定年份
        function scrollToYear(year) {
            const items = Array.from(getPickerItems());
            const index = items.findIndex(item => item.dataset.year === String(year));
            if (index !== -1) {
                // 滚动位置 = 选项索引 * 选项高度
                pickerList.scrollTop = index * itemHeight;
            }
        }
        
        // 关闭选择器
        function closePicker() {
            pickerOverlay.classList.remove('show');
            yearPicker.classList.remove('show');
        }
        
        pickerOverlay.addEventListener('click', closePicker);
        pickerCancel.addEventListener('click', closePicker);
        
        // 滚动时更新选中状态
        let scrollTimer = null;
        pickerList.addEventListener('scroll', function() {
            // 实时更新选中样式
            updateSelectedItem();
            
            // 滚动停止后自动对齐
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(function() {
                snapToItem();
            }, 100);
        });
        
        // 根据滚动位置更新选中的选项（仅在选择器打开时生效，避免 WebView 初始化误改年份）
        function updateSelectedItem() {
            if (!yearPicker.classList.contains('show')) return;
            const scrollTop = pickerList.scrollTop;
            const centerIndex = Math.round(scrollTop / itemHeight);
            const pickerItems = getPickerItems();
            
            pickerItems.forEach((item, index) => {
                if (index === centerIndex) {
                    item.classList.add('selected');
                    selectedYear = item.dataset.year;
                } else {
                    item.classList.remove('selected');
                }
            });
        }
        
        // 滚动停止后对齐到最近的选项
        function snapToItem() {
            const scrollTop = pickerList.scrollTop;
            const targetIndex = Math.round(scrollTop / itemHeight);
            const targetScrollTop = targetIndex * itemHeight;
            
            pickerList.scrollTo({
                top: targetScrollTop,
                behavior: 'smooth'
            });
        }
        
        // 确定选择
        pickerConfirm.addEventListener('click', function() {
            selectedYear = String(normalizeTaxYear(selectedYear));
            yearDisplay.textContent = selectedYear;
            closePicker();
        });
        
        function getSelectedIncomeTypes() {
            var types = [];
            document.querySelectorAll('.type-list .type-item').forEach(function (item) {
                var icon = item.querySelector('.check-icon');
                var textEl = item.querySelector('.type-text');
                if (!icon || icon.classList.contains('check-off') || !textEl) return;
                var label = textEl.textContent.trim();
                if (label) types.push(label);
            });
            return types;
        }

        function setIncomeTypeSelections(labels) {
            if (!Array.isArray(labels) || !labels.length) return;
            var labelSet = {};
            labels.forEach(function (l) { labelSet[String(l).trim()] = true; });
            document.querySelectorAll('.type-list .type-item').forEach(function (item) {
                var icon = item.querySelector('.check-icon');
                var textEl = item.querySelector('.type-text');
                if (!icon || !textEl) return;
                var on = !!labelSet[textEl.textContent.trim()];
                icon.classList.toggle('check-off', !on);
                item.setAttribute('aria-checked', on ? 'true' : 'false');
            });
        }

        try {
            var savedTypes = localStorage.getItem('selected_income_types');
            if (savedTypes) setIncomeTypeSelections(JSON.parse(savedTypes));
        } catch (e) {}

        // 查询（未激活也可进入结果页）
        function doQuery() {
            selectedYear = String(normalizeTaxYear(selectedYear));
            yearDisplay.textContent = selectedYear;
            localStorage.setItem('selected_year', selectedYear);
            var types = getSelectedIncomeTypes();
            if (!types.length) {
                alert('请至少选择一种所得类型');
                return;
            }
            try {
                localStorage.setItem('selected_income_types', JSON.stringify(types));
            } catch (e) {}
            var q = 'year=' + encodeURIComponent(selectedYear) +
                '&types=' + encodeURIComponent(types.join(','));
            /* location.href 不会走 <a> 点击拦截，需手动显示全页转圈 */
            if (typeof window.showPageLoading === 'function') {
                window.showPageLoading();
            }
            window.location.href = 'shuiming_result.html?' + q;
        }
        
        // 所得类型：默认四项，点击「其他类型」展开全部，「收起」还原
        (function () {
            var extra = document.getElementById('incomeTypesExtra');
            var btnExpand = document.getElementById('btnExpandTypes');
            var btnCollapse = document.getElementById('btnCollapseTypes');
            if (!extra || !btnExpand || !btnCollapse) return;
            function setExpanded(open) {
                extra.classList.toggle('is-open', open);
                extra.setAttribute('aria-hidden', open ? 'false' : 'true');
                btnExpand.classList.toggle('hidden', open);
                btnCollapse.classList.toggle('hidden', !open);
                btnExpand.setAttribute('aria-expanded', open ? 'true' : 'false');
                btnCollapse.setAttribute('aria-expanded', open ? 'true' : 'false');
            }
            btnExpand.addEventListener('click', function () { setExpanded(true); });
            btnCollapse.addEventListener('click', function () { setExpanded(false); });
        })();

        // 所得类型：多选，点击行切换勾选
        (function () {
            var list = document.querySelector('.type-list');
            if (!list) return;

            function syncAria(item) {
                var icon = item.querySelector('.check-icon');
                if (!icon) return;
                var on = !icon.classList.contains('check-off');
                item.setAttribute('aria-checked', on ? 'true' : 'false');
            }

            function toggleItem(item) {
                var icon = item.querySelector('.check-icon');
                if (!icon) return;
                icon.classList.toggle('check-off');
                syncAria(item);
            }

            list.addEventListener('click', function (e) {
                var item = e.target.closest('.type-item');
                if (!item || !list.contains(item)) return;
                toggleItem(item);
            });

            list.addEventListener('keydown', function (e) {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                var item = e.target.closest('.type-item');
                if (!item || !list.contains(item)) return;
                e.preventDefault();
                toggleItem(item);
            });
        })();
    </script>
</body>
</html>
