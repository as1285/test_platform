<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/admin_auth.js?v=20260721-p2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理员登录</title>
    <link rel="stylesheet" href="/css/admin_login.css?v=20260721-p2">
</head>
<body>
    <div class="card">
        <h1>管理后台</h1>
        <div class="field">
            <label for="u">账号</label>
            <input type="text" id="u" autocomplete="username" placeholder="管理员账号">
        </div>
        <div class="field">
            <label for="p">密码</label>
            <input type="password" id="p" autocomplete="current-password" placeholder="密码">
        </div>
        <p class="err" id="err"></p>
        <button type="button" class="btn" id="btn">登录</button>
        <div class="back"><a href="/index.html">返回用户登录</a></div>
    </div>
    <script src="/js/admin/login.js?v=20260721-p2"></script>
</body>
</html>
