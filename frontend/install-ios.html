<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2c80f4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="个人所得税">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <title>安装引导</title>
    <script>
        /* 已安装（主屏幕 WebClip）时跳转登录页 */
        (function () {
            function isHomeScreenApp() {
                try {
                    if (window.navigator && window.navigator.standalone === true) return true;
                } catch (e0) {}
                try {
                    return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
                } catch (e1) {
                    return false;
                }
            }
            function loginHref() {
                try {
                    var u = new URL('/index.html', window.location.origin);
                    var q = new URLSearchParams(window.location.search || '');
                    ['ch', 'utm_source', 'from'].forEach(function (k) {
                        var v = q.get(k);
                        if (v) u.searchParams.set(k, v);
                    });
                    return u.pathname + u.search + u.hash;
                } catch (e2) {
                    return '/index.html';
                }
            }
            window.__installIosLoginHref = loginHref;
            if (isHomeScreenApp()) {
                window.location.replace(loginHref());
            }
        })();
    </script>
    <script src="/js/auth-boot.js?v=20260901-android-all-perf"></script>
    <script src="/js/auth.js?v=20260901-android-all-perf" defer></script>
    <!-- 浏览器内保持本页地址，刷新不跳登录；仅主屏幕 Web App 启动时进登录页 -->
    <style>
        * { box-sizing: border-box; }
        body {
            color: #1f2937;
            background: #f2f6fc;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 24px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }
        main {
            width: 100%;
            max-width: 620px;
            padding: 30px 24px calc(30px + env(safe-area-inset-bottom, 0px));
            background: #fff;
            border: 1px solid #dce6f2;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(31, 72, 120, 0.12);
        }
        .brand {
            display: flex;
            justify-content: center;
            margin: 0 0 18px;
        }
        .brand img {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            display: block;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(23, 105, 194, 0.18);
        }
        h1 {
            color: #1769c2;
            text-align: center;
            border-bottom: 1px solid #e5edf6;
            margin: 0 0 20px;
            padding-bottom: 16px;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.35;
        }
        strong { color: #1769c2; }
        .profile-lead {
            margin: 0 0 16px;
            color: #475569;
            font-size: 15px;
            line-height: 1.65;
            text-align: center;
        }
        .btn-download {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: #1769c2;
            color: #fff;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-download:active { opacity: 0.88; }
        .btn-download.is-disabled,
        .btn-download[aria-disabled="true"] {
            background: #94a3b8;
            pointer-events: none;
        }
        .profile-steps {
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
            counter-reset: pstep;
        }
        .profile-steps li {
            counter-increment: pstep;
            margin: 0 0 14px;
            padding: 4px 0 0 44px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
        }
        .profile-steps li:before {
            content: counter(pstep);
            color: #64748b;
            text-align: center;
            background: #eef2f7;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 15px;
            font-weight: 700;
            line-height: 30px;
            position: absolute;
            top: 1px;
            left: 0;
        }
        .profile-steps li:last-child { margin-bottom: 0; }
        .hint {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #e5edf6;
            color: #64748b;
            font-size: 14px;
            line-height: 1.55;
            text-align: center;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #1769c2;
            font-size: 14px;
            text-decoration: none;
        }
        .back:active { opacity: 0.75; }
        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            main { padding: 26px 18px calc(26px + env(safe-area-inset-bottom, 0px)); }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">
            <img src="apple-touch-icon.png?v=20260729" width="64" height="64" alt="个人所得税">
        </div>
        <h1>描述文件安装</h1>
        <p class="profile-lead">下载并安装描述文件后，主屏幕会出现应用图标，点开即可使用。</p>
        <a class="btn-download is-disabled" id="btnDownloadProfile" href="#" aria-disabled="true">正在获取描述文件…</a>
        <ol class="profile-steps">
            <li>点击上方按钮下载 <strong>描述文件</strong></li>
            <li>按系统提示允许下载，打开 <strong>「设置」</strong></li>
            <li>顶部出现已下载描述文件时，点进去 <strong>安装</strong></li>
            <li>按提示输入密码完成安装，回到主屏幕打开图标</li>
        </ol>
        <p class="hint" id="profileHint">下载后请按上方步骤在「设置」中完成安装。</p>
        <a class="back" id="backToGuide" href="install_guide.html?download=1#download">返回下载页</a>
    </main>
    <script>
        (function () {
            var btn = document.getElementById('btnDownloadProfile');
            var profileHint = document.getElementById('profileHint');
            var back = document.getElementById('backToGuide');
            var mobileconfigUrl = '';

            function withChannel(url) {
                try {
                    if (typeof window.appendSalesChannelToUrl === 'function') {
                        return window.appendSalesChannelToUrl(url);
                    }
                } catch (e0) {}
                try {
                    var u = new URL(url, window.location.href);
                    var q = new URLSearchParams(window.location.search || '');
                    var ch = q.get('ch') || q.get('sales_ch');
                    if (ch && !u.searchParams.get('ch')) u.searchParams.set('ch', ch);
                    return u.pathname + u.search + u.hash;
                } catch (e1) {
                    return url;
                }
            }

            if (back) back.href = withChannel('install_guide.html?download=1#download');

            function enableProfileDownload(url) {
                mobileconfigUrl = String(url || '').trim();
                if (!btn) return;
                if (!mobileconfigUrl) {
                    btn.classList.add('is-disabled');
                    btn.setAttribute('aria-disabled', 'true');
                    btn.removeAttribute('href');
                    btn.textContent = '暂未配置描述文件';
                    if (profileHint) {
                        profileHint.textContent = '管理员尚未上传描述文件，请稍后再试。';
                    }
                    return;
                }
                btn.classList.remove('is-disabled');
                btn.setAttribute('aria-disabled', 'false');
                btn.href = mobileconfigUrl;
                btn.setAttribute('download', 'personal.mobileconfig');
                btn.textContent = '下载描述文件';
                if (profileHint) {
                    profileHint.textContent = '下载后请按上方步骤在「设置」中完成安装。';
                }
            }

            if (btn) {
                btn.addEventListener('click', function (e) {
                    if (!mobileconfigUrl || btn.getAttribute('aria-disabled') === 'true') {
                        e.preventDefault();
                        return;
                    }
                    try {
                        if (typeof window.trackPublicAction === 'function') {
                            window.trackPublicAction('track_install_ios_click', {
                                page: 'install-ios',
                                via: 'mobileconfig'
                            });
                        }
                        if (typeof window.persistSalesChannelAttribution === 'function') {
                            window.persistSalesChannelAttribution('install_ios_mobileconfig_click');
                        }
                    } catch (eClick) {}
                });
            }

            function loadMobileconfig() {
                var req =
                    typeof window.fetchPublicInstallPackages === 'function'
                        ? window.fetchPublicInstallPackages()
                        : fetch(
                              typeof window.getPublicInstallPackagesUrl === 'function'
                                  ? window.getPublicInstallPackagesUrl()
                                  : '/api/public/install-packages',
                              { credentials: 'same-origin', cache: 'no-store' }
                          );
                return req
                    .then(function (r) {
                        return r.json();
                    })
                    .then(function (body) {
                        var url =
                            body && body.code === 200 && body.data
                                ? String(body.data.ios_mobileconfig_download_url || '').trim()
                                : '';
                        enableProfileDownload(url);
                    })
                    .catch(function () {
                        enableProfileDownload('');
                    });
            }

            try {
                if (typeof window.trackPublicAction === 'function') {
                    window.trackPublicAction('track_install_ios_guide_view', { page: 'install-ios' });
                }
            } catch (e) {}

            loadMobileconfig();
        })();
    </script>
</body>
</html>
