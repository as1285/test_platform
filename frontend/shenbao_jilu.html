<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260724-login-session"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>申报记录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            color: #333;
        }
        .header {
            background: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid #eee;
        }
        .back-btn {
            position: absolute;
            left: 12px;
            color: #1e6fff;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
        }
        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #333;
            padding: 0 48px;
            text-align: center;
            line-height: 1.35;
        }
        button.header-title {
            display: block;
            width: 100%;
            border: none;
            background: none;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        button.header-title.header-title--add {
            cursor: pointer;
        }
        button.header-title.header-title--add:active {
            opacity: 0.88;
        }
        .tabs {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #eee;
        }
        .tab {
            flex: 1;
            border: none;
            background: none;
            padding: 12px 8px 10px;
            font-size: 15px;
            color: #333;
            font-family: inherit;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .tab.active {
            color: #1e6fff;
            font-weight: 500;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 28px;
            height: 3px;
            background: #1e6fff;
            border-radius: 2px;
        }
        .notice {
            margin: 12px 16px 0;
            padding: 12px 14px;
            background: #e8f3ff;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.65;
            color: #666;
        }
        .notice a {
            color: #1e6fff;
            text-decoration: none;
        }
        #tabContent {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .empty-wrap {
            padding: 24px 16px 48px;
        }
        .empty-illustration {
            max-width: min(520px, 92vw);
            margin: 0 auto;
        }
        .empty-illustration img {
            width: 100%;
            height: auto;
            display: block;
        }
        .empty-text {
            text-align: center;
            color: #999;
            font-size: 15px;
            margin-top: 16px;
        }
        .record-list {
            margin-top: 8px;
        }
        .record-group-label {
            padding: 10px 16px 8px;
            font-size: 14px;
            color: #999;
            background: #f5f6fa;
        }
        .record-item {
            display: flex;
            align-items: center;
            width: 100%;
            text-align: left;
            border: none;
            background: #fff;
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .record-item:active {
            background: #fafafa;
        }
        .record-item.is-longpress {
            background: #f0f6ff;
        }
        .record-item-body {
            flex: 1;
            min-width: 0;
            padding-right: 8px;
        }
        .record-title {
            font-size: 16px;
            font-weight: 500;
            color: #333;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .record-sub {
            font-size: 14px;
            color: #888;
            line-height: 1.45;
        }
        .record-amount {
            margin-top: 4px;
        }
        .record-chevron {
            flex-shrink: 0;
            font-size: 22px;
            color: #ccc;
            font-weight: 300;
            line-height: 1;
        }
    </style>
</head>
<body class="page-shenbao-jilu">
    <div class="header">
        <a href="bancha.html" class="back-btn" aria-label="返回"><img src="/jt.png" class="back-icon" alt="" width="9" decoding="async"><span>返回</span></a>
        <button type="button" class="header-title" id="headerTitleBtn" aria-label="申报记录（更正/作废申报）">申报记录（更正/作废申报）</button>
    </div>
    <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="pending" role="tab" aria-selected="true">未完成</button>
        <button type="button" class="tab" data-tab="done" role="tab" aria-selected="false">已完成</button>
        <button type="button" class="tab" data-tab="void" role="tab" aria-selected="false">已作废</button>
    </div>
    <div class="notice">
        如您存在未支付完成的订单，则该申报表无法更正和作废；如需更正和作废，请15分钟后再试，或直接至<a href="daiban.html">支付订单管理</a>取消订单后再操作。
    </div>
    <div id="tabContent" class="is-empty" role="tabpanel">
        <div class="empty-wrap">
            <div class="empty-illustration">
                <img src="shuiming_empty.png" alt="页面空空如也" loading="lazy" decoding="async">
            </div>
        </div>
    </div>

    <script src="/js/watermark.js?v=20260722-wm-redder"></script>
    <script src="/js/shenbao_jilu_store.js?v=20260524-delete"></script>
    <script src="/js/shenbao_jilu.js?v=20260524-longpress-delete"></script>
</body>
</html>
