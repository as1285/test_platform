<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth.js?v=20260720-guest-funnel"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>帮助中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            color: #333;
        }
        .header {
            background: #fff;
            padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #f0f0f0;
        }
        .back-btn {
            position: absolute;
            left: 12px;
            color: #1e6fff;
            font-size: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn .arrow {
            font-size: 22px;
            line-height: 1;
            margin-right: 2px;
        }
        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }
        .help-section {
            display: flex;
            background: #fff;
            border-bottom: 8px solid #f5f6fa;
        }
        .help-side {
            width: 28%;
            min-width: 88px;
            max-width: 120px;
            padding: 18px 8px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-right: 1px solid #f0f0f0;
            flex-shrink: 0;
        }
        .help-side-icon {
            width: 36px;
            height: 36px;
            color: #1e6fff;
            margin-bottom: 8px;
        }
        .help-side-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .help-side-label {
            font-size: 13px;
            color: #333;
            line-height: 1.35;
        }
        .help-side-chev {
            margin-top: 6px;
            font-size: 10px;
            color: #bbb;
            line-height: 1;
        }
        .help-items {
            flex: 1;
            min-width: 0;
        }
        .help-item {
            display: block;
            padding: 16px 18px;
            font-size: 16px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #f0f0f0;
            -webkit-tap-highlight-color: transparent;
        }
        .help-item:last-child {
            border-bottom: none;
        }
        .help-item:active {
            background: #f8fbff;
        }
        .help-item.is-static {
            cursor: default;
        }
        .help-item.is-static:active {
            background: transparent;
        }
        html.app-top-safe-shell body.page-help-center .header {
            padding-top: calc(12px + var(--app-shell-statusbar-top, env(safe-area-inset-top, 0px)));
        }
    </style>
</head>
