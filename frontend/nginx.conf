limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=admin_per_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=uploads_per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# JSON/JS 体积大（税务列表常 >100KB）；开启 gzip 后弱网可从数百 KB 压到个位数 KB
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

map $http_user_agent $bad_user_agent {
    default 0;
    "" 1;
    "~*(?:sqlmap|nikto|nmap|masscan|zgrab|python-requests|go-http-client|libwww-perl)" 1;
}

# Cloudflare Flexible：浏览器↔CF 为 HTTPS，CF↔源站为 HTTP；透传访客协议
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# 复用到 Node 的连接，避免每个 API 请求都新建 TCP
upstream personal_tax_api {
    server backend:3000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    # 本机直连域名：同时提供 HTTP:80 与 HTTPS:443（证书见 certs/）
    listen 0.0.0.0:80 default_server;
    listen 0.0.0.0:443 ssl default_server;
    # 接受任意 Host；具体对外域名由各机 .env / DNS 决定，无需按域名分分支
    server_name _;

    # Cloudflare Flexible：源站是 HTTP，$scheme=http；若绝对跳转会变成 Location: http://…
    # 浏览器从 https 被拽到 http，表现为「掉了」。相对 Location 可保持访客原协议。
    absolute_redirect off;

    ssl_certificate     /etc/nginx/certs/active-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/active-privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Let's Encrypt HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 不对外提供 source map（降低前端还原成本）
    location ~* \.map$ {
        return 404;
    }

    # 基础安全头（防点击劫持 / MIME 嗅探；不替代 DNS/客户端侧劫持排查）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cloudflare 真实访客 IP（否则日志/限流全是 CF 节点）
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    set $real_ip $remote_addr;
    if ($http_cf_connecting_ip) {
        set $real_ip $http_cf_connecting_ip;
    }

    # 管理端上传等资源：默认 1m 会导致 413；0 表示不限制请求体大小（仍受磁盘与上游内存约束）
    client_max_body_size 0;

    # IP 封禁列表（CF 还原真实 IP 后匹配；勿放 conf.d 以免被当独立配置加载）
    include /etc/nginx/blocked_ips.conf;

    if ($bad_user_agent) {
        return 403;
    }

    location = /api/auth {
        limit_req zone=auth_per_ip burst=8 nodelay;
        limit_conn conn_per_ip 5;

        proxy_pass http://personal_tax_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api/auth.php {
        limit_req zone=auth_per_ip burst=8 nodelay;
        limit_conn conn_per_ip 5;

        proxy_pass http://personal_tax_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api/admin/login {
        limit_req zone=auth_per_ip burst=5 nodelay;
        limit_conn conn_per_ip 3;

        proxy_pass http://personal_tax_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/admin/ {
        limit_req zone=admin_per_ip burst=20 nodelay;
        limit_conn conn_per_ip 8;

        proxy_pass http://personal_tax_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn conn_per_ip 20;

        # 指向后端 API 服务（Docker 网络内用服务名 + keepalive）
        proxy_pass http://personal_tax_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # 避免上游偶发慢（DB 冷启动、长事务）时默认 60s 过短导致 504；仍无法解决「进程挂死」类问题
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 社保演示样例展示（非正式证明）
    location ~ ^/taxmock/(?<sbdy_tok>[A-Za-z0-9]+)/show(?:\.pdf)?$ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://personal_tax_api/api/public/sbdy-demo/show/$sbdy_tok;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 根路径显式跳转到登录页（与 frontend/index.html 一致）
    location = / {
        return 302 /index.html;
    }

    # 微信域名校验 TXT：纯文本、禁止缓存/改写，避免校验失败
    location ~* "^/[0-9a-f]{32}\.txt$" {
        root /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files $uri =404;
    }

    # 首页横幅更新后避免浏览器长期缓存旧图
    location = /sydb-v2.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sydb.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /zdfwdb.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /daiban.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # APK 单独处理：强制附件下载、不限速（慢传易被浏览器/代理判定为连接重置）
    location ~* ^/uploads/.+\.apk$ {
        limit_req zone=uploads_per_ip burst=40 nodelay;
        limit_conn conn_per_ip 10;

        root /usr/share/nginx/html;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="geshui.apk"' always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # iOS 描述文件（管理后台上传）：正确 MIME，便于 Safari 触发安装
    location ~* ^/uploads/.+\.mobileconfig$ {
        limit_req zone=uploads_per_ip burst=40 nodelay;
        limit_conn conn_per_ip 10;

        root /usr/share/nginx/html;
        types { }
        default_type application/x-apple-aspen-config;
        add_header Content-Disposition 'attachment; filename="个人所得税.mobileconfig"' always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /uploads/ {
        limit_req zone=uploads_per_ip burst=40 nodelay;
        limit_conn conn_per_ip 8;
        limit_rate_after 2m;
        limit_rate 1m;

        root /usr/share/nginx/html;
        # 安装页 GIF/视频等媒体可缓存；文件名通常带版本或唯一路径
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 底栏图标与内置静态图在镜像构建时固定，允许浏览器缓存，减少 tab 切换时的闪烁/卡顿
    location ^~ /caidan/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico|mp4|webm)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # JS 均带 ?v= 版本参数；允许强缓存，避免每个 TAB 都重新校验 auth.js
    location ^~ /js/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 银行图标更新后需及时生效（此前 SVG 长期缓存会导致错图残留）
    location ^~ /bank_icons/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 管理端路径入口（阶段 2）：便于书签与后续切到 admin.geshui.vip
    location = /admin {
        return 302 /admin_login.html;
    }
    location = /admin/ {
        return 302 /admin_login.html;
    }
    location = /admin/login {
        return 302 /admin_login.html;
    }
    location = /admin/panel {
        return 302 /admin_panel.html;
    }

    # 管理端 HTML 禁止缓存，避免后台改版后壳内继续用旧页
    location = /admin_panel.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; connect-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;
        try_files $uri =404;
    }

    location = /admin_login.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self';" always;
        try_files $uri =404;
    }

    # 管理端模块脚本：短缓存，便于按菜单懒加载发版
    location ^~ /js/admin/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # 我要咨询页含粘贴解析逻辑，禁止缓存以免发版后仍跑旧脚本
    location = /consult.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # C 端 HTML：短缓存 + SWR，配合底栏预取，切 TAB 可走磁盘缓存；发版后最多约 1 分钟生效
    location ~* \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        try_files $uri =404;
    }

    # iOS 描述文件：正确 MIME，便于 Safari 触发「安装描述文件」
    location = /personal.mobileconfig {
        root /usr/share/nginx/html;
        default_type application/x-apple-aspen-config;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Disposition "attachment; filename=personal.mobileconfig";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# 阶段 2：管理端独立 Host（需 Cloudflare/DNS 将 admin.geshui.vip 指到同源）
# 未配置 DNS 时不影响主站；配置后获得更严 CSP 与资源面收敛。
server {
    listen 0.0.0.0:80;
    server_name admin.geshui.vip;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; connect-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    set $real_ip $remote_addr;
    if ($http_cf_connecting_ip) {
        set $real_ip $http_cf_connecting_ip;
    }

    client_max_body_size 0;

    if ($bad_user_agent) {
        return 403;
    }

    location = / {
        return 302 /admin_login.html;
    }

    location = /admin {
        return 302 /admin_login.html;
    }
    location = /admin/login {
        return 302 /admin_login.html;
    }
    location = /admin/panel {
        return 302 /admin_panel.html;
    }

    location = /api/admin/login {
        limit_req zone=auth_per_ip burst=5 nodelay;
        limit_conn conn_per_ip 3;
        proxy_pass http://personal_tax_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location ^~ /api/admin/ {
        limit_req zone=admin_per_ip burst=20 nodelay;
        limit_conn conn_per_ip 8;
        proxy_pass http://personal_tax_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/health {
        proxy_pass http://personal_tax_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location = /admin_login.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self';" always;
        try_files $uri =404;
    }

    location = /admin_panel.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /js/admin/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location = /js/admin_auth.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location = /js/admin_panel.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location = /js/admin-analytics-period.js {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ^~ /js/vendor/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location = /js/najilu.js {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ^~ /css/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location /uploads/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 管理域默认拒绝用户端页面
    location / {
        return 404;
    }
}
