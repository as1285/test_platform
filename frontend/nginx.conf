limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=admin_per_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=uploads_per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

map $http_user_agent $bad_user_agent {
    default 0;
    "" 1;
    "~*(?:sqlmap|nikto|nmap|masscan|zgrab|python-requests|go-http-client|libwww-perl)" 1;
}

# Cloudflare Flexible：浏览器↔CF 为 HTTPS，CF↔源站为 HTTP；透传访客协议
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    # Flexible 模式：源站只保留 HTTP:80，不做 SSL/443（避免 525/526）
    listen 0.0.0.0:80 default_server;
    server_name geshui.vip www.geshui.vip localhost;

    # Cloudflare 真实访客 IP（否则日志/限流全是 CF 节点）
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    set $real_ip $remote_addr;
    if ($http_cf_connecting_ip) {
        set $real_ip $http_cf_connecting_ip;
    }

    # 管理端上传等资源：默认 1m 会导致 413；0 表示不限制请求体大小（仍受磁盘与上游内存约束）
    client_max_body_size 0;

    if ($bad_user_agent) {
        return 403;
    }

    location = /api/auth.php {
        limit_req zone=auth_per_ip burst=8 nodelay;
        limit_conn conn_per_ip 5;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api/admin/login {
        limit_req zone=auth_per_ip burst=5 nodelay;
        limit_conn conn_per_ip 3;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/admin/ {
        limit_req zone=admin_per_ip burst=20 nodelay;
        limit_conn conn_per_ip 8;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_conn conn_per_ip 10;

        # 指向后端 API 服务（Docker 网络内用服务名）
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # 避免上游偶发慢（DB 冷启动、长事务）时默认 60s 过短导致 504；仍无法解决「进程挂死」类问题
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 根路径显式跳转到登录页（与 frontend/index.html 一致）
    location = / {
        return 302 /index.html;
    }

    # 首页横幅更新后避免浏览器长期缓存旧图
    location = /sydb-v2.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sydb.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /zdfwdb.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /daiban.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ^~ /uploads/ {
        limit_req zone=uploads_per_ip burst=20 nodelay;
        limit_conn conn_per_ip 3;
        limit_rate_after 2m;
        limit_rate 512k;

        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 底栏图标与内置静态图在镜像构建时固定，允许浏览器缓存，减少 tab 切换时的闪烁/卡顿
    location ^~ /caidan/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 壳内状态栏/登录态等关键脚本需要及时生效，避免 WebView 继续使用旧 auth.js
    location ^~ /js/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 银行图标更新后需及时生效（此前 SVG 长期缓存会导致错图残留）
    location ^~ /bank_icons/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 页面结构经常调整（状态栏安全区、导航热区等），HTML 不缓存，避免壳内 WebView 继续使用旧页面
    location ~* \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # iOS 描述文件：正确 MIME，便于 Safari 触发「安装描述文件」
    location = /personal.mobileconfig {
        root /usr/share/nginx/html;
        default_type application/x-apple-aspen-config;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Disposition "attachment; filename=personal.mobileconfig";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
