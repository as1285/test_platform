<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/auth-boot.js?v=20260828-android-load"></script>
    <script src="/js/auth.js?v=20260831-m60home" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>在职证明生成</title>
    <style>
        :root {
            --ink: #0f172a;
            --ink-soft: #475569;
            --muted: #94a3b8;
            --line: #e2e8f0;
            --bg: #f4f7fb;
            --accent: #1d6fd8;
            --accent-deep: #1860be;
            --accent-soft: #eff6ff;
            --warn: #b45309;
            --warn-soft: #fff7e8;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --wrap: 440px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background: var(--bg);
            padding-bottom: calc(28px + var(--safe-b));
        }
        .header {
            max-width: var(--wrap);
            margin: 0 auto;
            padding: calc(12px + var(--safe-t)) 20px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            color: var(--accent);
            font-size: 15px;
            text-decoration: none;
            padding: 4px 2px;
        }
        .header-title { font-size: 16px; font-weight: 600; }
        .page { max-width: var(--wrap); margin: 0 auto; padding: 8px 20px 0; }
        .hero {
            padding: 18px 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            color: #fff;
            background: linear-gradient(135deg, #0f4c9a 0%, #1d6fd8 55%, #5aa3f0 100%);
            box-shadow: 0 10px 24px rgba(29, 111, 216, 0.18);
        }
        .hero h1 { font-size: 20px; margin: 0 0 6px; }
        .hero p { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.88); margin: 0; }
        .card {
            padding: 16px;
            margin-top: 12px;
            border: 1px solid rgba(226, 232, 240, 0.85);
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.05);
        }
        .card[hidden] { display: none !important; }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .card-hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
        .field-label {
            display: block;
            font-size: 12px;
            color: var(--ink-soft);
            margin: 0 0 6px;
        }
        .field {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 15px;
            margin-bottom: 12px;
            font-family: inherit;
            background: #fff;
        }
        .field:focus {
            outline: none;
            border-color: #93c0f0;
            box-shadow: 0 0 0 3px rgba(29, 111, 216, 0.12);
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            background: var(--accent);
        }
        .btn + .btn { margin-top: 8px; }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-secondary {
            background: #fff;
            color: var(--ink-soft);
            border: 1px solid var(--line);
        }
        .status {
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.45;
            color: var(--accent-deep);
            text-align: center;
        }
        .status.is-err { color: #b91c1c; }
        .qr-wrap {
            margin-top: 12px;
            text-align: center;
            min-height: 40px;
        }
        .qr-wrap img {
            width: 180px;
            height: 180px;
            background: #fff;
            border-radius: 8px;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            color: #166534;
            background: #ecfdf3;
            border-radius: 6px;
            padding: 3px 8px;
            margin-bottom: 8px;
        }
        .pdf-save-card .card-title { margin-bottom: 8px; }
        .pdf-frame-wrap {
            margin: 10px 0 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: auto;
            background: #e8eef5;
            min-height: 280px;
            max-height: 52vh;
            -webkit-overflow-scrolling: touch;
        }
        .pdf-frame-wrap iframe {
            display: block;
            width: 100%;
            height: 360px;
            border: 0;
            background: #fff;
        }
        .pdf-preview-img {
            display: block;
            width: 100%;
            height: auto;
            background: #fff;
        }
        .pdf-preview-fallback {
            margin: 0;
            padding: 48px 16px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }
        .pdf-save-tip {
            font-size: 12px;
            line-height: 1.5;
            color: var(--ink-soft);
            margin: 0 0 10px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>
    <script src="/js/cert-page-survey.js?v=20260828-cert-survey"></script>
</head>
<body>
    <div class="header">
        <a class="back-btn" href="consult.html?tab=products" id="lizhiBack">‹ 返回</a>
        <div class="header-title">在职证明</div>
    </div>
    <div class="page">
        <div class="hero">
            <h1>在职证明生成</h1>
            <p>未付款可生成带「演示样例」水印的 PDF；支付宝付 ¥50 开通后，可生成无演示水印版本。</p>
        </div>

        <div class="card" id="cardPay" hidden>
            <div class="card-title">开通权益 · ¥50</div>
            <p class="card-hint">付款成功后自动解锁并去除「演示样例」水印，无需激活码。</p>
            <button type="button" class="btn" id="btnLizhiPay">支付宝付款开通</button>
            <div class="qr-wrap" id="lizhiQrWrap" hidden></div>
            <p class="status" id="lizhiPayStatus" hidden></p>
        </div>

        <div class="card" id="cardForm">
            <span class="badge" id="lizhiUnlockBadge">未开通 · PDF 含演示水印</span>
            <div class="card-title">填写并生成</div>
            <p class="card-hint">已按账号资料预填，可修改后生成 PDF。App 内请用系统分享「存储到文件」。</p>
            <label class="field-label" for="lzName">姓名</label>
            <input class="field" id="lzName" maxlength="64" autocomplete="name">
            <label class="field-label" for="lzId">身份证号</label>
            <input class="field" id="lzId" maxlength="32" autocomplete="off">
            <label class="field-label" for="lzCompany">公司全称</label>
            <input class="field" id="lzCompany" maxlength="128" autocomplete="organization">
            <label class="field-label" for="lzDepartment">部门</label>
            <input class="field" id="lzDepartment" maxlength="64" placeholder="如：市场部" autocomplete="organization-title">
            <label class="field-label" for="lzPosition">担任岗位</label>
            <input class="field" id="lzPosition" maxlength="64" placeholder="如：销售经理" autocomplete="organization-title">
            <label class="field-label" for="lzGender">性别</label>
            <input class="field" id="lzGender" maxlength="8" placeholder="男 / 女" autocomplete="sex">
            <label class="field-label" for="lzHire">入职日期</label>
            <input class="field" id="lzHire" maxlength="32" placeholder="2025/12/15">
            <label class="field-label" for="lzIssue">开具日期</label>
            <input class="field" id="lzIssue" maxlength="48" placeholder="2026 年 7 月 13 日">
            <button type="button" class="btn" id="btnLizhiGenerate">生成并保存 PDF</button>
            <button type="button" class="btn btn-secondary" id="btnLizhiPrefill">重新预填</button>
            <p class="status" id="lizhiGenStatus" hidden></p>
        </div>

        <div class="card pdf-save-card" id="cardPdfSave" hidden>
            <div class="card-title">PDF 已生成</div>
            <p class="pdf-save-tip" id="lizhiPdfTip">
                App 内无法直接写入「下载」目录。请点「系统分享保存」，在弹出面板里选择「存储到文件」或「保存到下载」。
            </p>
            <div class="pdf-frame-wrap">
                <img id="lizhiPdfPreview" class="pdf-preview-img" alt="在职证明预览" hidden>
                <iframe id="lizhiPdfFrame" title="在职证明预览" hidden></iframe>
                <p class="pdf-preview-fallback" id="lizhiPdfPreviewFallback" hidden>预览图加载中…</p>
            </div>
            <p class="pdf-save-tip" id="lizhiLongPressTip" hidden style="margin-top:8px;">也可长按上方预览图，选择「保存图片 / 下载图片」。</p>
            <button type="button" class="btn" id="btnLizhiShare">系统分享保存</button>
            <button type="button" class="btn btn-secondary" id="btnLizhiOpenPdf">打开预览</button>
            <button type="button" class="btn btn-secondary" id="btnLizhiDesktopDl">浏览器下载 PDF</button>
            <p class="status" id="lizhiSaveStatus" hidden></p>
        </div>
    </div>

    <script>
(function () {
    function token() {
        try { return String(localStorage.getItem('token') || '').trim(); } catch (e) { return ''; }
    }
    function authFetch(url, opts) {
        opts = opts || {};
        var headers = Object.assign({ Accept: 'application/json' }, opts.headers || {});
        var t = token();
        if (t) headers.Authorization = 'Bearer ' + t;
        return fetch(url, Object.assign({}, opts, { headers: headers }));
    }
    function setStatus(el, text, isErr) {
        if (!el) return;
        if (!text) {
            el.hidden = true;
            el.textContent = '';
            return;
        }
        el.hidden = false;
        el.textContent = text;
        el.classList.toggle('is-err', !!isErr);
    }
    var lastPdfBlob = null;
    var lastPreviewBlob = null;
    var lastPdfName = '工作证明.pdf';
    var lastPdfUrl = '';
    var lastPreviewUrl = '';
    var lastPdfShareUrl = '';
    var lastPreviewShareUrl = '';
    var cardPay = document.getElementById('cardPay');
    var cardForm = document.getElementById('cardForm');
    var cardPdfSave = document.getElementById('cardPdfSave');
    var payStatus = document.getElementById('lizhiPayStatus');
    var genStatus = document.getElementById('lizhiGenStatus');
    var saveStatus = document.getElementById('lizhiSaveStatus');
    var pdfFrame = document.getElementById('lizhiPdfFrame');
    var pdfPreview = document.getElementById('lizhiPdfPreview');
    var pdfPreviewFallback = document.getElementById('lizhiPdfPreviewFallback');
    var longPressTip = document.getElementById('lizhiLongPressTip');
    var btnShare = document.getElementById('btnLizhiShare');
    var qrWrap = document.getElementById('lizhiQrWrap');
    var pollTimer = null;
    var pendingOtn = '';
    var feeAmount = '50.00';
    var certUnlocked = false;

    function base64ToBlob(b64, mime) {
        var bin = atob(b64);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: mime || 'application/octet-stream' });
    }

    function base64ToPdfBlob(b64) {
        return base64ToBlob(b64, 'application/pdf');
    }

    function revokeLastPdfUrl() {
        if (lastPdfUrl) {
            try { URL.revokeObjectURL(lastPdfUrl); } catch (e0) {}
            lastPdfUrl = '';
        }
        if (lastPreviewUrl) {
            try { URL.revokeObjectURL(lastPreviewUrl); } catch (e1) {}
            lastPreviewUrl = '';
        }
    }

    function isLikelyMobileAppShell() {
        try {
            if (typeof window.isCordovaTaxAppShell === 'function' && window.isCordovaTaxAppShell()) {
                return true;
            }
        } catch (e1) {}
        try {
            if (window.navigator.standalone === true) return true;
        } catch (e2) {}
        try {
            if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
                return true;
            }
        } catch (e3) {}
        var ua = navigator.userAgent || '';
        return /iPhone|iPad|iPod|Android/i.test(ua);
    }

    function isAndroidLike() {
        return /Android/i.test(navigator.userAgent || '');
    }

    function canShareFiles(files) {
        try {
            if (!navigator.share || typeof navigator.share !== 'function') return false;
            if (!files || !files.length) return false;
            if (typeof File === 'undefined') return false;
            if (navigator.canShare && !navigator.canShare({ files: files })) return false;
            return true;
        } catch (e) {
            return false;
        }
    }

    function shareFiles(files, title) {
        if (!canShareFiles(files)) {
            return Promise.reject(new Error('share_unsupported'));
        }
        return navigator.share({
            files: files,
            title: title || '在职证明'
        });
    }

    function absoluteApiUrl(path) {
        var p = String(path || '');
        if (!p) return '';
        if (/^https?:\/\//i.test(p)) return p;
        if (p.charAt(0) !== '/') p = '/' + p;
        try {
            return String(location.origin || '') + p;
        } catch (e0) {
            return p;
        }
    }

    function tempShareUrlFromToken(token) {
        var t = String(token || '').trim();
        if (!t) return '';
        return absoluteApiUrl('/api/zaizhi-cert/temp-share/' + encodeURIComponent(t));
    }

    /** App iframe → Cordova 壳用系统浏览器打开（可触发下载/存相册） */
    function openExternalUrl(url) {
        var u = url != null ? String(url).trim() : '';
        if (!u) return false;
        var notified = false;
        try {
            if (window.parent && window.parent !== window) {
                try {
                    if (typeof window.parent.openTaxPlatformExternal === 'function') {
                        window.parent.openTaxPlatformExternal(u);
                        notified = true;
                    }
                } catch (eParentFn) {}
                try {
                    window.parent.postMessage(
                        { source: 'tax-platform-h5', type: 'open-external', url: u },
                        '*'
                    );
                    notified = true;
                } catch (eMsg) {}
            }
        } catch (e0) {}
        try {
            if (window.TaxApp && TaxApp.shell && typeof TaxApp.shell.openExternal === 'function') {
                TaxApp.shell.openExternal(u);
                notified = true;
            }
        } catch (eTax) {}
        try {
            if (
                window.cordova &&
                window.cordova.InAppBrowser &&
                typeof window.cordova.InAppBrowser.open === 'function'
            ) {
                window.cordova.InAppBrowser.open(u, '_system');
                return true;
            }
        } catch (e1) {}
        if (notified) return true;
        try {
            var opened = window.open(u, '_blank', 'noopener,noreferrer');
            if (opened) return true;
        } catch (e2) {}
        /* 安卓壳内：Intent VIEW（勿用 location.href，避免 iframe 被导航走） */
        if (isAndroidLike() && /^https?:\/\//i.test(u)) {
            try {
                var inShell = false;
                try {
                    inShell =
                        (typeof window.isCordovaTaxAppShell === 'function' &&
                            window.isCordovaTaxAppShell()) ||
                        (window.parent && window.parent !== window);
                } catch (eShell) {}
                if (inShell) {
                    var parsed = new URL(u);
                    var intentUrl =
                        'intent://' +
                        parsed.host +
                        parsed.pathname +
                        parsed.search +
                        parsed.hash +
                        '#Intent;scheme=' +
                        parsed.protocol.replace(':', '') +
                        ';action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
                    var aIntent = document.createElement('a');
                    aIntent.href = intentUrl;
                    aIntent.target = '_blank';
                    aIntent.rel = 'noopener';
                    aIntent.style.display = 'none';
                    document.body.appendChild(aIntent);
                    aIntent.click();
                    if (aIntent.parentNode) aIntent.parentNode.removeChild(aIntent);
                    return true;
                }
            } catch (eIntent) {}
        }
        return false;
    }

    /** 安卓 WebView 对 PDF 文件分享支持差，优先分享预览 PNG；桌面仍用 PDF */
    function sharePdfBlob(blob, filename) {
        if (!blob && !lastPreviewBlob) return Promise.reject(new Error('no_blob'));
        var preferImage = isAndroidLike() || isLikelyMobileAppShell();
        var jobs = [];
        if (preferImage && lastPreviewBlob) {
            var pngName = String(filename || '工作证明.pdf').replace(/\.pdf$/i, '') + '.png';
            jobs.push(function () {
                var imgFile = new File([lastPreviewBlob], pngName, { type: 'image/png' });
                return shareFiles([imgFile], pngName);
            });
        }
        if (blob) {
            jobs.push(function () {
                var pdfFile = new File([blob], filename || '工作证明.pdf', { type: 'application/pdf' });
                return shareFiles([pdfFile], filename || '在职证明');
            });
        }
        if (!jobs.length) return Promise.reject(new Error('share_unsupported'));

        function run(i) {
            if (i >= jobs.length) return Promise.reject(new Error('share_unsupported'));
            return jobs[i]().catch(function (err) {
                if (err && err.name === 'AbortError') throw err;
                return run(i + 1);
            });
        }
        return run(0);
    }

    function triggerAnchorDownload(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename || '工作证明.pdf';
        a.rel = 'noopener';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
            try { URL.revokeObjectURL(url); } catch (e0) {}
            if (a.parentNode) a.parentNode.removeChild(a);
        }, 2000);
    }

    /**
     * 安卓：直接用短期 HTTPS 链拉起系统浏览器下载（优先预览 PNG，易存相册）。
     * WebView 内 a[download] / Web Share 文件均不可靠，勿再优先走分享。
     */
    function androidBrowserSave() {
        var url = lastPreviewShareUrl || lastPdfShareUrl;
        var kind = lastPreviewShareUrl ? 'png' : 'pdf';
        if (url) {
            var opened = openExternalUrl(url);
            if (opened) {
                return Promise.resolve('browser_' + kind);
            }
            /* 壳未接管时仍尝试同域 a[download]，再退回 blob */
            try {
                var a = document.createElement('a');
                a.href = url;
                a.download = kind === 'png'
                    ? String(lastPdfName || '工作证明.pdf').replace(/\.pdf$/i, '') + '.png'
                    : lastPdfName || '工作证明.pdf';
                a.target = '_blank';
                a.rel = 'noopener';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                if (a.parentNode) a.parentNode.removeChild(a);
                return Promise.resolve('anchor_link_' + kind);
            } catch (eDl) {}
        }
        if (lastPreviewBlob) {
            var pngName = String(lastPdfName || '工作证明.pdf').replace(/\.pdf$/i, '') + '.png';
            triggerAnchorDownload(lastPreviewBlob, pngName);
            return Promise.resolve('anchor_png');
        }
        if (lastPdfBlob) {
            triggerAnchorDownload(lastPdfBlob, lastPdfName);
            return Promise.resolve('anchor_pdf');
        }
        return Promise.reject(new Error('no_share_url'));
    }

    function saveOrSharePdf(blob, filename) {
        /* 安卓：主按钮直接系统浏览器下载，不再先调 Web Share */
        if (isAndroidLike()) {
            return androidBrowserSave().then(function (mode) {
                return mode || 'android_fallback';
            });
        }
        return sharePdfBlob(blob, filename)
            .then(function () {
                return 'shared';
            })
            .catch(function (err) {
                if (err && err.name === 'AbortError') throw err;
                if (isLikelyMobileAppShell()) {
                    return androidBrowserSave().then(function (mode) {
                        return mode || 'android_fallback';
                    });
                }
                throw err;
            });
    }

    function showPdfSavePanel(blob, filename, previewBlob, shareMeta) {
        lastPdfBlob = blob;
        lastPreviewBlob = previewBlob || null;
        lastPdfName = filename || '工作证明.pdf';
        shareMeta = shareMeta || {};
        lastPdfShareUrl = tempShareUrlFromToken(shareMeta.pdf_share_token);
        lastPreviewShareUrl = tempShareUrlFromToken(shareMeta.preview_share_token);
        revokeLastPdfUrl();
        lastPdfUrl = URL.createObjectURL(blob);
        if (previewBlob) {
            lastPreviewUrl = URL.createObjectURL(previewBlob);
        }

        var mobile = isLikelyMobileAppShell() || isAndroidLike();
        var android = isAndroidLike();
        if (btnShare) {
            btnShare.textContent = android ? '系统浏览器下载图片' : '系统分享保存';
        }
        if (pdfPreview) {
            if (lastPreviewUrl) {
                pdfPreview.src = lastPreviewUrl;
                pdfPreview.hidden = false;
            } else {
                pdfPreview.removeAttribute('src');
                pdfPreview.hidden = true;
            }
        }
        if (pdfFrame) {
            /* 安卓 WebView 里 iframe+blob PDF 基本空白，仅桌面用 iframe */
            if (!mobile && lastPdfUrl) {
                pdfFrame.src = lastPdfUrl;
                pdfFrame.hidden = false;
            } else {
                pdfFrame.removeAttribute('src');
                pdfFrame.hidden = true;
            }
        }
        if (pdfPreviewFallback) {
            pdfPreviewFallback.hidden = !!(lastPreviewUrl || (!mobile && lastPdfUrl));
            if (!pdfPreviewFallback.hidden) {
                pdfPreviewFallback.textContent = android
                    ? '预览暂不可用，请直接点「系统浏览器下载图片」或「浏览器下载 PDF」'
                    : '预览暂不可用，请直接点「系统分享保存」或「浏览器下载 PDF」';
            }
        }
        if (longPressTip) {
            longPressTip.hidden = !lastPreviewUrl;
        }
        var tip = document.getElementById('lizhiPdfTip');
        if (tip) {
            tip.textContent = android
                ? (lastPreviewUrl
                    ? '安卓请点「系统浏览器下载图片」：将拉起系统浏览器下载预览图，可存相册/文件。也可长按上方图片保存。需要 PDF 时点「浏览器下载 PDF」。'
                    : '安卓请点「系统浏览器下载图片」或「浏览器下载 PDF」，将拉起系统浏览器下载。')
                : mobile
                    ? (lastPreviewUrl
                        ? '请点「系统分享保存」把预览图存到相册/文件；也可长按上方图片保存。需要 PDF 文件时可用下方「浏览器下载 PDF」。'
                        : '请点「系统分享保存」。若分享不可用，请改用「浏览器下载 PDF」。')
                    : '可在下方预览；电脑端可直接下载 PDF。';
        }
        if (cardPdfSave) {
            cardPdfSave.hidden = false;
            try {
                cardPdfSave.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch (eScroll) {}
        }
        setStatus(saveStatus, '');
    }

    function deliverPdf(b64, filename, previewB64, shareMeta) {
        var name = filename || '工作证明.pdf';
        var blob = base64ToPdfBlob(b64);
        var previewBlob = null;
        if (previewB64) {
            try {
                previewBlob = base64ToBlob(previewB64, 'image/png');
            } catch (ePrev) {
                previewBlob = null;
            }
        }
        showPdfSavePanel(blob, name, previewBlob, shareMeta);

        if (!isLikelyMobileAppShell()) {
            triggerAnchorDownload(blob, name);
            setStatus(genStatus, '已开始下载；也可在下方预览或再次下载');
            return Promise.resolve('desktop_download');
        }

        return saveOrSharePdf(blob, name)
            .then(function (mode) {
                if (mode === 'shared') {
                    setStatus(genStatus, '已调起系统分享，请选择保存到相册或文件');
                    setStatus(saveStatus, '分享面板已打开');
                    return mode;
                }
                if (String(mode).indexOf('browser_') === 0 || String(mode).indexOf('anchor') === 0 || mode === 'android_fallback') {
                    setStatus(
                        genStatus,
                        isAndroidLike()
                            ? '已拉起系统浏览器下载；若未开始请再点「系统浏览器下载图片」或长按预览图'
                            : '已尝试下载；也可长按预览图保存'
                    );
                    setStatus(
                        saveStatus,
                        isAndroidLike()
                            ? '已打开系统浏览器下载'
                            : '已尝试下载保存'
                    );
                    return mode;
                }
                setStatus(genStatus, '请按下方提示保存');
                return mode;
            })
            .catch(function (err) {
                var errName = err && err.name ? String(err.name) : '';
                if (errName === 'AbortError') {
                    setStatus(
                        genStatus,
                        isAndroidLike()
                            ? '已取消。可再点「系统浏览器下载图片」'
                            : '已取消分享。可再点下方「系统分享保存」'
                    );
                    return 'aborted';
                }
                setStatus(
                    genStatus,
                    lastPreviewBlob
                        ? '请点下方保存按钮，或长按上方预览图保存'
                        : '请点下方保存按钮；若仍失败请用「浏览器下载 PDF」'
                );
                setStatus(saveStatus, '自动保存未成功，请手动再点一次', true);
                return 'fallback';
            });
    }

    try {
        var ref = document.referrer || '';
        var back = document.getElementById('lizhiBack');
        if (back) {
            var fromQ = '';
            try {
                fromQ = String(new URLSearchParams(location.search || '').get('from') || '').toLowerCase();
            } catch (eFrom) {}
            if (fromQ === 'consult' || /consult\.html/i.test(ref)) {
                back.setAttribute('href', 'consult.html?tab=products');
            } else if (fromQ === 'purchase' || /purchase\.html/i.test(ref)) {
                back.setAttribute('href', 'purchase.html?from=mine');
            } else if (/mine\.html/i.test(ref)) {
                back.setAttribute('href', 'mine.html');
            } else {
                // 已激活用户常从「我要咨询」进入；默认回咨询页税务记录
                back.setAttribute('href', 'consult.html?tab=products');
            }
        }
    } catch (e0) {}

    if (!token()) {
        window.location.replace(
            typeof window.buildLoginPageUrl === 'function'
                ? window.buildLoginPageUrl('zaizhi_cert.html')
                : 'login.html?redirect=' + encodeURIComponent('zaizhi_cert.html')
        );
        return;
    }

    document.getElementById('btnLizhiShare').addEventListener('click', function () {
        if (!lastPdfBlob && !lastPreviewBlob) {
            setStatus(saveStatus, '请先生成 PDF', true);
            return;
        }
        setStatus(
            saveStatus,
            isAndroidLike() ? '正在拉起系统浏览器…' : '正在调起系统分享…'
        );
        saveOrSharePdf(lastPdfBlob, lastPdfName)
            .then(function (mode) {
                if (mode === 'shared') {
                    setStatus(saveStatus, '请在分享面板选择「存储到文件」或「保存到相册」');
                    return;
                }
                setStatus(
                    saveStatus,
                    isAndroidLike()
                        ? '已拉起系统浏览器下载；若未开始请长按上方图片保存'
                        : '已尝试下载保存'
                );
            })
            .catch(function (err) {
                if (err && err.name === 'AbortError') {
                    setStatus(saveStatus, '已取消');
                    return;
                }
                setStatus(
                    saveStatus,
                    lastPreviewBlob
                        ? '请长按上方预览图保存，或点「浏览器下载 PDF」'
                        : '保存失败，请点「浏览器下载 PDF」',
                    true
                );
            });
    });

    document.getElementById('btnLizhiOpenPdf').addEventListener('click', function () {
        var url = lastPreviewUrl || lastPdfUrl;
        if (!url) {
            setStatus(saveStatus, '请先生成 PDF', true);
            return;
        }
        var opened = null;
        try {
            opened = window.open(url, '_blank');
        } catch (eOpen) {}
        if (!opened) {
            setStatus(
                saveStatus,
                lastPreviewUrl
                    ? (isAndroidLike()
                        ? '请查看上方预览图；可长按保存或点「系统浏览器下载图片」'
                        : '请查看上方预览图；可长按保存或点「系统分享保存」')
                    : '已在上方预览；请用下方按钮保存',
                true
            );
            if (pdfPreview && !pdfPreview.hidden) {
                try { pdfPreview.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e2) {}
            } else if (pdfFrame) {
                try { pdfFrame.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e3) {}
            }
            return;
        }
        setStatus(saveStatus, '已打开预览，可用系统分享/存储菜单保存');
    });

    document.getElementById('btnLizhiDesktopDl').addEventListener('click', function () {
        if (!lastPdfBlob && !lastPdfShareUrl) {
            setStatus(saveStatus, '请先生成 PDF', true);
            return;
        }
        if (isAndroidLike() && lastPdfShareUrl) {
            var opened = openExternalUrl(lastPdfShareUrl);
            setStatus(
                saveStatus,
                opened
                    ? '已用系统浏览器下载 PDF'
                    : '请在弹出的浏览器中保存 PDF；若无反应可再试一次',
                !opened
            );
            return;
        }
        if (lastPdfBlob) {
            triggerAnchorDownload(lastPdfBlob, lastPdfName);
        }
        setStatus(
            saveStatus,
            isAndroidLike()
                ? '若未开始下载，请改用「系统浏览器下载图片」'
                : '若未开始下载，请改用「系统分享保存」'
        );
    });

    function applyUnlocked(unlocked) {
        certUnlocked = !!unlocked;
        cardPay.hidden = !!unlocked;
        cardForm.hidden = false;
        var badge = document.getElementById('lizhiUnlockBadge');
        if (badge) {
            badge.textContent = unlocked
                ? '已开通 · 生成无演示水印版本'
                : '未开通 · PDF 含演示水印';
        }
        if (unlocked && pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
        }
    }

    function fillForm(d) {
        if (!d) return;
        if (d.name != null) document.getElementById('lzName').value = d.name;
        if (d.id_number != null) document.getElementById('lzId').value = d.id_number;
        if (d.company_name != null) document.getElementById('lzCompany').value = d.company_name;
        if (d.department != null) document.getElementById('lzDepartment').value = d.department;
        if (d.position != null) document.getElementById('lzPosition').value = d.position;
        if (d.hire_date != null) document.getElementById('lzHire').value = d.hire_date;
        if (d.gender != null) document.getElementById('lzGender').value = d.gender;
        if (d.issue_date != null) document.getElementById('lzIssue').value = d.issue_date;
        if (!document.getElementById('lzGender').value) {
            document.getElementById('lzGender').value = genderFromId(document.getElementById('lzId').value);
        }
    }

    function genderFromId(idNumber) {
        var s = String(idNumber || '').replace(/[^0-9Xx]/g, '');
        var d = '';
        if (s.length >= 18) d = s.charAt(16);
        else if (s.length === 15) d = s.charAt(14);
        if (!d || !/\d/.test(d)) return '';
        return Number(d) % 2 === 1 ? '男' : '女';
    }

    function defaultIssueDate() {
        var n = new Date();
        return n.getFullYear() + ' 年 ' + (n.getMonth() + 1) + ' 月 ' + n.getDate() + ' 日';
    }

    function loadStatus() {
        return authFetch('/api/zaizhi-cert/status')
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (!j || j.code !== 200 || !j.data) throw new Error((j && j.msg) || '读取失败');
                feeAmount = j.data.fee_amount || feeAmount;
                applyUnlocked(!!j.data.unlocked);
                document.getElementById('btnLizhiPay').textContent =
                    '支付宝付款开通 ¥' + feeAmount;
                return loadPrefill();
            })
            .catch(function (e) {
                setStatus(payStatus, (e && e.message) || '读取权益失败', true);
            });
    }

    function loadPrefill() {
        return authFetch('/api/zaizhi-cert/prefill')
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j && j.code === 200 && j.data) {
                    fillForm(j.data);
                    if (!document.getElementById('lzIssue').value) {
                        document.getElementById('lzIssue').value = defaultIssueDate();
                    }
                }
            })
            .catch(function () {});
    }

    function startPay() {
        setStatus(payStatus, '正在创建订单…');
        qrWrap.hidden = false;
        qrWrap.innerHTML = '<p style="color:#888;font-size:13px;">生成付款码…</p>';
        authFetch('/api/payments/alipay/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product: 'zaizhi_cert', sku_id: 'sku_zaizhi_cert_50' })
        })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (!j || j.code !== 200 || !j.data) {
                    var failMsg = (j && j.msg) || '创建订单失败';
                    setStatus(payStatus, failMsg, true);
                    qrWrap.innerHTML = '';
                    if (typeof showPaymentCreateFailDialog === 'function') {
                        showPaymentCreateFailDialog({ message: failMsg, source: 'zaizhi_cert' });
                    }
                    return;
                }
                var qr = j.data.qr_code || j.data.payment_url || '';
                pendingOtn = j.data.order && j.data.order.out_trade_no ? String(j.data.order.out_trade_no) : '';
                if (typeof QRCode !== 'undefined' && QRCode.toDataURL && qr) {
                    QRCode.toDataURL(qr, { width: 180, margin: 2, errorCorrectionLevel: 'M' }, function (err, dataUrl) {
                        if (err || !dataUrl) {
                            qrWrap.innerHTML = '<p style="font-size:12px;word-break:break-all;">请在支付宝打开：<br>' + qr + '</p>';
                            return;
                        }
                        qrWrap.innerHTML = '<img src="' + dataUrl + '" alt="付款码">';
                    });
                } else if (qr) {
                    qrWrap.innerHTML = '<p style="font-size:12px;word-break:break-all;">请复制到支付宝打开：<br>' + qr + '</p>';
                }
                setStatus(payStatus, '请使用支付宝扫码支付 ¥' + feeAmount);
                if (pollTimer) clearInterval(pollTimer);
                pollTimer = setInterval(pollPay, 2500);
            })
            .catch(function () {
                setStatus(payStatus, '网络错误', true);
                if (typeof showPaymentCreateFailDialog === 'function') {
                    showPaymentCreateFailDialog({
                        message: '创建支付订单失败，网络异常',
                        source: 'zaizhi_cert'
                    });
                }
            });
    }

    function pollPay() {
        authFetch('/api/payments/alipay/latest')
            .then(function (r) { return r.json(); })
            .then(function (j) {
                var ord = j && j.code === 200 && j.data ? j.data.order : null;
                if (!ord) return;
                var st = String(ord.status || '');
                var sku = String(ord.sku_id || '');
                var otn = String(ord.out_trade_no || '');
                if (
                    st === 'paid' &&
                    (sku === 'sku_zaizhi_cert_50' || !pendingOtn || otn === pendingOtn)
                ) {
                    setStatus(payStatus, '支付成功，正在解锁…');
                    if (pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                    loadStatus();
                }
            })
            .catch(function () {});
    }

    function generate() {
        var payload = {
            name: document.getElementById('lzName').value.trim(),
            id_number: document.getElementById('lzId').value.trim(),
            company_name: document.getElementById('lzCompany').value.trim(),
            department: document.getElementById('lzDepartment').value.trim(),
            position: document.getElementById('lzPosition').value.trim(),
            hire_date: document.getElementById('lzHire').value.trim(),
            gender: document.getElementById('lzGender').value.trim() || genderFromId(document.getElementById('lzId').value.trim()),
            issue_date: document.getElementById('lzIssue').value.trim() || defaultIssueDate()
        };
        if (!payload.name || !payload.id_number) {
            setStatus(genStatus, '请填写姓名与身份证号', true);
            return;
        }
        if (!payload.company_name) {
            setStatus(genStatus, '请填写公司全称', true);
            return;
        }
        if (!payload.department) {
            setStatus(genStatus, '请填写部门', true);
            return;
        }
        if (!payload.position) {
            setStatus(genStatus, '请填写担任岗位', true);
            return;
        }
        var btn = document.getElementById('btnLizhiGenerate');
        btn.disabled = true;
        setStatus(genStatus, '正在生成 PDF…');
        authFetch('/api/zaizhi-cert/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                var j = res.j;
                if (!j || j.code !== 200 || !j.data || !j.data.pdf_base64) {
                    setStatus(genStatus, (j && j.msg) || '生成失败', true);
                    return;
                }
                setStatus(
                    genStatus,
                    j.data.demo
                        ? '演示水印版生成成功，正在调起保存…'
                        : '无演示水印版生成成功，正在调起保存…'
                );
                return deliverPdf(
                    j.data.pdf_base64,
                    j.data.filename || '工作证明.pdf',
                    j.data.preview_png_base64 || null,
                    {
                        pdf_share_token: j.data.pdf_share_token || null,
                        preview_share_token: j.data.preview_share_token || null
                    }
                );
            })
            .catch(function () {
                setStatus(genStatus, '网络错误', true);
            })
            .finally(function () {
                btn.disabled = false;
            });
    }

    document.getElementById('btnLizhiPay').addEventListener('click', startPay);
    document.getElementById('btnLizhiGenerate').addEventListener('click', generate);
    document.getElementById('btnLizhiPrefill').addEventListener('click', function () {
        loadPrefill().then(function () {
            setStatus(genStatus, '已重新预填');
        });
    });
    document.getElementById('lzIssue').value = defaultIssueDate();
    var lzIdEl = document.getElementById('lzId');
    if (lzIdEl) {
        lzIdEl.addEventListener('blur', function () {
            var g = document.getElementById('lzGender');
            if (g && !g.value.trim()) g.value = genderFromId(lzIdEl.value);
        });
    }
    loadStatus();
    window.addEventListener('pagehide', revokeLastPdfUrl);
    if (typeof window.initCertPageSurvey === 'function') {
        window.initCertPageSurvey({
            product: 'zaizhi',
            productLabel: '在职证明',
            backBtnId: 'lizhiBack',
            authFetch: authFetch,
            getSeenPrice: function () {
                var n = Number(feeAmount);
                return isFinite(n) && n > 0 ? n : 50;
            },
            getUnlocked: function () {
                return !!certUnlocked;
            }
        });
    }
})();
    </script>
</body>
</html>
