<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var u = typeof navigator !== 'undefined' ? (navigator.userAgent || '') : '';
                if (/Android/i.test(u)) document.documentElement.classList.add('platform-android');
            } catch (e) {}
        })();
    </script>
    <script src="/js/auth-boot.js?v=20260901-android-all-perf"></script>
    <script src="/js/auth.js?v=20260901-android-all-perf" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>任职受雇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f2f2f7;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #f0f0f0;
        }

        /* Android：黑条状态栏已在 WebView 外，顶栏勿再叠安全区 */
        html.platform-android body.page-renzhi > .header,
        html.app-android-client.app-top-safe-shell body.page-renzhi > .header {
            padding-top: 14px;
            padding-bottom: 15px;
            min-height: 0;
        }

        .back-btn {
            position: absolute;
            left: 12px;
            color: #007aff;
            font-size: 15px;
            font-weight: 400;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .back-btn span:first-child {
            font-size: 15px;
            margin-right: 2px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #000;
        }

        .list-container {
            padding: 12px;
        }

        .company-card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .company-name {
            font-size: 17px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* iOS（含 14 Plus）：PingFang 600 偏粗，公司名称用常规字重 */
        html.app-ios-client .company-name,
        html[class*='app-ios'] .company-name {
            font-weight: 400;
        }

        .info-item {
            display: block;
            margin-bottom: 4px;
            font-size: 15px;
            line-height: 1.5;
            font-weight: 400;
            color: #8e8e93;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #8e8e93;
            font-weight: 400;
        }

        .info-value {
            color: #8e8e93;
            font-weight: 400;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-add-link {
            display: inline-block;
            margin-top: 16px;
            color: #007aff;
            font-size: 15px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .rz-guide-root {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
        }

        .rz-guide-root.is-open {
            display: block;
        }

        .rz-guide-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .rz-guide-panel {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% - 88px);
            max-width: 280px;
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        }

        .rz-guide-title {
            margin: 0;
            padding: 20px 16px 6px;
            font-size: 17px;
            font-weight: 600;
            color: #000;
        }

        .rz-guide-desc {
            margin: 0;
            padding: 0 16px 18px;
            font-size: 13px;
            color: #8e8e93;
            line-height: 1.5;
        }

        .rz-guide-actions {
            display: flex;
            border-top: 0.5px solid #e5e5ea;
        }

        .rz-guide-btn {
            flex: 1;
            padding: 12px 8px;
            font-size: 17px;
            line-height: 1.2;
            background: none;
            border: none;
            color: #007aff;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .rz-guide-btn + .rz-guide-btn {
            border-left: 0.5px solid #e5e5ea;
        }

        .rz-guide-btn.primary {
            font-weight: 600;
        }
    </style>
</head>
<body class="page-renzhi">
    <div class="header">
        <a href="mine.html" class="back-btn">
            <img src="/jt.png" alt="" style="width: 9px; vertical-align: middle;">
            <span>返回</span>
        </a>
        <span class="header-title">任职受雇</span>
    </div>

    <div class="list-container" id="listContainer"></div>

    <div id="renzhiEmptyGuide" class="rz-guide-root" role="dialog" aria-modal="true" aria-labelledby="renzhiEmptyGuideTitle" hidden>
        <div class="rz-guide-mask" id="renzhiEmptyGuideMask"></div>
        <div class="rz-guide-panel">
            <p class="rz-guide-title" id="renzhiEmptyGuideTitle">添加任职受雇</p>
            <p class="rz-guide-desc">暂无任职受雇信息。先添加一条记录，后续查询和填写会更完整。</p>
            <div class="rz-guide-actions">
                <button type="button" class="rz-guide-btn" id="renzhiEmptyGuideLater">稍后再说</button>
                <button type="button" class="rz-guide-btn primary" id="renzhiEmptyGuideGo">去添加</button>
            </div>
        </div>
    </div>

    <script>
        function escAttr(s) {
            return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function loadEmployerList() {
            var userId = localStorage.getItem('user_id');
            if (!userId) {
                window.location.href = 'index.html';
                return;
            }

            window.authFetch('api/user?action=employers')
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    if (data.code === 200 && data.data && data.data.employers) {
                        renderList(data.data.employers);
                    } else {
                        showEmpty(false);
                    }
                })
                .catch(function (error) {
                    console.error('加载失败:', error);
                    showEmpty(false);
                });
        }

        function syncMineEmployerCount(list) {
            var n = 0;
            (list || []).forEach(function (e) {
                if (!e) return;
                if (e.status == '1' || e.status === 1 || e.status === '在职') n += 1;
            });
            try {
                localStorage.setItem('employer_count', String(n));
            } catch (e0) {}
            try {
                sessionStorage.removeItem('mine_summary_cache_v1');
            } catch (e1) {}
        }

        function renderList(list) {
            var container = document.getElementById('listContainer');
            syncMineEmployerCount(list);

            if (!list || list.length === 0) {
                showEmpty(true);
                return;
            }

            var html = '';
            for (var i = 0; i < list.length; i++) {
                var item = list[i];
                var idAttr = escAttr(item.id);
                var leaveVal = item.leave_date;
                if (!leaveVal && (item.status === '1' || item.status === 1)) {
                    leaveVal = '-';
                }
                html += '<div class="company-card" onclick="goDetail(\'' + idAttr + '\')" style="cursor:pointer;">';
                html += '<div class="company-name">' + escapeHtml(item.company_name || '-') + '</div>';
                html += '<div class="info-item"><span class="info-label">统一社会信用代码：</span><span class="info-value">' + escapeHtml(item.credit_code || '-') + '</span></div>';
                html += '<div class="info-item"><span class="info-label">职务：</span><span class="info-value">' + escapeHtml(item.position || '-') + '</span></div>';
                html += '<div class="info-item"><span class="info-label">任职受雇日期：</span><span class="info-value">' + escapeHtml(item.hire_date || '-') + '</span></div>';
                html += '<div class="info-item"><span class="info-label">离职日期：</span><span class="info-value">' + escapeHtml(leaveVal || '-') + '</span></div>';
                html += '</div>';
            }

            container.innerHTML = html;
        }

        function goDetail(id) {
            window.location.href = 'renzhi_detail.html?id=' + encodeURIComponent(id);
        }

        function addEmployerHref() {
            var href = 'consult.html?tab=employers&open=employer';
            try {
                var uid = localStorage.getItem('user_id') || '';
                if (uid) href += '&user_id=' + encodeURIComponent(uid);
            } catch (e0) {}
            return href;
        }

        function emptyGuideStorageKey() {
            var uid = '';
            try {
                uid = localStorage.getItem('user_id') || '';
            } catch (e0) {}
            return 'renzhi_empty_guide_v1:' + (uid || 'anon');
        }

        function hasSeenEmptyGuide() {
            try {
                return localStorage.getItem(emptyGuideStorageKey()) === '1';
            } catch (e0) {
                return true;
            }
        }

        function markEmptyGuideSeen() {
            try {
                localStorage.setItem(emptyGuideStorageKey(), '1');
            } catch (e0) {}
        }

        function closeEmptyGuide() {
            var root = document.getElementById('renzhiEmptyGuide');
            if (!root) return;
            root.classList.remove('is-open');
            root.hidden = true;
        }

        function goAddEmployer() {
            window.location.href = addEmployerHref();
        }

        function maybeShowEmptyGuide() {
            if (hasSeenEmptyGuide()) return;
            var root = document.getElementById('renzhiEmptyGuide');
            if (!root || root.classList.contains('is-open')) return;
            markEmptyGuideSeen();
            root.hidden = false;
            root.classList.add('is-open');
            if (typeof window.trackUserAction === 'function') {
                window.trackUserAction('track_renzhi_empty_guide_show', { page: 'renzhi' });
            }
        }

        function bindEmptyGuide() {
            var later = document.getElementById('renzhiEmptyGuideLater');
            var go = document.getElementById('renzhiEmptyGuideGo');
            var mask = document.getElementById('renzhiEmptyGuideMask');
            if (later) {
                later.onclick = function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_renzhi_empty_guide_later', { page: 'renzhi' });
                    }
                    closeEmptyGuide();
                };
            }
            if (go) {
                go.onclick = function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_renzhi_empty_guide_go', { page: 'renzhi' });
                    }
                    goAddEmployer();
                };
            }
            if (mask) {
                mask.onclick = function () {
                    if (typeof window.trackUserAction === 'function') {
                        window.trackUserAction('track_renzhi_empty_guide_later', { page: 'renzhi', via: 'mask' });
                    }
                    closeEmptyGuide();
                };
            }
        }

        function showEmpty(syncedEmpty) {
            /* 仅在接口确认列表为空时写回 0；加载失败勿清本地角标 */
            if (syncedEmpty) syncMineEmployerCount([]);
            var container = document.getElementById('listContainer');
            container.innerHTML =
                '<div class="empty-state"><div class="icon">📋</div><div>暂无任职受雇信息</div>' +
                '<a class="empty-add-link" href="' + escapeHtml(addEmployerHref()) + '">去添加</a></div>';
            if (syncedEmpty) maybeShowEmptyGuide();
        }

        bindEmptyGuide();
        loadEmployerList();
    </script>
    <script src="/js/watermark.js?v=20260831-m60home"></script>
</body>
</html>
