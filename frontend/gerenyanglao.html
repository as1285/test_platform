            line-height: 1.25;

            -webkit-tap-highlight-color: transparent;

    <header class="header">
        <a href="bancha.html" class="back-btn" aria-label="返回">

    <div class="hero">

    <section class="tips-box">
        <h2 class="tips-title">温馨提示</h2>
        <p class="tips-item">1.个人养老金制度，是国家政策支持、个人自愿参加、市场化运营的补充养老保险制度。</p>
        <p class="tips-item">2.您可通过「一站式」申报，直接获取个人养老金管理平台缴费信息，无需下载<a href="javascript:void(0)">个人养老金缴费凭证</a>。您也可通过<a href="javascript:void(0)">扫码</a>或<a href="javascript:void(0)">手动录入</a>的方式申报。</p>
        <p class="tips-item">3.若您无法查询到相关数据或数据不准确，请您与开立账户的商业银行联系核实。</p>
    </section>

    <div class="footer-actions">
        <button type="button" class="btn-primary" id="btnOneStop">“一站式”申报（免下载凭证）</button>
        <button type="button" class="btn-outline" id="btnManual">录入凭证申报</button>
        <a href="javascript:void(0)" class="footer-link" id="viewDeductionLink">查看我的扣除信息</a>
    </div>

    <script>
        function toast(msg) {
            alert(msg || '功能开发中');
        }
        document.getElementById('authManageLink').addEventListener('click', function () {
            toast('授权管理功能开发中');
        });
        document.getElementById('btnOneStop').addEventListener('click', function () {
            toast('“一站式”申报功能开发中');
        });
        document.getElementById('btnManual').addEventListener('click', function () {
            toast('录入凭证申报功能开发中');
        });
        document.getElementById('viewDeductionLink').addEventListener('click', function () {
            toast('暂无扣除信息');
        });

    <script src="/js/watermark.js?v=20260511-mine-wm"></script>
