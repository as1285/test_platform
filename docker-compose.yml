services:
  db:
    image: mysql:8.0
    container_name: test_platform_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: personal_tax
    ports:
      # 避免与宿主机已有 MySQL 抢 3306
      # 仅允许服务器本机访问，禁止公网直连数据库
      - "127.0.0.1:3308:3306"
    volumes:
      # 独立卷，避免与同机 LMeterX 等共用 test_platform_mysql_data 导致 ibdata 锁冲突
      - personal_tax_mysql_data:/var/lib/mysql
    networks:
      - test_platform_default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 限制上限，降低 3.6G 小机 OOM 时被内核优先杀业务进程的概率
    mem_limit: 1g
    # 主机重启后必须自动拉起；否则 API 会因连不上 db 起不来
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: test_platform_redis
    # volatile-ttl：仅淘汰带 TTL 的键（限流/OTP），避免 LRU 误删安全态
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-ttl
    volumes:
      - personal_tax_redis_data:/data
    networks:
      - test_platform_default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 192m
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: personal-tax-api
    environment:
      UPLOAD_DIR: /data/uploads
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_DATABASE: personal_tax
      # 限流 / OTP challenge：Redis（多实例与重启不丢）
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # 生产环境请设置强随机串；未设置时使用 server.js 内默认开发密钥
      JWT_SECRET: ${JWT_SECRET:-}
      # 管理员发激活码：POST api/auth.php action=admin_issue_code，请求体带 admin_key 与同值；未设置则无法发码
      ADMIN_ACTIVATION_KEY: ${ADMIN_ACTIVATION_KEY:-}
      # 管理后台登录（务必在生产修改密码）
      ADMIN_PANEL_USER: ${ADMIN_PANEL_USER:-admin}
      ADMIN_PANEL_PASSWORD: ${ADMIN_PANEL_PASSWORD:-640810}
      ADMIN_PANEL_FULL_NAME: ${ADMIN_PANEL_FULL_NAME:-系统管理员}
      # 管理端 IP 黑名单（逗号分隔）；经 CF 的真实访客 IP
      ADMIN_IP_DENYLIST: ${ADMIN_IP_DENYLIST:-}
      # 管理登录：连续失败锁定 + 可选邮件 OTP（1=开启，需 SMTP）
      ADMIN_LOGIN_MAX_FAILS: ${ADMIN_LOGIN_MAX_FAILS:-5}
      ADMIN_LOGIN_LOCK_MINUTES: ${ADMIN_LOGIN_LOCK_MINUTES:-30}
      ADMIN_LOGIN_EMAIL_OTP: ${ADMIN_LOGIN_EMAIL_OTP:-0}
      ADMIN_OTP_EMAIL: ${ADMIN_OTP_EMAIL:-}
      ADMIN_OTP_TTL_SEC: ${ADMIN_OTP_TTL_SEC:-300}
      ADMIN_UPLOAD_MAX_BYTES: ${ADMIN_UPLOAD_MAX_BYTES:-83886080}
      GUEST_SESSION_RATE_PER_IP_MIN: ${GUEST_SESSION_RATE_PER_IP_MIN:-8}
      TRACK_RATE_PER_IP_MIN: ${TRACK_RATE_PER_IP_MIN:-60}
      # 明文密码：0=不存（默认）；1=明文；encrypt=AES 加密存入 plain_password
      REGISTER_STORE_PLAIN_PASSWORD: ${REGISTER_STORE_PLAIN_PASSWORD:-0}
      # 服务器监控告警收件人
      MONITOR_ALERT_EMAIL: ${MONITOR_ALERT_EMAIL:-498771018@qq.com}
      MONITOR_CHECK_INTERVAL_MS: ${MONITOR_CHECK_INTERVAL_MS:-60000}
      MONITOR_FRONTEND_URL: ${MONITOR_FRONTEND_URL:-http://frontend/}
      MONITOR_NET_RX_ALERT_BPS: ${MONITOR_NET_RX_ALERT_BPS:-83886080}
      MONITOR_NET_TX_ALERT_BPS: ${MONITOR_NET_TX_ALERT_BPS:-83886080}
      MONITOR_LOAD_ALERT_PERCENT: ${MONITOR_LOAD_ALERT_PERCENT:-90}
      MONITOR_MEMORY_ALERT_PERCENT: ${MONITOR_MEMORY_ALERT_PERCENT:-90}
      # 部署期间不发告警：后端启动后默认静默 3 分钟，并识别共享卷中的部署标记
      MONITOR_DEPLOY_GRACE_MS: ${MONITOR_DEPLOY_GRACE_MS:-180000}
      MONITOR_DEPLOY_MARKER: ${MONITOR_DEPLOY_MARKER:-/data/uploads/.deployment-in-progress}
      MONITOR_DEPLOY_MARKER_MAX_AGE_MS: ${MONITOR_DEPLOY_MARKER_MAX_AGE_MS:-1800000}
      LOGIN_RATE_PER_IP_MIN: ${LOGIN_RATE_PER_IP_MIN:-20}
      LOGIN_RATE_PER_USER_MIN: ${LOGIN_RATE_PER_USER_MIN:-8}
      ADMIN_LOGIN_RATE_PER_IP_MIN: ${ADMIN_LOGIN_RATE_PER_IP_MIN:-10}
      ADMIN_API_RATE_PER_IP_MIN: ${ADMIN_API_RATE_PER_IP_MIN:-240}
      HEAVY_ADMIN_API_RATE_PER_IP_MIN: ${HEAVY_ADMIN_API_RATE_PER_IP_MIN:-60}
      # 埋点 / 审计日志保留（全局默认 + 可按表覆盖，见 docs/architecture-phase4）
      DB_LOG_RETAIN_DAYS: ${DB_LOG_RETAIN_DAYS:-90}
      DB_LOG_PURGE_INTERVAL_MS: ${DB_LOG_PURGE_INTERVAL_MS:-86400000}
      DB_RETAIN_USER_PAGE_EVENTS_DAYS: ${DB_RETAIN_USER_PAGE_EVENTS_DAYS:-90}
      DB_RETAIN_INSTALL_GUIDE_TRACK_EVENTS_DAYS: ${DB_RETAIN_INSTALL_GUIDE_TRACK_EVENTS_DAYS:-180}
      DB_RETAIN_ANALYTICS_API_DAILY_DAYS: ${DB_RETAIN_ANALYTICS_API_DAILY_DAYS:-365}
      DB_RETAIN_API_SLOW_EVENTS_DAYS: ${DB_RETAIN_API_SLOW_EVENTS_DAYS:-90}
      DB_RETAIN_API_ERROR_EVENTS_DAYS: ${DB_RETAIN_API_ERROR_EVENTS_DAYS:-180}
      DB_RETAIN_USER_LOGIN_EVENTS_DAYS: ${DB_RETAIN_USER_LOGIN_EVENTS_DAYS:-180}
      DB_RETAIN_ADMIN_LOGIN_EVENTS_DAYS: ${DB_RETAIN_ADMIN_LOGIN_EVENTS_DAYS:-365}
      DB_RETAIN_ADMIN_OPERATION_LOGS_DAYS: ${DB_RETAIN_ADMIN_OPERATION_LOGS_DAYS:-365}
      DB_RETAIN_TAX_RECORD_CHANGE_LOGS_DAYS: ${DB_RETAIN_TAX_RECORD_CHANGE_LOGS_DAYS:-365}
      DB_RETAIN_USER_DAILY_ACTIVITY_DAYS: ${DB_RETAIN_USER_DAILY_ACTIVITY_DAYS:-730}
      DB_RETAIN_SALES_CHANNEL_ATTRIBUTIONS_DAYS: ${DB_RETAIN_SALES_CHANNEL_ATTRIBUTIONS_DAYS:-180}
      # 上传：本地卷为默认；可设 PUBLIC_ASSET_BASE_URL 指向 CDN
      PUBLIC_ASSET_BASE_URL: ${PUBLIC_ASSET_BASE_URL:-}
      UPLOAD_STORAGE_BACKEND: ${UPLOAD_STORAGE_BACKEND:-local}
      # 多机域名：与前端 site-config / APP_URL 保持一致（见 .env.example）
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-${APP_URL:-}}
      SITE_TRUSTED_HOSTS: ${SITE_TRUSTED_HOSTS:-}
      # QQ 邮箱 SMTP（发件邮箱与 SMTP_PASS 授权码，未配置时仅后台展示监控、不发邮件）
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # 支付宝应用凭据只从未提交的 .env / 部署 Secret 读取，禁止写入后台设置或前端代码
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-}
      ALIPAY_PRODUCT_TITLE: ${ALIPAY_PRODUCT_TITLE:-激活码}
      ALIPAY_PRODUCT_AMOUNT: ${ALIPAY_PRODUCT_AMOUNT:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
    ports:
      # 后端仅由前端 Nginx 通过 Docker 内网访问；宿主本机保留调试入口
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_static:/data/uploads
    networks:
      - test_platform_default
    mem_limit: 768m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend-container
    ports:
      # 本机域名直连：对外 HTTP + HTTPS（证书挂载自 ./certs）
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    depends_on:
      - backend
    volumes:
      - uploads_static:/usr/share/nginx/html/uploads
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-webroot:/var/www/certbot:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/blocked_ips.conf:/etc/nginx/blocked_ips.conf:ro
      # 部署脚本按 .env 生成到 deploy/runtime/；改域名后无需重建前端镜像
      - ./deploy/runtime/site-config.js:/usr/share/nginx/html/js/site-config.js:ro
    networks:
      - test_platform_default
    mem_limit: 128m
    restart: unless-stopped

volumes:
  uploads_static:
    name: test_platform_uploads_static
  personal_tax_mysql_data:
    name: personal_tax_mysql_data
  personal_tax_redis_data:
    name: personal_tax_redis_data

networks:
  test_platform_default:
    name: test_platform_default
