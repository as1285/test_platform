<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <title>个人所得税</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #fff;
        }
        html.app-huawei-pura70-shell,
        html.app-huawei-pura70-shell body {
            background: #f5f6fa !important;
        }
        /* 全屏启动图（与 start.png 同目录） */
        #startPage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background: #fff;
        }
        #startPage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #main {
            display: none;
            width: 100%;
            height: 100%;
        }
        #main.is-ready {
            display: block;
        }
        #app-frame {
            border: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        html.app-huawei-pura70-shell #app-frame {
            width: 100vw;
            max-width: 100%;
        }
    </style>
    <script>
        (function () {
            /* 启动页显示时长：1000=1秒，2000=2秒，3000=3秒 */
            var START_PAGE_MS = 2000;

            var APP_ORIGIN = 'http://139.199.191.204/';
            if (!APP_ORIGIN || !/^https?:\/\//i.test(APP_ORIGIN)) {
                document.body.innerHTML =
                    '<p style="padding:24px;font-family:system-ui,sans-serif;color:#666;text-align:center">请编辑 <code>cordova-app/www/index.html</code> 中的 <code>APP_ORIGIN</code> 后重新打包 APK。</p>';
                return;
            }

            function isCordovaXiaomi23127() {
                var ua = navigator.userAgent || '';
                return /TaxPlatformCordovaApp/i.test(ua) && /23127PN0CC|23127PN\b/i.test(ua);
            }
            function isHuaweiPura70Shell() {
                var ua = navigator.userAgent || '';
                if (!/Huawei|HUAWEI|HarmonyOS/i.test(ua)) {
                    return false;
                }
                return /HBN-AL00|HBN-AL80|HBN-AL10|HBN-LX9|ADY-AL00|ADY-AL80|ADY-LX9|HLY-AL00|HLY-AL80|HLY-LX9|LNA-AL00|MLA-AL00|MLA-AL10|Pura\s*70|Pura70/i.test(
                    ua
                );
            }
            if (isHuaweiPura70Shell()) {
                document.documentElement.classList.add('app-huawei-pura70-shell');
            }

            function hideStartShowMain() {
                var start = document.getElementById('startPage');
                var main = document.getElementById('main');
                if (start) {
                    start.style.display = 'none';
                }
                if (main) {
                    main.classList.add('is-ready');
                }
            }

            function mountApp() {
                var main = document.getElementById('main');
                if (!main || document.getElementById('app-frame')) {
                    return;
                }
                var f = document.createElement('iframe');
                f.id = 'app-frame';
                f.setAttribute('title', '应用');
                f.setAttribute('importance', 'high');
                f.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
                f.src = APP_ORIGIN;
                main.appendChild(f);
            }

            function boot() {
                mountApp();
                setTimeout(hideStartShowMain, START_PAGE_MS);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot);
            } else {
                boot();
            }

            document.addEventListener('deviceready', function () {
                if (!window.StatusBar) {
                    return;
                }
                if (isHuaweiPura70Shell()) {
                    StatusBar.overlaysWebView(true);
                    StatusBar.backgroundColorByHexString('#f5f6fa00');
                    StatusBar.styleDefault();
                    return;
                }
                if (isCordovaXiaomi23127()) {
                    StatusBar.overlaysWebView(false);
                    StatusBar.backgroundColorByHexString('#1e6fff');
                    StatusBar.styleLightContent();
                    return;
                }
                StatusBar.overlaysWebView(true);
                StatusBar.backgroundColorByHexString('#00000000');
                StatusBar.styleDefault();
            });
        })();
    </script>
</head>
<body>
    <div id="startPage" aria-hidden="false">
        <img src="start.png" alt="启动图">
    </div>
    <div id="main"></div>
</body>
</html>
