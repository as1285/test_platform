# 在 GitHub Actions 云端打包 Cordova Android Debug APK（无需本地 Android SDK）。
#
# 如何取包：仓库 → Actions → 本工作流 → 选一次成功运行 → Artifacts → android-debug-apk → 下载 zip（内含 app-debug.apk）
# 手动触发：Actions → Cordova Android Debug APK → Run workflow
#
# 仅 Debug 包（自测 / 内部分发）；上架需另行配置 Release 签名与 Play 流程。
# 本地等价命令：cd cordova-app && npx cordova build android --debug
name: Cordova Android Debug APK

on:
  workflow_dispatch:
    inputs:
      agent_channel:
        description: "代理渠道 ID（留空=公开包；填写则打渠道包）"
        required: false
        default: ""
      agent_channels_batch:
        description: "批量渠道（逗号分隔；填写则逐个打渠道包，忽略单个）"
        required: false
        default: ""
  push:
    branches: [master, main]
    paths:
      - "cordova-app/**"
      - ".github/workflows/cordova-android.yml"
      - "scripts/build-agent-apk.sh"
      - "scripts/build-agent-packages.sh"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cordova-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cordova-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-cordova-${{ hashFiles('cordova-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-cordova-
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          npm ci
          npx cordova telemetry off

      - name: Apply agent distribution config
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.agent_channel != '' }}
        run: |
          CHANNEL="${{ github.event.inputs.agent_channel }}"
          CHANNEL_LOWER="$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')"
          cat > www/distribution-config.js <<EOF
          window.__TAX_DISTRIBUTION__ = Object.freeze({
            agentSalesChannel: '${CHANNEL_LOWER}',
            disableInAppRegister: false,
            permanentChannel: true
          });
          EOF
          sed -i "s|<preference name=\"AppendUserAgent\" value=\" TaxPlatformCordovaApp/1\" />|<preference name=\"AppendUserAgent\" value=\" TaxPlatformCordovaApp/1 TaxPlatformDistributor/${CHANNEL_LOWER}\" />|" config.xml

      # 可选：仓库 Settings → Secrets → APP_ORIGIN（如 https://lkj.qiyun888.top/）
      # 未设置时沿用 www/index.html 内默认值；本机代理包请用 scripts/build-agent-apk.sh
      - name: Override APP_ORIGIN from secret
        env:
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
        working-directory: cordova-app
        run: |
          if [ -z "${APP_ORIGIN:-}" ]; then
            echo "No APP_ORIGIN secret; keep www/index.html default"
            exit 0
          fi
          ORIGIN="${APP_ORIGIN%/}/"
          python3 - "$ORIGIN" <<'PY'
          import pathlib, re, sys
          origin = sys.argv[1]
          path = pathlib.Path("www/index.html")
          text = path.read_text(encoding="utf-8")
          new, n = re.subn(
              r"var APP_ORIGIN = '[^']*';",
              f"var APP_ORIGIN = '{origin}';",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("未能替换 APP_ORIGIN")
          path.write_text(new, encoding="utf-8")
          print(f"APP_ORIGIN = {origin}")
          PY

      - name: Generate splash & icon assets
        run: |
          python3 -m pip install --user --quiet Pillow
          npm run generate-assets

      - name: Add Android platform
        run: npx cordova platform add android@13 --no-interactive

      - name: Build debug APK
        run: npx cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.agent_channel != '' && format('android-agent-{0}-apk', github.event.inputs.agent_channel) || 'android-debug-apk' }}
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
